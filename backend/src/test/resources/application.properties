# Local integration tests run against the FIXED compose database (mezo_test) —
# company pattern: tables are inspectable 1:1 in a real Postgres while/after tests run.
# Requires: docker compose up -d (see backend/compose.yaml).
#
# CI / machines without the compose stack: pass -Dmezo.test.use-testcontainers=true
# to spin up a throwaway Testcontainers Postgres instead (its @ServiceConnection
# overrides this datasource URL automatically).
#
# (.properties on the test classpath deliberately AUGMENTS the main application.yml
# instead of shadowing it — only the keys below are overridden.)
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:15432}/mezo_test
mezo.test.use-testcontainers=false

# Cap the per-context Hikari pool for tests. The Spring TestContext cache keeps every
# distinct ApplicationContext (each with its own pool) alive simultaneously; with Hikari's
# default pool of 10 the growing set of contexts exhausts Postgres max_connections (100)
# and unrelated contexts fail to boot ("FATAL: sorry, too many clients already"). ITs run
# sequentially and need only a couple of connections per context, so a small cap is safe.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Production defaults to SHADOW. Keep unrelated integration contexts on the frozen path so an
# unawaited background retrieval cannot race ResetDatabase; rollout ITs opt into SHADOW/NEW.
mezo.companion.memory-platform.serving-mode=OLD

# mezo-peh4 / mezo-v73w — THE MASTER SWITCH. SchedulingConfiguration's @EnableScheduling is now
# @ConditionalOnProperty on this key (production application.yml declares it true), so false here
# means the test profile has NO scheduler thread in ANY context, and no @Scheduled method can fire.
#
# Why it is needed on top of the per-job switches below: those gate whether the job BEAN exists.
# ~25 integration tests re-enable their own job with @TestPropertySource("<key>=true") because they
# need that bean to call run()/runOnce() directly. Each such class forks its OWN Spring
# ApplicationContext (the TestContext cache keys on the merged property set), and that context —
# scheduler thread included — stays ALIVE in the cache for the rest of the surefire JVM, ticking
# against the SAME database. So a job re-enabled by class A could still fire at its real wall-clock
# cron minute during class Z's @BeforeEach ResetDatabase TRUNCATE, ~15 daily fire-minutes' worth of
# chances inside a CI window, and deadlock it:
#   AbstractIntegrationTest.resetDatabaseState » PessimisticLock ... [ERROR: deadlock detected]
# That is exactly the mezo-peh4 flake — random victim classes, no content regression, ~10% of runs.
# Reproduced deterministically before this switch existed (a once-per-second @Scheduled write
# transaction vs. the TRUNCATE) and green after it; SchedulingInertInTestProfileIT guards it.
#
# Consequence to accept: no cron WIRING is exercised in tests any more (a bad cron expression or a
# missing @Scheduled would not surface from an IT — it barely did before). The per-job switches and
# the @TestPropertySource re-enables below stay: they still gate bean existence, which those ITs need.
mezo.techcore.scheduling.enabled=false

# Two @Scheduled jobs in this app tick often enough to collide with a test run; both are off here.
# N2's dispatch job (mezo.notification.dispatch-cron) fires every minute. Left at the production default (true)
# here, the real scheduler thread WILL tick mid-suite and race an unrelated test class's
# ResetDatabase TRUNCATE, which deadlocks Postgres (verified: the real cron fired from
# [scheduling-1] at the real wall-clock minute during a `Notification*` test run and collided with
# the next class's @BeforeEach reset). Off by default for the whole test context;
# NotificationDispatchJobIT re-enables it via its own @TestPropertySource (own cached context).
mezo.techcore.cron.notification-dispatch-job.enabled=false

# W5.1's flag sweep (mezo.companion.flags.sweep-cron) is the second one: "0 5 * * * *" — HOURLY at
# :05, not the "rare specific time" the note above used to claim every non-dispatch cron anchors on.
# Same failure mode, same fix (mezo-b3pp.38): on PR #268 the 16:05 tick raced HabitAiSuggestApiIT's
# @BeforeEach reset and deadlocked the TRUNCATE — 2559 tests, 0 failures, 1 error, in an entirely
# unrelated feature. Any CI run straddling minute :05 can hit it, in any test class.
# FlagSweepJobSwitchOffIT sets this property itself, so it is unaffected.
mezo.techcore.cron.flag-sweep-job.enabled=false

# mezo-oou9: every OTHER @Scheduled job ticks at a fixed dawn/weekly/monthly wall-clock minute
# rather than every minute/hour, so a real collision with a ResetDatabase TRUNCATE is rarer than
# the two above (no incident recorded for these) — but CI runs DO straddle the 00:05-04:10 dawn
# cluster and the 12:30/20:30 daytime feed slots, so "rarer" is not "never". The jobs below have
# no direct-call *JobIT at all (only *SwitchOffIT or plain unit tests reference the job class).
mezo.techcore.cron.setup-check-job.enabled=false
mezo.techcore.cron.graph-maintenance-job.enabled=false
mezo.techcore.cron.feedback-learning-job.enabled=false
mezo.techcore.cron.reflection-job.enabled=false
mezo.techcore.cron.pattern-detection-job.enabled=false
mezo.techcore.cron.character-monthly-job.enabled=false
mezo.techcore.cron.adaptive-review-job.enabled=false
mezo.techcore.cron.weekly-review-job.enabled=false

# mezo-oou9: MemoryRetrievalRetentionJob previously had NO independent kill-switch (gated only by
# mezo.feature.companion.enabled) — the audit above surfaced the gap, so the switch was added
# alongside this fix. MemoryRetrievalRetentionIT re-enables it via its own @TestPropertySource.
mezo.techcore.cron.memory-retrieval-retention-job.enabled=false

# mezo-c9k4: the remaining 16 jobs — the ones the mezo-oou9 note above deliberately left ENABLED
# because each IS exercised by a direct-call *JobIT and had no re-enable of its own. That reason is
# gone: every one of those ITs now carries a "<key>=true" @TestPropertySource (its own cached
# context), so the switch can be off for the whole shared test profile. Same failure mode as the
# two incidents above — a real [scheduling-*] tick racing an unrelated class's ResetDatabase
# TRUNCATE — just at a rarer wall-clock minute; the dawn cluster (00:05 quest-finalize .. 03:50
# consolidation-monthly) and the 12:30/20:30 feed slots are both inside normal CI windows.
# To re-enable one for a test, add @TestPropertySource(properties = "<key>=true") to that class.
# CAVEAT (honest): this removes the tick from every context EXCEPT the one that re-enables it, so
# each job can still fire inside its own IT's forked context. Narrowing, not elimination — a single
# unconditional @EnableScheduling gate would close it fully (recorded as mezo-v73w, prod code).
mezo.techcore.cron.quest-job.enabled=false
mezo.techcore.cron.habit-job.enabled=false
mezo.techcore.cron.life-goal-eval-job.enabled=false
mezo.techcore.cron.daily-summary-job.enabled=false
mezo.techcore.cron.character-observation-job.enabled=false
mezo.techcore.cron.consolidation-job.enabled=false
mezo.techcore.cron.llm-log-retention-job.enabled=false
mezo.techcore.cron.profile-assembler-job.enabled=false
mezo.techcore.cron.quarterly-review-job.enabled=false
mezo.techcore.cron.feed-job.enabled=false
mezo.techcore.cron.weekly-suggestion-job.enabled=false
mezo.techcore.cron.prediction-job.enabled=false
mezo.techcore.cron.experiment-job.enabled=false
mezo.techcore.cron.challenge-job.enabled=false
mezo.techcore.cron.memoir-job.enabled=false
mezo.techcore.cron.character-conference-job.enabled=false

# mezo-ibxy: the management server is a second embedded server; a fixed 8081 would collide
# across the cached test contexts. 0 = random, read back with @LocalManagementPort.
management.server.port=0

# Admin hub insights (mezo-d5iy) — off by default in application.yml; ITs need the
# controllers mounted.
mezo.feature.admin-insights.enabled=true

# RAG memory explorer (mezo-4qyt) — off by default in application.yml; ITs need the controller mounted.
mezo.feature.admin-memory.enabled=true
