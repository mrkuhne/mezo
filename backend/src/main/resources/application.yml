          question: "Fáraszt az egyhangú edzésterhelés?"
          expected-direction: negative
          when-positive-hu: "az egyhangúbb terhelésű időszakokban {erősség} több energiád volt"
          when-negative-hu: "az egyhangúbb terhelésű időszakokban {erősség} kevesebb energiád volt"
