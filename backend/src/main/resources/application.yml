    advisors:
      # V1.3 post-response advisor chain — deterministic clinical Rx-dose guard + one cheap-tier
      # LLM verdict (never-ask-twice redundancy + grounding-lite); reject -> one corrective
      # re-prompt -> degraded flag. Off = the chain beans do not exist (V1.2 behavior).
      enabled: true
      # Corrective re-prompts before an answer ships degraded (0 = check-only flagging)
      max-retries: 1
      # Prescription-med terms the clinical check guards (accent-folded match; dose-CHANGE verbs only)
      rx-terms: [retatrutid, reta, tirzepatid, mounjaro, szemaglutid, ozempic, wegovy]
    habit-suggest:
      # AI habit suggester (mezo-n5e9.3) — smart-model propose-only chain-fill suggestions; caps
      # how many suggestions the Task 2 adapter asks the model for / returns (HabitAiService's
      # own sanitize step is a defensive bounds check, not a count clamp).
      max-suggestions: 5
    lifegoal-propose:
      # AI life-goal proposer (mezo-iizd) — smart-model, propose-only; max pillars per proposal.
      max-pillars: 5
    transcription:
      # Chat voice input (mezo-at8x.4) — kept under the 6 MB container multipart cap so the
      # SERVICE check in TranscriptionService is the effective, message-bearing limit.
      # 5 MB of 16 kHz mono WAV (what the FE uploads) is ~2.5 minutes of speech.
      max-audio-bytes: 5242880
      # Base mime types only — the browser's `;codecs=opus` parameter is stripped before matching.
      # Chrome/Android record webm/opus, iOS Safari mp4/aac; the FE normalizes to wav where it can.
      allowed-mime-types:
        - audio/wav
        - audio/x-wav
        - audio/webm
        - audio/ogg
        - audio/mp4
        - audio/mpeg
        - audio/aac
    # Phase 5 W1 journal (mezo-b3pp.1) — decision review-due offset in days (used by W1.4's decision journal).
    journal:
      decision-review-days: 30
    # Daily evaluation (mezo-jcpt.4) — the 6-dimension day-score engine's tuning knobs.
    day-evaluation:
      weights:
        nutrition: 0.30
        quality: 0.15
        training: 0.20
        sleep: 0.15
        logging: 0.10
        rhythm: 0.10
      nutrition:
        kcal-under-band: 0.10
        kcal-over-band: 0.05
        kcal-slope: 3.0
        protein-under-band: 0.05
        protein-slope: 2.5
        carb-fat-band: 0.15
        carb-fat-slope: 1.5
      workout-day-kcal-widen: 150
      sleep-target-h: 7.5
      rhythm-window-days: 7
      rhythm-min-days: 3
      log-timely-min: 120
  # Karakter S2 nightly expert observation pass (mezo-1gim.3, spec §5/§6) — the 7-expert team
  # writes observations onto the CORE dimensions; the job switch lives under mezo.techcore.cron.
  character:
    observation:
      # 02:50 — the brief's suggested 02:40 collides with mezo.companion.patterns.cron (line
      # above); free dawn slots taken so far: 02:20 summary, 02:40 patterns, 03:00 SUN hypotheses,
      # 03:10 feedback-learning, 03:20 graph, 03:30 MON weekly rung, 03:40 llm-log retention,
      # 03:45 MON profile, 03:50 monthly rung, 04:00 quarterly.
      cron: "0 50 2 * * *"
      # Finished days back the job checks and self-heals (the summary catch-up idiom)
      catch-up-days: 3
    conference:
      # Sunday 19:30 — the week that is ending; 19:30 slot free (checked against every other
      # cron in this file before landing here, mezo-1gim.5).
      cron: "0 30 19 * * SUN"
      # Finished weeks back the job checks and self-heals (the observation catch-up idiom)
      catch-up-weeks: 2
    monthly:
      # Sunday 20:00 — a plain Sunday cron; CharacterMonthlyJob#isDeepReadDay narrows it in code to
      # the month's FIRST Sunday only (Spring cron cannot AND day-of-month with day-of-week).
      # 20:00 slot free (checked against every other cron in this file, mezo-1gim.6): 19:30 SUN
      # conference, 19:00 SUN memoir, 20:30 daily feed evening-cron all miss it.
      cron: "0 0 20 * * SUN"
      # A CHAPTER dimension with no ACTIVE claim left is retired once its updatedAt is this stale.
      stale-chapter-days: 90
    # [Karakter] prompt block tuning (spec §8, mezo-1gim.8) — CharacterPromptAssembler.
    prompt:
      # Below this, a claim never makes the block (Karakter S5 plan, Global Constraints).
      min-confidence: 0.45
      # Per-dimension line cap; confidence x recency decay picks the winners.
      max-claims-per-dimension: 3
      # Whole-block char budget; a dimension that would blow it is dropped WHOLE, never mid-line.
      max-total-chars: 1800
      # A dimension's portrait digest only renders once its maturity roll-up clears this.
      portrait-min-maturity: 30
    # Per-detector kill switches (spec §5) — empty = every detector enabled; keyed by detector key.
    detector: {}
  proactive:
    weekly:
      # W1 Monday-dawn plan-suggestion schedule (server zone); gathered from the finished previous week
      cron: "0 0 6 * * MON"
    weekly-review:
      # Monday weekly-review schedule (server zone, mezo-p2tr) — for the week that JUST finished
      # (weekStart = previous Monday), unlike weekly's forward-looking suggestion
      cron: "0 50 6 * * MON"
      # mezo-d20.7.7: the trailing window the highlight-citation signal ("cited in N of the last
      # weeks") is derived over — a quarter of weeks, so the signal decays instead of accumulating
      citation-window-weeks: 12
    diagnosis:
      # On-demand fatigue diagnosis (mezo-hqfi) — no cron; the user triggers it.
      # window/baseline: the diagnosed 14 days vs the 28 that precede them.
      window-days: 14
      baseline-days: 28
      # A metric needs this many measured days in the window to become evidence at all.
      min-coverage-days: 7
      # Distinct MetricDomains that must clear coverage before a diagnosis is attempted.
      min-domains: 2
      # Generations per user per calendar day; reads are always free.
      max-per-day: 3
    memoir:
      # W2 Sunday-evening memoir schedule (old journey 5.8) — the week ending that Sunday
      cron: "0 0 19 * * SUN"
    prediction:
      # P1 Monday-morning generation (after the weekly suggestion) + daily window-close validation
      cron: "0 30 6 * * MON"
      validation-cron: "0 15 6 * * *"
      max-per-week: 3
      # epsilon bands for the deterministic direction verdicts (stable inside ±epsilon)
      weight-epsilon-kg: 0.1
      sleep-epsilon-h: 0.25
    experiment:
      # P2 weekly proposal (Monday, after the prediction batch) + daily outcome evaluation
      propose-cron: "0 45 6 * * MON"
      outcome-cron: "0 20 6 * * *"
      max-open: 3
      min-days: 3
      max-days: 28
    challenge:
      # Daily outcome backstop (after the experiment outcome run)
      outcome-cron: "0 25 6 * * *"
      max-per-workout: 3
    feed:
      # Companion-feed (mezo-gst9) cron kinds — the lazy GET derives midday/evening fire-times
      # from these SAME expressions (CronExpression)
      morning-cron: "0 45 5 * * *"
      midday-cron: "0 30 12 * * *"
      evening-cron: "0 30 20 * * *"
      # How many finished days of narrative memory (daily_summary) the feed gather reads;
      # doubles as the emptiness gate: zero summaries in the window -> no message
      past-days: 7
    setup-checks:
      # S3 (mezo-d58h.3, spec 2026-09-03 §4 setup table): checks against CONFIGURATION, not
      # against a day's data — so they run once daily and re-emit at most weekly until the
      # configuration stops contradicting them. Config text, never an LLM call.
      # 06:10 — after the 05:45 morning message job, so a setup card lands below the briefing.
      cron: "0 10 6 * * *"
      # "At most weekly": 7 days.
      re-emit-hours: 168
      plan-feasibility:
        # Wake → out-the-door: shower, breakfast, travel to the morning obligation.
        wake-buffer-min: 45
        # Sport slot end → home. sport_schedule_slot.location is free text, never geocoded,
        # so one flat number is the honest granularity.
        commute-buffer-min: 30
        # A gym slot at or before 10:00 is a morning obligation; later ones are evening training.
        morning-cutoff-hour: 10
        # Spec §4: "if the plan misses by >45′".
        misfit-tolerance-min: 45
        bedtime-window-days: 14
        # Fewer than 4 logged bedtimes ⇒ the observed-bedtime half stays silent.
        min-bedtime-samples: 4
  fuel:
    protocol:
      # Deterministic-era protocol confidence (the Stack page 'conf' badge). P8 replaces this
      # with a computed value; until then it is config, never hardcoded in code.
      default-confidence: 0.86
    scoring:
      # Deterministic meal-score v0 (mezo-yta, ADR 0006). Binds onto MealScoringProperties;
      # formulas in specs/2026-07-05-fuel-p7-meal-scoring-design.md §3.
      # 8-dimension weighted model (mezo-7797) — meal uses all except portion, template all except
      # context; BOTH subsets must sum to 1.0 (validated at startup).
      weights:
        macro: 0.22
        micro: 0.10
        who: 0.14
        fat-quality: 0.10
        nova: 0.18
        plant-diversity: 0.08
        energy-density: 0.06
        context: 0.12
        portion: 0.12
      nova:                       # quality score per NOVA class (1 unprocessed .. 4 ultra-processed)
        group1: 1.0
        group2: 0.85
        group3: 0.55
        group4: 0.20
      # Macro dim: score = max(0, 1 - totalVariation(P/C/F kcal-shares vs mezo.nutrition targets) * slope)
      macro-deviation-slope: 2.0
      # Protein-surplus side of the macro deviation: 0.0 = protein overshoot forgiven (fitness-app
      # policy, mezo-8ms6), 1.0 = old symmetric penalty. Protein DEFICIT always counts in full.
      macro-protein-surplus-penalty: 0.0
      # A meal's ratio-deviation counts in full at/above this kcal-share of the day; below it the
      # penalty scales down linearly (the "tiny snack can't tank the macro dim" fix, mezo-jcpt).
      macro-significance-ref-share: 0.25
      micro:                      # fiber TARGET only since mezo-7797 (sugar/salt/satFat → who/fat-quality)
        fiber-g: 38
      who:                        # WHO guideline dimension
        sugar-energy-share-limit: 0.10   # free sugar ≤10% of energy (WHO strong recommendation)
        salt-limit-g: 5                  # WHO 5 g/day, scaled by the meal's kcal-share
      fat-quality:
        sat-fat-energy-share-limit: 0.10 # saturated fat ≤10% of energy (WHO)
        sat-fat-share-ref: 0.33          # saturated share of total fat reference (balanced thirds)
      plant-diversity:
        target-categories: 3             # distinct plant categories for a full score
        plant-categories: [vegetables, fruits, grains, legumes, nuts_seeds]
      energy-density:
        good-kcal-per-100g: 150          # at/below → score 1.0
        bad-kcal-per-100g: 400           # at/above → score 0 (linear between)
      portion:
        default-share: 0.30              # slot-less recipe: assumed kcal-share of the day
      slot-shares:                # expected kcal-share of the day per meal slot
        breakfast: 0.25
        lunch: 0.35
        dinner: 0.30
        snack: 0.10
      slot-windows:               # local-hour windows for the timing fit (snack always fits)
        breakfast-from: 5
        breakfast-to: 10
        lunch-from: 11
        lunch-to: 15
        dinner-from: 17
        dinner-to: 22
      # Relative tolerance around the slot share within which the kcal-fit is perfect
      slot-share-tolerance: 0.4
      # Training-aware role windows (mezo-ta8p): a meal is pre-workout fuel within pre-lead-min
      # before a workout start, post-workout recovery within post-trail-min after its end.
      pre-lead-min: 120
      post-trail-min: 90
      # Per-role rubric overlays. STANDARD uses the base targets/who/nova above (zero regression).
      roles:
        pre:                       # pre-workout: fast carbs are FUEL — carb target up, sugar/NOVA relaxed
          p: 150
          c: 550
          f: 60
          who:
            sugar-energy-share-limit: 0.30   # fueling: free sugar tolerated far higher than WHO 10%
            salt-limit-g: 5
          nova:
            group1: 1.0
            group2: 0.9
            group3: 0.8
            group4: 0.6                       # a gel/toast is processed and FINE pre-workout
        post:                      # post-workout: protein + carb recovery (glycogen)
          p: 300
          c: 480
          f: 70
          who:
            sugar-energy-share-limit: 0.20
            salt-limit-g: 5
          nova:
            group1: 1.0
            group2: 0.88
            group3: 0.7
            group4: 0.45
  progression:
    # Level threshold curve: xpThreshold(n) = round(base * (n-1)^exp); Lv2=100, Lv3≈303, Lv5≈919.
    curve:
      base: 100
      exp: 1.6
    # Streak robustness — family-agnostic (gym/run/sport all feed the training-week streak).
    robustness:
      per-week-xp: 25         # robustness XP per consecutive training week (streak-only v1)
    # Gym-path XP weights (display-only economy in v1; tune freely without touching code).
    gym:
      volume-unit: 100          # kg·reps that equal one volume XP unit
      volume-xp-per-unit: 10    # muscle XP per volume unit (per the day's logged muscles)
      e1rm-xp-per-kg: 2         # max_strength XP per kg of best Epley e1RM
      pr-bonus-xp: 40           # max_strength XP per RECORD-tier medal earned in the session
      target-medal-xp: 5        # strength_endurance XP per TARGET_HIT medal earned in the session
      target-medal-cap: 12      # max TARGET_HIT medals paid per workout (targetMedalXp cap)
      strength-endurance-xp-per-set: 8  # per logged work set (non-skipped, reps present)
      bodyweight-xp-per-rep: 1  # flat XP per rep for weightless sets (no e1RM/volume)
    # Run-path XP weights.
    run:
      sprint-xp-per-round: 25     # sprint_speed per completed sprint round
      anaerobic-xp-per-round: 15  # anaerobic_capacity per completed sprint round
      steady-xp-per-min: 4        # strength_endurance per steady minute
      aerobic-xp-per-min: 5       # aerobic_capacity per steady minute
      rpe-xp-per-point: 6         # explosiveness / effort proxy per RPE point
      hr-recovery-bonus-xp: 30    # one-off aerobic bonus when HR-recovery is logged
    # Sport-path XP weights (athletic only; per-kind skill mapping in applySport).
    sport:
      xp-per-set: 12              # volleyball volume → vertical_jump/agility/coordination
      xp-per-round: 14            # cross/TRX volume → anaerobic_capacity/strength_endurance/core_stability
      xp-per-min: 4               # duration → aerobic_capacity (volleyball) / mobility (TRX)
      rpe-xp-per-point: 6         # RPE → explosiveness / effort skills
    # Radar aggregation (fixed axis grouping in v1; only the Erő muscle blend is tunable).
    radar:
      strength-muscle-blend: 0.5   # Erő = max_strength*(1-w) + muscle-level-mean*w
  # Daily quests (gamified growth E1, ADR 0010). XP amounts live in content/quest-catalog.json.
  quest:
    reroll-per-day: 1               # autonomy valve (ADR 0010) — a shop item may raise it later (E4)
    generate-cron: "0 35 6 * * *"   # morning backstop so quests exist even if Today is never opened
    finalize-cron: "0 5 0 * * *"    # 00:05 — evaluate + quietly expire yesterday's offered quests
    cron-presence-days: 7           # the morning cron only backstops users seen (last_seen_at) in this window
    # Adaptive difficulty (E3, ADR 0010 — rule-based, no LLM in the economy): per-slot 28-day
    # completion ratio bands the allowed difficulty tiers; <min-sample closed quests = all tiers.
    adaptive:
      window-days: 28
      min-sample: 5
      high-ratio: 0.85
      low-ratio: 0.50
    # E3 flavor copy: the companion rewrites quest title/why in its own voice on the morning
    # cron; lazy generation and rerolls keep catalog copy; any LLM failure keeps catalog copy.
    flavor:
      enabled: true
  # Activity-log tuning (E2, ADR 0010): the LLM proposes, the server disposes — XP clamped into
  # [xp-min, xp-max], per-skill and per-day caps bound the honor system; below the confidence
  # threshold the entry lands uncategorized and the client prompts for a manual category.
  activity:
    xp-min: 5
    xp-max: 25
    per-skill-daily-cap: 40
    daily-cap: 100
    confidence-threshold: 0.6
    default-xp: 10
  # Habit engine tuning (mezo-d1jb, ADR 0010): every target window/cutoff is config, never code.
  # Binds onto HabitProperties; the close cron fires after the quest finalize.
  habit:
    close-cron: "0 10 0 * * *"    # 00:10 — after the quest finalize
    wake-window-min: 45
    protein-target-g: 25
    bed-grace-min: 30
    kitchen-close-offset-min: 90
    strength-window-days: 28
    min-sample: 5
    summary-days: 30
  # Daily intention tuning (mezo-a686): focus cap + text limits are config, never code.
  # Binds onto IntentionProperties.
  intention:
    focus-cap: 3
    creed-max-len: 280
    focus-max-len: 200
  # Napzárás window tunables (mezo-hvmx, spec §5) — bed-anchored offsets, minutes. Binds onto
  # RitualProperties.
  ritual:
    lead-min: 75        # the window opens bed − 75'
    prep-lead-min: 45   # sleep-prep display anchor: bed − 45'
  # Binds feature/needs/config/NeedsProperties — Életjel day-close award rule (mezo-dhzk)
  needs:
    green-threshold: 60
    per-ring-xp: 5
    all-green-bonus-xp: 30
  # Binds feature/lifegoal/config/LifeGoalProperties (mezo-iizd) — pillar cap per goal.
  lifegoal:
    max-pillars: 5
    # XP per `hit` pillár-nap (mezo-iizd.6) — a pillér saját skill_key-ére, idempotensen
    # (source_type=LIFE_GOAL, kulcs: UUID.nameUUIDFromBytes("lifegoal:<pillarId>:<day>")).
    xp-per-hit: 5
    # 00:20 — a habit close (00:10) UTÁN, hogy a nap metrikái már véglegesek legyenek.
    # A job ETTŐL a futástól kezdve a késleltetett ha–akkor terveket (és a hiány-alapú
    # ritual_missed-et) is emittálja a tegnapi napra — külön ütemező nincs (mezo-iizd.7, spec D-3).
    eval-cron: "0 20 0 * * *"
  # Web Push (RFC 8030/8291/8292) — bd mezo-h4wp.6.1. The private key NEVER has a real default:
  # production supplies it from the mezo-app SealedSecret, local dev from an untracked .env.
  # The dummy default keeps the context bootable with the notification feature switched off.
  # Binds onto WebPushProperties.
  webpush:
    subject: mailto:daniel.kuhne@intuitech.studio
    public-key: ${VAPID_PUBLIC:dummy-vapid-public}
    private-key: ${VAPID_PRIVATE:dummy-vapid-private}
    default-ttl-seconds: 3600
    # Connect + read timeout for the outbound push POST (WebPushClient) — a hung push service
    # must not hold a caller's thread (N2's per-minute dispatch job).
    timeout-ms: 5000
  # Push notification content tunables (bd mezo-h4wp.6.1). Binds onto NotificationProperties;
  # N2 extends the same record rather than inventing a second one.
  notification:
    # Notification body is truncated to this many chars before it is encrypted + sent.
    body-max-chars: 300
    # Medication has no per-day time column (MedicationCycleService only derives which cycle
    # day it is) — the reminder anchors on this fixed HH:mm instead (spec §6).
    medication-time: "08:00"
    # A decision's review has no time of its own, only a due DATE (decision_entry.review_due) —
    # the decision_review push anchors on this fixed HH:mm instead (spec §5.4, bd mezo-b3pp.4).
    decision-review-time: "09:00"
    # How much of an already-generated prose row (companion_message/weekly/memoir) AnchorResolver
    # excerpts for a push body — cut at a word boundary, never a new LLM call (spec §6).
    prose-excerpt-chars: 160
    # N2 per-minute dispatch job (NotificationDispatchJob) schedule — every minute, on the minute.
    dispatch-cron: "0 * * * * *"
    # DueEvaluator's BACKWARD firing window width in minutes — a half-open [0, catch-up-minutes)
    # on (now - fireMinute), i.e. on time plus (width - 1) recovered LATE minutes, so a genuinely
    # missed cron minute still delivers on the next tick; the push_log dedup (not this) prevents a
    # double-send. Looking forward instead would fire a minute EARLY and never recover a miss.
    catch-up-minutes: 2
    # Grace (minutes) applied to a prose category's anchor when it would otherwise land AT or
    # BEFORE the minute its own content generator cron runs: memoir (mezo.proactive.memoir.cron,
    # 19:00), midday (proactive.feed.midday-cron, 12:30) and weekly whenever the user's wake
    # time is <= proactive.weekly.cron (06:00). Both jobs queue on the SAME size-1 scheduler thread
    # and each generator makes an LLM call, so at the anchor minute the row provably does not exist
    # yet and the (default-ON) category would never fire at all. AnchorResolver reads the generator
    # crons themselves via CronExpression — those minutes are NOT duplicated here. morning needs
    # no grace by construction (generates 05:45, anchors at wake ~06:00) — that is the pattern.
    prose-generation-grace-min: 15
    # W5.2 (bd mezo-b3pp.19): do-not-disturb window — a non-exempt intervention push generated
    # inside it is DEFERRED to quiet-hours end (possibly next morning), never dropped. Only the
    # intervention category consults this today; widening it is a separate decision.
    quiet-hours:
      start: "22:00"
      end: "07:00"
    # In-app notification feed (bd mezo-gzhp.1). The two inbox-* values MUST mirror the FE
    # STRONG_SIGNAL constant, the two band-* values the FE strengthWord bands — pinned by
    # AppNotificationServiceIT and the FE insights tests on both sides.
    feed:
      limit: 50
      inbox-min-abs-r: 0.3
      inbox-max-p: 0.15
      band-promising: 0.3
      band-strong: 0.6
  # Account gamification ledger (bd mezo-huzd): title-shop saver price/cap + the coin awards the
  # AccountProgressPort adapter fires. Binds onto GamificationProperties.
  gamification:
    saver-price: 200
    max-savers: 2
    level-up-coins: 50
    quest-coins: 10
    all3-coins: 20
    milestone-coins: { 7: 50, 30: 150, 100: 500 }
  # Sleep goal defaults (mezo-dbsr): the config-default "ghost" served before the user saves a goal,
  # plus the regularity band default. Binds onto SleepGoalProperties.
  sleep:
    default-target-min: 480
    default-anchor: WAKE
    default-wake: "06:00"
    default-bed: "23:00"
    regularity-band-min: 15
  # Sleep screenshot extraction tuning (mezo-66ab). Binds onto SleepShotProperties.
  sleep-shot:
    max-photo-bytes: 5000000
    allowed-mime-types: [image/jpeg, image/png, image/webp]
    confidence-threshold: 0.6
  # Fuel-settings ghost defaults (mezo-53su). Binds onto FuelSettingsProperties.
  fuel-settings:
    default-meals-per-day: 4
    default-caffeine-cutoff: "14:00"
  # Diet-settings ghost defaults (Diet Plan slice 1). Binds onto DietSettingsProperties.
  diet-settings:
    default-split-preset: balanced
    default-protein-tier: moderate
    default-water-ml: 4000
    default-fiber-g: 30
    default-day-type-shift-kcal: 0
  hypertrophy:
    plate-step: 2.5           # kg rounding granularity for computed weights
    default-increment: 2.5    # fallback load step when a type has no explicit increment
    increment:
      compound: 5.0           # compound lifts progress in 5 kg jumps
      isolation: 2.5          # isolation lifts in 2.5 kg jumps
    default-warmup-sets: 2
    # Count-keyed absolute-rep warmup ladders (mezo-dnln) — keyed by warmupSets count; each rung
    # is a %working-weight + absolute rep count. Counts above 3 prepend (n-3) repeats of the
    # 3-ladder's first rung ahead of the full 3-ladder (see SetRecommendationService).
    warmup-ladders:
      1: [ { pct: 0.70, reps: 4 } ]
      2: [ { pct: 0.50, reps: 8 }, { pct: 0.75, reps: 3 } ]
      3: [ { pct: 0.50, reps: 8 }, { pct: 0.70, reps: 4 }, { pct: 0.90, reps: 2 } ]
  # Hypertrophy plan generator frames (POST /api/train/meso-plans/generate).
  meso-plan:
    max-exercises-per-group-per-day: 2
    compound-rep-min: 8
    compound-rep-max: 10
    isolation-rep-min: 12
    isolation-rep-max: 15
    target-rir: 1
    compound-warmup: 2
    isolation-warmup: 1
  # Volume progression (Plan 2 Phase A) — weekly per-muscle set-volume tuning. Binds VolumeProperties.
  volume:
    step: 2                 # sets added per productive week
    deload-fraction: 0.5    # deload target = round(prevSets * this)
    grind-rir-gap: 2        # RIR-below-target gap that counts as a grind
    # RP intermediate MEV/MAV/MRV landmarks per coarse muscle group (mezo-xlmp) — seeded onto
    # muscle_group_volume_log at meso create-as-active/activate for the groups the template
    # actually trains. Bands match the demofixtures seed; core/traps intentionally absent
    # (RP treats their MEV as ~0 — indirect volume from compounds covers them).
    baselines:
      chest:    { mev: 8,  mav: 14, mrv: 20 }
      back:     { mev: 10, mav: 16, mrv: 22 }
      shoulder: { mev: 8,  mav: 12, mrv: 18 }
      biceps:   { mev: 6,  mav: 10, mrv: 14 }
      triceps:  { mev: 6,  mav: 10, mrv: 14 }
      quad:     { mev: 8,  mav: 12, mrv: 18 }
      ham:      { mev: 6,  mav: 10, mrv: 14 }
      glute:    { mev: 8,  mav: 12, mrv: 18 }
      calf:     { mev: 6,  mav: 10, mrv: 16 }
  train:
    gym-default-minutes: 60        # gym schedule slots carry no duration
    run-default-minutes: 45        # interval runs have no single continuous duration
    sport-session-max-span-days: 400   # widest inclusive from..to window the sport-session log accepts
    met:                           # MET by kind — MIRROR of FE fuelConfig.MET_BY_KIND (drift-guard test)
      gym: 6.0
      sport: 4.5
      run: 9.5
      default-kind: 5.0
    # Workout-timing tuning (mezo-1jm8) — measurement clips + profile-learner seeds.
    # Binds onto TimingProperties.
    timing:
      gap-cap-seconds: 300
      lead-in-cap-seconds: 900
      max-clipped-ratio: 0.25
      alpha: 0.125
      beta: 0.25
      outlier-k: 4
      min-samples: 3
      # RFC 6298 granularity floor (RTO = SRTT + max(G, K*RTTVAR)): without it, a very consistent
      # user's deviation converges toward 0 and the outlier gate rejects every future observation,
      # freezing the estimate permanently and silently once min-samples is reached (mezo-dzbm).
      min-deviation-seconds: 20
      seed-set-cycle-compound: 180
      seed-set-cycle-isolation: 125
      seed-transition: 240
      seed-lead-in: 480
  # Fix zárás — closing exercises ensured on every gym day of the active meso; slug references
  # master exercise-catalog rows (content/exercise-catalog.json). Dead-hang reps are SECONDS
  # (plyo type -> weightless, reps-only logging on the FE).
  closing-block:
    exercises:
      - { slug: dead-hang, working-sets: 2, rep-min: 45, rep-max: 60, target-rir: 0 }         # 2×45–60 mp függés
      - { slug: back-extension-45, working-sets: 2, rep-min: 12, rep-max: 15, target-rir: 2 }
management:
  endpoints:
    web:
      exposure:
        include: health
