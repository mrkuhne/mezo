          title: "Alvásminőség ↔ másnapi edzés-RPE"
          mechanism: "A rosszabb alvás másnap nehezebbnek érződő edzést hozhat."
          question: "Könnyebb az edzés, ha jól aludtál?"
          expected-direction: negative
          when-positive-hu: "a jobb alvás után {erősség} nehezebbnek érződött az edzés"
          when-negative-hu: "a jobb alvás után {erősség} könnyebbnek érződött az edzés"
