          question: "Megérzi a hangulatod a szórt lefekvési időket?"
          expected-direction: negative
          when-positive-hu: "a szórtabb lefekvésű időszakokban {erősség} jobb volt a mentális állapotod"
          when-negative-hu: "a szórtabb lefekvésű időszakokban {erősség} rosszabb volt a mentális állapotod"
