          when-positive-hu: "a későbbi ébredésű napokon {erősség} több energiád volt"
          when-negative-hu: "a későbbi ébredésű napokon {erősség} kevesebb energiád volt"
          metric-a: wakeup-hour
          metric-b: checkin-energy
          lag-days: 0
