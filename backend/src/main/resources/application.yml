        cooldown-hours: 24
        quiet-hours-exempt: false
    # W4.3 (mezo-b3pp.17): the pragmatic profile — "hogyan érdemes Daniellel beszélni"
    profile:
      # Monday 03:45 — after the 03:10 feedback rollups and the 03:30 weekly consolidation rung,
      # both of which are this job's inputs.
      cron: "0 45 3 * * MON"
      render-max-tokens: 400
      max-decisions: 10
      max-graph-nodes: 12
    # W5.3 (mezo-b3pp.20, spec §9.3): the quarterly deep pass — season-over-season comparison.
    quarterly:
      # 04:00 on the 1st of Jan/Apr/Jul/Oct — after that dawn's 03:50 monthly consolidation rung
      # (this job's input) and clear of every other dawn slot (02:20 summary, 02:40 patterns,
      # 03:00 SUN hypotheses, 03:05 hourly flags, 03:10 feedback-learning, 03:20 graph,
      # 03:30 MON weekly rung, 03:40 llm-log retention, 03:45 MON profile, 03:50 monthly rung).
      cron: "0 0 4 1 1,4,7,10 *"
      # Max SEASON candidates ONE run may propose into the L2 inbox (IDENT-6: proposals only).
      max-candidates: 2
      # Month rungs per side that enter the prompt — a quarter has 3; the cap is the flood guard.
      max-period-lines: 6
      # Per-rung character cap in the compare_periods tool output (a tool result is prompt budget).
      render-max-chars: 400
    patterns:
      # V3.1 nightly Pearson correlation over the pair catalog — 02:40, after the summary job
      cron: "0 40 2 * * *"
      # Correlation window (finished days)
      lookback-days: 60
      # Minimum aligned days before a pair may surface (honest small-n gate)
      min-n: 8
      # Binary A metrics need enough observations on BOTH sides before an effect may surface
      min-group-n: 3
      # A confirmed pattern reinforces its promoted fact at most once per this many days
      # (the nightly window slides one day - re-counting the same evidence would inflate ranks)
      reinforce-cooldown-days: 7
      # Derivalt terheles-metrikak (ACWR, monotonia) kozos skalaja: ennyi kg gym-volumen
      # szamit egy sport-perc-ekvivalensnek a napi terheles osszegzeseben
      load-gym-kg-per-min: 100
