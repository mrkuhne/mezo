FUEL_SCORE_DIM_ENERGY_DENSITY=Energy density
FUEL_SCORE_DIM_PORTION=Portion size
FUEL_SCORE_DIM_CONTEXT=Timing and context
# Meal / recipe score: a dimension with nothing to measure
FUEL_SCORE_NO_DATA=no data
FUEL_SCORE_MACRO_NO_DATA=No macro data for these items.
FUEL_SCORE_MICRO_NO_DATA=No fibre data for these items.
