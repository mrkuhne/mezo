# Stack: why a supplement sits in its zone (stored on the item as written)
FUEL_PLACEMENT_REASON_CREATINE=Creatine in water after waking. It does not depend on meals; taking it every day is what counts.
FUEL_PLACEMENT_HINT_CREATINE=suggested daily total 15–20 g, best split into 3–4 doses
FUEL_PLACEMENT_REASON_CAFFEINE=Caffeine early in the day, well before the 14:00 cut-off.
FUEL_PLACEMENT_REASON_PUMP=Pump stack about 40 minutes before training, so it peaks as you start. Left out on rest days.
FUEL_PLACEMENT_REASON_PROTEIN=Protein in the window after training. On rest days, with breakfast.
FUEL_PLACEMENT_REASON_FAT_SOLUBLE=Fat-soluble: a meal with fat absorbs it 3–4× better.
FUEL_PLACEMENT_REASON_MAGNESIUM=Magnesium in the evening, about 2 hours before bed. It supports GABA activity and deep sleep.
FUEL_PLACEMENT_REASON_BEDTIME=Works best right before bed.
FUEL_PLACEMENT_REASON_ZINC=Zinc with dinner, away from the morning caffeine and from other minerals.
FUEL_PLACEMENT_REASON_VITAMIN=With breakfast: gentler with food, and an easy routine.
FUEL_PLACEMENT_REASON_PANTRY_TIMING=Based on the timing suggested for this pantry item.
FUEL_PLACEMENT_REASON_FALLBACK=Not sure about this one. Move it if you take it at another time.
FUEL_PLACEMENT_REASON_MANUAL=Placed here by hand.
