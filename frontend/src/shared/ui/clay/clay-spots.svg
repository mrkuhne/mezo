<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<!-- Titanium spot family (mezo-titanium-icons): large poster graphics on the 100-grid.
     Same material language as the icons (brushed titanium + one domain accent + soft shadow).
     Gradient/filter ids are sg-* namespaced. The 12 orb variants share one companion-orb base
     (titanium sphere + two orbital rings + a colored core), differentiated by accent colour. -->
<linearGradient id="sg-titanium" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#e9e4f6"/><stop offset=".18" stop-color="#8e8a9e"/><stop offset=".43" stop-color="#282b39"/><stop offset=".66" stop-color="#62697d"/><stop offset=".85" stop-color="#c9c7d8"/><stop offset="1" stop-color="#393647"/></linearGradient>
<linearGradient id="sg-blue" x2=".5" y2="1"><stop stop-color="#d1faff"/><stop offset=".4" stop-color="#78cfe7"/><stop offset="1" stop-color="#38617a"/></linearGradient>
<linearGradient id="sg-gold" x2=".8" y2="1"><stop stop-color="#ffebbe"/><stop offset=".45" stop-color="#b89757"/><stop offset="1" stop-color="#604831"/></linearGradient>
<linearGradient id="sg-purple" x2=".7" y2="1"><stop stop-color="#eee0ff"/><stop offset=".4" stop-color="#b3a0ed"/><stop offset="1" stop-color="#504373"/></linearGradient>
<linearGradient id="sg-lime" x2=".8" y2="1"><stop stop-color="#eeffb9"/><stop offset=".5" stop-color="#b8d777"/><stop offset="1" stop-color="#52663e"/></linearGradient>
<linearGradient id="sg-rose" x2=".7" y2="1"><stop stop-color="#ffe0ec"/><stop offset=".45" stop-color="#e79db7"/><stop offset="1" stop-color="#6f4353"/></linearGradient>
<linearGradient id="sg-coral" x2=".7" y2="1"><stop stop-color="#ffd9c8"/><stop offset=".45" stop-color="#f0885f"/><stop offset="1" stop-color="#7a3a26"/></linearGradient>
<filter id="sg-shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity=".45"/></filter>

<!-- ============ COMPANION / PERSONA ORBS (shared base, accent varies) ============ -->
<symbol id="s-orb" viewBox="0 0 100 100"><g filter="url(#sg-shadow)"><ellipse cx="50" cy="50" rx="43" ry="20" transform="rotate(-24 50 50)" fill="none" stroke="url(#sg-purple)" stroke-width="3.2"/><ellipse cx="50" cy="50" rx="43" ry="19" transform="rotate(32 50 50)" fill="none" stroke="url(#sg-blue)" stroke-width="2.4" opacity=".55"/><circle cx="50" cy="50" r="25" fill="url(#sg-titanium)"/><circle cx="50" cy="50" r="12" fill="url(#sg-gold)"/><path d="M40 47a11 11 0 0 1 13-8" fill="none" stroke="#fff4d2" stroke-width="2" opacity=".7"/><circle cx="88" cy="33" r="4.2" fill="url(#sg-purple)"/><circle cx="15" cy="64" r="3.2" fill="url(#sg-blue)"/></g></symbol>
