server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the way out (mezo-l5lvh). Without this the ~4.3 MB of JS/CSS
    # went over the wire raw (~1.1 MB gzipped). `gzip_proxied any` because every request
    # arrives through the Traefik Ingress; woff2/png/jpg are already compressed and stay out.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json
               application/manifest+json application/wasm image/svg+xml;

    # Single-page app: any unknown path falls back to index.html so client-side
    # routing works on refresh/deep-links. /api/* never reaches here — the
    # Traefik Ingress routes those to the backend before the frontend pod.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed file names under /assets/, so a given URL never changes
    # content: cache it forever. A missing asset must 404 (never fall back to index.html —
    # an HTML body cached as "immutable" JS would brick the app until the cache is cleared).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Don't cache the service worker(s) or the HTML shell (so new deploys are picked up).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /push-sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
