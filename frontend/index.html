<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no: disable all browser zoom app-wide.
         Primary effect: kills iOS Safari's auto-zoom when focusing sub-16px inputs (the app's
         compact UI uses 12–13px fields). viewport-fit=cover kept for notch/safe-area insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EEF5F9" />
    <!-- Installed-PWA chrome (mezo-cp8w → status bar): on Android + Safari-browser the
         dynamic `theme-color` meta (applyTheme in shared/lib/theme.ts) tints the system bar.
         iOS home-screen PWAs ignore theme-color; the `default` status-bar style gives the
         light status bar with dark icons over the light Folyadék app (the app is light-locked,
         the page colour is #EEF5F9). The standalone media query pads `.screen-content` by
         env(safe-area-inset-top), so nothing hides behind it.
         NOTE: iOS caches these at install time — an already-installed app must be removed
         and re-added to the home screen to pick up the change. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Boop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The approved three-Boop mark is the installed app icon and favicon (mezo-akskj). -->
    <link rel="icon" href="/logo-boop.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Boop</title>
    <!-- Light-locked app (Folyadék, mezo-n4wf5.1): the boot sets no data-theme attribute. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
