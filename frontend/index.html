<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no: disable all browser zoom app-wide.
         Primary effect: kills iOS Safari's auto-zoom when focusing sub-16px inputs (the app's
         compact UI uses 12–13px fields). viewport-fit=cover kept for notch/safe-area insets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EEF5F9" />
    <!-- Installed-PWA chrome (mezo-cp8w → status bar): on Android + Safari-browser the
         dynamic `theme-color` meta (applyTheme in shared/lib/theme.ts) already tints the
         system bar per theme. iOS home-screen PWAs ignore theme-color, so the OS status
         bar stayed opaque white over the dark Nap shell. `black-translucent` lets the web
         view bleed under the status bar (icons forced white) so the app's OWN background
         paints it — dark on the dark pages. The standalone media query already pads
         `.screen-content` by env(safe-area-inset-top), so nothing hides behind it.
         NOTE: iOS caches these at install time — an already-installed app must be removed
         and re-added to the home screen to pick up the change. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Boop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The approved three-Boop mark is the installed app icon and favicon (mezo-akskj). -->
    <link rel="icon" href="/logo-boop.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Boop</title>
    <script>
      (function () {
        /* Folyadék light lock (bible §1.1, mezo-n4wf5.1): light is the CSS base, so the boot never
           sets data-theme. THEME_LOCK in shared/lib/theme.ts is the same lock; the dark pockets
           (force claims) set the attribute from ThemeProvider. */
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
