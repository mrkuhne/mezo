# The Spring Boot backend. A Deployment (not StatefulSet) because it is stateless —
# all state lives in Postgres. k8s can recreate/replace this pod freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mezo
spec:
  replicas: 1
  # mezo-ibxy: with replicas=1 the default 25% maxUnavailable already rounds down to 0, but make
  # the "old pod keeps serving until the new one is Ready" guarantee explicit — the probes now
  # live on the management port, which an older image does not open.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Pull the private image from GHCR using the ghcr-pull secret.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/mrkuhne/mezo-backend:2.203.0
          ports:
            - name: http
              containerPort: 8090
            # mezo-ibxy: actuator (health + prometheus). Cluster-internal only — never on an Ingress.
            - name: management
              containerPort: 8081
          env:
            # Pin the JVM default zone so business dates (level_up_event.occurred_on,
            # gamification streak/coin rollover) and every @Scheduled cron run on Budapest
            # wall-clock, not the eclipse-temurin UTC default. The occurred_on backfill
            # (migration 202607241130) committed Budapest-local dates, so runtime stamps
            # must match or a 00:00–02:00 log lands on the previous business date and earns
            # no streak credit (bd mezo-k0t2). Also fires the crons (02:20/02:40/05:45…) at
            # their intended Budapest wall-clock. Matches k8s/postgres/backup-cronjob's zone.
            - name: TZ
              value: Europe/Budapest
            # mezo-5h9: refuse to boot with dev-default owner password / JWT secret in production.
            - name: MEZO_AUTH_STRICT
              value: "true"
            # demodata = seed the single owner user on first boot.
            - name: SPRING_PROFILES_ACTIVE
              value: demodata
            # Override the localhost JDBC URL from application.yml → the k8s Service.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/mezo
            # DB credentials come from the same Secret Postgres uses.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mezo-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mezo-db
                  key: POSTGRES_PASSWORD
            # App secrets (JWT signing key + owner seed credentials).
            - name: MEZO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mezo-app
                  key: MEZO_JWT_SECRET
            - name: MEZO_OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mezo-app
                  key: MEZO_OWNER_EMAIL
            - name: MEZO_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mezo-app
                  key: MEZO_OWNER_PASSWORD
            - name: MEZO_OWNER_NAME
              valueFrom:
                secretKeyRef:
                  name: mezo-app
                  key: MEZO_OWNER_NAME
            # Phase-3 companion is LIVE (activated 2026-07-04, epic mezo-fnnq complete):
            # the Gemini key rides the mezo-app SealedSecret; the nightly/weekly crons
            # (02:20 summaries, 02:40 patterns, Sun 03:00 hypotheses) fill the memory.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mezo-app
                  key: GEMINI_API_KEY
            # mezo-ozri.2: the OpenAI chat provider. Rides the SAME mezo-app secret, and the
            # Gemini key above STAYS — embedding, audio-transcribe and the chat fallback are
            # all still Gemini. optional: true so the pod keeps booting on the dummy
            # application.yml default until the key is actually sealed in; until then
            # mezo.companion.llm.provider must stay `gemini`.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mezo-app
                  key: OPENAI_API_KEY
                  optional: true
            - name: MEZO_FEATURE_COMPANION_ENABLED
              value: "true"
            # Phase-4 proactive layer LIVE (B1.2, mezo-h4wp.2): the generated morning
            # briefing + dawn BriefingJob (05:45). Explicit switch (the companion
            # precedent) rather than relying on the application.yml default.
            - name: MEZO_FEATURE_PROACTIVE_ENABLED
              value: "true"
            # LLM call audit log (mezo-2zyu): every Gemini call lands in llm_log_history with
            # its token/cost breakdown and its caller attribution (feature/operation/entity).
            # Default-on in application.yml since mezo-ozri.1 — this explicit pin is now
            # redundant with that default, kept deliberately as a production safeguard.
            - name: MEZO_FEATURE_LLM_LOG_ENABLED
              value: "true"
            # Admin hub insights + data browser (mezo-d5iy): OWNER-only installation
            # counters, per-user footprint/cost, and the read-only data browser.
            - name: MEZO_FEATURE_ADMIN_INSIGHTS_ENABLED
              value: "true"
            # mezo-ibxy: observability. ECS JSON logs for VictoriaLogs; actuator on 8081.
            - name: MEZO_LOG_FORMAT
              value: ecs
            - name: MEZO_MANAGEMENT_PORT
              value: "8081"
            # H2 Web Push N1 (mezo-h4wp.6.1): the VAPID keypair backing every push we
            # sign. Both halves live in the mezo-app SealedSecret — the private one is
            # secret, the public one is not, but it is kept beside it so the pair can
            # never drift apart (a mismatched pair fails as a GENERIC push-service error,
            # not a loud one — see docs/features/_platform-notifications.md).
            # The frontend gets the same public half from the VITE_VAPID_PUBLIC repo
            # variable at build time (.github/workflows/deploy.yml) — sealing alone is
            # not enough, the browser needs it baked into the bundle.
            - name: VAPID_PUBLIC
              valueFrom:
                secretKeyRef:
                  name: mezo-app
                  key: VAPID_PUBLIC
            - name: VAPID_PRIVATE
              valueFrom:
                secretKeyRef:
                  name: mezo-app
                  key: VAPID_PRIVATE
          # startupProbe gives Spring Boot + Liquibase time to come up before
          # liveness/readiness start judging it. /actuator/health lives on the management
          # port (mezo-ibxy) — a broken management server = an unhealthy pod, on purpose.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 5
            failureThreshold: 40      # up to ~200s to boot
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
