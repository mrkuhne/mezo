# Stable internal address for the backend pods. The Ingress routes /api here.
# ClusterIP (default) = reachable only inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mezo
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8090
      targetPort: http
    # mezo-ibxy: scraped by vmagent (VMServiceScrape "backend" selects this port by name).
    - name: management
      port: 8081
      targetPort: management
