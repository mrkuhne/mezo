# TEMPLATE ONLY — the whole Alertmanager config is sealed because it carries the Telegram
# bot token. Create a bot with @BotFather, get chat_id from https://api.telegram.org/bot<token>/getUpdates
# after messaging the bot once.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    route:
      receiver: telegram
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token: "CHANGE_ME"
            chat_id: 0
            parse_mode: HTML
            send_resolved: true
            message: '{{ template "telegram.default.message" . }}'
