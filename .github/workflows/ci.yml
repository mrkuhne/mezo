name: ci
# Convention + test gates (mezo-ah18.4 lint/drift; mezo-ah18.5 tests).
# Deliberately SEPARATE from deploy.yml so the deploy path stays fast
# (mezo-oa3); this workflow gates quality, not releases — deploys are NOT
# gated on it (decision recorded in ADR 0007). A red run on main means
# fix-forward before starting new work.
# See docs/decisions/0007-machine-enforcement-of-conventions.md for the why.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # lint-docs staleness compares per-file git commit dates
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Convention + generator gates (shared with premerge.yml)
        # Defined ONCE in .github/scripts/cheap-gates.sh so the pre-merge re-check and
        # the PR run can never drift apart. All of these are merge-sensitive: two PRs
        # can each be green and their merge still red (mezo-l4am, mezo-mxrc).
        run: bash .github/scripts/cheap-gates.sh

  lint-k8s:
    # mezo-ibxy: first manifest gate. Plain YAML under k8s/ is schema-checked; the Helm values
    # are proven renderable against the pinned chart. CRD kinds have no upstream schema in
    # kubeconform's catalog → -ignore-missing-schemas (structure is still YAML-validated).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Validate plain manifests
        run: |
          find k8s argocd -name '*.yaml' ! -name 'values.yaml' ! -name 'secret.example*' -print0 \
            | xargs -0 kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.35.0 -summary
      - name: Render the monitoring chart with our values
        run: |
          helm repo add vm https://victoriametrics.github.io/helm-charts/
          helm template vm vm/victoria-metrics-k8s-stack --version 0.91.2 -n monitoring \
            -f k8s/monitoring/values.yaml \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.35.0 -summary

  contract-drift:
    # Fails when api/openapi.yml is a stale merge of the api/feature/* fragments,
    # or frontend api.gen.ts was not regenerated after a contract change. The
    # backend cannot drift (openapi-generator-maven-plugin regenerates on every
    # build) — this closes the FE half and the fragments->merge half.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — the pin lives in frontend/package.json's `packageManager`
          # field, so CI and every local shell resolve the SAME pnpm (mezo-q8oy).
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Regenerate merged OpenAPI spec from fragments
        working-directory: api/generate
        run: |
          npm ci
          npm run generate:api
      - name: Regenerate frontend API types
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm generate:api
      - name: Fail on drift (committed spec/types stale vs fragments)
        run: |
          git diff --exit-code -- api/openapi.yml frontend/src/data/_client/api.gen.ts \
            || { echo '::error::Generated contract artifacts are stale. Run: cd api/generate && npm run generate:api; cd frontend && pnpm generate:api — then commit.'; exit 1; }

  test-frontend:
    # The CLAUDE.md gate, machine-enforced: vitest must be green in BOTH modes
    # (VITE_USE_MOCK=false + VITE_USE_MOCK=true). Includes the dualMode.guard test.
    # BOTH steps set the var EXPLICITLY: `isMockMode()` is `VITE_USE_MOCK !== 'false'`,
    # so an UNSET var means MOCK — and `frontend/.env` (which is what makes a local
    # `pnpm test` real-mode) is gitignored, hence absent on a CI checkout. Leaving the
    # first step bare therefore ran mock mode twice and the real-mode gate was vacuous.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — the pin lives in frontend/package.json's `packageManager`
          # field, so CI and every local shell resolve the SAME pnpm (mezo-q8oy).
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Tests (real mode)
        env:
          VITE_USE_MOCK: "false"
        run: pnpm test
      - name: Tests (mock mode)
        env:
          VITE_USE_MOCK: "true"
        run: pnpm test

  test-visual:
    # Visual-regression gate (mezo-uz4g). Pixel-compares 14 key screens × 2
    # themes against the committed LINUX goldens
    # (frontend/tests/visual/visual.spec.ts-snapshots/*-linux.png). The harness is
    # hermetic (frozen clock, pinned Europe/Budapest timezone, self-hosted fonts,
    # reduced motion) so a clean ubuntu-latest run matches the goldens
    # deterministically. Mirrors test-frontend's checkout/pnpm/node setup; the
    # Playwright browser cache key matches update-visual-baselines.yml so the two
    # workflows share it. The linux goldens are regenerated by the dispatchable
    # update-visual-baselines.yml workflow; darwin goldens are committed for local
    # `pnpm test:visual` runs. See docs/infrastructure/local-dev-testing.md.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — the pin lives in frontend/package.json's `packageManager`
          # field, so CI and every local shell resolve the SAME pnpm (mezo-q8oy).
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium --with-deps
      - name: Visual goldens (compare vs committed linux baselines)
        run: pnpm test:visual
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: frontend/test-results/
          retention-days: 7

  test-visual-darwin:
    # The darwin half of the two-platform golden set had NO machine gate at all: CI ran
    # only on ubuntu-latest, so the 118 committed *-darwin.png files were guarded solely
    # by whether a developer happened to run `pnpm test:visual` locally. They rotted
    # silently — on feat/orb-seed-and-provider the me-rutinok darwin goldens were ~39 000
    # pixels off main, because a branch regenerated darwin, THEN merged a main that moved
    # the page vertically, and only the linux half was refreshed by the workflow. CI
    # stayed green and the PR stayed mergeable (mezo-in3h, mezo-a3tr).
    # Actions minutes are free on this public repo and this job runs in parallel with the
    # others, so the coverage costs no wall clock.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — the pin lives in frontend/package.json's `packageManager`
          # field, so CI and every local shell resolve the SAME pnpm (mezo-q8oy).
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - name: Visual goldens (compare vs committed darwin baselines)
        run: pnpm test:visual
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-darwin
          path: frontend/test-results/
          retention-days: 7

  test-backend:
    # Full IT suite on a throwaway Testcontainers Postgres (no fixed-DB
    # dependency; ubuntu-latest ships Docker). Same command as the CI variant
    # documented in CLAUDE.md "Build & Test".
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7    # full repo so ../api contract is present
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Integration tests (Testcontainers Postgres)
        run: ./mvnw -B clean test -Dmezo.test.use-testcontainers=true
