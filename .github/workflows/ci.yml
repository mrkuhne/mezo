name: ci
# Convention + test gates (mezo-ah18.4 lint/drift; mezo-ah18.5 tests).
# Deliberately SEPARATE from deploy.yml so the deploy path stays fast
# (mezo-oa3); this workflow gates quality, not releases — deploys are NOT
# gated on it (decision recorded in ADR 0007). A red run on main means
# fix-forward before starting new work.
# See docs/decisions/0007-machine-enforcement-of-conventions.md for the why.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # PRs: a newer push supersedes the older run. main: every push keeps its OWN run (the sha
  # makes the group unique), so a later push can no longer cancel it. With several sessions
  # pushing every few minutes the per-ref group meant no run on main ever finished
  # (mezo-dubmh) — and ci-scope.sh needs finished green runs to diff against.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read     # ci-scope.sh reads the previous ci run on the branch (mezo-dubmh)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # lint-docs staleness compares per-file git commit dates
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Convention + generator gates (shared with premerge.yml)
        # Defined ONCE in .github/scripts/cheap-gates.sh so the pre-merge re-check and
        # the PR run can never drift apart. All of these are merge-sensitive: two PRs
        # can each be green and their merge still red (mezo-l4am, mezo-mxrc).
        run: bash .github/scripts/cheap-gates.sh

  lint-k8s:
    # mezo-ibxy: first manifest gate. Plain YAML under k8s/ is schema-checked; the Helm values
    # are proven renderable against the pinned chart. CRD kinds have no upstream schema in
    # kubeconform's catalog → -ignore-missing-schemas (structure is still YAML-validated).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Validate plain manifests
        run: |
          find k8s argocd -name '*.yaml' ! -name 'values.yaml' ! -name 'secret.example*' -print0 \
            | xargs -0 kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.35.0 -summary
      - name: Render the monitoring chart with our values
        run: |
          helm repo add vm https://victoriametrics.github.io/helm-charts/
          helm template vm vm/victoria-metrics-k8s-stack --version 0.91.2 -n monitoring \
            -f k8s/monitoring/values.yaml \
            | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.35.0 -summary

  contract-drift:
    # Fails when api/openapi.yml is a stale merge of the api/feature/* fragments. The
    # backend cannot drift (openapi-generator-maven-plugin regenerates on every build) —
    # this closes the fragments->merge half. (The web app's generated types left with the
    # web app, retired 2026-11-19, #52; the iPhone's copy is synced by ios/scripts/sync-openapi.sh.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/generate/package-lock.json
      - name: Regenerate merged OpenAPI spec from fragments
        working-directory: api/generate
        run: |
          npm ci
          npm run generate:api
      - name: Fail on drift (committed spec stale vs fragments)
        run: |
          git diff --exit-code -- api/openapi.yml \
            || { echo '::error::The merged contract is stale. Run: cd api/generate && npm run generate:api — then commit.'; exit 1; }

  test-backend:
    # Full IT suite on a throwaway Testcontainers Postgres (no fixed-DB
    # dependency; ubuntu-latest ships Docker). Same command as the CI variant
    # documented in CLAUDE.md "Build & Test".
    # mezo-dubmh: two parallel test JVMs, each with its own Postgres container (one database
    # per Spring context inside it — see TestcontainersConfiguration). Two, not more: a fork
    # peaks around 3.5 GB RSS plus ~1 GB for its Postgres, and the runner has 4 vCPU / 16 GB.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # ci-scope.sh diffs against the previous commit / PR base
      - name: Does this commit touch the backend?
        # mezo-dubmh: the expensive steps below run only when it does. The job still starts
        # and ends green otherwise, so require-checks.sh keeps seeing a successful check run.
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: .
        run: bash .github/scripts/ci-scope.sh backend/ api/
      - uses: actions/setup-java@v6
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Integration tests (Testcontainers Postgres)
        if: steps.scope.outputs.run == 'true'
        run: ./mvnw -B clean test -Dmezo.test.use-testcontainers=true -Dmezo.test.forks=2
