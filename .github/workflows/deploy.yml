name: deploy
# git push to main -> build the changed image, push to GHCR, bump the k8s tag via
# a [skip ci] commit. ArgoCD (already automated) deploys the result.
# NOTE: tests are intentionally NOT run here (mezo-oa3) — they are a local pre-push
# gate (see CLAUDE.md "Session Completion"). The deploy path goes straight to build.
on:
  push:
    branches: [main]
  # Manual escape hatch: rebuild the backend even when backend/ and api/ are unchanged.
  # (The frontend build and its force_frontend input left with the web app, retired
  # 2026-11-19, #52.)
  workflow_dispatch:
    inputs:
      force_backend:
        description: 'Rebuild the backend even if backend/ and api/ are unchanged'
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false   # never abort a half-done release; queue instead

permissions:
  contents: write   # commit the tag bump back + push the git tag
  packages: write   # push images to GHCR

jobs:
  version:
    # Skip the release-commit's own push, breaking the loop.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      backend_changed: ${{ steps.eff.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history + tags for semver + diff
      - id: calc
        run: bash .github/scripts/compute-release.sh
      # OR the manual force flag into the computed flag HERE, so every downstream
      # condition (build-backend, release's tag-bump choice) keeps reading one output
      # and needs no knowledge of the dispatch inputs.
      - id: eff
        env:
          BE: ${{ steps.calc.outputs.backend_changed }}
          FORCE_BE: ${{ inputs.force_backend }}
        run: |
          be="$BE"
          [ "$FORCE_BE" = "true" ] && be=true
          echo "backend_changed=${be}" >> "$GITHUB_OUTPUT"
          echo "effective: be=${be} (computed ${BE}, forced ${FORCE_BE:-false})" >&2

  build-backend:
    needs: version
    if: ${{ needs.version.outputs.backend_changed == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7    # full repo so ../api contract is present
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Package (skip tests — local pre-push gate; mezo-oa3)
        run: ./mvnw -B clean package -DskipTests
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mrkuhne/mezo-backend:${{ needs.version.outputs.version }}

  release:
    needs: [version, build-backend]
    # Run if nothing failed/cancelled and the backend image shipped.
    if: >-
      ${{ !failure() && !cancelled() &&
          needs.version.outputs.backend_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump image tags, commit back, tag the BUILT commit
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BE: ${{ needs.version.outputs.backend_changed }}
          # The commit these images were built from. The manifest commit rebases onto
          # whatever main is by now; the TAG must stay on this SHA or it claims trees that
          # were never built and the next run skips their build (mezo-pl7d).
          BUILT_SHA: ${{ github.sha }}
        run: bash .github/scripts/release-commit.sh
