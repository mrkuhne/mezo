name: deploy
# git push to main -> build the changed image, push to GHCR, bump the k8s tag via
# a [skip ci] commit. ArgoCD (already automated) deploys the result.
# NOTE: tests are intentionally NOT run here (mezo-oa3) — they are a local pre-push
# gate (see CLAUDE.md "Session Completion"). The deploy path goes straight to build.
on:
  push:
    branches: [main]
  # Manual escape hatch for the one case path-change detection structurally cannot see:
  # a build-time-baked value changing outside the tree. Every VITE_* is inlined into the
  # frontend bundle at build time, so editing the VITE_VAPID_PUBLIC repo variable (or
  # rotating the VAPID keypair) changes what the bundle MUST contain while leaving
  # frontend/ byte-identical — the push-triggered run then skips build-frontend and the
  # stale bundle stays live, silently. Discovered wiring the VAPID key (mezo-7kr3).
  workflow_dispatch:
    inputs:
      force_frontend:
        description: 'Rebuild the frontend even if frontend/ is unchanged (after changing a VITE_* repo variable)'
        type: boolean
        default: false
      force_backend:
        description: 'Rebuild the backend even if backend/ and api/ are unchanged'
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false   # never abort a half-done release; queue instead

permissions:
  contents: write   # commit the tag bump back + push the git tag
  packages: write   # push images to GHCR

jobs:
  version:
    # Skip the release-commit's own push, breaking the loop.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      frontend_changed: ${{ steps.eff.outputs.frontend_changed }}
      backend_changed: ${{ steps.eff.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags for semver + diff
      - id: calc
        run: bash .github/scripts/compute-release.sh
      # OR the manual force flags into the computed flags HERE, so every downstream
      # condition (build-frontend, build-backend, release's tag-bump choice) keeps
      # reading one pair of outputs and needs no knowledge of the dispatch inputs.
      - id: eff
        env:
          FE: ${{ steps.calc.outputs.frontend_changed }}
          BE: ${{ steps.calc.outputs.backend_changed }}
          FORCE_FE: ${{ inputs.force_frontend }}
          FORCE_BE: ${{ inputs.force_backend }}
        run: |
          fe="$FE"; be="$BE"
          [ "$FORCE_FE" = "true" ] && fe=true
          [ "$FORCE_BE" = "true" ] && be=true
          echo "frontend_changed=${fe}" >> "$GITHUB_OUTPUT"
          echo "backend_changed=${be}" >> "$GITHUB_OUTPUT"
          echo "effective: fe=${fe} be=${be} (computed ${FE}/${BE}, forced ${FORCE_FE:-false}/${FORCE_BE:-false})" >&2

  build-frontend:
    needs: version
    if: ${{ needs.version.outputs.frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No `version:` — the pin lives in frontend/package.json's `packageManager`
          # field, so CI and every local shell resolve the SAME pnpm (mezo-q8oy).
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build (real mode)
        env:
          VITE_USE_MOCK: "false"
          VITE_API_URL: ""
          # The VAPID PUBLIC half is baked into the bundle at BUILD time (it becomes
          # pushManager.subscribe()'s applicationServerKey) — sealing the keypair into the
          # cluster does NOT reach the frontend. Blank here ⇒ a zero-length key ⇒ every
          # subscribe() rejects with InvalidAccessError on the real device.
          VITE_VAPID_PUBLIC: ${{ vars.VITE_VAPID_PUBLIC }}
        run: pnpm build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mrkuhne/mezo-frontend:${{ needs.version.outputs.version }}

  build-backend:
    needs: version
    if: ${{ needs.version.outputs.backend_changed == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4    # full repo so ../api contract is present
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Package (skip tests — local pre-push gate; mezo-oa3)
        run: ./mvnw -B clean package -DskipTests
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mrkuhne/mezo-backend:${{ needs.version.outputs.version }}

  release:
    needs: [version, build-frontend, build-backend]
    # Run if nothing failed/cancelled and at least one component shipped.
    # (skipped build jobs are not "failure", so this still fires for FE-only or BE-only.)
    if: >-
      ${{ !failure() && !cancelled() &&
          (needs.version.outputs.frontend_changed == 'true' ||
           needs.version.outputs.backend_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump deployment image tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FE: ${{ needs.version.outputs.frontend_changed }}
          BE: ${{ needs.version.outputs.backend_changed }}
        run: |
          if [ "$FE" = "true" ]; then
            sed -i -E "s|(ghcr\.io/mrkuhne/mezo-frontend:).*|\1${VERSION}|" k8s/frontend/deployment.yaml
          fi
          if [ "$BE" = "true" ]; then
            sed -i -E "s|(ghcr\.io/mrkuhne/mezo-backend:).*|\1${VERSION}|" k8s/backend/deployment.yaml
          fi
          git diff --stat
      - name: Commit-back + tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/frontend/deployment.yaml k8s/backend/deployment.yaml
          if git diff --cached --quiet; then
            echo "No tag change to commit (already at v${VERSION}); skipping."
            exit 0
          fi
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git pull --rebase origin main
          git tag -a "v${VERSION}" -m "release v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"
