name: update-visual-baselines

# Regenerates the Playwright visual goldens and pushes them back to the dispatched
# ref as a bot commit. Run it against a feature branch whenever a change
# legitimately moves pixels:
#   gh workflow run update-visual-baselines.yml -r <branch>
#
# BOTH platforms are regenerated by default (mezo-in3h). Regenerating only linux is
# what let the darwin half rot: a branch would refresh darwin locally, then merge a
# main that moved pixels, and only linux got refreshed here — CI (linux-only) stayed
# green while the committed darwin goldens were ~39 000 pixels stale.
#
# The two jobs run one at a time and rebase before pushing, because they push to the
# same branch. See docs/infrastructure/local-dev-testing.md (mezo-uz4g).
#
# NOTE (unchanged trap): the bot commit is made with GITHUB_TOKEN, which does NOT
# trigger CI. After this workflow runs, `gh pr close <n> && gh pr reopen <n>` — else
# the PR looks green while zero checks ran on the new commit.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which golden sets to regenerate'
        type: choice
        default: both
        options: [both, linux, darwin]

permissions:
  contents: write

jobs:
  regenerate:
    strategy:
      max-parallel: 1        # both jobs push to the same branch
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: ubuntu-latest
            browser_cache: ~/.cache/ms-playwright
            install: chromium --with-deps
          - platform: darwin
            runs-on: macos-latest
            browser_cache: ~/Library/Caches/ms-playwright
            install: chromium
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Skip platforms not requested
        id: gate
        working-directory: .
        run: |
          want='${{ inputs.platforms }}'
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.platform }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "platform ${{ matrix.platform }} not requested (platforms=$want) — skipping"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'
      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: ${{ matrix.browser_cache }}
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install ${{ matrix.install }}
        if: steps.gate.outputs.run == 'true'
      - run: pnpm test:visual:update
        if: steps.gate.outputs.run == 'true'
      - name: Commit regenerated ${{ matrix.platform }} goldens
        if: steps.gate.outputs.run == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "frontend/tests/visual/"*-snapshots/*-${{ matrix.platform }}.png
          if git diff --cached --quiet; then
            echo "no ${{ matrix.platform }} golden changes"
            exit 0
          fi
          git commit -m "chore(visual): regenerate ${{ matrix.platform }} baselines (mezo-uz4g)"
          # The other platform's job may have pushed to this branch already.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
