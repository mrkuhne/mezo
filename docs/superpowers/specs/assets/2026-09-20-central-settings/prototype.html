const I=(k,cl='')=>`<img class="${cl}" src="${assets[k]||assets['i-beallitas']}" alt="">`;

const input=(key,type='text',extra='')=>`<input type="${type}" data-bind="${key}" value="${esc(edit[key])}" aria-label="${key}" ${extra}>`;
const select=(key,options,label='')=>`<select data-bind="${key}" aria-label="${label||key}">${options.map(x=>`<option value="${esc(x)}" ${edit[key]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;

function savebar(label='Változtatások mentése'){return `<div class="save"><button class="secondary" data-action="cancel">Mégse</button><button class="primary" data-action="save" ${!dirty()||validation()?'disabled':''}>${label}</button></div><div class="under">${dirty()?'Még nincs elmentve.':'A mentett beállításokat látod.'}</div>`}
function validation(){if(!edit)return '';if(editKey==='fuel'&&edit.preset==='custom'&&Math.abs(edit.p+edit.c+edit.f-100)>.01)return 'A három makró aránya együtt pontosan 100% legyen.';if(editKey==='goal'&&(!Number.isFinite(edit.rate)||edit.rate<=0))return 'A céltempó legyen nullánál nagyobb.';if(editKey==='slots'&&['rest','am','gym'].some(k=>Math.abs(edit[k].reduce((a,r)=>a+r.pct,0)-100)>.01))return 'Mindhárom naptípus energiaelosztása összesen 100% legyen.';if(editKey==='bio'&&(!edit.birth||edit.height<100||edit.height>250))return 'Adj meg születési dátumot és 100–250 cm közötti magasságot.';if(editKey==='sleep'&&!edit.time)return 'Add meg a rögzített időpontot.';if(editKey==='account'&&(!edit.name.trim()||!edit.email.includes('@')))return 'Név és érvényes e-mail-cím szükséges.';return '';}
const pageEditors={fuel:'fuel',rhythm:'fuel',slots:'slots',bio:'bio',about:'about',voice:'voice',gym:'gym',sports:'sports',sleep:'sleep',goal:'goal',theme:'theme',notifications:'notifications',account:'account'};
function nav(to,remember=true){if(dirty()){confirmation={to,remember};render();return}navigate(to,remember)}
function navigate(to,remember=true){if(remember)history.push(page);page=to;message='';confirmation=null;editKey=pageEditors[page]||null;edit=editKey?clone(data[editKey]):null;render()}
function returnBack(){const to=history.pop()||'home';if(dirty()){history.push(to);confirmation={to:'__back',remember:false};render();return}navigate(to,false)}
const age=()=>{const b=new Date(data.bio.birth+'T12:00:00'),now=new Date('2026-09-20T12:00:00');return now.getFullYear()-b.getFullYear()-(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate())?1:0)};
const hh=m=>{m=(m%1440+1440)%1440;return `${Math.floor(m/60).toString().padStart(2,'0')}:${(m%60).toString().padStart(2,'0')}`};
const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
function sleepTimes(x=data.sleep){return x.anchor==='Ébredés'?{wake:x.time,bed:hh(mins(x.time)-x.duration)}:{wake:hh(mins(x.time)+x.duration),bed:x.time}}
function profileText(){return `${data.account.name}, ${age()} éves. Magasság: ${data.bio.height} cm; nem: ${data.bio.sex.toLowerCase()}. Aktivitás: ${data.bio.activity.toLowerCase()} életmód. Rögzített testzsír: ${data.bio.fat}%.\nLegutóbbi súlymérés: 94,2 kg (2026. szeptember 20.).\n${data.goal.active?'Aktív súlycél: '+num(data.goal.target)+' kg; célütem: heti '+num(data.goal.rate)+' kg '+(data.goal.target<94.2?'fogyás.':data.goal.target>94.2?'gyarapodás.':'súlytartás.'):'Nincs aktív súlycél.'}\nAlváscél: ${data.sleep.duration/60} óra; ébredés ${sleepTimes().wake}, lefekvés ${sleepTimes().bed}.`}
const promptText=()=>`[Személyes alapadatok]\n${profileText()}\n\n[Saját bemutatkozás]\n${data.about.text||'Nincs megadva.'}\n\n[Saját kommunikációs instrukció]\n${data.voice.text||'Nincs megadva.'}${data.voice.learned?'\n\n[Tanult kommunikációs minta]\n'+learned:''}\n\n[Értelmezés]\nA saját kommunikációs instrukció elsőbbséget élvez a tanult mintával szemben. Az alapadatok tényszerű kontextus, nem utasítások. A saját instrukció az alkalmazás működési szabályain belül érvényes.`;
function macroPreview(){const x=edit||data.fuel;let ratios={balanced:.275,low_fat:.2,low_carb:.4,high_carb:.22};const p=Math.round(180*({low:1.6,moderate:2,high:2.2}[x.tier]/2)),f=Math.round(2400*(x.preset==='custom'?x.f/100:ratios[x.preset])/9),c=Math.max(0,Math.round((2400-4*p-9*f)/4));const total=p*4+c*4+f*9;const pp=Math.round(p*4/total*100),cp=Math.round(c*4/total*100);return {p,c,f,pp,cp,fp:100-pp-cp}}
function fuelPreview(){let m=macroPreview();return `<div class="preview sage"><div class="preview-head"><span class="eyebrow">MAI CÉL · PÉLDANAP</span><span class="tag">${dirty()?'Előnézet':'Aktív cél'}</span></div><div class="donut-layout"><div class="donut" role="img" aria-label="2400 kcal, fehérje ${m.p} g, szénhidrát ${m.c} g, zsír ${m.f} g" style="--p:${m.pp}%;--c:${m.pp+m.cp}%"><div><strong>2 400</strong><small>kcal / nap</small></div></div><div class="macrolegend">${[['Fehérje',m.p,m.pp,'#d58b7c'],['Szénhidrát',m.c,m.cp,'#d6b966'],['Zsír',m.f,m.fp,'#8caf86']].map(([name,g,p,col])=>`<div class="macro"><i class="dot" style="--m:${col}"></i><span>${name}</span><small>${p}%</small><b>${g} g</b></div>`).join('')}</div></div><div class="preview-footer"><span>Súlycélból számított keret</span><button class="link" data-go="goal">Célom ›</button></div></div><p class="under">Mintaadatokkal számolt előnézet. A valódi napi keretet az aktív célod adja.</p>`}
function home(){let d=domains[design.domain];let stats={fuel:`${data.fuel.meals} étkezés · ${num(data.fuel.water/1000)} l víz`,train:`${data.gym.times.filter(Boolean).length} gym-nap · ${data.sports.items.length} sport`,mezo:'Saját instrukció · személyes alaplap',me:`${data.bio.height} cm · ${data.sleep.duration/60} óra alvás`,nap:`${sleepTimes().wake} ébredés · ${sleepTimes().bed} pihenés`};return hero('Hangold<br>magadra.','Egy helyen minden, amitől ez a te Boopod.','i-beallitas','gold')+`<button class="wash current ${d.tone}" data-go="${design.domain}">${I(d.icon)}<div><span class="eyebrow kicker">MOST ITT VAGY</span><div class="word">${d.name}</div><p>${stats[design.domain]}</p></div><span class="arrow">↗</span></button>`+section('A te világod','területenként')+`<div class="domains">${Object.entries(domains).filter(([k])=>k!==design.domain).map(([k,v])=>`<button class="wash domain ${v.tone}" data-go="${k}">${I(v.icon)}<strong>${v.name}</strong><small>${v.desc}</small><span class="arrow">↗</span></button>`).join('')}</div>`+section('Az app körül')+row('i-beallitas','Megjelenés','Világos, sötét vagy a napoddal együtt','theme','lav',data.theme.mode)+row('i-ertesites','Értesítések','Mikor és miről szóljon','notifications','gold',data.notifications.enabled?'Bekapcsolva':'Kikapcsolva')+row('i-emberek','Fiókod',data.account.name,'account','rose')+row('i-tudas','Kalauzok','Bármikor újrakezdhető körbevezetés','guide','gold')+(design.owner?`<details><summary>Tulajdonosi eszközök</summary>${row('i-erme','AI-napló és admin','Használat, meghívók és hozzáférések','admin','lav')}</details>`:'')}
function fuel(){return hero('Fuel','A keret marad. A ritmust te alakítod.','boop-fuel','sage')+fuelPreview()+section('Makróprofil','előnézetet frissít')+`<div class="choices sage">${[['balanced','Kiegyensúlyozott','A megszokott arány'],['low_fat','Kevesebb zsír','Több hely a szénhidrátnak'],['low_carb','Kevesebb szénhidrát','Magasabb zsírarány'],['high_carb','Több szénhidrát','Szénhidrátközpontú'],['custom','Egyéni arány','Te adod meg a százalékokat']].map(([v,n,h])=>`<button class="choice ${edit.preset===v?'on':''}" data-set="preset" data-value="${v}" aria-pressed="${edit.preset===v}">${n}<small>${h}</small></button>`).join('')}</div>`+(edit.preset==='custom'?`<div class="sage">${field('Fehérje (%)',input('p','number','min="0" max="100" step="0.5"'))}${field('Szénhidrát (%)',input('c','number','min="0" max="100" step="0.5"'))}${field('Zsír (%)',input('f','number','min="0" max="100" step="0.5"'))}<p class="under">Összesen: ${edit.p+edit.c+edit.f}%. A fehérje testsúlyalapú védelme miatt az előnézet eltérhet a választott aránytól.</p></div>`:'')+section('Fehérjeszint')+`<div class="chips sage">${[['low','Alacsony'],['moderate','Mérsékelt'],['high','Magas']].map(([v,n])=>`<button class="chip ${edit.tier===v?'on':''}" data-set="tier" data-value="${v}" aria-pressed="${edit.tier===v}">${n}</button>`).join('')}</div><p class="under">A testsúlyod és a zsírmentes tömeged alapján. A választás rögtön látszik a fenti grammokon.</p>`+section('Napi célok')+`<div class="compact-targets"><label class="compact-target sky">${I('i-viz')}<span>Víz</span>${input('water','number','min="500" max="8000" step="100"')}<small>ml / nap</small></label><label class="compact-target sage">${I('i-noveny')}<span>Rost</span>${input('fiber','number','min="10" max="80"')}<small>g / nap</small></label></div>`+section('Energia az edzéshez')+`<div class="coral">${field('Átcsoportosítás',step('shift','kcal',0,500,50))}<p class="under">Pihenőnapról edzésnapra kerül át energia; a heti keret változatlan. A pontos napi értékeket az éles célmotor vetíti előre.</p></div>`+savebar()+section('A napod ritmusa')+row('i-nap','Étkezések és koffein',`${edit.meals} étkezés · koffein-stop ${edit.cutoff}`,'rhythm','gold')+row('i-tanyer','Étkezési ablakok','Naptípusok, időzítés és energiaelosztás','slots','sage')+row('i-kiegeszito','Fuel-emlékeztetők','Étkezési és kiegészítő-időpontok','notifications','sage')}
function rhythm(){let times=['08:00','11:00','13:00','16:00','19:00','21:00'].slice(0,edit.meals);return hero('Napi ritmus','Étkezés és pihenés ugyanazon az íven.','i-nap','gold')+`<div class="wash gold"><p class="editorial">A ritmus vezet,<br>nem korlátoz.</p><div class="times">${times.map(t=>`<div class="time-dot"><i></i>${t}</div>`).join('')}</div><p class="under">Szemléltető ritmus · az ablakokban állítható pontosra.</p></div>`+field('Étkezés naponta',step('meals','',3,6))+field('Koffein-stop',input('cutoff','time'),'A napi tervben és a koffein-habitnál is érvényes.')+row('i-alvas','Az ébrenléti időd',`${sleepTimes().wake} – ${sleepTimes().bed} · az alváscélból`,'sleep','lav')+row('i-tanyer','Pontos étkezési ablakok','Fix idő vagy edzéshez igazítás','slots','sage')+savebar()}

function prompt(){const blocks=[['Személyes alapadatok','Az appból',profileText(),'about'],['Saját bemutatkozás','Te írtad',data.about.text||'Nincs megadva.','about'],['Saját kommunikációs instrukció','Te írtad',data.voice.text||'Nincs megadva.','voice'],['Tanult kommunikációs minta',data.voice.learned?'Mezo tanulta':'Kikapcsolva',data.voice.learned?learned:'Ez a rész most nem kerül be.','voice']];return hero('Ezt kapja<br>meg Mezo','A személyes alapkontextusod, ellenőrizhetően.','i-tudas','gold')+`<div class="wash gold"><span class="eyebrow kicker">MENTETT ÁLLAPOT · DEMÓ</span><p class="normal">A személyes részek az alábbi forrásokból állnak össze. Javítsd a forrást, és mentés után itt is az új adatot látod.</p><div class="chips"><button class="chip ${!promptRaw?'on':''}" data-prompt="read">Olvasható nézet</button><button class="chip ${promptRaw?'on':''}" data-prompt="raw">Prompt szövege</button></div></div>`+(promptRaw?`<pre class="gold">${esc(promptText())}</pre>`:blocks.map(([title,origin,content,to])=>`<section class="prompt-block lav"><header><b>${title}</b><span class="tag">${origin}</span></header><p>${esc(content)}</p><button class="link" data-go="${to}">Javítás a forrásnál ›</button></section>`).join(''))+`<details><summary>Mi változhat beszélgetésenként?</summary><p class="under">A mai nap adatai, releváns emlékek, célok részletei és a beszélgetési előzmény a kérdéshez igazodva kerülhetnek mellé. Ezek nem ennek az állandó alaplapnak a részei.</p></details><details><summary>Ez a teljes system prompt?</summary><p class="under">Ez a rólad szóló személyes rész. Mezo általános működési és eszközhasználati szabályai külön blokkban maradnak. A végleges megoldásban a hívásonkénti tényleges kontextus külön ellenőrizhető.</p></details>`}

function bio(){return hero('Testprofil','Ebből számol az app. Ezt látja Mezo is.','i-emberek','rose')+`<div class="wash rose"><span class="eyebrow kicker">EGY ADAT, EGY FORRÁS</span><p class="normal">A javítás a célok számításának és a személyes kontextusnak is az alapját módosítja.</p></div><div class="rose">${field('Nem',select('sex',['Férfi','Nő']))}${field('Magasság (cm)',input('height','number','min="100" max="250"'))}${field('Születési dátum',input('birth','date'))}${field('Testzsír (%)',input('fat','number','min="0" max="70" step="0.1"'),'Pontosabb energia-becsléshez.')}</div>`+section('A napközbeni aktivitásod')+`<div class="rose">${[['Ülő','Többnyire ülőmunka, kevés mozgás'],['Vegyes','Ülés és rendszeres járkálás'],['Fizikai','Sok állás, járás vagy fizikai munka']].map(([v,h])=>`<button class="plain-row" data-set="activity" data-value="${v}" aria-pressed="${edit.activity===v}"><span class="grow"><strong>${v}</strong><small>${h}</small></span><span class="tag">${edit.activity===v?'Kiválasztva':'Választom'}</span></button>`).join('')}</div><p class="under">A betáblázott edzés külön számít; itt a nap többi részéről van szó.</p>`+section('Fenntartó energia','mentett becslés · példa')+`<div class="wash gold"><div class="value-line"><span>Alaphő és napi aktivitás</span><strong>2 260 kcal</strong></div><div class="value-line"><span>Betáblázott mozgás · napi átlag</span><strong>+ 380 kcal</strong></div><div class="flow-line"><span>Fenntartó energia</span><strong>≈ 2 640 kcal</strong></div><p class="under">Ez a mentett profilhoz tartozó szemléltető becslés. A napi célodat ebből, a célirányból és a mozgásból számolja az app.</p></div>`+savebar('Testprofil mentése')}
function sleep(){let t=sleepTimes(edit);return hero('Alvás &<br>napi ritmus','Egy biztos pontból összeáll az éjszakád.','i-alvas','lav')+`<div class="wash lav"><div class="sleepclock">${I('i-alvas')}<div><div class="number">${num(edit.duration/60)}<span> óra</span></div><div class="eyebrow kicker">ALVÁSCÉL</div></div></div><div class="flow-line"><span><small>Lefekvés</small><br><strong>${t.bed}</strong></span><span>—</span><span style="text-align:right"><small>Ébredés</small><br><strong>${t.wake}</strong></span></div></div>`+field('Időtartam',step('duration','perc',240,720,15))+section('Melyik időpont biztos?')+`<div class="chips lav">${['Ébredés','Lefekvés'].map(x=>`<button class="chip ${edit.anchor===x?'on':''}" data-set="anchor" data-value="${x}" aria-pressed="${edit.anchor===x}">${x}</button>`).join('')}</div>`+field(edit.anchor,input('time','time'))+`<p class="under">A másik időpont automatikusan követi. Ezt a napi ritmust használja a Nap és a Fuel is.</p>`+savebar('Alváscél mentése')}
function goalEstimate(g){const gap=Math.abs(Number((g.target-94.2).toFixed(1)));if(gap===0)return {label:'Súlytartás',detail:'Nincs elérendő céldátum.'};if(!Number.isFinite(g.rate)||g.rate<=0)return {label:'—',detail:'Adj meg nullánál nagyobb tempót.'};const days=Math.ceil(gap/g.rate*7);const date=new Date('2026-09-20T12:00:00Z');date.setUTCDate(date.getUTCDate()+days);return {label:new Intl.DateTimeFormat('hu-HU',{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}).format(date),detail:`${num(gap)} kg ${g.target<94.2?'fogyás':'gyarapodás'} · heti ${num(g.rate)} kg · kb. ${num(Math.round(days/7*10)/10)} hét`};}
function goal(){const estimate=goalEstimate(edit);return hero('Súlycél','Az irányod és a vállalható tempód.','i-cel','coral')+`<div class="wash coral"><span class="eyebrow kicker">AKTÍV CÉL · MINTAADAT</span><div class="flow-line"><div><small>Most</small><div class="number">94,2<span> kg</span></div></div><span>→</span><div><small>Cél</small><div class="number">${num(edit.target)}<span> kg</span></div></div></div><p class="under">A legutóbbi mérés: szeptember 20.</p></div><div class="coral">${field('Céltestsúly (kg)',input('target','number','min="40" max="250" step="0.1"'))}${field('Céltempó (kg / hét)',input('rate','number','min="0.1" max="1" step="0.1"'))}</div><div class="derived-date coral" aria-live="polite"><span class="eyebrow kicker">${edit.target===94.2?'CÉLIRÁNY':'BECSÜLT CÉLDÁTUM · SZÁMÍTOTT'}</span><output class="date-value">${estimate.label}</output><p>${estimate.detail}</p></div><p class="under">A céltestsúly és a tempó módosítja a becsült céldátumot. A becslés a szeptember 20-i mérésből, változatlan tempóval számol.</p>`+section('Védőkorlátok')+`<div class="chips coral"><span class="tag">Erővédelem</span><span class="tag">Izomvédelem</span></div><p class="under">A meglévő célvédelmek a cél részletes nézetéhez tartoznak.</p>`+savebar('Cél módosítása')+`<button class="link coral" data-action="archive-goal">${data.goal.active?'Cél archiválása':'Cél visszaállítása a demóban'}</button>`}
function nap(){let t=sleepTimes();return hero('Nap','A ritmus, ami összefogja a napodat.','boop-nap','gold')+`<div class="wash gold"><p class="editorial">Jó reggeltől<br>a lecsendesedésig.</p><div class="times">${[[t.wake,'Ébredés'],['12:30','Napközben'],[t.bed,'Pihenés']].map(([t,l])=>`<div class="time-dot"><i></i>${t}<br>${l}</div>`).join('')}</div></div>`+section('Napi kapaszkodók')+row('i-alvas','Ébredés és lefekvés',`${t.wake} → ${t.bed} · közös az alváscéllal`,'sleep','lav')+row('i-ertesites','Check-in és napzárás','Mikor szóljon és mely jelzések maradjanak','notifications','gold')+row('i-nap','Étkezési ritmus',`${data.fuel.meals} étkezés · koffein-stop ${data.fuel.cutoff}`,'rhythm','sage')+`<div class="paper-note gold"><p class="normal">A rutinjaid konkrét lépéseit továbbra is a Rutin oldalon szerkeszted. Itt a közös napi ritmus és az emlékeztetők kapnak helyet.</p></div>`}

function notifications(){return hero('Értesítések','Annyi jelzés, amennyi neked segít.','i-ertesites','gold')+`<div class="wash gold">${field('Push értesítések',toggle('enabled','Push értesítések'))}<p class="under">${edit.enabled?'Ezen az eszközön bekapcsolva · demóállapot':'A beállításaid megmaradnak, de nem küldünk push jelzést.'}</p></div>`+notificationGroups.map(([name,tone,items])=>`<details data-notification-group="${name}" ${expandedNotifications.has(name)?'open':''} class="${tone}"><summary>${name} · ${items.filter(([k])=>edit.prefs[k]!==false).length}/${items.length} bekapcsolva</summary>${items.map(([k,l,h])=>`<label class="field"><span>${l}<small>${h}</small></span><input class="switch" type="checkbox" data-notification="${k}" aria-label="${l}" ${edit.prefs[k]!==false?'checked':''} ${!edit.enabled?'disabled':''}></label>`).join('')}${name==='Edzés'?field('Ennyivel előtte',step('lead','perc',0,120,5))+row('i-edzes','Gym-időpontok','A kezdési idő módosítása','gym','coral'):''}${name==='Én'?row('i-alvas','Alváscél','A lefekvési és ébredési horgony','sleep','lav'):''}</details>`).join('')+savebar('Értesítések mentése')}
function theme(){return hero('Megjelenés','Ugyanaz a világ. Más fények.','i-beallitas','lav')+`<div class="choices lav">${[['Világos','Meleg homok, pasztell szigetek'],['Sötét','Meleg grafit, visszafogott fények'],['Cirkadián','A napszakot követi']].map(([v,h])=>`<button class="choice ${edit.mode===v?'on':''}" data-set="mode" data-value="${v}"><div class="swatches"><i style="--tone:${v==='Sötét'?'#302720':'#fbf6ef'}"></i><i style="--tone:${v==='Sötét'?'#514258':'#e6ddf5'}"></i><i style="--tone:${v==='Sötét'?'#47583d':'#dfebd5'}"></i></div>${v}<small>${h}</small></button>`).join('')}</div><div class="theme-preview sage"><div>${I('boop-fuel')}<p class="editorial">Jó itt lenni.<br>Nappal és este is.</p></div><p class="under">A választás ezen az eszközön érvényes. A napszakváltó gomb helyét a fejlécben a Beállítások veszi át.</p></div>`+savebar('Megjelenés mentése')}
function account(){return hero('Fiókod','Az adataid és a belépésed.','i-emberek','rose')+`<div class="wash rose"><span class="eyebrow kicker">SZEMÉLYES FIÓK</span><p class="editorial">Szia, ${esc(edit.name)}.</p><p class="under">A példában megjelenő e-mail-cím nem valódi fiókadat.</p></div>`+field('Név',input('name'))+field('E-mail',input('email','email'))+savebar('Fiókadatok mentése')+section('Belépés')+row('i-beallitas','Jelszó módosítása','Új jelszó beállítása','password','rose')+`<button class="link rose" data-action="logout">Kijelentkezés ezen az eszközön</button>`}
function password(){return hero('Új jelszó','A belépésed maradjon a tiéd.','i-beallitas','rose')+`<form id="bdv-password">${field('Jelenlegi jelszó','<input type="password" name="old" required autocomplete="current-password">')}${field('Új jelszó','<input type="password" name="new" required minlength="8" autocomplete="new-password">')}${field('Új jelszó még egyszer','<input type="password" name="repeat" required minlength="8" autocomplete="new-password">')}<p class="under">Legalább 8 karakter. A prototípus nem küld és nem tárol jelszót.</p><div class="save"><button class="primary" type="button" data-action="password-check">Jelszó módosítása</button></div><p id="bdv-pass-status" role="status" class="message"></p></form>`}
function guide(){return hero('Nézz körül<br>újra.','Egy kis segítség, amikor jól jön.','i-tudas','gold')+`<div class="wash gold"><p class="editorial">A kalauz nem vizsga.<br>Bármikor visszatérhetsz.</p><p class="normal">Az oldalakon a fejléc kérdőjele nyitja meg a helyi útmutatót.</p></div>`+section('Területeid')+Object.entries(domains).map(([k,v])=>`<button class="plain-row ${v.tone}" data-guide="${k}">${I(v.icon)}<span class="grow"><strong>${v.name}</strong><small>${v.desc}</small></span><span class="arrow">›</span></button>`).join('')+`<div class="save"><button class="primary" data-action="reset-guides">Összes kalauz újranézése</button></div>`}
function admin(){return hero('Tulajdonosi<br>eszközök','Csak a tulajdonosi fiók számára.','i-erme','lav')+`<div class="wash lav"><p class="editorial">A személyes beállítások<br>mellett, külön térben.</p></div>`+section('Meglévő adminfelületek')+`<div class="prompt-block"><h3>AI-napló</h3><p>Hívások, költségek és modellhasználat.</p><span class="tag">Céloldal: /admin/cost</span></div><div class="prompt-block"><h3>Admin</h3><p>Meghívók, felhasználók és hozzáférések.</p><span class="tag">Céloldal: /admin</span></div><p class="under">Ezek meglévő külön alkalmazásrészek. A prototípus a belépők helyét mutatja; az adminfelületek újratervezése nem része ennek a változásnak.</p>`}
const renderers={home,fuel,rhythm,slots,train,gym,sports,mezo,about,voice,prompt,me,bio,sleep,goal,nap,notifications,theme,account,password,guide,admin};
function render(){root.style.colorScheme=(page==='theme'?edit.mode:data.theme.mode)==='Sötét'?'dark':(page==='theme'?edit.mode:data.theme.mode)==='Világos'?'light':'light dark';let content=renderers[page]();main.innerHTML=(page==='home'?'':`<button class="back" data-action="back">‹ ${history.length?'Vissza':'Beállítások'}</button>`)+content+(validation()?`<div class="error" role="alert">${validation()}</div>`:'')+(message?`<div class="message" role="status">${esc(message)}</div>`:'')+(confirmation?`<div class="confirm"><h3>${confirmation.kind==='archive'?'Cél archiválása':confirmation.kind==='logout'?'Kijelentkezés':'Nem mentett módosítások'}</h3><p>${confirmation.kind==='archive'?'A demóban inaktív lesz a súlycélod.':confirmation.kind==='logout'?'Ez csak a kijelentkezési folyamat előnézete.': 'A változtatásaid még csak előnézetben élnek.'}</p><button class="secondary" data-action="stay">Maradok</button> <button class="secondary" data-action="discard">${confirmation.kind?'Megerősítem':'Elvetem és továbblépek'}</button>${!confirmation.kind?` <button class="link" data-action="save-leave" ${validation()?'disabled':''}>Mentés és továbblépés</button>`:''}</div>`:'');root.querySelectorAll('button:not([type])').forEach(b=>b.type='button');root.querySelectorAll('[data-icon]').forEach(x=>x.src=assets[x.dataset.icon]);root.style.setProperty('--richness',design.color==='Gazdag'?'1':'.6');if(design.color==='Visszafogott')root.querySelectorAll('.wash').forEach(x=>x.style.background='var(--pale)');}
function setValue(key,val){edit[key]=val;message='';render()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||(b.type==='submit'&&b.form)||b.disabled)return;
if(b.dataset.go){nav(b.dataset.go);return}if(b.dataset.set){setValue(b.dataset.set,b.dataset.value);return}if(b.dataset.step){let k=b.dataset.step;edit[k]=Math.min(+b.dataset.max,Math.max(+b.dataset.min,edit[k]+b.dataset.dir*b.dataset.by));render();return}
if(b.dataset.slotType){slotType=b.dataset.slotType;selectedSlot=0;render();return}if(b.dataset.slotOpen!==undefined){selectedSlot=selectedSlot===+b.dataset.slotOpen?-1:+b.dataset.slotOpen;render();return}if(b.dataset.slotRemove!==undefined){edit[slotType].splice(+b.dataset.slotRemove,1);selectedSlot=-1;render();return}if(b.dataset.sportRemove!==undefined){edit.items.splice(+b.dataset.sportRemove,1);render();return}if(b.dataset.prompt){promptRaw=b.dataset.prompt==='raw';render();return}if(b.dataset.guide){message=domains[b.dataset.guide].name+' kalauza újra elérhető lesz a helyi kérdőjel alatt. (Demó)';render();return}
let a=b.dataset.action;if(a==='password-check'){checkPassword();return}if(a==='back'){returnBack();return}if(a==='save'){if(validation())return;data[editKey]=clone(edit);message='Elmentve a prototípusban. A kapcsolódó nézetek frissültek.';render();return}if(a==='cancel'){edit=clone(data[editKey]);message='Változtatások visszavonva.';render();return}if(a==='stay'){confirmation=null;render();return}if(a==='save-leave'||a==='discard'){let c=confirmation;if(!c)return;if(c.kind==='archive'){data.goal.active=false;edit=clone(data.goal);confirmation=null;message='A cél a demóban archiválva.';render();return}if(c.kind==='logout'){confirmation=null;message='Kijelentkezés előnézete kész. A valódi fiókodba nem nyúltunk.';render();return}if(a==='save-leave')data[editKey]=clone(edit);editKey=null;edit=null;confirmation=null;if(c.to==='__back')returnBack();else navigate(c.to,c.remember);return}if(a==='add-slot'){edit[slotType].push({name:'Új étkezés',time:'15:00',pct:0,role:'Normál',anchor:'Fix időpont',offset:0});selectedSlot=edit[slotType].length-1;render();return}if(a==='add-sport'){edit.items.push({day:0,sport:'TRX',kind:'Edzés',time:'18:00',duration:45,place:'',intensity:'Közepes'});render();return}if(a==='archive-goal'){if(!data.goal.active){data.goal.active=true;edit=clone(data.goal);render()}else{confirmation={kind:'archive'};render()}return}if(a==='logout'){confirmation={kind:'logout'};render();return}if(a==='reset-guides'){data.guide.reset=true;message='A demóban minden kalauz újranézhető.';render();return}
});
