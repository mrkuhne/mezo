<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boop indítókép</title>
<meta name="description" content="Az indítókép három mozgásváltozata: lélegzés, töltődés, keringés.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --page:#191614;--panel:#211d1a;--ink:#F5EFE6;--sub:#B7A899;--faint:#8A7A6A;--hair:rgba(245,239,230,.08);
  --lav:#AB9FD2;--gold:#FFBE60;--sky:#7FB2DE;--sage:#8FB49A;--coral:#FF7E5C;
  --ff:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.78,.24,1);
}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{margin:0;font-family:var(--ff);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--lav);outline-offset:3px;border-radius:12px}

/* ── the viewer around the phone ── */
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:28px;grid-template-columns:minmax(0,1fr) auto;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);justify-items:center}.side{max-width:420px;width:100%}}
.side{display:grid;gap:18px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
h1{margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.1;text-wrap:balance}
.lede{margin:0;color:var(--sub);font-size:14.5px;line-height:1.55;max-width:46ch}
.picker{display:grid;gap:10px}
.opt{--c:var(--lav);display:grid;grid-template-columns:34px 1fr;gap:4px 12px;align-items:center;padding:14px 16px;border-radius:18px;
  background:linear-gradient(160deg,rgba(52,46,41,.5),rgba(30,27,24,.4));box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .25s var(--ease),background .25s var(--ease)}
.opt .tag{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.opt b{font-size:15.5px;font-weight:600}
.opt span{font-size:13px;color:var(--sub);line-height:1.45}
.opt[aria-selected="true"]{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,rgba(52,46,41,.7)),rgba(30,27,24,.6));
  box-shadow:inset 0 0 0 1.3px color-mix(in srgb,var(--c) 70%,transparent),0 0 26px -8px color-mix(in srgb,var(--c) 60%,transparent)}
.opt[aria-selected="true"] .tag{background:var(--c);color:#1E1B18}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13.5px;color:var(--sub)}
.ctl label{display:flex;gap:8px;align-items:center;cursor:pointer}
.ctl input{accent-color:var(--lav);width:16px;height:16px}
.btn{padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;color:#1E1B18;background:linear-gradient(135deg,#E6DDFF,var(--lav));box-shadow:0 8px 20px -10px var(--lav)}

/* ── phone ── */
.phone{position:relative;width:360px;max-width:calc(100vw - 32px);height:720px;border-radius:42px;overflow:hidden;background:var(--page);
  box-shadow:0 40px 90px -30px #000,0 0 0 10px #2A2521,0 0 0 11px rgba(245,239,230,.08)}
@media(max-width:440px){.phone{height:640px;border-radius:32px}}
.aurora{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.2}
.aurora i:nth-child(1){width:280px;height:280px;left:-90px;top:40px;background:#5E8A67}
.aurora i:nth-child(2){width:240px;height:240px;right:-100px;top:-40px;background:#C98A3A}
.aurora i:nth-child(3){width:260px;height:260px;left:30px;bottom:-60px;background:#6D5FA8}
.after{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;color:var(--faint);font-size:13.5px;text-align:center;padding:24px}
.after strong{font-size:22px;font-weight:700;letter-spacing:-.8px;background:linear-gradient(120deg,#F5EFE6 0%,#E6DDFF 55%,#E9C48A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── the splash (same geometry as the app's) ── */
.stage{position:absolute;inset:0;z-index:5}
.splash{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;overflow:hidden;background:var(--page)}
.mark{position:relative;width:150px;height:150px;display:grid;place-items:center}
.halo{position:absolute;left:50%;top:50%;width:460px;height:420px;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(ellipse,rgba(171,159,210,.34),rgba(255,190,96,.14) 42%,transparent 68%)}
.glow{position:absolute;inset:-18px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(171,159,210,.55),rgba(171,159,210,0) 68%)}
.ripple{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0;border:1.6px solid rgba(230,221,255,.7);box-shadow:0 0 18px rgba(171,159,210,.55)}
.trail{position:absolute;left:50%;top:50%;pointer-events:none;overflow:visible;opacity:0}
.trail ellipse{fill:none;stroke:rgba(171,159,210,.28);stroke-width:1.2;stroke-dasharray:2 6}

/* glass recipe (üveg bible §3), dark variant, round */
.orb{--c:var(--lav);position:relative;z-index:2;width:150px;height:150px;border-radius:50%;isolation:isolate;overflow:hidden;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 62%),linear-gradient(160deg,rgba(52,46,41,.72),rgba(30,27,24,.6));
  backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);
  box-shadow:0 16px 30px -16px rgba(0,0,0,.75),0 0 26px -6px color-mix(in srgb,var(--c) 30%,transparent),inset 0 1px 0 rgba(255,244,230,.10),inset 0 -14px 26px -18px color-mix(in srgb,var(--c) 55%,transparent)}
.orb::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.3px;pointer-events:none;z-index:3;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 80%,transparent) 0%,rgba(255,244,230,.16) 30%,color-mix(in srgb,var(--c) 18%,transparent) 62%,color-mix(in srgb,var(--c) 60%,transparent) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.orb svg{position:absolute;inset:0;width:100%;height:100%}
.liquid{opacity:.85;filter:drop-shadow(0 0 10px rgba(171,159,210,.7))}
.hi{fill:none;stroke:rgba(255,255,255,.55);stroke-width:5;stroke-linecap:round}
.sheen{position:absolute;top:-20%;bottom:-20%;left:0;width:34%;z-index:4;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,244,230,.4),transparent)}

.ic{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;opacity:0;will-change:transform,opacity}
.ic svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 7px rgba(0,0,0,.55)) drop-shadow(0 0 10px color-mix(in srgb,var(--c) 55%,transparent))}

.has-orbit .mark{margin-block:56px}
.word{position:relative;font-family:var(--ff);font-size:48px;font-weight:700;letter-spacing:-2px;line-height:1;
  background:linear-gradient(120deg,#F5EFE6 0%,#E6DDFF 55%,#E9C48A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(171,159,210,.35))}
</style>

<main class="wrap">
  <section class="side">
    <div>
      <div class="eyebrow">Indítókép · mozgás</div>
      <h1>Életre keltett Boop-gömb</h1>
    </div>
    <p class="lede">Ugyanaz az üveggömb és ugyanaz a három másodperc, mint most. Csak az változik, mit csinál közben. Válassz egyet, és nézd meg a telefonon.</p>
    <div class="picker" role="tablist" aria-label="Változatok">
      <button class="opt" role="tab" data-v="most" style="--c:var(--faint)"><i class="tag">0</i><b>Mostani</b><span>Lassan lebeg, a folyadék hullámzik. Ehhez mérjük a többit.</span></button>
      <button class="opt" role="tab" data-v="lelegzes"><i class="tag">A</i><b>Lélegzés</b><span>A gömb kétszer megduzzad, a fénye vele erősödik, és egy halvány gyűrű fut ki belőle.</span></button>
      <button class="opt" role="tab" data-v="toltodes" style="--c:var(--sky)"><i class="tag">B</i><b>Töltődés</b><span>A lila folyadék az indulással együtt feltölti a gömböt, buborékok szállnak, a végén fénycsík söpör át rajta.</span></button>
      <button class="opt" role="tab" data-v="keringes" style="--c:var(--gold)"><i class="tag">C</i><b>Keringés</b><span>Öt ikon kering körben a gömb körül: nap, súlyzó, tál, vízcsepp, hold.</span></button>
      <button class="opt" role="tab" data-v="kombo" style="--c:var(--coral)"><i class="tag">D</i><b>Töltődés + keringés</b><span>A gömb feltöltődik, közben az öt ikon körben kering körülötte. A végén a fénycsík átsöpör az üvegen.</span></button>
    </div>
    <div class="ctl">
      <button class="btn" id="replay" type="button">Újrajátszás</button>
      <label><input type="checkbox" id="loop" checked> Ismétlés</label>
      <label><input type="checkbox" id="still"> Csökkentett mozgás</label>
    </div>
  </section>

  <div class="phone" aria-label="Telefon-előnézet">
    <div class="aurora"><i></i><i></i><i></i></div>
    <div class="after" id="after" hidden><strong>boop</strong>Itt nyílik meg az app.<br>A változat mindjárt újraindul.</div>
    <div class="stage" id="stage"></div>
  </div>
</main>

<script>
(() => {
const DUR = 3000, FADE = 300;
const ORBIT = [
  { id: 't-sun',      c: '#FFBE60' },
  { id: 't-dumbbell', c: '#FF7E5C' },
  { id: 't-bowl',     c: '#8FB49A' },
  { id: 't-water',    c: '#7FB2DE' },
  { id: 't-moon',     c: '#AB9FD2' },
];
const stage = document.getElementById('stage'), after = document.getElementById('after');
const loopBox = document.getElementById('loop'), stillBox = document.getElementById('still');
const mq = matchMedia('(prefers-reduced-motion: reduce)');
if (mq.matches) stillBox.checked = true;

const clamp = x => Math.max(0, Math.min(1, x));
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const bob = (t, p) => (1 - Math.cos(2 * Math.PI * t / p)) / 2;

let variant = 'lelegzes', raf = 0, timer = 0, t0 = 0, el = {};

function splashHTML(v) {
  const fill = v === 'toltodes' || v === 'kombo';
  const bubbles = fill
    ? Array.from({ length: 7 }, (_, i) => `<circle class="bub" r="${1.4 + (i % 3) * .7}" fill="rgba(255,255,255,.6)" opacity="0"/>`).join('') : '';
  const backWave = fill
    ? `<path class="back" fill="#5E4F9A" opacity=".55" d="M-20 88 Q0 98 20 88 T60 88 T100 88 T140 88 T180 88 V220 H-20Z"/>` : '';
  const ripples = v === 'lelegzes' ? '<i class="ripple"></i><i class="ripple"></i><i class="ripple"></i>' : '';
  const orbit = (v === 'keringes' || v === 'kombo')
    ? `<svg class="trail" width="240" height="240" viewBox="-120 -120 240 240"><ellipse cx="0" cy="0" rx="108" ry="108"/></svg>` +
      ORBIT.map(o => `<span class="ic" style="--c:${o.c}"><svg viewBox="0 0 64 64"><use href="#${o.id}"/></svg></span>`).join('') : '';
  return `<div class="splash${orbit ? ' has-orbit' : ''}" role="status" aria-label="Boop betöltése">
    <div class="mark" aria-hidden="true">
      <div class="halo"></div><div class="glow"></div>${ripples}${orbit}
      <div class="orb">
        <svg viewBox="0 0 150 150">
          <defs>
            <clipPath id="oc"><circle cx="75" cy="75" r="68"/></clipPath>
            <linearGradient id="og" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6DDFF"/><stop offset=".55" stop-color="#AB9FD2"/><stop offset="1" stop-color="#5E4F9A"/></linearGradient>
          </defs>
          <g clip-path="url(#oc)">
            <g class="level">
              <g class="slosh">${backWave}
                <g class="wave"><path class="liquid" fill="url(#og)" d="M-20 88 Q0 78 20 88 T60 88 T100 88 T140 88 T180 88 V220 H-20Z"/></g>
              </g>
            </g>
            ${bubbles}
          </g>
          <path class="hi" d="M34 44 A48 48 0 0 1 62 26"/>
        </svg>
        <i class="sheen"></i>
      </div>
    </div>
    <span class="word" aria-hidden="true">boop</span>
  </div>`;
}

function build(v) {
  stage.innerHTML = splashHTML(v);
  const q = s => stage.querySelector(s), qa = s => [...stage.querySelectorAll(s)];
  el = { orb: q('.orb'), halo: q('.halo'), glow: q('.glow'), wave: q('.wave'), level: q('.level'), slosh: q('.slosh'),
         back: q('.back'), sheen: q('.sheen'), word: q('.word'), ripples: qa('.ripple'), bubs: qa('.bub'),
         icons: qa('.ic'), trail: q('.trail') };
  const w = stage.clientWidth || 360;
  el.rx = Math.min(108, (w - 60) / 2); el.ry = el.rx;
  if (el.trail) { const e = el.trail.querySelector('ellipse'); e.setAttribute('rx', el.rx); e.setAttribute('ry', el.ry); }
}

/* ── frame renderers; t in ms, still=true draws the resting frame ── */
function common(t, still) {
  const p = still ? 1 : clamp((t - 200) / 600), e = outCubic(p);
  el.word.style.opacity = p;
  el.word.style.transform = `translateY(${8 * (1 - e)}px)`;
  if (!still) el.wave.setAttribute('transform', `translate(${-8 * bob(t, 3200)} 0)`);
}

const R = {
  most(t, still) {
    common(t, still);
    el.orb.style.transform = still ? '' : `translateY(${-6 * bob(t, 5000)}px)`;
  },

  lelegzes(t, still) {
    common(t, still);
    if (still) return;
    const P = 1350, local = t - 150;
    let b = 0;
    if (local >= 0) {
      const ph = (local % P) / P;
      b = ph < .28 ? outCubic(ph / .28) : 1 - inOutCubic((ph - .28) / .72);
    }
    el.orb.style.transform = `scale(${1 + .065 * b})`;
    el.halo.style.transform = `translate(-50%,-50%) scale(${1 + .16 * b})`;
    el.halo.style.opacity = .7 + .3 * b;
    el.glow.style.opacity = .15 + .75 * b;
    el.glow.style.transform = `scale(${1 + .18 * b})`;
    el.ripples.forEach((r, k) => {
      const age = local - k * P;
      if (age < 0 || age > 1500) { r.style.opacity = 0; return; }
      const a = age / 1500;
      r.style.opacity = .6 * (1 - a) * clamp(age / 120);
      r.style.transform = `scale(${1 + 1.05 * outCubic(a)})`;
    });
  },

  toltodes(t, still) {
    common(t, still);
    const p = still ? 1 : inOutCubic(clamp((t - 100) / 2300));
    const lvl = 150 + (88 - 150) * p;
    el.level.setAttribute('transform', `translate(0 ${lvl - 88})`);
    if (still) { el.back.setAttribute('opacity', 0); return; }
    const calm = 1 - .75 * p;
    el.slosh.setAttribute('transform', `rotate(${7 * Math.sin(t / 240) * calm} 75 ${lvl})`);
    el.wave.setAttribute('transform', `translate(${-10 * bob(t, 1300)} 0)`);
    el.back.setAttribute('transform', `translate(${-10 * bob(t + 650, 1300)} ${-3})`);
    el.bubs.forEach((c, i) => {
      const start = 180 + i * 290, age = t - start;
      const y = 142 - age * .07, x = 38 + (i * 23) % 76 + 4 * Math.sin(age / 140 + i);
      const vis = age > 0 && y > lvl + 4;
      c.setAttribute('cx', x); c.setAttribute('cy', y);
      c.setAttribute('opacity', vis ? .75 * clamp(age / 200) * clamp((y - lvl - 4) / 14) : 0);
    });
    const s = clamp((t - 2250) / 520);
    el.sheen.style.opacity = s > 0 && s < 1 ? 1 : 0;
    el.sheen.style.transform = `skewX(-20deg) translateX(${-120 + 440 * inOutCubic(s)}%)`;
    const flash = Math.max(0, 1 - Math.abs(t - 2450) / 260);
    el.glow.style.opacity = .1 + .8 * flash + .15 * p;
  },

  keringes(t, still) {
    common(t, still);
    el.orb.style.transform = still ? '' : `translateY(${-5 * bob(t, 5000)}px)`;
    orbit(t, still);
  },

  kombo(t, still) {
    R.toltodes(t, still);
    orbit(t, still);
  },
};

function orbit(t, still) {
    const spin = still ? 0 : t / 5200;
    el.trail.style.opacity = still ? .9 : clamp((t - 150) / 700) * .9;
    el.trail.style.transform = 'translate(-50%,-50%)';
    el.icons.forEach((ic, i) => {
      const e = still ? 1 : outCubic(clamp((t - 120 - i * 110) / 750));
      const th = 2 * Math.PI * (i / ORBIT.length + spin) - Math.PI / 2;
      const r = el.rx * (.55 + .45 * e);
      ic.style.transform = `translate(${r * Math.cos(th)}px,${r * Math.sin(th)}px) scale(${.6 + .4 * e})`;
      ic.style.opacity = e;
      ic.style.zIndex = 3;
    });
}

function stop() { cancelAnimationFrame(raf); clearTimeout(timer); }

function run() {
  stop();
  after.hidden = true;
  build(variant);
  stage.style.opacity = 1;
  const still = stillBox.checked;
  if (still) {
    R[variant](0, true);
    timer = setTimeout(finish, DUR);
    return;
  }
  R[variant](0, false);
  t0 = performance.now();
  const tick = now => {
    const t = now - t0;
    R[variant](t, false);
    stage.style.opacity = t > DUR - FADE ? 1 - clamp((t - (DUR - FADE)) / FADE) : 1;
    if (t >= DUR) return finish();
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

function finish() {
  stop();
  stage.style.opacity = 0;
  after.hidden = false;
  if (loopBox.checked) timer = setTimeout(run, 1400);
}

function select(v) {
  if (!R[v]) v = 'kombo';
  variant = v;
  document.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  run();
}

const HASH = { most: 'most', lelegzes: 'lelegzes', toltodes: 'toltodes', keringes: 'keringes', kombo: 'kombo' };
document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
  if (location.hash.slice(1) === b.dataset.v) select(b.dataset.v); else location.hash = b.dataset.v;
}));
addEventListener('hashchange', () => select(HASH[location.hash.slice(1)]));
document.getElementById('replay').addEventListener('click', run);
stillBox.addEventListener('change', run);
loopBox.addEventListener('change', () => { if (loopBox.checked && !after.hidden) run(); });
select(HASH[location.hash.slice(1)] || 'kombo');
})();
</script>
