<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Csepp prototípus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,600&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────
   Új UI irány · Nap és Edzés — három változat egymás mellett
   Jelenlegi (Üveg, az élő prototípus beágyazva) · Klinikai sötét · Lelet világos
   Layout: fixed phone (390×844) with a notes column; stacks under 900px.
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#F2F3F1; --fg:#1C2126; --mute:#6B737A; --line:rgba(28,33,38,.12); --card:#FFFFFF; --acc:#1F6F6A;
  --ff:'Geist',system-ui,-apple-system,sans-serif; --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace; --serif:'Fraunces',Georgia,serif;
  --ease:cubic-bezier(.2,.78,.24,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121517;--fg:#E7E9E6;--mute:#8E959B;--line:rgba(231,233,230,.12);--card:#1A1E21;--acc:#6FB3AC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121517;--fg:#E7E9E6;--mute:#8E959B;--line:rgba(231,233,230,.12);--card:#1A1E21;--acc:#6FB3AC;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--ff);color:var(--fg);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
svg.ic{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.ic.td{stroke:none;width:26px;height:26px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.hb svg.ic.td{width:22px;height:22px}.tb svg.ic.td{width:27px;height:27px;filter:grayscale(.45) brightness(.85)}.tb.on svg.ic.td{filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.dmark i svg.ic.td{width:24px;height:24px}.qa button svg.ic.td,.pair button svg.ic.td{width:30px;height:30px}.ds i svg.ic.td{width:12px;height:12px}.btn svg.ic.td{width:20px;height:20px}
.phone[data-v="vilagos"] svg.ic.td{filter:drop-shadow(0 3px 4px rgba(27,32,36,.25))}

/* ── page chrome (outside the phone) ─────────────── */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:18px 16px 10px;border-bottom:1px solid var(--line)}
.top h1{font-size:15px;font-weight:600;letter-spacing:-.2px}
.top h1 small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--line)}
.seg button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.top label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-left:auto}
.stage{display:flex;gap:36px;align-items:flex-start;justify-content:center;padding:26px 16px 60px}
.notes{max-width:360px;min-width:0;font-size:13.5px;line-height:1.5;color:var(--fg)}
.notes h2{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.notes h2:first-child{margin-top:4px}
.notes p{margin-bottom:8px}
.notes ul{padding-left:18px;display:grid;gap:5px}
.notes .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.notes .pal{display:flex;flex-wrap:wrap;gap:6px 12px;margin:6px 0 10px}
.notes .pal span{font-size:12px;color:var(--mute)}
@media(max-width:900px){.stage{flex-direction:column;align-items:center}.notes{max-width:420px}}

/* ── phone frame ─────────────────────────────── */
.phone{position:relative;width:390px;max-width:100%;height:844px;border-radius:44px;overflow:hidden;background:var(--page);color:var(--ink);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.55),0 0 0 10px #26292B,0 0 0 11px rgba(255,255,255,.08)}
.phone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#141210}
@media(max-width:440px){.stage{padding:0 0 40px}.phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;padding-bottom:110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ══ KLINIKAI SÖTÉT — grafit alap, egy acélkék akcentus, jelentéses státuszszínek ══ */
.phone[data-v="sotet"]{
  --page:#0F1214; --ink:#E6E9EA; --sub:#9AA3A8; --faint:#6B757B; --hair:rgba(230,233,234,.09);
  --card:#161B1E; --card2:#1C2226; --acc:#7FB2D0; --acc-ink:#0F1214;
  --ok:#5FA98A; --warn:#CFA14A; --bad:#CF6B5E; --info:#7FB2D0;
  --disp:var(--ff); --dispw:600; --dispt:-.6px; --r:14px;
}
/* ══ LELET VILÁGOS — papírfehér alap, tinta, egy mély klinikai zöldeskék ══ */
.phone[data-v="vilagos"]{
  --page:#F7F7F4; --ink:#1B2024; --sub:#5F6A70; --faint:#8F999F; --hair:rgba(27,32,36,.12);
  --card:#FFFFFF; --card2:#EFF1EE; --acc:#1F6F6A; --acc-ink:#FFFFFF;
  --ok:#2E8A68; --warn:#B07A1E; --bad:#B5473B; --info:#1F6F6A;
  --disp:var(--serif); --dispw:500; --dispt:-.3px; --r:10px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.35),0 0 0 10px #FFFFFF,0 0 0 11px rgba(0,0,0,.1);
}
.phone[data-v="vilagos"] .scroll{background:
  linear-gradient(var(--page),var(--page)) padding-box}

/* ══ HIBRID MELEG — a mostani meleg grafit és derengés marad, üveg csak az egy hangsúlyos kártyán ══ */
.phone[data-v="hibrid"]{
  --page:#141210; --ink:#F0E9DF; --sub:#B3A595; --faint:#857664; --hair:rgba(240,233,223,.09);
  --card:#1C1916; --card2:#231F1B; --acc:var(--dom,#E0A95A); --acc-ink:#141210;
  --ok:#8FB49A; --warn:#E0A95A; --bad:#E8785A; --info:#7FB2DE;
  --disp:var(--ff); --dispw:600; --dispt:-.6px; --r:18px;
  box-shadow:0 40px 90px -30px #000,0 0 0 10px #2A2521,0 0 0 11px rgba(245,239,230,.08);
}
.phone[data-v="hibrid"][data-d="nap"]{--dom:#E0A95A}
.phone[data-v="hibrid"][data-d="edzes"]{--dom:#E8785A}
.aurora{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.16}
.aurora i:nth-child(1){width:300px;height:300px;left:-90px;top:60px;background:#5E8A67}
.aurora i:nth-child(2){width:260px;height:260px;right:-100px;top:-40px;background:#C98A3A}
.aurora i:nth-child(3){width:280px;height:280px;left:40px;top:520px;background:#6D5FA8}
.aurora i:nth-child(4){width:220px;height:220px;right:-80px;top:760px;background:#B8584A}
.phone[data-v="hibrid"] .hd{background:linear-gradient(180deg,rgba(20,18,16,.92) 60%,rgba(20,18,16,.6));border-bottom:0}
.phone[data-v="hibrid"] .wm{background:linear-gradient(120deg,#F5EFE6 0%,#E6DDFF 55%,#E9C48A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:23px;letter-spacing:-1px;font-weight:700}
.phone[data-v="hibrid"] .hb{background:rgba(240,233,223,.05);border-color:rgba(240,233,223,.12)}
.phone[data-v="hibrid"] .nav{left:10px;right:10px;bottom:12px;border-radius:26px;border:1px solid rgba(240,233,223,.12);background:rgba(34,30,27,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 16px 30px -16px rgba(0,0,0,.75)}
.phone[data-v="hibrid"] .scroll{padding-bottom:120px}
.phone[data-v="hibrid"] .card{background:rgba(240,233,223,.035);border-color:rgba(240,233,223,.08)}
.phone[data-v="hibrid"] .tb.on{background:radial-gradient(80% 90% at 50% 20%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%)}
/* the ONE glass card per screen: the living recipe, color frame + glow, no sheen */
.phone[data-v="hibrid"] .hg{--c:var(--acc);position:relative;isolation:isolate;border:0;border-radius:22px;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 62%),linear-gradient(160deg,rgba(52,46,41,.72),rgba(30,27,24,.6));
  box-shadow:0 16px 30px -16px rgba(0,0,0,.75),0 0 26px -6px color-mix(in srgb,var(--c) 30%,transparent),inset 0 1px 0 rgba(255,244,230,.10),inset 0 -14px 26px -18px color-mix(in srgb,var(--c) 55%,transparent)}
.phone[data-v="hibrid"] .hg::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 80%,transparent) 0%,rgba(255,244,230,.16) 30%,color-mix(in srgb,var(--c) 18%,transparent) 62%,color-mix(in srgb,var(--c) 60%,transparent) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.phone[data-v="hibrid"] .hg.hero{margin:6px 16px 10px;padding:16px 16px 14px}
.phone[data-v="hibrid"] .ring .p{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 70%,transparent))}
.phone[data-v="hibrid"] .btn{box-shadow:0 10px 22px -10px color-mix(in srgb,var(--acc) 80%,transparent)}
.phone[data-v="hibrid"] .qa button svg.ic,.phone[data-v="hibrid"] .pair button svg.ic{color:var(--ink)}
.phone[data-v="hibrid"] .qa button{background:rgba(240,233,223,.035);border-color:rgba(240,233,223,.08)}


/* ══ AJÁNLOTT — Klinikai sötét + mostani 3D ikonok + egy üveg hangsúlykártya oldalanként ══ */
.phone[data-v="ajanlott"]{
  --page:#0F1214; --ink:#E6E9EA; --sub:#9AA3A8; --faint:#6B757B; --hair:rgba(230,233,234,.09);
  --card:#161B1E; --card2:#1C2226; --acc:#7FB2D0; --acc-ink:#0F1214;
  --ok:#5FA98A; --warn:#CFA14A; --bad:#CF6B5E; --info:#7FB2D0;
  --disp:var(--ff); --dispw:600; --dispt:-.6px; --r:16px;
}
.phone[data-v="ajanlott"] .aurora i{opacity:.10;filter:blur(70px)}
.phone[data-v="ajanlott"] .aurora i:nth-child(1){background:#2F6B7A}
.phone[data-v="ajanlott"] .aurora i:nth-child(2){background:#3B5A8A}
.phone[data-v="ajanlott"] .aurora i:nth-child(3){background:#2E6B5E}
.phone[data-v="ajanlott"] .aurora i:nth-child(4){background:#3B5A8A}
.phone[data-v="ajanlott"] .card{background:rgba(230,233,234,.035);border-color:rgba(230,233,234,.08)}
.phone[data-v="ajanlott"] .nav{left:10px;right:10px;bottom:12px;border-radius:26px;border:1px solid rgba(230,233,234,.12);background:rgba(22,27,30,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 16px 30px -16px rgba(0,0,0,.75)}
.phone[data-v="ajanlott"] .scroll{padding-bottom:120px}
.phone[data-v="ajanlott"] .hd{border-bottom:0;background:linear-gradient(180deg,rgba(15,18,20,.92) 60%,rgba(15,18,20,.5))}
.phone[data-v="ajanlott"] .tb.on{background:radial-gradient(80% 90% at 50% 20%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 70%)}
.phone[data-v="ajanlott"] .hg{--c:var(--acc);position:relative;isolation:isolate;border:0;border-radius:20px;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 20%,transparent),transparent 62%),linear-gradient(160deg,rgba(38,46,52,.78),rgba(22,27,30,.66));
  box-shadow:0 16px 30px -16px rgba(0,0,0,.75),0 0 26px -6px color-mix(in srgb,var(--c) 28%,transparent),inset 0 1px 0 rgba(230,240,255,.10),inset 0 -14px 26px -18px color-mix(in srgb,var(--c) 50%,transparent)}
.phone[data-v="ajanlott"] .hg::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 80%,transparent) 0%,rgba(230,240,255,.16) 30%,color-mix(in srgb,var(--c) 18%,transparent) 62%,color-mix(in srgb,var(--c) 60%,transparent) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.phone[data-v="ajanlott"] .hg.hero{margin:6px 16px 10px;padding:16px 16px 14px}
.phone[data-v="ajanlott"] .ring .p{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 70%,transparent))}
.phone[data-v="ajanlott"] .btn{box-shadow:0 10px 22px -10px color-mix(in srgb,var(--acc) 80%,transparent)}
.phone[data-v="ajanlott"] svg.ic.td{filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)) drop-shadow(0 0 8px color-mix(in srgb,var(--acc) 30%,transparent))}


/* muscle chips (production MuscleChip look) + hero art + card-head icons */
.mchp{--c:#78cfe7;width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--card2) 70%,#fff 0%),color-mix(in srgb,var(--c) 16%,var(--card)));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -6px 12px -8px color-mix(in srgb,var(--c) 70%,transparent),0 0 12px -4px color-mix(in srgb,var(--c) 55%,transparent)}
.mchp svg{width:100%;height:100%}
.mchp.sm{width:30px;height:30px}
.phone[data-v="vilagos"] .mchp{background:radial-gradient(circle at 35% 28%,#fff,color-mix(in srgb,var(--c) 18%,#F2F3F0));box-shadow:inset 0 0 0 1px var(--hair)}
.musrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.musrow .l{flex:1;font-size:13px}
.musrow .v{font-family:var(--mono);font-size:11.5px;color:var(--sub)}
.musrow .v b{color:var(--ink);font-weight:500}
.musrow .bar{width:84px}
.hero{position:relative}
.hero .art{position:absolute;right:14px;top:34px;width:60px;height:60px;color:var(--acc);opacity:.9}
.hero .art.td{width:64px;height:64px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.ch{display:flex;align-items:center;gap:8px}
.ch svg.ic{color:var(--acc)}
.ch svg.ic.td{width:30px;height:30px}


/* ── Ajánlott · 2. kör: a 7 javítás ── */
.phone[data-v="ajanlott"][data-d="nap"]{--dom:#CFA14A}
.phone[data-v="ajanlott"][data-d="edzes"]{--dom:#CF6B5E}
.phone[data-v="ajanlott"] .aurora i{opacity:.16}                                   /* 7: láthatóbb derengés */
.phone[data-v="ajanlott"] .dmark i{color:var(--dom);background:color-mix(in srgb,var(--dom) 14%,transparent);border-color:color-mix(in srgb,var(--dom) 40%,transparent)}  /* 6: terület-szín csak itt */
.phone[data-v="ajanlott"] .dmark small b.on{background:var(--dom)}
.phone[data-v="ajanlott"] .ds button.on b{color:var(--dom)}
.wm.mark{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--sub)}   /* 4: jel + csendes név */
.wm.mark .logo{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--acc);position:relative;flex:0 0 auto;box-shadow:0 0 12px -2px color-mix(in srgb,var(--acc) 60%,transparent)}
.wm.mark .logo::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--acc)}
.hero-n{display:flex;gap:16px;align-items:center}                                    /* 1: a szám a hős */
.ring.big{width:124px;height:124px}.ring.big svg{width:124px;height:124px}.ring.big circle{stroke-width:7}
.ring.big .c b{font-size:36px;letter-spacing:-1.5px}.ring.big .c small{font-size:9px;margin-top:4px}
.hero-n .verdict{font-family:var(--disp);font-weight:var(--dispw);letter-spacing:var(--dispt);font-size:19px;line-height:1.2;margin:4px 0 6px;text-wrap:balance}  /* 2: ítélet */
.qa.compact{grid-template-columns:repeat(4,1fr)}                                     /* 3: kevesebb, kisebb művelet */
.qa.compact button{flex-direction:row;justify-content:center;gap:6px;padding:9px 4px;font-size:11px;border-radius:10px}
.qa.compact button svg.ic.td{width:22px;height:22px}
.qa.compact button.more{color:var(--faint)}


/* ── Az élő csepp — az app jele (arc nélküli, lélegző, folyadékkal töltődő forma) ── */
.csepp{display:block;position:relative;flex:0 0 auto;width:var(--s,48px);height:var(--s,48px)}
.csepp svg{width:100%;height:100%;overflow:visible;display:block}
.csepp .shell{fill:color-mix(in srgb,var(--c) 10%,rgba(255,255,255,.04));stroke:color-mix(in srgb,var(--c) 55%,rgba(255,255,255,.25));stroke-width:1.2;vector-effect:non-scaling-stroke}
.csepp .liq{fill:var(--c);opacity:.92}
.csepp .sheen{fill:url(#cs-sheen);mix-blend-mode:soft-light}
.csepp .hi{fill:none;stroke:rgba(255,255,255,.45);stroke-width:2.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.csepp .body{filter:drop-shadow(0 0 calc(var(--s,48px)/6) color-mix(in srgb,var(--c) 55%,transparent)) drop-shadow(0 8px 14px rgba(0,0,0,.45));transform-origin:50% 60%;transform-box:fill-box}
.csepp .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff}
.csepp .val b{font-family:var(--disp);font-weight:700;font-size:calc(var(--s,48px)*.3);letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.csepp .val small{display:block;font-family:var(--mono);font-size:calc(var(--s,48px)*.07);letter-spacing:.1em;opacity:.85;margin-top:.3em}
.csepp.mini .val b{font-size:calc(var(--s,48px)*.28);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  body:not(.still) .csepp.alive .body{animation:cs-breathe 4.6s ease-in-out infinite}
  body:not(.still) .csepp.alive .wave{animation:cs-wave 3.6s ease-in-out infinite}
  body:not(.still) .csepp.alive.warn .body{animation-duration:3.2s}
  body:not(.still) .csepp.alive.bad .body{animation-duration:2.2s}
}
@keyframes cs-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes cs-wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
.hero-cs{display:flex;gap:16px;align-items:center}
.hb.cs{border:0;background:none;width:44px;height:44px}
/* Jelek lap */
.jl{padding:0 16px 10px}
.jl .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.jl .cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;border-radius:var(--r);background:var(--card);border:1px solid var(--hair);text-align:center}
.jl .cell strong{font-size:12.5px;font-weight:500}
.jl .cell small{font-size:11px;color:var(--sub);line-height:1.35}
.jl .team{grid-template-columns:repeat(5,1fr);gap:6px}
.jl .team .cell{padding:12px 2px 8px}
.jl .team strong{font-size:11px}
.jl .team small{font-size:9.5px}
.jl p.lead{margin-top:6px}


/* ── Ajánlott · 4. kör: csend. Négy szövegszerep, doboz csak az üvegnek, két árnyalat, szín = jelentés ── */
.phone[data-v="ajanlott"] .open{padding:16px 16px 14px;border-top:1px solid var(--hair)}
.phone[data-v="ajanlott"] .open.first{border-top:0}
.phone[data-v="ajanlott"] .open .eb{margin-bottom:6px}
.phone[data-v="ajanlott"] .ln{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--hair)}
.phone[data-v="ajanlott"] .ln:first-of-type{border-top:0}
.phone[data-v="ajanlott"] .ln .g{flex:1;min-width:0;font-size:14px;line-height:1.35}
.phone[data-v="ajanlott"] .ln .g small{display:block;font-size:12.5px;color:var(--sub)}

.phone[data-v="ajanlott"][data-t="light"] .card{background:var(--card);border-color:var(--hair)}

/* ── 7. kör: MacroFactor / BWS minták ── */
/* heti makró-sávok: 7 nap, 3 szegmens; teljesült nap = semleges */
.phone[data-v="ajanlott"] .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px;margin:12px 0 6px;position:relative}

.phone[data-v="ajanlott"] .wk .d i{display:block;flex:var(--f)}
.phone[data-v="ajanlott"] .wk .d .p{background:var(--protein)}.phone[data-v="ajanlott"] .wk .d .c{background:var(--carb)}.phone[data-v="ajanlott"] .wk .d .f{background:var(--fat)}
.phone[data-v="ajanlott"] .wk .d.met i{background:rgba(230,233,234,.22)}
.phone[data-v="ajanlott"][data-t="light"] .wk .d.met i{background:rgba(21,34,44,.18)}

.phone[data-v="ajanlott"] .wkl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.phone[data-v="ajanlott"] .wkl b{color:var(--acc);font-weight:500}
.phone[data-v="ajanlott"] .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:6px;vertical-align:1px;box-shadow:0 0 8px color-mix(in srgb,var(--acc) 70%,transparent)}
/* edzés közben: szett-sorok (BWS: súly · ism · erő → pihenő) */
.phone[data-v="ajanlott"] .pb{display:flex;gap:3px;height:3px;margin:0 16px 10px}
.phone[data-v="ajanlott"] .pb i{flex:1;background:var(--hair);border-radius:2px;position:relative;overflow:hidden}
.phone[data-v="ajanlott"] .pb i b{position:absolute;inset:0;width:var(--w);background:var(--acc)}
.phone[data-v="ajanlott"] .ex{padding:14px 16px 12px;border-top:1px solid var(--hair)}
.phone[data-v="ajanlott"] .ex.hg{border-top:0;margin:4px 16px 10px;padding:14px 14px 12px}
.phone[data-v="ajanlott"] .exh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.phone[data-v="ajanlott"] .exh .g{flex:1;min-width:0}
.phone[data-v="ajanlott"] .exh strong{display:block;font-size:15px;font-weight:600}

.phone[data-v="ajanlott"] .exh small b{color:var(--acc);font-weight:500}
.phone[data-v="ajanlott"] .sets{display:grid;grid-template-columns:22px 1fr 1fr 1fr 34px;gap:6px 8px;align-items:center;font-variant-numeric:tabular-nums}
.phone[data-v="ajanlott"] .sets .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;color:var(--faint);text-transform:uppercase;padding-bottom:2px}
.phone[data-v="ajanlott"] .sets .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.phone[data-v="ajanlott"] .sets .v{font-family:var(--mono);font-size:13.5px;color:var(--ink)}
.phone[data-v="ajanlott"] .sets .v.done{color:var(--sub)}
.phone[data-v="ajanlott"] .sets .in{font-family:var(--mono);font-size:13.5px;padding:8px 8px;border-radius:7px;background:var(--card2);border:1px solid var(--hair);color:var(--ink)}

.phone[data-v="ajanlott"] .sets .tk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ok)}

.phone[data-v="ajanlott"] .tech{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--sub)}

.phone[data-v="ajanlott"] .tech b{color:var(--ink);font-weight:500}
.phone[data-v="ajanlott"] .rest{position:absolute;left:10px;right:10px;bottom:92px;z-index:25;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--hair);backdrop-filter:blur(14px);box-shadow:0 16px 30px -16px rgba(0,0,0,.6)}
.phone[data-v="ajanlott"] .rest .ring{--c:var(--acc)}
.phone[data-v="ajanlott"] .rest .ring.sm{width:44px;height:44px}.phone[data-v="ajanlott"] .rest .ring.sm svg{width:44px;height:44px}.phone[data-v="ajanlott"] .rest .ring.sm circle{stroke-width:4}
.phone[data-v="ajanlott"] .rest strong{display:block;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.phone[data-v="ajanlott"] .rest small{display:block;font-size:11.5px;color:var(--sub)}
.phone[data-v="ajanlott"] .rest .g{flex:1}
.phone[data-v="ajanlott"] .rest button.pill{font-family:var(--mono);font-size:11.5px;padding:7px 10px;border-radius:8px;border:1px solid var(--hair);color:var(--ink)}

/* ── header ── */
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:14px 14px 10px;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.wm{flex:1;font-family:var(--disp);font-weight:var(--dispw);font-size:21px;letter-spacing:var(--dispt)}
.phone[data-v="vilagos"] .wm{font-size:23px}
.hb{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub);border:1px solid var(--hair);background:var(--card);flex:0 0 auto}
.hb svg.ic{width:18px;height:18px}
.hb.q{font-weight:600;font-size:14px;color:var(--ink)}
.hb .n{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--acc-ink);background:var(--acc)}
.dayring{width:38px;height:38px;position:relative;flex:0 0 auto}
.dayring svg{width:38px;height:38px;transform:rotate(-90deg)}
.dayring circle{fill:none;stroke-width:3}
.dayring .t{stroke:var(--hair)}
.dayring .p{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:var(--d) 100}
.dayring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;color:var(--sub)}

/* ── bottom nav ── */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:stretch;padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--page) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--hair)}
.dmark{display:grid;place-items:center;width:58px;margin-right:4px;border-right:1px solid var(--hair);position:relative}
.dmark i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.dmark i svg.ic{width:20px;height:20px}
.dmark small{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.dmark small b{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.dmark small b.on{background:var(--acc)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:10px;font-weight:500;color:var(--faint);border-radius:10px}
.tb svg.ic{width:22px;height:22px}
.tb.on{color:var(--ink)}
.tb.on svg.ic{color:var(--acc)}

/* ── content primitives ── */
.p16{padding:0 16px}
.eb{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
h1.t{font-family:var(--disp);font-weight:var(--dispw);letter-spacing:var(--dispt);font-size:30px;line-height:1.05;text-wrap:balance}
.phone[data-v="vilagos"] h1.t{font-size:34px}
h2.t{font-family:var(--disp);font-weight:var(--dispw);letter-spacing:var(--dispt);font-size:17px;line-height:1.2}
.phone[data-v="vilagos"] h2.t{font-size:19px}
.lead{font-size:13.5px;line-height:1.5;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:14px 14px 12px;margin:0 16px 10px}
.phone[data-v="vilagos"] .card{box-shadow:0 1px 2px rgba(27,32,36,.05)}
.card .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.card .hrow a{font-size:11.5px;color:var(--acc);text-decoration:none;font-weight:500}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 8px}
.num{font-family:var(--disp);font-weight:var(--dispw);font-variant-numeric:tabular-nums;letter-spacing:-1px;font-size:40px;line-height:1}
.num small{font-family:var(--mono);font-size:12px;letter-spacing:0;color:var(--sub);margin-left:6px;font-weight:400}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;font-family:var(--mono);font-size:10.5px;color:var(--sub);border:1px solid var(--hair);background:var(--card2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.st{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:500}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st.plan{color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent)}
.st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:9px;font-size:14px;font-weight:600;color:var(--acc-ink);background:var(--acc)}
.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--hair)}
.btn.sm{padding:8px 12px;font-size:12.5px;font-weight:500;border-radius:7px}
.btn.wide{width:100%}
.btn svg.ic{width:18px;height:18px}
.link{font-size:12.5px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.bar{height:4px;border-radius:2px;background:var(--hair);overflow:hidden}
.bar b{display:block;height:100%;width:var(--w);background:var(--c,var(--acc));border-radius:2px}
.bar b.sec2{background:color-mix(in srgb,var(--c,var(--acc)) 35%,transparent)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair)}
.row:first-of-type{border-top:0}
.row .g{flex:1;min-width:0}
.row strong{display:block;font-size:13.5px;font-weight:500}
.row small{display:block;font-size:12px;color:var(--sub);margin-top:1px}
.row time{font-family:var(--mono);font-size:11px;color:var(--faint);width:40px;flex:0 0 auto}
.row svg.ic{color:var(--sub)}
.row .chev{color:var(--faint);width:16px;height:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.kv .l{font-size:13px}
.kv .v{font-family:var(--mono);font-size:12px;color:var(--sub);text-align:right}
.kv .v b{color:var(--ink);font-weight:500}
.kv .bar{grid-column:1/-1;margin-bottom:4px}
.fn{font-size:11.5px;color:var(--faint);line-height:1.45;margin-top:10px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

/* ring (readiness / életjelek) */
.ring{position:relative;width:88px;height:88px;flex:0 0 auto}
.ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .t{stroke:var(--hair)}
.ring .p{stroke:var(--c,var(--acc));stroke-linecap:round;stroke-dasharray:var(--d) 1000}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--disp);font-weight:var(--dispw);font-size:22px;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
.ring .c small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.8px;color:var(--faint);margin-top:3px}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 16px 12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:var(--r);background:var(--card);border:1px solid var(--hair);font-size:10px;font-weight:500;color:var(--sub);text-align:center}

/* day strip (Edzés) */
.ds{display:flex;gap:4px;padding:10px 16px 6px}
.ds button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:9px;border:1px solid transparent}

.ds b{font-family:var(--mono);font-weight:500;font-size:13px}
.ds i{font-style:normal;font-size:9px;color:var(--faint);height:12px;display:grid;place-items:center}
.ds i svg.ic{width:11px;height:11px;stroke-width:2.2}
.ds i.ok{color:var(--ok)}
.ds button.on{background:var(--card);border-color:var(--hair)}
.ds button.on b{color:var(--acc)}
.ds button.rest{opacity:.55}

/* hero (Edzés) */
.hero{padding:10px 16px 14px}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0;border:0;margin-bottom:8px}
.hero .top .eb{margin:0}
.hero h1.t{margin:6px 0 4px}
.hero .chips{margin:10px 0 12px}
.mus{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.mus span{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:5px;color:var(--sub);background:var(--card2);border:1px solid var(--hair)}
.cta{display:flex;align-items:center;gap:10px;margin-top:10px}

/* observation evidence */
.ev{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.obs .q{font-size:13.5px;line-height:1.5;margin-top:8px}
.obs p{font-size:13.5px;line-height:1.5}
.conf{display:flex;align-items:center;gap:8px;margin-top:8px}
.conf .bar{flex:1}
.conf small{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}

/* energy split */
.split{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--hair);margin:8px 0 6px}
.split b{background:var(--acc)}
.split i{background:color-mix(in srgb,var(--acc) 30%,transparent)}
.leg{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--sub)}
.leg b{color:var(--ink);font-weight:500}

/* pair */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 10px}
.pair button{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--hair)}
.pair button small{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;color:var(--faint)}
.pair button strong{font-size:13.5px;font-weight:500}
.pair button svg.ic{color:var(--acc)}
.lrow{display:flex;align-items:center;gap:10px;margin:0 16px;padding:12px 0;border-top:1px solid var(--hair);font-size:13.5px}
.lrow .g{flex:1}
.lrow svg.ic{color:var(--sub)}
.lrow .chev{width:16px;height:16px;color:var(--faint)}
.dashadd{display:block;margin:10px 16px 0;padding:11px;border-radius:9px;border:1px dashed var(--hair);text-align:center;font-size:13px;color:var(--sub);width:calc(100% - 32px)}
.warnl{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);font-size:12.5px;line-height:1.45;margin-top:10px}
.warnl svg.ic{color:var(--warn);width:18px;height:18px;margin-top:1px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);z-index:50;padding:9px 14px;border-radius:9px;background:var(--ink);color:var(--page);font-size:12.5px;opacity:0;pointer-events:none;transition:.25s var(--ease);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ── motion: one-shot rise, reduced-motion branch ── */
@media (prefers-reduced-motion:no-preference){
  body:not(.still) .rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
  body:not(.still) .ring .p,body:not(.still) .dayring .p{animation:ringin 1s var(--ease) both .15s}
  body:not(.still) .bar b{animation:grow .9s var(--ease) both .25s}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes ringin{from{stroke-dasharray:0 1000}}
@keyframes grow{from{width:0}}

/* ── shell additions: sheets, switcher, back row ── */
.backrow{padding:10px 16px 0}
.backbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.backbtn b{font-size:18px;line-height:1;font-weight:400}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;max-height:86%;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:var(--card);border-top:1px solid var(--hair);box-shadow:0 -20px 40px -20px rgba(0,0,0,.6);transform:translateY(105%);transition:.32s var(--ease);scrollbar-width:none}
.sheet.on{transform:none}
.sheet-grab{width:36px;height:4px;border-radius:2px;background:var(--hair);margin:4px auto 14px}
.scrim{position:absolute;inset:0;z-index:55;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.3s}
.scrim.on{opacity:1;pointer-events:auto}
.sw-sheet{position:absolute;left:10px;right:10px;bottom:92px;z-index:62;padding:14px 12px 12px;border-radius:20px;background:var(--card);border:1px solid var(--hair);box-shadow:0 16px 30px -16px rgba(0,0,0,.75)}
.sw-sheet .eb{margin:0 4px 10px}
.sw-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.swb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 6px;border-radius:12px;font-size:11px;font-weight:500;color:var(--sub)}
.swb.on{color:var(--ink);background:color-mix(in srgb,var(--dom) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dom) 40%,transparent)}
.phone[data-v="ajanlott"][data-d="fuel"]{--dom:#8FB49A}
.phone[data-v="ajanlott"][data-d="mezo"]{--dom:#AB9FD2}
.phone[data-v="ajanlott"][data-d="en"]{--dom:#D98B9D}
.phone[data-v="ajanlott"] .sheet h2.t{margin-bottom:8px}
.phone[data-v="ajanlott"] .ln.tap{cursor:pointer}

/* a generált dobozok (BODY.b) pontatlanok — élesben a MuscleChip getBBox()-szal finomít; itt is */
const MEAS=new Map();
function box(v,s){const id=v+'/'+s;if(MEAS.has(id))return MEAS.get(id);
  let m=document.getElementById('bm-measure');if(!m){document.body.insertAdjacentHTML('beforeend','<svg id="bm-measure" style="position:absolute;left:-9999px;top:0;width:10px;height:10px;visibility:hidden" aria-hidden="true"></svg>');m=document.getElementById('bm-measure')}
  m.innerHTML=BODY[v].p[s].map(d=>`<path d="${d}"/>`).join('');const b=m.getBBox();const r=b.width?[b.x,b.y,b.width,b.height]:BODY[v].b[s];MEAS.set(id,r);return r}
const sil=v=>`<g fill="url(#mg-body)" opacity=".3"><use href="#bm-sil-${v}"/></g>`;
function mchp(key,cls=''){
  const sh=TOKEN_SHAPES[key]; const v=sh[0][0]; const slugs=sh.filter(([x])=>x===v).map(([,s])=>s);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const s of slugs){const [bx,by,bw,bh]=box(v,s);x0=Math.min(x0,bx);y0=Math.min(y0,by);x1=Math.max(x1,bx+bw);y1=Math.max(y1,by+bh)}
  const side=Math.max(x1-x0,y1-y0)*1.6, cx=(x0+x1)/2, cy=(y0+y1)/2;
  return `<span class="mchp ${cls}" style="--c:${muscleColor(key)}"><svg viewBox="${cx-side/2} ${cy-side/2} ${side} ${side}" aria-hidden="true">${sil(v)}<g fill="${muscleColor(key)}" stroke="${muscleColor(key)}" stroke-width="${side/40}" stroke-linejoin="round" style="filter:drop-shadow(0 0 ${side/30}px ${muscleColor(key)})">${slugs.map(s=>`<use href="#bm-${v}-${s}"/>`).join('')}</g></svg></span>`;
}

const sec=(eb,right='')=>`<div class="sec rise"><span class="eb">${eb}</span>${right?`<span class="eb">${right}</span>`:''}</div>`;
const page=(inner,d,active,{pad=''}={})=>`<div class="aurora"><i></i><i></i><i></i><i></i></div><div class="scroll" ${pad?`style="padding-bottom:${pad}"`:''}>${header()}${inner}</div>${nav(d,active)}<div class="toast" id="toast"></div><div class="sheet" id="sheet"></div><div class="scrim" id="scrim"></div>`;
let CSS_SEEN=new Set();function css(txt){const k=txt.slice(0,60);if(CSS_SEEN.has(k))return;CSS_SEEN.add(k);const st=document.createElement('style');st.textContent=txt;document.head.appendChild(st)}
function wkBars(){
  const W=[['H',[.26,.52,.22],.98,1],['K',[.28,.5,.22],.9,0],['Sze',[.24,.54,.22],1.02,1],['Cs',[.27,.51,.22],.72,0],['P',[.3,.48,.22],.66,0,'today'],['Szo',null,0,0],['V',null,0,0]];
  return `<div class="wk">${W.map(([l,m,h,met,t])=>m?`<span class="d ${met?'met':''} ${t||''}" style="--h:${Math.round(h*82)}%"><i class="p" style="--f:${m[0]}"></i><i class="c" style="--f:${m[1]}"></i><i class="f" style="--f:${m[2]}"></i></span>`:`<span class="d empty" style="--h:82%"></span>`).join('')}</div>
  <div class="wkl">${W.map(([l,,,,t])=>`<span>${t?`<b>${l}</b>`:l}</span>`).join('')}</div>`;
}

const JELEN_NOTES=`<h2>Jelenlegi · Üveg</h2><p>Az élő prototípus, változtatás nélkül. Ez az, ami ma az appban van.</p>`;
const TISZTA_NOTES=`<h2>Tisztított Üveg</h2><p>A mostani app marad: a meleg sötét alap, a színes derengés, az üveg, a 3D ikonok, minden képernyő és gomb ugyanott. Csak rendet raktunk benne.</p>
<h2>Mi változott</h2><ul>
<li><b>Egy fő fókusz képernyőnként.</b> Az első, legfontosabb kártya marad teljes üveg, színes kerettel és fénnyel. Ez mondja meg, mire nézz.</li>
<li><b>Kevesebb kártya.</b> A többi nagy kártya „kinyílik”: nincs doboza, kerete, fénye, csak egy vékony vonal választja el. A tartalom ugyanaz.</li>
<li><b>Csendesebb csempék.</b> A kis csempék és sorok halvány alapot kapnak színes keret és ragyogás nélkül.</li>
<li><b>Kevesebb zaj.</b> Színes ragyogás csak a fókusz-kártyán van; a címkék és az ikonok a helyükön maradnak.</li>
<li><b>Buborékok a Boopok helyett.</b> Ugyanott, ugyanabban a színben, de arc nélkül: folyadékkal teli, lélegző forma. Területenként más alak.</li>
</ul>
<h2>Hogyan nézd</h2><p>Váltogass a <b>Jelenlegi</b> és a <b>Tisztított</b> között ugyanazon a képernyőn. A telefonban minden ugyanúgy kattintható, mint az élő prototípusban. A harmadik gomb a korábbi klinikai kör, összevetésnek.</p>`;
/* ── registry + router ── */
const REG={};
function register(d,def){REG[d]=def; if(def.css) css(def.css);}
let V='k2',D='nap',R='mai',ARG='';
let LIGHT=false,WARM=false,HIST=[];
function go(route){if(!route)return;HIST.push(R+(ARG?'.'+ARG:''));const [r,...a]=route.split('.');R=r;ARG=a.join('.');render()}
function goBack(){const p=HIST.pop()||'mai';const [r,...a]=p.split('.');R=r;ARG=a.join('.');render()}
function render(){
  const ph=$('#phone');
  if(D==='jelek'&&V!=='ajanlott')V='ajanlott';
  if(/^k[123]$/.test(V)){ph.dataset.v=V;ph.removeAttribute('data-s');ph.removeAttribute('data-d');ph.removeAttribute('data-t');ph.innerHTML=window.KONC?KONC[V]():'';}
  else if(V==='feher'||V==='elo'){window.FH_LIVE=V==='elo';ph.dataset.v='feher';if(V==='elo')ph.dataset.s='elo';else ph.removeAttribute('data-s');ph.dataset.d=D;ph.removeAttribute('data-t');ph.classList.remove('warm');const f=window.FREG&&FREG[D];const fn=f&&(f.routes[R]||f.routes.mai);ph.innerHTML=fn?fn(ARG):'';if(f&&f.after)f.after(R,ARG);}
  else
  if(V!=='ajanlott'){ph.removeAttribute('data-v');ph.removeAttribute('data-s');ph.removeAttribute('data-d');ph.removeAttribute('data-t');ph.classList.remove('warm');
    const file=D==='jelek'?'nap':D; const dir=V==='tiszta'?'tiszta':'elo'; const r0=(D==='en'&&R==='mai')?'en':(D==='mezo'&&R==='mai')?'fal':R;
    ph.innerHTML=`<iframe title="${V==='tiszta'?'Tisztított Üveg':'Élő prototípus'}" src="${dir}/${file}.html#${r0}${ARG?'/'+ARG:''}"></iframe>`}
  else{ph.dataset.v='ajanlott';ph.dataset.d=D==='jelek'?'nap':D;if(LIGHT)ph.dataset.t='light';else ph.removeAttribute('data-t');ph.classList.toggle('warm',WARM);
    const reg=REG[D]; const fnr=reg&&(reg.routes[R]||reg.routes.mai);
    ph.innerHTML=fnr?fnr(ARG):`<div class="scroll">${header()}<p class="p16 txt" style="padding:40px 16px;color:var(--sub)">Ez a terület (${D}) még nincs kidolgozva.</p></div>`;
    if(reg&&reg.after)reg.after(R,ARG);}
  const reg=REG[D]; $('#notes').innerHTML=/^k[123]$/.test(V)?((window.KNOTES||{})[V]||''):V==='elo'?((window.FNOTES_ELO||'')+((window.FREG&&FREG[D]&&FREG[D].notes)||'')):V==='feher'?(window.FNOTES||''):V==='tiszta'?TISZTA_NOTES:V==='jelenlegi'?JELEN_NOTES:((reg&&reg.notes)||'');
  document.querySelectorAll('#vseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===V));
  document.querySelectorAll('#dseg button').forEach(b=>b.classList.toggle('on',b.dataset.d===D));
  $('#dseg').hidden=/^k[123]$/.test(V);
  
  history.replaceState(null,'',`#${V==='jelenlegi'?'j':V==='tiszta'?'t':V==='feher'?'f':V==='elo'?'e':/^k/.test(V)?V.slice(1):'a'}-${D}-${R}${ARG?'.'+ARG:''}`);
  $('#phone .scroll')?.scrollTo(0,0);
}
function fromHash(){const m=/^#(j|a|t|f|e|1|2|3)-(nap|edzes|fuel|mezo|en|jelek)-([a-z0-9_-]+)(?:\.(.+))?$/.exec(location.hash);if(m){V=m[1]==='j'?'jelenlegi':m[1]==='t'?'tiszta':m[1]==='f'?'feher':m[1]==='e'?'elo':/[123]/.test(m[1])?'k'+m[1]:'ajanlott';D=m[2];R=m[3];ARG=m[4]||''}}
function openSheet(html){const s=$('#sheet');if(!s)return;s.innerHTML=`<div class="sheet-grab"></div>${html}`;s.classList.add('on');$('#scrim').classList.add('on')}
function closeSheet(){$('#sheet')?.classList.remove('on');$('#scrim')?.classList.remove('on');$('#swsheet')?.remove()}
document.addEventListener('click',e=>{
  const v=e.target.closest('#vseg button');if(v){V=v.dataset.v;render();return}
  const d=e.target.closest('#dseg button');if(d){D=d.dataset.d;R='mai';ARG='';HIST=[];render();return}
  const dm=e.target.closest('[data-dom]');if(dm){D=dm.dataset.dom;R='mai';ARG='';HIST=[];render();return}
  if(e.target.closest('[data-switcher]')){e.preventDefault();$('#phone').insertAdjacentHTML('beforeend',switcher());$('#scrim').classList.add('on');return}
  if(e.target.id==='scrim'||e.target.closest('[data-close]')){closeSheet();return}
  const sh=e.target.closest('[data-sheet]');if(sh){e.preventDefault();const reg=(V==='elo'||V==='feher')?(window.FREG||{})[D]:REG[D];const f=reg&&reg.sheets&&reg.sheets[sh.dataset.sheet];if(f)openSheet(f(sh.dataset.arg||''));else toast(sh.dataset.sheet);return}
  const bk=e.target.closest('[data-back]');if(bk){e.preventDefault();goBack();return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();closeSheet();go(g.dataset.go);return}
  const t=e.target.closest('[data-toast]');if(t){e.preventDefault();toast(t.dataset.toast)}
});
let tt;function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
$('#still').addEventListener('change',e=>document.body.classList.toggle('still',e.target.checked));
$('#meleg').addEventListener('change',e=>{WARM=e.target.checked;render()});
$('#vilagos').addEventListener('change',e=>{LIGHT=e.target.checked;render()});
if(/still/.test(location.search)){document.body.classList.add('still');$('#still').checked=true}
if(/vilagos/.test(location.search)){LIGHT=true;$('#vilagos').checked=true}
window.addEventListener('hashchange',()=>{fromHash();render()});

window.addEventListener('DOMContentLoaded',()=>{fromHash();render()});
