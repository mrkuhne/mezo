<meta charset="utf-8">
<title>Emberek</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
  :root {
    --ground: #EFE8DD; --ground-2: #E7DFD2; --card: #FFFFFF;
    --ink: #2B2118; --ink-2: #6E6257; --accent: #A84A26;
    --line: rgba(43, 33, 24, 0.12);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground: #191614; --ground-2: #211D19; --card: #262119;
      --ink: #F0E9E1; --ink-2: #BCAFA1; --accent: #FF8A66;
      --line: rgba(240, 233, 225, 0.12);
    }
  }
  :root[data-theme="dark"] {
    --ground: #191614; --ground-2: #211D19; --card: #262119;
    --ink: #F0E9E1; --ink-2: #BCAFA1; --accent: #FF8A66;
    --line: rgba(240, 233, 225, 0.12);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "Geist", system-ui, -apple-system, sans-serif;
    line-height: 1.5; padding: 48px 24px 64px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 10px; }
  .lede { max-width: 62ch; color: var(--ink-2); font-size: 16px; }
  .lede strong { color: var(--ink); font-weight: 600; }
  .lede code { font-family: ui-monospace, "SF Mono", monospace; font-size: 0.86em; background: var(--ground-2); border-radius: 6px; padding: 1px 6px; }
  .stage { margin-top: 40px; display: flex; gap: 56px; flex-wrap: wrap; align-items: flex-start; }
  aside { max-width: 400px; display: grid; gap: 24px; }
  aside h2 { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  aside ul, aside ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14.5px; color: var(--ink-2); }
  aside li strong { color: var(--ink); font-weight: 600; }
  .note { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 14.5px; color: var(--ink-2); border-left: 2px solid var(--accent); padding-left: 14px; }

  /* ============ PHONE ============ */
  .phone {
    width: 330px; height: 694px; flex: none;
    background: #1D1712; border-radius: 52px; padding: 11px;
    box-shadow: 0 30px 60px -22px rgba(29, 23, 18, 0.5);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden;
    display: flex; flex-direction: column; font-size: 11.5px; line-height: 1.4;
    color: #2B2118;
    background: linear-gradient(180deg, #F7E3ED 0%, #FDFAF4 36%);
  }
  .isl { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 82px; height: 22px; border-radius: 999px; background: #1D1712; z-index: 14; }
  .p-status { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 2px; font-size: 11px; font-weight: 600; position: relative; z-index: 14; }
  .p-eyebrow { font-size: 8.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #A2958A; }
  .grow { flex: 1; min-width: 0; }
  .mrow { display: flex; align-items: center; gap: 8px; }
  .mut { color: #6E6257; }
  .big { font-weight: 200; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .homebar { width: 118px; height: 4px; border-radius: 999px; background: #2B2118; margin: 2px auto 9px; flex: none; opacity: 0.85; position: relative; z-index: 14; }

  .rise { opacity: 0; transform: translateY(16px) scale(0.98); }
  .play .rise { animation: rise 0.5s cubic-bezier(0.22, 0.9, 0.32, 1.15) forwards; animation-delay: var(--d); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* page-váz */
  .page-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; }
  .backbtn {
    border: none; background: rgba(255, 255, 255, 0.7); font-family: inherit; cursor: pointer;
    border-radius: 999px; padding: 6px 13px 6px 9px; font-size: 11px; font-weight: 600; color: #2B2118;
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 6px 14px -8px rgba(43, 33, 24, 0.3);
  }
  .backbtn:focus-visible, .pgact:focus-visible, .fchip:focus-visible { outline: 2px solid #8E3F6F; outline-offset: 2px; }
  .pgact { margin-left: auto; border: 1px solid rgba(43, 33, 24, 0.14); background: rgba(255, 255, 255, 0.72); border-radius: 999px; padding: 5px 12px; font-size: 9.5px; font-weight: 700; color: #6E6257; font-family: inherit; cursor: pointer; }
  .pgact.hot { border-color: #C46FA0; color: #8E3F6F; background: #fff; }
  .page-hero { display: grid; justify-items: center; text-align: center; gap: 1px; padding: 6px 14px 10px; }
  .page-hero .bignum { font-weight: 200; font-size: 40px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .page-hero .nm { font-size: 15px; font-weight: 700; }
  .page-hero .sb { font-size: 10px; color: #6E6257; }
  .page-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 2px 14px 16px; }
  .page-body::-webkit-scrollbar { display: none; }

  .page {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    padding-top: 34px;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.35, 1);
    background: linear-gradient(180deg, #F7E3ED 0%, #FDFAF4 36%);
  }
  .page.open { transform: none; }

  .lsec { display: flex; align-items: center; gap: 6px; padding: 10px 2px 6px; }
  .lsec .cnt { margin-left: auto; font-size: 9px; font-weight: 700; color: #A2958A; font-variant-numeric: tabular-nums; }

  .statstrip { display: flex; gap: 8px; margin-bottom: 10px; }
  .statcell {
    flex: 1; text-align: center; padding: 9px 4px; border-radius: 15px;
    background: rgba(255, 255, 255, 0.72); border: 0.5px solid rgba(43, 33, 24, 0.07);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 8px 16px -10px rgba(43, 33, 24, 0.25);
  }
  .statcell b { font-size: 13px; font-weight: 600; display: block; font-variant-numeric: tabular-nums; }
  .statcell small { font-size: 8px; color: #6E6257; }

  /* ============ jelölt-inbox ============ */
  .candt {
    border-radius: 18px; padding: 11px 12px; margin-bottom: 10px;
    background: linear-gradient(150deg, #FDF0DA, #FFFCF5);
    border: 1px solid #C9962E;
    box-shadow: 0 16px 30px -14px rgba(201, 150, 46, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.75);
    animation: candpulse 3s ease-in-out 1.2s infinite;
  }
  @keyframes candpulse {
    0%, 100% { box-shadow: 0 16px 30px -14px rgba(201, 150, 46, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.75); }
    50% { box-shadow: 0 16px 30px -10px rgba(201, 150, 46, 0.75), 0 0 0 4px rgba(201, 150, 46, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.75); }
  }
  .candt .q { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 9.5px; font-weight: 300; color: #6E6257; margin-top: 5px; line-height: 1.5; }
  .candt .ev { font-size: 7.5px; color: #A8801F; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .candbtns { display: flex; gap: 6px; margin-top: 9px; }
  .cta {
    background: linear-gradient(135deg, #D67FB0, #B35A8C); color: #fff;
    border-radius: 999px; padding: 6px 14px; font-size: 10px; font-weight: 600; flex: none;
    box-shadow: 0 8px 16px -6px rgba(179, 90, 140, 0.55); border: none; font-family: inherit; cursor: pointer;
  }
  .cta.gold { background: linear-gradient(135deg, #E5C46B, #C9962E); box-shadow: 0 8px 16px -6px rgba(201, 150, 46, 0.55); }
  .ghost { background: rgba(43, 33, 24, 0.06); color: #6E6257; border: none; font-family: inherit; border-radius: 999px; padding: 6px 12px; font-size: 10px; font-weight: 600; flex: none; cursor: pointer; }

  /* ============ személy-csempék ============ */
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 4px; }
  .persont {
    border-radius: 17px; padding: 10px 11px 9px; display: grid; gap: 4px; justify-items: center; text-align: center;
    background: #fff; border: 0.5px solid rgba(43, 33, 24, 0.06); cursor: pointer;
    box-shadow: 0 14px 26px -14px rgba(142, 63, 111, 0.32), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    transition: transform 0.15s cubic-bezier(0.3, 0.8, 0.4, 1.4);
  }
  .persont:active { transform: scale(0.96); }
  .persont.fresh { animation: freshin 0.55s cubic-bezier(0.3, 1.3, 0.5, 1); }
  @keyframes freshin { 0% { opacity: 0; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1); } }
  .pavat {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(var(--ac) calc(var(--av)), rgba(43, 33, 24, 0.1) 0);
  }
  .pavat .in { width: 28px; height: 28px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #2B2118; }
  .pavat.lg { width: 58px; height: 58px; }
  .pavat.lg .in { width: 46px; height: 46px; font-size: 19px; }
  .persont .nm { font-size: 10.5px; font-weight: 700; }
  .persont .rl { font-size: 6px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #A2958A; }
  .persont .mt { font-size: 8px; color: #6E6257; font-variant-numeric: tabular-nums; }
  .pspark { display: flex; gap: 2.5px; align-items: flex-end; height: 16px; }
  .pspark i { width: 4.5px; border-radius: 2px; min-height: 2.5px; transform: scaleY(0); transform-origin: bottom; }
  .play .pspark i { animation: sparkup 0.5s cubic-bezier(0.25, 0.8, 0.35, 1) forwards; animation-delay: var(--d, 350ms); }
  @keyframes sparkup { to { transform: scaleY(1); } }
  .ctxdots { display: flex; gap: 3px; }
  .ctxdots i { width: 6px; height: 6px; border-radius: 50%; }

  /* ============ szűrők + említés-feed ============ */
  .chiprow { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 9px; }
  .fchip { border: 1px solid rgba(43, 33, 24, 0.14); background: #fff; border-radius: 999px; padding: 4px 11px; font-size: 9px; font-weight: 600; color: #6E6257; cursor: pointer; font-family: inherit; }
  .fchip.on { background: #F7E3ED; border-color: #C46FA0; color: #8E3F6F; }
  .mrowt {
    border-radius: 15px; padding: 9px 11px; margin-bottom: 8px; background: #fff;
    border: 0.5px solid rgba(43, 33, 24, 0.06);
    box-shadow: 0 10px 20px -13px rgba(43, 33, 24, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }
  .mrowt .gut { font-size: 7.5px; font-weight: 800; color: #A2958A; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  .mrowt .q { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 9.8px; font-weight: 300; margin-top: 4px; line-height: 1.5; }
  .mrowt .edge { font-size: 7.5px; color: #8E3F6F; margin-top: 4px; font-weight: 600; }
  .tonedot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .ctxch { font-size: 6.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 5px; padding: 2px 6px; flex: none; background: rgba(142, 63, 111, 0.09); color: #8E3F6F; }
  .figy { font-size: 6px; font-weight: 800; letter-spacing: 0.1em; border-radius: 5px; padding: 2px 6px; background: rgba(201, 150, 46, 0.18); color: #A8801F; flex: none; }
  .mdel { border: none; background: none; color: #C9B8AA; font-size: 11px; cursor: pointer; font-family: inherit; padding: 0 2px; flex: none; }
  .srcb { font-size: 9px; flex: none; }

  /* ============ részletek-oldal ============ */
  .trendcard, .ctxcard, .evt, .factcard {
    background: #fff; border-radius: 16px; padding: 11px 12px; margin-bottom: 9px;
    border: 0.5px solid rgba(43, 33, 24, 0.06);
    box-shadow: 0 14px 26px -16px rgba(43, 33, 24, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.85);
  }
  .affbars { display: flex; gap: 4px; align-items: flex-end; height: 44px; margin-top: 8px; }
  .affbars i { flex: 1; border-radius: 4px 4px 2px 2px; min-height: 4px; transform: scaleY(0); transform-origin: bottom; }
  .play .affbars i { animation: sparkup 0.55s cubic-bezier(0.25, 0.8, 0.35, 1) forwards; animation-delay: var(--d, 200ms); }
  .affax { display: flex; justify-content: space-between; font-size: 6.5px; color: #A2958A; font-weight: 700; margin-top: 4px; letter-spacing: 0.06em; }
  .ctxbar { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .ctxbar .lb { font-size: 8.5px; font-weight: 600; width: 82px; flex: none; }
  .ctxbar .tr { flex: 1; height: 7px; border-radius: 4px; background: rgba(43, 33, 24, 0.07); overflow: hidden; }
  .ctxbar .tr div { height: 100%; border-radius: 4px; width: 0; transition: width 0.8s cubic-bezier(0.25, 0.8, 0.35, 1) 0.35s; }
  .play .ctxbar .tr div { width: var(--w); }
  .ctxbar .pc { font-size: 8px; font-weight: 700; color: #6E6257; width: 26px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .evt { display: flex; gap: 9px; align-items: center; cursor: pointer; transition: transform 0.15s cubic-bezier(0.3, 0.8, 0.4, 1.4); }
  .evt:active { transform: scale(0.97); }
  .evt.amber { background: linear-gradient(150deg, #FFF1D6, #FFFAF0); box-shadow: 0 14px 26px -14px rgba(181, 126, 20, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .evt.sage { background: linear-gradient(150deg, #E9F1E2, #F7FBF3); box-shadow: 0 14px 26px -14px rgba(110, 139, 94, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .evt.lav { background: linear-gradient(150deg, #EBE6F8, #F9F6FE); box-shadow: 0 14px 26px -14px rgba(93, 79, 160, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .evt .pic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none; background: rgba(255, 255, 255, 0.85); box-shadow: 0 2px 6px rgba(43, 33, 24, 0.08); }
  .evt b { font-size: 9.8px; font-weight: 700; }
  .evt .mt2 { font-size: 7.5px; color: #6E6257; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .fact { display: inline-flex; border-radius: 999px; padding: 3.5px 10px; font-size: 8.5px; font-weight: 600; color: #8E3F6F; background: rgba(142, 63, 111, 0.08); margin: 2px 3px 2px 0; }

  /* ============ sheetek ============ */
  .sheetback { position: absolute; inset: 0; z-index: 20; background: rgba(29, 23, 18, 0.4); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
  .sheetback.open { opacity: 1; pointer-events: auto; }
  .bsheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 21;
    background: #FDFAF4; border-radius: 28px 28px 42px 42px; padding: 14px 16px 22px;
    transform: translateY(105%); transition: transform 0.32s cubic-bezier(0.25, 0.8, 0.35, 1);
    max-height: 82%; overflow-y: auto; scrollbar-width: none;
  }
  .bsheet.open { transform: none; }
  .bsheet::-webkit-scrollbar { display: none; }
  .grab { width: 36px; height: 4px; border-radius: 999px; background: rgba(43, 33, 24, 0.16); margin: 0 auto 12px; }
  .shlbl { font-size: 8px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #A2958A; margin: 12px 0 6px; }
  .shin {
    width: 100%; border: 1px solid rgba(43, 33, 24, 0.14); border-radius: 12px; background: #fff;
    font-family: inherit; font-size: 11px; padding: 9px 11px; color: #2B2118;
  }
  .shin:focus-visible { outline: 2px solid #8E3F6F; outline-offset: 1px; }
  textarea.shin { resize: none; height: 56px; }
  .selrow { display: flex; gap: 5px; flex-wrap: wrap; }
  .selch { border: 1px solid rgba(43, 33, 24, 0.14); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 9.5px; font-weight: 600; color: #6E6257; cursor: pointer; font-family: inherit; }
  .selch.on { background: #F7E3ED; border-color: #C46FA0; color: #8E3F6F; }
  .selch.tj.on { background: rgba(143, 175, 126, 0.18); border-color: #6E8B5E; color: #4E6B42; }
  .selch.tn.on { background: rgba(201, 150, 46, 0.16); border-color: #C9962E; color: #A8801F; }
  .aliasrow { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .aliasch { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 4px 6px 4px 11px; font-size: 9px; font-weight: 600; background: rgba(142, 63, 111, 0.08); color: #8E3F6F; }
  .aliasch button { border: none; background: none; cursor: pointer; color: #B589A2; font-size: 10px; padding: 0; font-family: inherit; }
  .shcta { width: 100%; margin-top: 16px; padding: 11px 0; text-align: center; font-size: 11px; }
  .shcta:disabled { opacity: 0.4; cursor: default; }
  .micnote { font-size: 8.5px; color: #A2958A; text-align: center; margin-top: 8px; font-weight: 300; }

  /* ============ hub-mozaik ============ */
  .mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .tile {
    border-radius: 17px; padding: 10px 11px; min-height: 96px;
    display: flex; flex-direction: column; cursor: pointer;
    border: 0.5px solid rgba(43, 33, 24, 0.06);
    box-shadow: 0 14px 26px -14px rgba(43, 33, 24, 0.28), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    transition: transform 0.15s cubic-bezier(0.3, 0.8, 0.4, 1.4);
  }
  .tile:active { transform: scale(0.96); }
  .t-gold { background: linear-gradient(150deg, #FDF0DA, #FFFCF5); box-shadow: 0 14px 26px -14px rgba(201, 150, 46, 0.45), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .t-rose { background: linear-gradient(150deg, #FAE3ED, #FEF8FB); box-shadow: 0 14px 26px -14px rgba(142, 63, 111, 0.35), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .t-sky { background: linear-gradient(150deg, #DFEDF5, #F5FAFD); box-shadow: 0 14px 26px -14px rgba(78, 143, 184, 0.4), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .t-lav { background: linear-gradient(150deg, #EBE6F8, #F9F6FE); box-shadow: 0 14px 26px -14px rgba(93, 79, 160, 0.4), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .tile-line { font-size: 9px; font-weight: 300; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .spotwrap { flex: 1; display: grid; place-items: center; padding: 4px 0; }
  .spotwrap .anchor { position: relative; display: grid; place-items: center; }
  .badge {
    position: absolute; top: -5px; right: -9px; min-width: 17px; height: 17px;
    border-radius: 999px; background: linear-gradient(135deg, #E5C46B, #C9962E);
    color: #fff; font-size: 9.5px; font-weight: 700;
    display: grid; place-items: center; padding: 0 4px;
    box-shadow: 0 3px 8px -2px rgba(201, 150, 46, 0.7);
    animation: badgepulse 2.8s ease-in-out 1.2s infinite;
  }
  @keyframes badgepulse {
    0%, 100% { box-shadow: 0 3px 8px -2px rgba(201, 150, 46, 0.7); }
    50% { box-shadow: 0 3px 8px -2px rgba(201, 150, 46, 0.7), 0 0 0 4px rgba(201, 150, 46, 0.18); }
  }
  .facepile { display: flex; }
  .facepile .pavat { width: 26px; height: 26px; margin-left: -7px; box-shadow: 0 0 0 2px #fff; border-radius: 50%; }
  .facepile .pavat:first-child { margin-left: 0; }
  .facepile .pavat .in { width: 20px; height: 20px; font-size: 8.5px; }
  .hwide {
    border-radius: 19px; padding: 11px 13px; margin-top: 9px; cursor: pointer;
    border: 0.5px solid rgba(43, 33, 24, 0.06);
    background: linear-gradient(150deg, #FFEDE4, #FFF8F4);
    box-shadow: 0 16px 30px -15px rgba(216, 72, 31, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    transition: transform 0.15s cubic-bezier(0.3, 0.8, 0.4, 1.4);
  }
  .hwide:active { transform: scale(0.975); }
  .hwide .snip { font-size: 9.5px; font-weight: 300; line-height: 1.5; margin-top: 4px; }
  .wkdelta { display: flex; align-items: center; gap: 9px; padding: 8px 0; }
  .wkdelta + .wkdelta { border-top: 0.5px solid rgba(43, 33, 24, 0.08); }
  .wkdelta .arr { font-size: 13px; flex: none; width: 18px; text-align: center; }
