<meta charset="utf-8">
<title>Mezo Clay Csomag</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
  :root {
    --ground: #EFE8DD; --ground-2: #E7DFD2; --card: #FFFFFF;
    --ink: #2B2118; --ink-2: #6E6257; --accent: #A84A26;
    --line: rgba(43, 33, 24, 0.12);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground: #191614; --ground-2: #211D19; --card: #262119;
      --ink: #F0E9E1; --ink-2: #BCAFA1; --accent: #FF8A66;
      --line: rgba(240, 233, 225, 0.12);
    }
  }
  :root[data-theme="dark"] {
    --ground: #191614; --ground-2: #211D19; --card: #262119;
    --ink: #F0E9E1; --ink-2: #BCAFA1; --accent: #FF8A66;
    --line: rgba(240, 233, 225, 0.12);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "Geist", system-ui, -apple-system, sans-serif;
    line-height: 1.5; padding: 48px 24px 72px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 10px; }
  .lede { max-width: 64ch; color: var(--ink-2); font-size: 16px; }
  .lede strong { color: var(--ink); font-weight: 600; }
  .lede code { font-family: ui-monospace, monospace; font-size: 13.5px; background: var(--ground-2); border-radius: 6px; padding: 1px 7px; }
  section { margin-top: 52px; }
  h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .sec-lede { color: var(--ink-2); font-size: 14.5px; max-width: 62ch; margin: 5px 0 20px; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 26px; box-shadow: 0 18px 34px -20px rgba(43, 33, 24, 0.25);
  }
  .logohero { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
  .wordmark { font-size: 42px; font-weight: 600; letter-spacing: -0.03em; }
  .wordmark .lite { font-weight: 200; }
  .logowhy { font-size: 14px; color: var(--ink-2); max-width: 46ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 13px; }
  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px 6px 11px; border-radius: 16px;
    background: linear-gradient(180deg, #FDFAF4, #F4ECDF);
    border: 0.5px solid rgba(43, 33, 24, 0.07);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 18px -12px rgba(43, 33, 24, 0.28);
  }
  .cell span { font-size: 10.5px; font-weight: 600; color: #6E6257; text-align: center; }
  .cell code { font-size: 9px; color: #A2958A; font-family: ui-monospace, monospace; }
  .spotgrid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 15px; }
  .spotgrid .cell { padding: 20px 8px 13px; }
  .minibar {
    display: flex; align-items: center; justify-content: space-between;
    background: #FFFFFF; border: 0.5px solid rgba(43, 33, 24, 0.1);
    border-radius: 999px; padding: 10px 20px; margin-top: 22px;
    box-shadow: 0 12px 24px -12px rgba(43, 33, 24, 0.3);
    max-width: 340px; color: #2B2118;
  }
  .minibar .t { display: grid; justify-items: center; gap: 3px; font-size: 9.5px; font-weight: 600; color: #A2958A; }
  .minibar .t.on { color: #A84A26; }
  .minibar .t.off svg { filter: grayscale(1) brightness(1.04) opacity(0.48); }
  .minifab {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #FF7A55, #FF5B36); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 7px 15px -5px rgba(255, 91, 54, 0.6);
  }
  .bar-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin-top: 24px; }
  .note {
    margin-top: 52px; padding: 20px 24px; background: var(--ground-2);
    border-radius: 16px; border: 1px solid var(--line); font-size: 14.5px; color: var(--ink-2);
    max-width: 900px;
  }
  .note strong { color: var(--ink); }
  .note code { font-family: ui-monospace, monospace; font-size: 12.5px; }
  @media (max-width: 720px) { body { padding: 32px 14px 56px; } .panel { padding: 18px; } }
</style>
