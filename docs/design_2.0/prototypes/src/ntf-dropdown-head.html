<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mezo · Értesítés-dropdown prototípus</title>
<style>
  :root{
    --surface-page:#FBF6EF; --surface-card:#FFFFFF; --surface-recess:rgba(43,33,24,.05);
    --text-primary:#2B2118; --text-secondary:#5F5346; --text-muted:#8A7A6A; --text-disabled:#A2937F;
    --ink-soft:#6E6257; --divider:rgba(43,33,24,.10);
    --primary-base:#FF6B4A; --primary-deep:#A84A26;
    --dv-coral:#FF6B4A; --dv-sage:#7FA48A; --dv-lav:#9B8FC4; --dv-sky:#6FA7D8; --dv-amber:#FFB347;
    --mz-chipbg:rgba(255,255,255,.7); --gradient-cta:linear-gradient(135deg,#FF7A55,#FF5B36);
    --wash-reggel:linear-gradient(155deg,#FFD9A8 0%,#FFE7CE 55%,#FFF3E6 100%);
    --wash-nap:linear-gradient(155deg,#B9DCF0 0%,#D3E9F6 55%,#EAF4FA 100%);
    --wash-este:linear-gradient(155deg,#D6CDF3 0%,#E4DDF7 55%,#F1EDFB 100%);
    --glass:rgba(255,255,255,.6); --glass-line:rgba(43,33,24,.08);
    --deco-line:rgba(43,33,24,.18); --deco-fill:rgba(43,33,24,.24);
    --scrim:rgba(43,33,24,.18);
  }
  .ph[data-theme="dark"]{
    --surface-page:#191410; --surface-card:#241D17; --surface-recess:rgba(245,239,230,.05);
    --text-primary:#F2E9DF; --text-secondary:#C9BAAB; --text-muted:#8A7A6A; --text-disabled:#7A6C5C;
    --ink-soft:#B7A897; --divider:rgba(245,239,230,.07);
    --primary-deep:#FFB59A;
    --dv-coral:#FF7E5C; --dv-sage:#8FB49A; --dv-lav:#AB9FD2; --dv-sky:#7FB2DE; --dv-amber:#FFBE60;
    --mz-chipbg:rgba(255,255,255,.09);
    --wash-reggel:linear-gradient(155deg,#5A4224 0%,#3E2E1C 55%,#241C14 100%);
    --wash-nap:linear-gradient(155deg,#1F4560 0%,#1C3242 55%,#1A2027 100%);
    --wash-este:linear-gradient(155deg,#3A2F63 0%,#2A2444 55%,#1E1A2A 100%);
    --glass:rgba(24,19,15,.6); --glass-line:rgba(255,255,255,.09);
    --deco-line:rgba(255,255,255,.2); --deco-fill:rgba(255,255,255,.3);
    --scrim:rgba(0,0,0,.42);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:#E9E2D6;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 12px 40px}
  h1{font-size:17px;margin:0;color:#2B2118}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .ctl .grp{display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .ctl button{border:none;background:none;font:inherit;font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer;color:#5F5346}
  .ctl button.on{background:#2B2118;color:#fff}
  .hint{font-size:12px;color:#6b5f52;margin:0;max-width:560px;text-align:center;line-height:1.5}

  .ph{width:390px;height:800px;border-radius:44px;background:var(--surface-page);overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.35),0 0 0 10px #17120E;position:relative;color:var(--text-primary)}
  .scr{height:100%;overflow-y:auto;scrollbar-width:none}
  .scr::-webkit-scrollbar{display:none}

  /* ════ FEJLÉC (1:1 az app-head receptje) ════ */
  .hero{position:sticky;top:0;z-index:20}
  .hero-bg{position:absolute;inset:0;height:92px;overflow:hidden;pointer-events:none;
    -webkit-mask-image:linear-gradient(to bottom,black 0%,black 58%,transparent 100%);
    mask-image:linear-gradient(to bottom,black 0%,black 58%,transparent 100%)}
  .grad{position:absolute;inset:0;background:var(--hero-w)}
  .ph[data-dp="reggel"]{--hero-w:var(--wash-reggel)}
  .ph[data-dp="nap"]{--hero-w:var(--wash-nap)}
  .ph[data-dp="este"]{--hero-w:var(--wash-este)}
  .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.75}
  .ph[data-dp="reggel"] .b1{background:#FFC078} .ph[data-dp="reggel"] .b2{background:#FF8E6A}
  .ph[data-dp="nap"] .b1{background:#7FBEE8} .ph[data-dp="nap"] .b2{background:#69CFBD}
  .ph[data-dp="este"] .b1{background:#A392E4} .ph[data-dp="este"] .b2{background:#E28FBB}
  .b1{width:190px;height:190px;left:-56px;top:-84px}
  .b2{width:150px;height:150px;right:-34px;top:-66px;opacity:.55}
  .bar{position:relative;display:flex;align-items:center;gap:9px;padding:14px 14px 8px}
  .grow{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
  .ptitle{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .rbtn{position:relative;width:40px;height:40px;border-radius:50%;border:.5px solid var(--glass-line);
    background:var(--mz-chipbg);display:grid;place-items:center;cursor:pointer;flex:none;
    box-shadow:0 6px 14px -8px rgba(43,33,24,.3);backdrop-filter:blur(6px)}
  .rbtn.is-open{background:color-mix(in srgb,var(--primary-base) 16%,var(--mz-chipbg));
    border-color:color-mix(in srgb,var(--primary-base) 30%,transparent)}
  .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:999px;background:var(--gradient-cta);
    color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .avatar{width:40px;height:40px;border:0;background:none;padding:0;cursor:pointer;flex:none}
  svg.ic{display:block}

  /* ════ ÉRTESÍTÉS-PANEL ════
     Teljes szélesség: a panel NEM a csengő wrapperéhez tapad, hanem a fejléc két
     széléhez (left/right 10px) — így a hosszú címek és a kétsoros törzsek kiférnek. */
  .scrim{position:absolute;inset:0;z-index:24;background:var(--scrim);
    backdrop-filter:blur(1.5px);animation:fade .22s ease both}
  .ntf{position:absolute;left:10px;right:10px;top:60px;z-index:25;
    background:var(--surface-card);border-radius:24px;overflow:hidden;
    border:.5px solid var(--glass-line);
    /* kétrétegű színes árnyék (Mozaik 2.0) */
    box-shadow:0 26px 48px -20px rgba(43,33,24,.5), 0 8px 18px -12px color-mix(in srgb,var(--primary-base) 40%,transparent);
    display:flex;flex-direction:column;max-height:min(600px,74%);
    transform-origin:88% top;animation:pop .26s cubic-bezier(.2,.9,.28,1.06) both}
  @keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.965)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* fejrész — kitapad, nem görög */
  .ntf-hd{display:flex;align-items:center;gap:8px;padding:13px 14px 9px;flex:none}
  .ntf-hd .eyebrow{font:800 10.5px/1 -apple-system,system-ui;letter-spacing:.7px;text-transform:uppercase;
    color:var(--text-disabled)}
  .ntf-hd .cnt{font:800 10.5px/1 -apple-system,system-ui;color:#fff;background:var(--gradient-cta);
    border-radius:999px;padding:4px 7px}
  .ntf-hd .allread{margin-left:auto;border:none;background:none;font:inherit;font-size:11.5px;font-weight:700;
    color:var(--primary-deep);cursor:pointer;padding:4px 2px}
  /* szűrő-chipek — „Mind / Olvasatlan" + KATEGÓRIÁK. A sor vízszintesen görgethető
     (FB-módra), és CSAK azokat a kategóriákat rajzolja, amikre van sor a feedben:
     üres kategória-chip olyan szűrőt ígérne, ami nulla találatot ad (honest state). */
  .ntf-tabs{display:flex;gap:6px;padding:0 14px 10px;flex:none;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(to right,black calc(100% - 18px),transparent 100%);
    mask-image:linear-gradient(to right,black calc(100% - 18px),transparent 100%)}
  .ntf-tabs::-webkit-scrollbar{display:none}
  .ntf-tabs button{display:flex;align-items:center;gap:6px;flex:none;
    border:.5px solid var(--divider);background:transparent;font:inherit;font-size:13.5px;font-weight:700;
    color:var(--text-secondary);padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .ntf-tabs button svg{display:block;opacity:.9}
  .ntf-tabs button .n{font-size:12px;font-weight:800;color:var(--text-disabled)}
  .ntf-tabs button.on{background:color-mix(in srgb,var(--primary-base) 14%,transparent);
    border-color:color-mix(in srgb,var(--primary-base) 26%,transparent);color:var(--primary-deep)}
  .ntf-tabs button.on .n{color:var(--primary-deep)}

  /* GÖRGŐ — a panel egyetlen görgethető rétege, felül-alul kifakuló maszkkal */
  .ntf-scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:0 8px 6px;scrollbar-width:thin;scrollbar-color:var(--divider) transparent}
  .ntf-scroll::-webkit-scrollbar{width:5px}
  .ntf-scroll::-webkit-scrollbar-thumb{background:var(--divider);border-radius:999px}
  .ntf-scroll.mask-b{-webkit-mask-image:linear-gradient(to bottom,black calc(100% - 20px),transparent 100%);
    mask-image:linear-gradient(to bottom,black calc(100% - 20px),transparent 100%)}

  /* nap-csoport címke — a görgőn BELÜL tapad ki, mint a FB dátumsávja */
  .ntf-day{position:sticky;top:0;z-index:2;font:800 10px/1 -apple-system,system-ui;letter-spacing:.6px;
    text-transform:uppercase;color:var(--text-muted);padding:9px 8px 6px;
    background:var(--surface-card);
    box-shadow:0 6px 8px -6px var(--surface-card),0 3px 0 0 var(--surface-card)}

  /* SOR — ikon-tok + kétsoros szöveg + időbélyeg + olvasatlan pötty */
  .row{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
    border:none;background:none;font-family:inherit;color:inherit;
    padding:10px 34px 10px 10px;border-radius:16px;position:relative;
    transition:background .16s ease}
  .row:hover{background:var(--surface-recess)}
  .row.unread{background:color-mix(in srgb,var(--primary-base) 8%,transparent)}
  .row.unread:hover{background:color-mix(in srgb,var(--primary-base) 13%,transparent)}
  .row+.row{margin-top:2px}
  .ico{width:38px;height:38px;border-radius:13px;flex:none;display:grid;place-items:center;
    box-shadow:0 6px 12px -8px rgba(43,33,24,.45), inset 0 1px 0 rgba(255,255,255,.5)}
  .ico.pattern   {background:color-mix(in srgb,var(--dv-lav) 20%,transparent)}
  .ico.knowledge {background:color-mix(in srgb,var(--dv-sage) 22%,transparent)}
  .ico.prediction{background:color-mix(in srgb,var(--dv-sky) 20%,transparent)}
  .ico.experiment{background:color-mix(in srgb,var(--dv-amber) 24%,transparent)}
  .ico.memoir    {background:color-mix(in srgb,var(--primary-base) 14%,transparent)}
  .ico.memory    {background:var(--surface-recess)}
  .ico.goal      {background:color-mix(in srgb,var(--dv-coral) 20%,transparent)}
  .txt{min-width:0;flex:1}
  .t{display:block;font:700 12.5px/1.3 -apple-system,system-ui;color:var(--text-primary)}
  .x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font:400 11.5px/1.42 -apple-system,system-ui;color:var(--text-secondary);margin-top:2px}
  .when{display:block;font:700 11.5px/1 -apple-system,system-ui;color:var(--text-muted);margin-top:6px;letter-spacing:.1px}
  .row.unread .when{color:var(--primary-deep)}
  .dot{position:absolute;right:13px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;
    background:var(--primary-base);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary-base) 18%,transparent)}

  /* lábléc — kitapad */
  .ntf-ft{flex:none;border-top:.5px solid var(--divider);padding:4px}
  .ntf-ft button{width:100%;border:none;background:none;font:inherit;font-size:12.5px;font-weight:800;
    color:var(--primary-deep);padding:12px;border-radius:18px;cursor:pointer}
  .ntf-ft button:hover{background:var(--surface-recess)}
  .empty{padding:26px 14px 30px;text-align:center;font-size:12px;color:var(--text-muted)}

  .cont{padding:10px 14px 120px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--surface-card);border-radius:22px;padding:16px;min-height:86px;
    box-shadow:0 17px 31px -17px rgba(43,33,24,.28),0 2px 6px rgba(43,33,24,.04)}
  .card h3{margin:0 0 6px;font-size:14px}
  .card p{margin:0;font-size:12px;color:var(--text-muted)}
  @media (prefers-reduced-motion:reduce){.ntf,.scrim{animation:none}}
</style>
</head>
