<meta charset="utf-8">
<title>Growth oldal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
  :root {
    --ground: #EFE8DD; --ground-2: #E7DFD2; --card: #FFFFFF;
    --ink: #2B2118; --ink-2: #6E6257; --accent: #A8801F;
    --line: rgba(43, 33, 24, 0.12);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground: #191614; --ground-2: #211D19; --card: #262119;
      --ink: #F0E9E1; --ink-2: #BCAFA1; --accent: #E5C46B;
      --line: rgba(240, 233, 225, 0.12);
    }
  }
  :root[data-theme="dark"] {
    --ground: #191614; --ground-2: #211D19; --card: #262119;
    --ink: #F0E9E1; --ink-2: #BCAFA1; --accent: #E5C46B;
    --line: rgba(240, 233, 225, 0.12);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "Geist", system-ui, -apple-system, sans-serif;
    line-height: 1.5; padding: 48px 24px 64px;
  }
  .wrap { max-width: 1160px; margin: 0 auto; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 10px; }
  .lede { max-width: 64ch; color: var(--ink-2); font-size: 16px; }
  .lede strong { color: var(--ink); font-weight: 600; }
  .lede code, aside code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.86em; background: var(--ground-2); border-radius: 5px; padding: 1px 5px; }
  .stage { margin-top: 40px; display: flex; gap: 56px; flex-wrap: wrap; align-items: flex-start; }
  aside { max-width: 420px; display: grid; gap: 24px; }
  aside h2 { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  aside ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14.5px; color: var(--ink-2); }
  aside li strong { color: var(--ink); font-weight: 600; }
  .note { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 14.5px; color: var(--ink-2); border-left: 2px solid var(--accent); padding-left: 14px; }
  .democtl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
  .democtl button { border: none; background: rgba(168, 128, 31, 0.12); color: var(--accent); font-family: inherit; font-weight: 700; font-size: 12.5px; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .democtl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .democtl span { font-size: 12.5px; color: var(--ink-2); flex-basis: 100%; }

  /* ============ PHONE ============ */
  .phone {
    width: 330px; height: 694px; flex: none; position: sticky; top: 24px;
    background: #1D1712; border-radius: 52px; padding: 11px;
    box-shadow: 0 30px 60px -22px rgba(29, 23, 18, 0.5);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden;
    display: flex; flex-direction: column; font-size: 11.5px; line-height: 1.4;
    color: #2B2118; background: linear-gradient(180deg, #FBEBCB 0%, #FDFAF4 34%), #FDFAF4;
  }
  .isl { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 82px; height: 22px; border-radius: 999px; background: #1D1712; z-index: 14; }
  .p-status { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 2px; font-size: 11px; font-weight: 600; position: relative; z-index: 14; }
  .p-body { flex: 1; min-height: 0; overflow: hidden; padding: 4px 14px 0; display: flex; flex-direction: column; gap: 8px; }
  .p-eyebrow { font-size: 8.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #A2958A; }
  .grow { flex: 1; min-width: 0; }
  .mrow { display: flex; align-items: center; gap: 8px; }
  .mut { color: #6E6257; }
  .tnum { font-variant-numeric: tabular-nums; }

  .backbtn {
    border: none; background: rgba(255, 255, 255, 0.7); font-family: inherit; cursor: pointer;
    border-radius: 999px; padding: 6px 13px 6px 9px; font-size: 11px; font-weight: 600; color: #2B2118;
    display: flex; align-items: center; gap: 4px; flex: none;
    box-shadow: 0 6px 14px -8px rgba(43, 33, 24, 0.3);
  }
  .backbtn:focus-visible, .pgact:focus-visible, .qchip:focus-visible, .tile:focus-visible { outline: 2px solid #A84A26; outline-offset: 2px; }
  .pgact { margin-left: auto; border: none; background: rgba(255, 255, 255, 0.7); font-family: inherit; cursor: pointer; border-radius: 999px; padding: 6px 12px; font-size: 10px; font-weight: 700; color: #A8801F; box-shadow: 0 6px 14px -8px rgba(43, 33, 24, 0.3); flex: none; }
  .cta {
    background: linear-gradient(135deg, #FF7A55, #FF5B36); color: #fff;
    border-radius: 999px; padding: 8px 16px; font-size: 10.5px; font-weight: 600; flex: none;
    box-shadow: 0 8px 16px -6px rgba(255, 91, 54, 0.55); border: none; font-family: inherit; cursor: pointer;
  }
  .ghost { background: rgba(43, 33, 24, 0.06); color: #6E6257; border: none; font-family: inherit; border-radius: 999px; padding: 7px 13px; font-size: 10.5px; font-weight: 600; flex: none; cursor: pointer; }

  .avatar-ring { width: 32px; height: 32px; border-radius: 50%; flex: none; background: conic-gradient(#C9962E 68%, rgba(43, 33, 24, 0.1) 0); display: grid; place-items: center; }
  .avatar-ring .in { width: 25px; height: 25px; border-radius: 50%; background: #FDFAF4; display: grid; place-items: center; }
  .dpswitch { width: 32px; height: 32px; border-radius: 50%; border: 0.5px solid rgba(43, 33, 24, 0.12); background: rgba(255, 255, 255, 0.85); display: grid; place-items: center; position: relative; flex: none; box-shadow: 0 8px 16px -10px rgba(43, 33, 24, 0.3); }
  .badge { position: absolute; top: -3px; right: -4px; min-width: 15px; height: 15px; border-radius: 999px; background: linear-gradient(135deg, #FF7A55, #FF5B36); color: #fff; font-size: 8.5px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; box-shadow: 0 3px 8px -2px rgba(255, 91, 54, 0.6); }

  /* ===== belépő koreográfia ===== */
  .rise { opacity: 0; transform: translateY(16px) scale(0.98); }
  .play .rise { animation: rise 0.5s cubic-bezier(0.22, 0.9, 0.32, 1.15) forwards; animation-delay: var(--d); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .rise-x { opacity: 0; transform: translateX(14px); }
  .play .rise-x { animation: risex 0.45s cubic-bezier(0.22, 0.9, 0.32, 1.1) forwards; animation-delay: var(--d); }
  @keyframes risex { to { opacity: 1; transform: none; } }

  .panel { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: 10px; }
  .panel::-webkit-scrollbar { display: none; }
  .panel > * { flex: none; }

  /* ===== HERO ===== */
  .grhero { display: grid; gap: 4px; padding: 2px 4px 2px; }
  .grhero .ttl { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
  .grhero .xprow { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .grhero .bignum { font-size: 38px; font-weight: 200; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .grhero .unit { font-size: 11px; font-weight: 700; color: #A8801F; margin-left: 4px; letter-spacing: 0.04em; }
  .grhero .xpicon { animation: growbreathe 5s ease-in-out infinite; transform-origin: 50% 80%; }
  @keyframes growbreathe { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.05) rotate(-2deg); } }
  .traits { display: grid; gap: 5px; padding: 4px 6px 0; }
  .trait { display: grid; grid-template-columns: 58px 1fr 54px; align-items: center; gap: 8px; }
  .trait .lb { font-size: 8px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #A2958A; }
  .trait .val { font-size: 9.5px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; color: #2B2118; }
  .trait .val small { font-weight: 500; color: #6E6257; font-size: 8px; }
  .trait.hidden { display: none; }
  .tbar { height: 6px; border-radius: 3px; background: rgba(43, 33, 24, 0.08); overflow: hidden; }
  .tbar i { display: block; height: 100%; border-radius: 3px; transform: scaleX(0); transform-origin: left; width: var(--w, 0%); }
  .play .tbar i { animation: fillx 0.9s cubic-bezier(0.22, 0.9, 0.32, 1) forwards; animation-delay: var(--d, 0ms); }
  @keyframes fillx { to { transform: none; } }
  .tbar i.gold { background: linear-gradient(90deg, #E5C46B, #C9962E); }
  .tbar i.lav { background: linear-gradient(90deg, #B4A6E0, #8A76CC); }
  .tbar i.sage { background: linear-gradient(90deg, #A9C69A, #8FAF7E); }
  .tbar i.sky { background: linear-gradient(90deg, #9CC4DE, #4E8FB8); }
  .wdots { display: flex; gap: 4px; align-items: center; }
  .wdots i { flex: 1; height: 7px; border-radius: 4px; background: rgba(43, 33, 24, 0.08); transform: scale(0.3); opacity: 0; }
  .wdots i.on { background: linear-gradient(90deg, #A9C69A, #8FAF7E); }
  .wdots i.now { box-shadow: 0 0 0 1.5px rgba(78, 107, 66, 0.35); }
  .play .wdots i { animation: dotpop 0.4s cubic-bezier(0.3, 1.4, 0.4, 1) forwards; animation-delay: var(--d); }
  @keyframes dotpop { to { transform: none; opacity: 1; } }

  /* ===== MA-CSÍK ===== */
  .mastrip { border-radius: 16px; padding: 8px 10px 9px; background: #fff; border: 0.5px solid rgba(43, 33, 24, 0.06);
    box-shadow: 0 14px 26px -16px rgba(43, 33, 24, 0.3), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.85); }
  .mahead { display: flex; align-items: center; gap: 6px; cursor: pointer; border: none; background: none; font-family: inherit; padding: 0 2px 6px; width: 100%; text-align: left; }
  .mahead .p-eyebrow { color: #A8801F; }
  .mahead .xpch { margin-left: auto; font-size: 8px; font-weight: 800; color: #4E6B42; background: rgba(143, 175, 126, 0.18); border-radius: 6px; padding: 2px 7px; font-variant-numeric: tabular-nums; }
  .mahead .chev { color: #A2958A; font-size: 12px; }
  .chiprail { display: flex; flex-wrap: wrap; gap: 5px; padding: 1px 2px 2px; margin: 0 -2px; }
  .chiprail::-webkit-scrollbar { display: none; }
  .qchip { flex: none; display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 6px 10px 6px 8px; font-size: 9px; font-weight: 600; font-family: inherit;
    border: 1px solid rgba(43, 33, 24, 0.12); background: #FBF9F4; color: #2B2118; cursor: pointer; transition: transform 0.15s cubic-bezier(0.3, 0.8, 0.4, 1.4), background 0.3s ease; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qchip:active { transform: scale(0.95); }
  .qchip .mk { width: 13px; height: 13px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 8px; border: 1.2px solid rgba(43, 33, 24, 0.2); }
  .qchip.done { background: rgba(143, 175, 126, 0.16); border-color: rgba(143, 175, 126, 0.5); color: #3E5A34; }
  .qchip.done .mk { background: #8FAF7E; border-color: #8FAF7E; color: #fff; }
  .qchip.gone { opacity: 0.5; border-style: dashed; cursor: default; }
  .qchip.gone .mk { border-style: dashed; }
  .qchip.add { background: linear-gradient(135deg, #FFF1D6, #FFFAF0); border-color: rgba(201, 150, 46, 0.45); color: #8A5E07; font-weight: 700; }
  .qchip.act { background: rgba(138, 118, 204, 0.14); border-color: rgba(138, 118, 204, 0.4); color: #5D4FA0; }
  .qchip.act .mk { border-color: #8A76CC; color: #5D4FA0; }
  .maempty { font-size: 9.5px; font-weight: 300; color: #6E6257; padding: 2px 2px 0; line-height: 1.5; }
  .maempty b { color: #2B2118; font-weight: 600; }

  /* ===== MOZAIK ===== */
  .mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile {
    border-radius: 17px; padding: 10px 11px 9px; min-height: 104px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 0.5px solid rgba(43, 33, 24, 0.06); cursor: pointer;
    box-shadow: 0 14px 26px -14px var(--sh, rgba(43, 33, 24, 0.28)), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    background: var(--wash, #fff); transition: transform 0.15s cubic-bezier(0.3, 0.8, 0.4, 1.4);
  }
  .tile:active { transform: scale(0.96); }
  .tile:hover { transform: translateY(-2px); }
  .tile .p-eyebrow { align-self: flex-start; color: var(--tc, #A2958A); }
  .tile .spotwrap { flex: 1; display: grid; place-items: center; }
  .tile .line { font-size: 9.5px; font-weight: 600; text-align: center; color: #6E6257; font-variant-numeric: tabular-nums; }
  .tile .line b { color: #2B2118; }
  .t-skill { --wash: linear-gradient(150deg, #EBE6F8, #F9F6FE); --sh: rgba(93, 79, 160, 0.4); --tc: #5D4FA0; }
  .t-rutin { --wash: linear-gradient(150deg, #FFF1D6, #FFFAF0); --sh: rgba(181, 126, 20, 0.4); --tc: #A8801F; }
  .t-naplo { --wash: linear-gradient(150deg, #DFEDF5, #F5FAFD); --sh: rgba(78, 143, 184, 0.4); --tc: #3E7396; }
  .t-kit { --wash: linear-gradient(150deg, #E9F1E2, #F7FBF3); --sh: rgba(110, 139, 94, 0.45); --tc: #4E6B42; }
  .tile .miniring { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--tc) calc(var(--v, 0) * 1%), rgba(43, 33, 24, 0.08) 0); }
  .tile .miniring::after { content: ''; position: absolute; width: 33px; height: 33px; border-radius: 50%; background: #FDFAF4; }
  .tile .miniring { position: relative; }
  .tile .miniring svg, .tile .miniring b { position: relative; z-index: 1; }
  .pulsedot { width: 7px; height: 7px; border-radius: 50%; background: #C9962E; box-shadow: 0 0 0 2px rgba(201, 150, 46, 0.25); margin-left: auto; flex: none; animation: kpulse 2.2s ease-in-out infinite; }
  @keyframes kpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ============ ALOLDALAK ============ */
  .page {
    position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; padding-top: 34px;
    transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.35, 1); background: #FDFAF4;
  }
  .page.open { transform: none; }
  .page.p-lav { background: linear-gradient(180deg, #E9E3F7 0%, #FDFAF4 36%), #FDFAF4; }
  .page.p-gold { background: linear-gradient(180deg, #FBEBCB 0%, #FDFAF4 36%), #FDFAF4; }
  .page.p-sky { background: linear-gradient(180deg, #DCEAF3 0%, #FDFAF4 36%), #FDFAF4; }
  .page.p-sage { background: linear-gradient(180deg, #E4EEDD 0%, #FDFAF4 36%), #FDFAF4; }
  .page-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; }
  .page-hero { display: grid; justify-items: center; text-align: center; gap: 1px; padding: 6px 14px 10px; }
  .page-hero .bignum { font-weight: 200; font-size: 38px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .page-hero .nm { font-size: 14px; font-weight: 700; }
  .page-hero .sb { font-size: 10px; color: #6E6257; }
  .page-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 2px 14px 18px; }
  .page-body::-webkit-scrollbar { display: none; }
  .principle { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 10px; color: #A2958A; text-align: center; padding: 8px 8px 4px; line-height: 1.5; }

  .statstrip { display: flex; gap: 7px; margin-bottom: 10px; }
  .statcell { flex: 1; text-align: center; border-radius: 12px; padding: 7px 3px 6px; background: rgba(255, 255, 255, 0.8); border: 0.5px solid rgba(43, 33, 24, 0.06); }
  .statcell b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .statcell small { font-size: 6.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #A2958A; }

  .card { border-radius: 17px; padding: 11px 12px; margin-bottom: 9px; background: #fff; border: 0.5px solid rgba(43, 33, 24, 0.06);
    box-shadow: 0 14px 26px -16px rgba(43, 33, 24, 0.3), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.85); }
  .card.lav { background: linear-gradient(150deg, #EBE6F8, #F9F6FE); box-shadow: 0 14px 26px -14px rgba(93, 79, 160, 0.4), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .card.sage { background: linear-gradient(150deg, #E9F1E2, #F7FBF3); box-shadow: 0 14px 26px -14px rgba(110, 139, 94, 0.45), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .card.amber { background: linear-gradient(150deg, #FFF1D6, #FFFAF0); box-shadow: 0 14px 26px -14px rgba(181, 126, 20, 0.4), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .card.sky { background: linear-gradient(150deg, #DFEDF5, #F5FAFD); box-shadow: 0 14px 26px -14px rgba(78, 143, 184, 0.4), 0 2px 5px rgba(43, 33, 24, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
  .card .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .stch { font-size: 7px; font-weight: 800; letter-spacing: 0.08em; border-radius: 6px; padding: 2px 7px; flex: none; margin-left: auto; font-variant-numeric: tabular-nums; }
  .stch.ok { background: rgba(143, 175, 126, 0.2); color: #4E6B42; }
  .stch.warn { background: rgba(201, 150, 46, 0.16); color: #A8801F; }
  .stch.lav { background: rgba(138, 118, 204, 0.14); color: #5D4FA0; }
  .stch.sky { background: rgba(78, 143, 184, 0.16); color: #3E7396; }
  .foot9 { font-size: 8.5px; color: #A2958A; font-weight: 300; padding: 6px 2px 0; line-height: 1.5; }
  .foot9 b { color: #4E6B42; font-weight: 700; }

  /* ===== skill-sorok ===== */
  .skl { display: flex; align-items: center; gap: 7px; padding: 4px 0; }
  .skl .ic { width: 20px; height: 20px; border-radius: 7px; flex: none; display: grid; place-items: center; background: rgba(255, 255, 255, 0.7); font-size: 8px; font-weight: 800; color: var(--tc, #6E6257); }
  .skl .nm { font-size: 9.5px; font-weight: 600; width: 82px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skl .tbar { flex: 1; height: 5px; }
  .skl .lv { font-size: 8px; font-weight: 800; color: #2B2118; background: rgba(255, 255, 255, 0.8); border-radius: 6px; padding: 2px 5px; flex: none; font-variant-numeric: tabular-nums; min-width: 30px; text-align: center; }
  .skl .perk { font-size: 7px; font-weight: 700; color: #A8801F; flex: none; }
  .skl.more { display: none; }
  .card.expanded .skl.more { display: flex; }
  .expandbtn { width: 100%; border: none; background: none; font-family: inherit; font-size: 9px; font-weight: 700; color: var(--tc, #6E6257); cursor: pointer; padding: 6px 0 0; text-align: center; }
  .card.expanded .expandbtn .less { display: inline; }
  .card.expanded .expandbtn .moretx { display: none; }
  .expandbtn .less { display: none; }

  /* ===== rutin ===== */
  .covgrid { display: flex; gap: 8px; margin-bottom: 9px; }
  .covtile { flex: 1; border-radius: 15px; padding: 9px 10px 9px; background: #fff; border: 0.5px solid rgba(43, 33, 24, 0.06);
    box-shadow: 0 12px 24px -16px rgba(43, 33, 24, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.85); position: relative; overflow: hidden; }
  .covtile .ch { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .covtile .ch b { font-size: 9.5px; font-weight: 700; }
  .covtile .ch .n { margin-left: auto; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .covtile .ch .n small { font-size: 7.5px; color: #A2958A; font-weight: 600; }
  .cells { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .cells i { aspect-ratio: 1; border-radius: 3px; background: rgba(43, 33, 24, 0.07); transform: scale(0.4); opacity: 0; }
  .cells i.on { background: linear-gradient(135deg, #E5C46B, #C9962E); }
  .cells i.ev.on { background: linear-gradient(135deg, #B4A6E0, #8A76CC); }
