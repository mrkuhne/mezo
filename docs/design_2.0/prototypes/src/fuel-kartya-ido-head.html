<meta charset="utf-8">
<title>Fuel kártya · óra-doboz és makró gyűrűk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
  /* ── Ház-tokenek (prototype.css DS dark = a képernyőfotó témája). A világos téma itt
     szándékosan nincs kihangosítva: ez vizuális referencia a sötét Mai lapról. ── */
  :root {
    --surface-page: #191614; --surface-card: #221E1B; --surface-elevated: #2A2521;
    --surface-recess: rgba(245, 239, 230, 0.05); --surface-glass: rgba(245, 239, 230, 0.05);
    --ink: #F5EFE6; --sub: #B7A899; --faint: #5E5348;
    --divider: rgba(245, 239, 230, 0.07); --border-subtle: rgba(245, 239, 230, 0.07);
    --amber: #FFBE60; --sage: #8FB49A; --lav: #AB9FD2; --sky: #7FB2DE; --coral: #FF7E5C;
    --macro-protein: #E26B67; --macro-carbs: #D49245; --macro-fat: #C4A020; --macro-fiber: #6BA24A;
    --ff-display: 'Geist', system-ui, sans-serif;
    --page-bg: #100D0B;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--page-bg); color: var(--ink);
    font-family: 'Geist', -apple-system, system-ui, sans-serif; font-size: 14px; line-height: 1.5;
    padding: 48px 24px 64px; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; border-radius: 12px; }

  .wrap { max-width: 1100px; margin: 0 auto; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--sky); }
  h1 { font-size: clamp(30px, 4vw, 42px); font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 10px; }
  .lede { max-width: 62ch; color: var(--sub); font-size: 16px; }
  .lede strong { color: var(--ink); font-weight: 600; }
  .stage { margin-top: 40px; display: flex; gap: 56px; flex-wrap: wrap; align-items: flex-start; }
  aside { max-width: 400px; display: grid; gap: 24px; }
  aside h2 { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  aside ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14.5px; color: var(--sub); }
  aside li strong { color: var(--ink); font-weight: 600; }
  .note { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 14.5px;
    color: var(--sub); border-left: 2px solid var(--sky); padding-left: 14px; }

  /* ── Telefon-keret ── */
  .phone { position: relative; width: 393px; max-width: 100%; height: 852px; flex: none;
    border-radius: 44px; background: var(--surface-page); overflow: hidden; isolation: isolate;
    box-shadow: 0 0 0 10px #0A0908, 0 0 0 12px #2E2A26, 0 30px 70px rgba(0, 0, 0, 0.5); }
  .phone-scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: none; padding: 20px 14px 40px; }
  .phone-scroll::-webkit-scrollbar { display: none; }
  .sb { display: flex; justify-content: space-between; padding: 2px 10px 14px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }

  /* ══ A Mai nap-blokk (a produkciós `fmx-` kalibráció, VÁLTOZATLAN geometria) ══ */
  .fmx-blocks { display: grid; gap: 16px; }
  .fmx-block { padding: 13px 13px 6px; border-radius: 18px;
    border: 1px solid color-mix(in srgb, var(--block-color) 22%, transparent);
    background: linear-gradient(160deg, color-mix(in srgb, var(--block-color) 11%, transparent),
      color-mix(in srgb, var(--block-color) 3%, transparent) 55%, var(--surface-card));
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.16), 0 0 22px color-mix(in srgb, var(--block-color) 7%, transparent); }
  .fmx-block.is-future { opacity: 0.88; }
  .fmx-block-head { display: flex; align-items: center; gap: 10px; padding: 0 0 8px; }
  .fmx-block-art { width: 38px; height: 38px; flex: 0 0 auto; display: grid; place-items: center; }
  .fmx-block-art svg { width: 38px; height: 38px;
    filter: drop-shadow(0 6px 7px rgba(0, 0, 0, 0.34)) drop-shadow(0 0 9px color-mix(in srgb, var(--block-color) 30%, transparent)); }
  .fmx-block-name { font-size: 17px; font-weight: 600; letter-spacing: 0.2px; color: var(--ink); flex: 1; min-width: 0; }

  /* ── ÚJ: az óra gomb — a cím sorában, a kcal-gyűrű előtt. Csendes üveg-korong,
     a clay időzítő ikonnal; csak LOGOLT blokkon jelenik meg. ── */
  .fmx-clock { width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: 50%; border: 1px solid var(--border-subtle);
    background: var(--surface-glass); backdrop-filter: blur(6px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    transition: transform 0.12s; }
  .fmx-clock:active { transform: scale(0.92); }
  .fmx-clock svg { width: 21px; height: 21px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.3)); }

  /* Blokk-gyűrű (kcal) — változatlan. */
  .fmx-budget-ring { position: relative; margin-left: 0; width: 44px; height: 44px; flex: 0 0 auto;
    display: grid; place-items: center; }
  .fmx-budget-ring svg { position: absolute; inset: 0; width: 100%; height: 100%;
    transform: rotate(-90deg); overflow: visible; }
  .fmx-budget-ring circle { fill: none; stroke-width: 4; }
  .fmx-br-track { stroke: var(--surface-recess); }
  .fmx-br-fill { stroke: var(--block-color); stroke-linecap: round; stroke-dasharray: 0 100;
    transition: stroke-dasharray 1s cubic-bezier(0.2, 0.8, 0.2, 1);
    filter: drop-shadow(0 0 5px color-mix(in srgb, var(--block-color) 40%, transparent)); }
  .fmx-budget-ring b { position: relative; font-size: 10px; font-weight: 600; color: var(--ink); }

  /* Ablak-csík — visszajött, a produkciós kalibráció (a sáv a tervezett idő, a pötty a log). */
  .fmx-window { display: flex; align-items: center; gap: 8px; padding: 0 0 11px; }
  .fmx-window > span { flex: 0 0 auto; font-size: 9px; color: var(--faint); }
  .fmx-window i { position: relative; flex: 1; height: 12px; border-radius: 7px; background: var(--surface-recess); }
  .fmx-window em { position: absolute; top: 0; bottom: 0; left: var(--from); width: calc(var(--to) - var(--from));
    border-radius: 7px; border: 1px solid color-mix(in srgb, var(--block-color) 24%, transparent);
    background: linear-gradient(90deg, color-mix(in srgb, var(--block-color) 14%, transparent),
      color-mix(in srgb, var(--block-color) 26%, transparent), color-mix(in srgb, var(--block-color) 14%, transparent)); }
  .fmx-window b { position: absolute; top: 50%; left: var(--at); width: 15px; height: 15px;
    transform: translate(-50%, -50%); border-radius: 50%; background: var(--block-color);
    border: 2px solid var(--surface-card);
    box-shadow: 0 0 9px color-mix(in srgb, var(--block-color) 40%, transparent); }

  /* Étkezés-sor: a NÉV felül teljes szélességben (két sorig törhet), alatta egy sorban a
     négy gyűrű + jobbra az AI pont-chip. */
  .fmx-meal-row { padding: 12px 0 13px; border-top: 1px solid var(--divider); }
  .fmx-meal-main { display: block; width: 100%; text-align: left; }
  .fmx-meal-main strong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 16px; font-weight: 500; line-height: 1.3; color: var(--ink); }
  .fmx-meal-bottom { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .fmx-meal-bottom .fmx-score { margin-left: auto; }
  .fmx-score { display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
    padding: 7px 11px 7px 7px; border-radius: 22px;
    border: 1px solid color-mix(in srgb, var(--lav) 42%, transparent);
    background: color-mix(in srgb, var(--lav) 12%, transparent);
    color: color-mix(in srgb, var(--lav) 70%, var(--ink)); }
  .fmx-score svg { width: 28px; height: 28px; }
  .fmx-score b { font-size: 15px; font-weight: 600; }

  /* ── ÚJ: makró mini-gyűrűk a grammsor helyén. Négyes cella-sor; az azonosság a
     megszokott hue + clay ikon (felirat nélkül). A P/Ch/Zs gyűrű az ÉTKEZÉS energia-
     arányát teli (mint a részletlap arány-gyűrűi), a rost a napi adag részesedését.
     Geometria = a ház `.fmx-ring` receptje (pathLength 100), kicsiben. ── */
  .fmx-mrings { display: flex; gap: 14px; }
  .fmx-mcell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .fmx-mcell > svg:first-child { width: 15px; height: 15px;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.26)); }
  .fmx-mring { position: relative; width: 40px; height: 40px; display: grid; place-items: center; }
  .fmx-mring > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
    transform: rotate(-90deg);
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--macro-color) 30%, transparent)); }
  .fmx-mring circle { fill: none; stroke-width: 4; }
  .fmx-mring .tr { stroke: var(--surface-recess); }
  .fmx-mring .fl { stroke: var(--macro-color); stroke-linecap: round; stroke-dasharray: 0 100;
    transition: stroke-dasharray 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .fmx-mring b { position: relative; display: flex; align-items: baseline; font-size: 12.5px;
    font-weight: 600; font-variant-numeric: tabular-nums; color: var(--macro-color); }
  .fmx-mring b i { font-style: normal; font-size: 7.5px; font-weight: 500; margin-left: 1px; color: var(--sub); }
  .fmx-mring.is-null b { color: var(--faint); font-weight: 400; }

  /* Üres blokk: egy nagy koppintható felület — változatlan. */
  .fmx-block-log { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 0 12px;
    border-top: 1px solid var(--divider); text-align: left; color: var(--ink); }
  .fmx-block-log > span:first-child { width: 34px; height: 34px; flex: 0 0 auto; display: grid;
    place-items: center; border-radius: 50%; font-size: 16px;
    border: 1px dashed color-mix(in srgb, var(--block-color) 48%, transparent);
    color: color-mix(in srgb, var(--block-color) 70%, var(--ink)); }
  .fmx-block-log strong { display: block; font-size: 14px; font-weight: 500; }
  .fmx-block-log small { display: block; margin-top: 3px; font-size: 9px; color: var(--sub); }

  /* ══ ÚJ: az idő-doboz — kis 3D üvegdoboz, az óra gombra nyílik ══ */
  .fmx-glass-layer { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; }
  .fmx-glass-layer[hidden] { display: none; }
  .fmx-glass-backdrop { position: absolute; inset: 0; width: 100%; height: 100%;
    background: rgba(5, 7, 12, 0.62); backdrop-filter: blur(15px); cursor: pointer;
    opacity: 0; transition: opacity 0.28s; }
  .fmx-timebox { position: relative; width: min(78%, 280px); padding: 22px 22px 18px;
    border-radius: 24px; border: 1px solid var(--border-subtle);
    background: var(--surface-elevated); backdrop-filter: blur(22px) saturate(1.25);
    box-shadow: 0 34px 70px rgba(0, 0, 0, 0.5),
      0 0 34px color-mix(in srgb, var(--block-color) 16%, transparent),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    text-align: center; color: var(--ink);
    opacity: 0; transform: perspective(700px) rotateX(14deg) scale(0.86) translateY(16px);
    transition: opacity 0.3s, transform 0.34s cubic-bezier(0.2, 0.9, 0.25, 1.18); }
  .fmx-glass-layer.is-open .fmx-glass-backdrop { opacity: 1; }
  .fmx-glass-layer.is-open .fmx-timebox { opacity: 1; transform: none; }
  .fmx-timebox-art { width: 54px; height: 54px; margin: -46px auto 2px; display: grid; place-items: center; }
  .fmx-timebox-art svg { width: 54px; height: 54px;
    filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.42)) drop-shadow(0 0 12px color-mix(in srgb, var(--block-color) 34%, transparent)); }
  .fmx-timebox-eyebrow { font-size: 8px; font-weight: 700; letter-spacing: 1.4px;
    text-transform: uppercase; color: var(--sub); }
  .fmx-timebox-time { margin-top: 2px; font-family: var(--ff-display); font-size: 54px;
    font-weight: 200; letter-spacing: -0.04em; line-height: 1.1; font-variant-numeric: tabular-nums;
    color: var(--ink); text-shadow: 0 0 26px color-mix(in srgb, var(--block-color) 30%, transparent); }
  .fmx-timebox-sub { margin-top: 2px; font-size: 11px; color: var(--sub); }
  .fmx-timebox-items { margin: 14px 0 0; padding: 10px 2px 0; border-top: 1px solid var(--divider);
    display: grid; gap: 7px; }
  .fmx-timebox-items div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    font-size: 12px; color: var(--sub); }
  .fmx-timebox-items div span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fmx-timebox-items div b { font-weight: 600; font-variant-numeric: tabular-nums;
    color: color-mix(in srgb, var(--block-color) 70%, var(--ink)); }
  .fmx-timebox-close { display: block; width: 100%; margin-top: 16px; padding: 10px 0;
    border: 1px solid var(--border-subtle); border-radius: 14px; background: var(--surface-recess);
    color: var(--ink); font-size: 13px; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .fmx-mring .fl, .fmx-br-fill { transition: none; }
    .fmx-glass-backdrop, .fmx-timebox { transition: none; }
    .fmx-timebox { transform: none; }
    .fmx-clock, .fmx-clock:active { transition: none; transform: none; }
  }
</style>
