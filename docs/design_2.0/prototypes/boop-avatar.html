  body { margin:0; background:#F6F0E7; font-family: system-ui; color:#2B2118; }

  .row { display:flex; gap:22px; flex-wrap:wrap; padding:0 24px 24px; align-items:flex-end; }
  figure { margin:0; text-align:center; }
  figcaption { font-size:12px; color:#6B5B4B; margin-top:8px; }

  .mid { width:110px; height:110px; }
  .small { width:44px; height:44px; }
  .band { background:#FBF6EF; border-radius:22px; margin:0 24px 22px; padding:18px 20px;
          box-shadow: 0 17px 31px -17px rgba(43,33,24,.28), inset 0 1px 0 rgba(255,255,255,.7); }
  .band h2 { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#8A5E07; margin:0 0 14px; }
  /* Pislogás + lélegzet — a 8b-ben ugyanez a két mozdulat kerül a komponensbe. */
  .boop-lid { transform: scaleY(0); transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: no-preference) {
    .live .boop-lid { animation: boop-blink 5.4s infinite; }
    .live .boop-eye-r .boop-lid { animation-delay: .06s; }
    .live .boop-body { animation: boop-breathe 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
  }
  @keyframes boop-blink { 0%,92% { transform: scaleY(0); } 94% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }
  @keyframes boop-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.018); } }
