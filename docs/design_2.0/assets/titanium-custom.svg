<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<!-- Custom Titanium-recipe icons (üveg style bible §4, epic mezo-me75u). Every symbol here is
     drawn in the sprite's own recipe: 64×64 viewBox, a gradient-filled body, a pale 0.6–1px stroke
     in a tint of the fill, highlight strokes at .7–.85 opacity, wrapped in the tg-shadow filter.
     They reuse the tg-* gradients of titanium-icons.svg (this file is appended to it by
     scripts/gen-titanium-sprite.mjs) and only add a gradient when the palette lacks one.
     Each symbol is listed with the slice whose "Új ikonok" sheet the owner approved it on. -->
<!-- symbols -->
