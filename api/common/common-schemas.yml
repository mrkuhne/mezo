openapi: 3.0.3
info:
  title: ''
  version: ''
paths: {}
components:
  schemas:
    SystemMessage:
      type: object
      description: >
        Error contract returned by GlobalExceptionHandler (see error_handling.md).
        Every non-2xx response body is an array of SystemMessage.
      required:
        - code
        - type
      properties:
        level:
          type: string
          enum: [ERROR, WARNING, INFO]
        code:
          type: string
          description: Machine-readable error code resolved via messages.properties
          example: VALIDATION_REQUIRED_FIELD
        params:
          type: array
          items:
            type: string
        message:
          type: string
          description: Resolved human-readable message (English)
        fieldName:
          type: string
          description: Offending field for FIELD-type messages
        type:
          type: string
          enum: [REQUEST, FIELD]
        exceptionTraceId:
          type: string
          format: uuid
    SystemMessageList:
      type: array
      items:
        $ref: '#/components/schemas/SystemMessage'
    Hypnogram:
      type: object
      description: >
        Quantised sleep-stage sequence read off the tracker's stage graph (mezo-fk9a).
        One letter per bucket, chronological, starting at the row's bedtime:
        D=deep, L=light, R=REM, A=awake. DISPLAY-ONLY — never the source of a ratio
        statistic; every phase percentage comes from the exact per-phase minute totals.
      required: [bucketMin, stages]
      properties:
        bucketMin:
          type: integer
          minimum: 1
          description: Minutes per letter (15 today; stored so a finer resolution needs no migration)
        stages:
          type: string
          pattern: '^[DLRA]+$'
          maxLength: 200
          description: One letter per bucket, chronological from bedtime
