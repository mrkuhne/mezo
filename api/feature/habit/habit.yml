openapi: 3.0.3
info: { title: mezo habit fragment, version: 1.0.0 }
paths:
  /api/habit/day/{date}:
    get:
      tags: [Habit]
      operationId: getHabitDay
      summary: Day view of both routine chains; lazily creates + evaluates today's rows (Habits)
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The day's habits (rerolled concept does not exist here)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HabitDayResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/habit/{key}/check:
    post:
      tags: [Habit]
      operationId: checkHabit
      summary: Manually check a MANUAL habit for today (Habits)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HabitCheckRequest' }
      responses:
        '200':
          description: Checked; XP awarded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HabitWriteResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: HABIT_UNKNOWN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: HABIT_NOT_MANUAL | HABIT_NOT_TODAY | HABIT_ALREADY_DONE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    delete:
      tags: [Habit]
      operationId: uncheckHabit
      summary: Same-day un-check of a MANUAL habit; reverses the XP (Habits)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Un-checked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HabitResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: HABIT_UNKNOWN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: HABIT_NOT_MANUAL | HABIT_NOT_TODAY | HABIT_NOT_DONE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/habit/summary:
    get:
      tags: [Habit]
      operationId: getHabitSummary
      summary: 28-day strengths + 30-day perfect-day counters (Habits)
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HabitSummaryResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/habit/catalog:
    get:
      tags: [Habit]
      operationId: getHabitCatalog
      summary: Full catalog for the editor — chains with their defs, inactive included
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitCatalogResponse" }
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemMessageList" }
  /api/habit/chain:
    post:
      tags: [Habit]
      operationId: createHabitChain
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitChainCreateRequest" }
      responses:
        "200":
          description: The created chain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitChainAdmin" }
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemMessageList" }
  /api/habit/chain/{id}:
    patch:
      tags: [Habit]
      operationId: updateHabitChain
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitChainUpdateRequest" }
      responses:
        "200":
          description: The updated chain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitChainAdmin" }
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemMessageList" }
    delete:
      tags: [Habit]
      operationId: deleteHabitChain
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Soft-deleted }
        "401": { description: Missing/invalid token, content: { application/json: { schema: { $ref: "#/components/schemas/SystemMessageList" } } } }
  /api/habit/chain/{id}/order:
    put:
      tags: [Habit]
      operationId: reorderHabitChain
      summary: Full-order replacement of the chain's def positions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitReorderRequest" }
      responses:
        "200":
          description: The chain with defs in the new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitChainAdmin" }
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemMessageList" }
  /api/habit/def:
    post:
      tags: [Habit]
      operationId: createHabitDef
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitDefCreateRequest" }
      responses:
        "200":
          description: The created def
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitDefAdmin" }
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemMessageList" }
  /api/habit/def/{id}:
    patch:
      tags: [Habit]
      operationId: updateHabitDef
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitDefUpdateRequest" }
      responses:
        "200":
          description: The updated def
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitDefAdmin" }
        "401":
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemMessageList" }
    delete:
      tags: [Habit]
      operationId: deleteHabitDef
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Soft-deleted }
        "401": { description: Missing/invalid token, content: { application/json: { schema: { $ref: "#/components/schemas/SystemMessageList" } } } }
  /api/habit/ai/suggest:
    post:
      tags: [Habit]
      operationId: suggestHabits
      summary: Propose-only AI habit suggestions (smart model; the model never writes)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitSuggestRequest" }
      responses:
        "200":
          description: Suggestions (possibly empty when the model output was unusable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitSuggestResponse" }
        "401": { description: Missing/invalid token, content: { application/json: { schema: { $ref: "#/components/schemas/SystemMessageList" } } } }
        "503": { description: Suggester unavailable (switch off / companion off) }
components:
  schemas:
    HabitResponse:
      type: object
      required: [key, chain, position, title, why, anchorCopy, mode, status, xp]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        chain: { type: string, description: "Chain key (seed chains: MORNING / EVENING)" }
        position: { type: integer }
        title: { type: string }
        why: { type: string }
        anchorCopy: { type: string }
        mode: { type: string, enum: [DERIVED, MANUAL] }
        status: { type: string, enum: [pending, done, missed] }
        doneAt: { type: string, format: date-time, nullable: true }
        xp: { type: integer }
        strengthPct: { type: integer, nullable: true, description: 'trailing-28d done ratio, null under min-sample' }
        linkUrl: { type: string, nullable: true, description: 'optional external resource opened directly from the row (e.g. a routine video)' }
        hint: { type: string, nullable: true, description: "Server-computed explainer for a row that cannot tick right now (e.g. out-of-window wakeup)" }
    HabitDayResponse:
      type: object
      required: [date, habits, levelUps]
      properties:
        date: { type: string, format: date }
        habits:
          type: array
          items: { $ref: '#/components/schemas/HabitResponse' }
        levelUps:
          type: array
          items: { $ref: '#/components/schemas/LevelUpResult' }
    HabitWriteResponse:
      type: object
      required: [habit, levelUps]
      properties:
        habit: { $ref: '#/components/schemas/HabitResponse' }
        levelUps:
          type: array
          items: { $ref: '#/components/schemas/LevelUpResult' }
    HabitCheckRequest:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
    HabitStrength:
      type: object
      required: [key, done28, missed28]
      properties:
        key: { type: string }
        strengthPct: { type: integer, nullable: true }
        done28: { type: integer }
        missed28: { type: integer }
    HabitSummaryResponse:
      type: object
      required: [perfectMorningDays30, perfectEveningDays30, habits]
      properties:
        perfectMorningDays30: { type: integer }
        perfectEveningDays30: { type: integer }
        habits:
          type: array
          items: { $ref: '#/components/schemas/HabitStrength' }
    HabitChainAdmin:
      type: object
      required: [id, chainKey, title, daypart, position, isActive, defs]
      properties:
        id: { type: string, format: uuid }
        chainKey: { type: string }
        title: { type: string }
        daypart: { type: string, enum: [MORNING, DAY, EVENING] }
        position: { type: integer }
        isActive: { type: boolean }
        defs:
          type: array
          items: { $ref: "#/components/schemas/HabitDefAdmin" }
    HabitDefAdmin:
      type: object
      required: [id, habitKey, chainKey, position, title, mode, metric, skillKey, xp, isActive]
      properties:
        id: { type: string, format: uuid }
        habitKey: { type: string }
        chainKey: { type: string }
        position: { type: integer }
        title: { type: string }
        why: { type: string, nullable: true }
        anchorCopy: { type: string, nullable: true }
        mode: { type: string, enum: [DERIVED, MANUAL] }
        metric: { type: string }
        skillKey: { type: string }
        xp: { type: integer }
        linkUrl: { type: string, nullable: true }
        framework: { type: string, enum: [FOGG, CLEAR], nullable: true }
        anchorHabitKey: { type: string, nullable: true, maxLength: 40 }
        cue: { type: string, nullable: true, maxLength: 160 }
        craving: { type: string, nullable: true, maxLength: 200 }
        reward: { type: string, nullable: true, maxLength: 160 }
        celebration: { type: string, nullable: true, maxLength: 120 }
        identity: { type: string, nullable: true, maxLength: 120 }
        isActive: { type: boolean }
    HabitCatalogResponse:
      type: object
      required: [chains]
      properties:
        chains:
          type: array
          items: { $ref: "#/components/schemas/HabitChainAdmin" }
    HabitChainCreateRequest:
      type: object
      required: [title, daypart]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        daypart: { type: string, enum: [MORNING, DAY, EVENING] }
    HabitChainUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        daypart: { type: string, enum: [MORNING, DAY, EVENING] }
        position: { type: integer, minimum: 1 }
        isActive: { type: boolean }
    HabitDefCreateRequest:
      type: object
      required: [chainKey, title, mode, skillKey, xp]
      properties:
        chainKey: { type: string }
        title: { type: string, minLength: 1, maxLength: 80 }
        why: { type: string, nullable: true }
        anchorCopy: { type: string, nullable: true, maxLength: 120 }
        mode: { type: string, enum: [DERIVED, MANUAL] }
        metric: { type: string, description: "Required for DERIVED; ignored for MANUAL (forced to \"manual\")" }
        skillKey: { type: string }
        xp: { type: integer, minimum: 5, maximum: 15 }
        linkUrl: { type: string, nullable: true }
        framework: { type: string, enum: [FOGG, CLEAR], nullable: true }
        anchorHabitKey: { type: string, nullable: true, maxLength: 40 }
        cue: { type: string, nullable: true, maxLength: 160 }
        craving: { type: string, nullable: true, maxLength: 200 }
        reward: { type: string, nullable: true, maxLength: 160 }
        celebration: { type: string, nullable: true, maxLength: 120 }
        identity: { type: string, nullable: true, maxLength: 120 }
        position: { type: integer, minimum: 1, description: "Defaults to end of chain" }
    HabitDefUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        why: { type: string, nullable: true }
        anchorCopy: { type: string, nullable: true, maxLength: 120 }
        chainKey: { type: string }
        position: { type: integer, minimum: 1 }
        xp: { type: integer, minimum: 5, maximum: 15 }
        linkUrl: { type: string, nullable: true }
        framework: { type: string, enum: [FOGG, CLEAR], nullable: true }
        anchorHabitKey: { type: string, nullable: true, maxLength: 40 }
        cue: { type: string, nullable: true, maxLength: 160 }
        craving: { type: string, nullable: true, maxLength: 200 }
        reward: { type: string, nullable: true, maxLength: 160 }
        celebration: { type: string, nullable: true, maxLength: 120 }
        identity: { type: string, nullable: true, maxLength: 120 }
        isActive: { type: boolean }
    HabitReorderRequest:
      type: object
      required: [defIds]
      properties:
        defIds:
          type: array
          items: { type: string, format: uuid }
    HabitSuggestRequest:
      type: object
      properties:
        chainKey: { type: string, nullable: true, maxLength: 40, description: "Preselected chain to suggest for" }
        hint: { type: string, nullable: true, maxLength: 200, description: "Optional user intent (szándék)" }
    HabitSuggestion:
      type: object
      required: [title, why, anchorCopy, skillKey, xp, chainKey]
      properties:
        title: { type: string }
        why: { type: string }
        anchorCopy: { type: string }
        skillKey: { type: string }
        xp: { type: integer, minimum: 5, maximum: 15 }
        chainKey: { type: string }
        framework: { type: string, enum: [FOGG, CLEAR], nullable: true }
        cue: { type: string, nullable: true, maxLength: 160 }
        craving: { type: string, nullable: true, maxLength: 200 }
        reward: { type: string, nullable: true, maxLength: 160 }
        celebration: { type: string, nullable: true, maxLength: 120 }
    HabitSuggestResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/HabitSuggestion" }
