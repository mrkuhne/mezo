openapi: 3.0.3
info: { title: '', version: '' }
tags:
  - name: Character
    description: >-
      Karakter dossier (mezo-1gim) — the synthesized user profile: 7 CORE dimensions + 1 META
      (the companion's self-audit) + AI-opened chapters, confidence-carrying claims, expert observations, and persisted
      konzílium transcripts. Slice 1 ships reads over an honestly empty dossier.
paths:
  /api/character:
    get:
      tags: [Character]
      operationId: getCharacterOverview
      summary: The dossier overview — all dimensions with maturity, portrait and top claims (lazily seeds the 7 CORE dimensions on first read)
      responses:
        '200':
          description: The dossier (CORE dimensions always present; portraits may be empty — the honest pre-bootstrap state)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterOverviewResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/dimension/{key}:
    get:
      tags: [Character]
      operationId: getCharacterDimension
      summary: One dimension in full — portrait, ACTIVE claims with evidence refs, recent revisions
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The dimension
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterDimensionResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such dimension key for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/experts:
    get:
      tags: [Character]
      operationId: getCharacterExperts
      summary: The profiling team catalog — 7 domain experts + Szkeptikus + Mezo, in fixed display order (Csapat page; never 404 while the switch is on)
      responses:
        '200':
          description: The 9 personas, catalog order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterExpertsResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/feed:
    get:
      tags: [Character]
      operationId: getCharacterFeed
      summary: Recent expert observations + the latest conference outcome diff, merged chronologically (empty array = honest empty state)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 30, maximum: 100 }
      responses:
        '200':
          description: Feed items, newest first (possibly empty — never a 404; list-endpoint precedent)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CharacterFeedItem' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/bootstrap:
    post:
      tags: [Character]
      operationId: bootstrapCharacter
      summary: One-time deep read over the whole existing history that stands up the dossier
      responses:
        '200':
          description: The bootstrap konzílium that just ran
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterConferenceResponse' }
        '204':
          description: No history to read — nothing was generated (the honest empty state)
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: A bootstrap konzílium already exists for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/conference:
    get:
      tags: [Character]
      operationId: listCharacterConferences
      summary: Konzílium list (summaries only — transcripts load per id)
      responses:
        '200':
          description: Conference summaries, newest first (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CharacterConferenceSummary' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  '/api/character/claim/{claimId}/feedback':
    post:
      tags: [Character]
      operationId: submitCharacterClaimFeedback
      summary: Daniel's answer to one claim — talál / nem igaz / pontosítom (spec §7)
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterClaimFeedbackRequest' }
      responses:
        '200':
          description: The claim after the feedback was applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterClaimDto' }
        '400':
          description: PONTOSITOM without text, or text sent with a kind that takes none
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such claim for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: The claim is already retired — nothing to answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/runs:
    get:
      tags: [Character]
      operationId: getCharacterRuns
      summary: >-
        The run timeline over an inclusive day window (Gépterem — Karakter S9, mezo-1gim.14):
        one row per pipeline execution that actually ran, quiet nights included; a day with no
        row means the pipeline never ran for it (honest "nincs adat" — never fabricated)
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Run summaries, newest day first (possibly empty — never a 404)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CharacterRunSummary' }
        '400':
          description: to before from, or the span exceeds 62 days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/run/{runId}:
    get:
      tags: [Character]
      operationId: getCharacterRun
      summary: >-
        One run's full detail: its summary plus the observations it resolved from — by
        (owner, day) for a NIGHTLY row, by the conference it fed for a WEEKLY/MONTHLY/BOOTSTRAP row
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterRunResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such run for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/conference/{conferenceId}:
    get:
      tags: [Character]
      operationId: getCharacterConference
      summary: One konzílium with its full persisted transcript — the exchange as it actually ran, never re-dramatized
      parameters:
        - name: conferenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The conference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterConferenceResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such conference for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    CharacterClaimDto:
      type: object
      required: [id, text, confidence, sensitive, evidence]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        confidence: { type: number, description: "0–1; the FE renders human words, never the raw number (Minták precedent)" }
        sensitive: { type: boolean }
        proposedBy: { type: string, description: expert persona key }
        evidence:
          type: array
          items:
            type: object
            required: [kind, label]
            properties:
              kind: { type: string }
              id: { type: string, nullable: true }
              label: { type: string }
    CharacterClaimFeedbackRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [TALAL, NEM_IGAZ, PONTOSITOM] }
        text:
          type: string
          maxLength: 500
          description: Required for PONTOSITOM (the correction), forbidden otherwise
    CharacterDimensionSummary:
      type: object
      required: [key, title, kind, maturity, portrait, topClaims]
      properties:
        key: { type: string }
        title: { type: string }
        kind: { type: string, enum: [CORE, CHAPTER, META] }
        expertKey: { type: string, nullable: true }
        maturity: { type: integer, description: 0–100; 0 = "tanulom" }
        portrait: { type: string, description: empty string until the first conference writes it }
        topClaims:
          type: array
          items: { $ref: '#/components/schemas/CharacterClaimDto' }
    CharacterOverviewResponse:
      type: object
      required: [dimensions]
      properties:
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/CharacterDimensionSummary' }
    CharacterExpertDto:
      type: object
      required: [key, displayName, role, voiceLine, watch, kind]
      properties:
        key: { type: string }
        displayName: { type: string }
        role: { type: string }
        voiceLine: { type: string, description: "the persona's short voice/manner line (Csapat card)" }
        watch:
          type: array
          items: { type: string }
        dimensionKey: { type: string, nullable: true, description: "null for mezo; for szkeptikus the META dimension key (self-audit); the owned CORE key for experts" }
        kind: { type: string, enum: [EXPERT, SKEPTIC, CHAIR] }
    CharacterExpertsResponse:
      type: object
      required: [experts]
      properties:
        experts:
          type: array
          items: { $ref: '#/components/schemas/CharacterExpertDto' }
    CharacterPortraitRevisionDto:
      type: object
      required: [version, portrait, createdAt]
      properties:
        version: { type: integer }
        portrait: { type: string }
        createdAt: { type: string, format: date-time }
    CharacterDimensionResponse:
      type: object
      required: [key, title, kind, maturity, portrait, claims, revisions]
      properties:
        key: { type: string }
        title: { type: string }
        kind: { type: string, enum: [CORE, CHAPTER, META] }
        expertKey: { type: string, nullable: true }
        maturity: { type: integer }
        portrait: { type: string }
        claims:
          type: array
          items: { $ref: '#/components/schemas/CharacterClaimDto' }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/CharacterPortraitRevisionDto' }
    CharacterFeedItem:
      type: object
      required: [kind, at, text]
      properties:
        kind: { type: string, enum: [OBSERVATION, CONFERENCE_CHANGE] }
        at: { type: string, format: date-time }
        expertKey: { type: string, nullable: true, description: null for CONFERENCE_CHANGE items }
        dimensionKeys:
          type: array
          items: { type: string }
        text: { type: string }
    CharacterConferenceSummary:
      type: object
      required: [id, kind, generatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [BOOTSTRAP, WEEKLY, MONTHLY] }
        weekStart: { type: string, format: date, nullable: true }
        generatedAt: { type: string, format: date-time }
    ConferenceTurn:
      type: object
      required: [persona, text]
      properties:
        persona: { type: string }
        text: { type: string }
        refIds:
          type: array
          items: { type: string }
    CharacterConferenceResponse:
      type: object
      required: [id, kind, generatedAt, transcript, changes]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [BOOTSTRAP, WEEKLY, MONTHLY] }
        weekStart: { type: string, format: date, nullable: true }
        generatedAt: { type: string, format: date-time }
        transcript:
          type: array
          items: { $ref: '#/components/schemas/ConferenceTurn' }
        changes:
          type: array
          items:
            type: object
            required: [kind, summary]
            properties:
              kind: { type: string }
              dimensionKey: { type: string, nullable: true }
              summary: { type: string }
    CharacterRunSummary:
      type: object
      required: [id, kind, day, observationCount, callCount, detectorKeys, expertKeys]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [NIGHTLY, WEEKLY, MONTHLY, BOOTSTRAP] }
        day:
          type: string
          format: date
          description: >-
            The anchor day — the observed day for NIGHTLY, week_start for WEEKLY, the month's
            first day for MONTHLY, the run date for BOOTSTRAP
        observationCount: { type: integer }
        callCount:
          type: integer
          description: >-
            Honest only for NIGHTLY (one call per fired expert); always 0 for WEEKLY/MONTHLY/
            BOOTSTRAP rows — no reliable call count is derivable there, so the FE should omit or
            relabel this cell for non-NIGHTLY kinds. The AI-napló is the call-level truth.
        detectorKeys:
          type: array
          items: { type: string }
        expertKeys:
          type: array
          items: { type: string }
        conferenceId:
          type: string
          format: uuid
          nullable: true
          description: Soft ref to the conference this run produced — null for NIGHTLY
    CharacterRunObservationSignal:
      type: object
      required: [detectorKey, summary, refCount]
      properties:
        detectorKey: { type: string }
        summary: { type: string }
        refCount:
          type: integer
          description: >-
            Count of raw evidence refs the signal is grounded in ("N forrás-hivatkozás", v4.1) —
            the raw ref ids stay backend-side, never served to the client
    CharacterRunObservation:
      type: object
      required: [id, expertKey, dimensionKeys, text, salience, signals]
      properties:
        id: { type: string, format: uuid }
        expertKey: { type: string }
        dimensionKeys:
          type: array
          items: { type: string }
        text: { type: string }
        salience: { type: integer }
        signals:
          type: array
          items: { $ref: '#/components/schemas/CharacterRunObservationSignal' }
    CharacterRunResponse:
      type: object
      required: [summary, observations]
      properties:
        summary: { $ref: '#/components/schemas/CharacterRunSummary' }
        observations:
          type: array
          items: { $ref: '#/components/schemas/CharacterRunObservation' }
