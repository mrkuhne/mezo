openapi: 3.0.3
info: { title: '', version: '' }
tags:
  - name: Character
    description: >-
      Karakter dossier (mezo-1gim) — the synthesized user profile: 7 CORE dimensions + 1 META
      (the companion's self-audit) + AI-opened chapters, confidence-carrying claims, expert observations, and persisted
      konzílium transcripts. Slice 1 ships reads over an honestly empty dossier.
paths:
  /api/character:
    get:
      tags: [Character]
      operationId: getCharacterOverview
      summary: The dossier overview — all dimensions with maturity, portrait and top claims (lazily seeds the 7 CORE dimensions on first read)
      responses:
        '200':
          description: The dossier (CORE dimensions always present; portraits may be empty — the honest pre-bootstrap state)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterOverviewResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/dimension/{key}:
    get:
      tags: [Character]
      operationId: getCharacterDimension
      summary: One dimension in full — portrait, ACTIVE claims with evidence refs, recent revisions
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The dimension
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterDimensionResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such dimension key for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/experts:
    get:
      tags: [Character]
      operationId: getCharacterExperts
      summary: The profiling team catalog — 7 domain experts + Szkeptikus + Mezo, in fixed display order (Csapat page; never 404 while the switch is on)
      responses:
        '200':
          description: The 9 personas, catalog order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterExpertsResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/feed:
    get:
      tags: [Character]
      operationId: getCharacterFeed
      summary: Recent expert observations + the latest conference outcome diff, merged chronologically (empty array = honest empty state)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 30, maximum: 100 }
      responses:
        '200':
          description: Feed items, newest first (possibly empty — never a 404; list-endpoint precedent)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CharacterFeedItem' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/bootstrap:
    post:
      tags: [Character]
      operationId: bootstrapCharacter
      summary: One-time deep read over the whole existing history that stands up the dossier
      responses:
        '200':
          description: The bootstrap konzílium that just ran
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterConferenceResponse' }
        '204':
          description: No history to read — nothing was generated (the honest empty state)
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: A bootstrap konzílium already exists for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/conference:
    get:
      tags: [Character]
      operationId: listCharacterConferences
      summary: Konzílium list (summaries only — transcripts load per id)
      responses:
        '200':
          description: Conference summaries, newest first (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CharacterConferenceSummary' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  '/api/character/claim/{claimId}/feedback':
    post:
      tags: [Character]
      operationId: submitCharacterClaimFeedback
      summary: Daniel's answer to one claim — talál / nem igaz / pontosítom (spec §7)
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterClaimFeedbackRequest' }
      responses:
        '200':
          description: The claim after the feedback was applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterClaimDto' }
        '400':
          description: PONTOSITOM without text, or text sent with a kind that takes none
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such claim for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: The claim is already retired — nothing to answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/runs:
    get:
      tags: [Character]
      operationId: getCharacterRuns
      summary: >-
        The run timeline over an inclusive day window (Gépterem — Karakter S9, mezo-1gim.14):
        one row per pipeline execution that actually ran, quiet nights included; a day with no
        row means the pipeline never ran for it (honest "nincs adat" — never fabricated)
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Run summaries, newest day first (possibly empty — never a 404)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CharacterRunSummary' }
        '400':
          description: to before from, or the span exceeds 62 days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/edition:
    get:
      tags: [Character]
      operationId: getTeamEditions
      summary: >-
        The esti kiadás timeline over an inclusive day window (csapatfal H1, mezo-a9bo7.12):
        one row per day an edition was generated, each with its ranked posts — a day with no
        row means no edition was generated for it (honest "nincs adat" — never fabricated)
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Editions, newest day first (possibly empty — never a 404)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamEdition' }
        '400':
          description: to before from, or the span exceeds 62 days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/run/{runId}:
    get:
      tags: [Character]
      operationId: getCharacterRun
      summary: >-
        One run's full detail: its summary plus the observations it resolved from — by
        (owner, day) for a NIGHTLY row, by the conference it fed for a WEEKLY/MONTHLY/BOOTSTRAP row
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterRunResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such run for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/conference/{conferenceId}:
    get:
      tags: [Character]
      operationId: getCharacterConference
      summary: One konzílium with its full persisted transcript — the exchange as it actually ran, never re-dramatized
      parameters:
        - name: conferenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The conference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterConferenceResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such conference for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/replies:
    get:
      tags: [Character]
      operationId: listCharacterReplies
      summary: Owned contextual reply thread, oldest first
      parameters:
        - name: sourceType
          in: query
          required: true
          schema: { type: string, enum: [OBSERVATION, CLAIM, CONFERENCE_CHANGE, CONFERENCE_ITEM] }
        - name: sourceId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: sourceIndex
          in: query
          schema: { type: integer, minimum: 0, maximum: 9999, default: 0 }
      responses:
        '200':
          description: Durable replies including processing outcomes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CharacterReplyResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Unknown or foreign source or reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    post:
      tags: [Character]
      operationId: createCharacterReply
      summary: Save a reply before asynchronous evaluation; clientRequestId deduplicates retries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterReplyCreateRequest' }
      responses:
        '200':
          description: Saved or existing reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterReplyResponse' }
        '400':
          description: Invalid text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: Idempotency key reused for different content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Unknown or foreign source or reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/replies/{replyId}/retry:
    post:
      tags: [Character]
      operationId: retryCharacterReply
      summary: Retry failed or interrupted processing without duplicating the reply
      parameters:
        - name: replyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Same durable reply; completed replies remain unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterReplyResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Unknown or foreign source or reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/council:
    get:
      tags: [Character]
      operationId: getCharacterCouncilStatus
      summary: Latest owned daily preparation status, without starting model work
      responses:
        '200':
          description: Daily preparation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterCouncilStatusResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/claims/{claimId}/revisions:
    get:
      tags: [Character]
      operationId: getCharacterClaimRevisions
      summary: Actual audited changes of an owned claim, newest first
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CharacterClaimRevisionDto' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Missing or foreign claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/character/revisions/{revisionId}/undo:
    post:
      tags: [Character]
      operationId: undoCharacterClaimRevision
      summary: Compensate an owned change if the claim has not changed since; repeated undo is idempotent
      parameters:
        - { name: revisionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Compensated revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterClaimRevisionDto' }
        '409':
          description: Later claim change prevents safe compensation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Missing or foreign revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    CharacterCouncilStatusResponse:
      type: object
      required: [day, status]
      properties:
        day: { type: string, format: date }
        status: { type: string, enum: [WAITING, PROCESSING, COMPLETED, QUIET, FAILED] }
        completedAt: { type: string, format: date-time, nullable: true }
        conferenceId: { type: string, format: uuid, nullable: true }
        sourceThrough: { type: string, format: date, nullable: true }
    CharacterClaimRevisionDto:
      type: object
      required: [id, claimId, operation, afterText, createdAt, canUndo, reason]
      properties:
        id: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        operation: { type: string }
        beforeText: { type: string, nullable: true }
        afterText: { type: string }
        beforeConfidence: { type: number, nullable: true }
        afterConfidence: { type: number, nullable: true }
        beforeStatus: { type: string, nullable: true }
        afterStatus: { type: string, nullable: true }
        beforeDimensionKey: { type: string, nullable: true }
        afterDimensionKey: { type: string, nullable: true }
        beforeObservedFrom: { type: string, format: date, nullable: true }
        afterObservedFrom: { type: string, format: date, nullable: true }
        beforeObservedTo: { type: string, format: date, nullable: true }
        afterObservedTo: { type: string, format: date, nullable: true }
        beforeValidFrom: { type: string, format: date, nullable: true }
        afterValidFrom: { type: string, format: date, nullable: true }
        beforeValidTo: { type: string, format: date, nullable: true }
        afterValidTo: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
        undoneAt: { type: string, format: date-time, nullable: true }
        canUndo: { type: boolean }
        reason: { type: string }
    CharacterReplyCreateRequest:
      type: object
      required: [sourceType, sourceId, text, clientRequestId]
      properties:
        sourceType: { type: string, enum: [OBSERVATION, CLAIM, CONFERENCE_CHANGE, CONFERENCE_ITEM] }
        sourceId: { type: string, format: uuid }
        sourceIndex: { type: integer, minimum: 0, maximum: 9999, default: 0 }
        text: { type: string, minLength: 1, maxLength: 2000 }
        clientRequestId: { type: string, format: uuid }
    CharacterReplyResponse:
      type: object
      required: [id, sourceType, sourceId, sourceIndex, sourceText, text, createdAt, status, authorName]
      properties:
        sourceType: { type: string, enum: [OBSERVATION, CLAIM, CONFERENCE_CHANGE, CONFERENCE_ITEM] }
        sourceId: { type: string, format: uuid }
        sourceIndex: { type: integer, minimum: 0, maximum: 9999, default: 0 }
        id: { type: string, format: uuid }
        sourceText: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        authorName: { type: string }
        expertKey: { type: string, nullable: true }
        status: { type: string, enum: [SAVED, PROCESSING, FAILED, NEEDS_CLARIFICATION, COMPLETED] }
        outcome: { type: string, enum: [UPDATED, WITHDRAWN, UNCHANGED, NEEDS_CLARIFICATION], nullable: true }
        outcomeText: { type: string, nullable: true }
        discussion:
          type: array
          items: { $ref: '#/components/schemas/ConferencePeerReaction' }
    CharacterClaimDto:
      type: object
      required: [id, text, confidence, sensitive, evidence]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        confidence: { type: number, description: "0–1; the FE renders human words, never the raw number (Minták precedent)" }
        sensitive: { type: boolean }
        proposedBy: { type: string, description: expert persona key }
        evidence:
          type: array
          items:
            type: object
            required: [kind, label]
            properties:
              kind: { type: string }
              id: { type: string, nullable: true }
              label: { type: string }
    CharacterClaimFeedbackRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [TALAL, NEM_IGAZ, PONTOSITOM] }
        text:
          type: string
          maxLength: 500
          description: Required for PONTOSITOM (the correction), forbidden otherwise
    CharacterDimensionSummary:
      type: object
      required: [key, title, kind, maturity, portrait, topClaims]
      properties:
        key: { type: string }
        title: { type: string }
        kind: { type: string, enum: [CORE, CHAPTER, META] }
        expertKey: { type: string, nullable: true }
        maturity: { type: integer, description: 0–100; 0 = "tanulom" }
        portrait: { type: string, description: empty string until the first conference writes it }
        topClaims:
          type: array
          items: { $ref: '#/components/schemas/CharacterClaimDto' }
    CharacterOverviewResponse:
      type: object
      required: [dimensions]
      properties:
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/CharacterDimensionSummary' }
    CharacterExpertDto:
      type: object
      required: [key, displayName, role, voiceLine, watch, kind]
      properties:
        key: { type: string }
        displayName: { type: string }
        role: { type: string }
        voiceLine: { type: string, description: "the persona's short voice/manner line (Csapat card)" }
        watch:
          type: array
          items: { type: string }
        dimensionKey: { type: string, nullable: true, description: "null for mezo; for szkeptikus the META dimension key (self-audit); the owned CORE key for experts" }
        kind: { type: string, enum: [EXPERT, SKEPTIC, CHAIR] }
    CharacterExpertsResponse:
      type: object
      required: [experts]
      properties:
        experts:
          type: array
          items: { $ref: '#/components/schemas/CharacterExpertDto' }
    CharacterPortraitRevisionDto:
      type: object
      required: [version, portrait, createdAt]
      properties:
        version: { type: integer }
        portrait: { type: string }
        createdAt: { type: string, format: date-time }
    CharacterDimensionResponse:
      type: object
      required: [key, title, kind, maturity, portrait, claims, revisions]
      properties:
        key: { type: string }
        title: { type: string }
        kind: { type: string, enum: [CORE, CHAPTER, META] }
        expertKey: { type: string, nullable: true }
        maturity: { type: integer }
        portrait: { type: string }
        claims:
          type: array
          items: { $ref: '#/components/schemas/CharacterClaimDto' }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/CharacterPortraitRevisionDto' }
    CharacterFeedItem:
      type: object
      required: [kind, at, text]
      properties:
        evidence:
          type: array
          items:
            type: object
            required: [kind, label]
            properties:
              kind: { type: string }
              label: { type: string }
              refId: { type: string, nullable: true }
        sourceType: { type: string, enum: [OBSERVATION, CLAIM, CONFERENCE_CHANGE, CONFERENCE_ITEM] }
        sourceId: { type: string, format: uuid }
        sourceIndex: { type: integer, minimum: 0, maximum: 9999 }
        kind: { type: string, enum: [OBSERVATION, CONFERENCE_CHANGE, CONFERENCE_POST] }
        at: { type: string, format: date-time }
        expertKey: { type: string, nullable: true, description: null for CONFERENCE_CHANGE items }
        dimensionKeys:
          type: array
          items: { type: string }
        text: { type: string }
    ConferenceOutcomeCounts:
      description: >-
        What one konzílium changed in the dossier, counted from its stored outcome envelope.
        `other` exists so the surface never implies these three kinds are the whole truth — it
        counts every change kind that is not one of the named three.
      type: object
      required: [accepted, retired, portraitRewritten, other]
      properties:
        accepted: { type: integer, format: int32 }
        retired: { type: integer, format: int32 }
        portraitRewritten: { type: integer, format: int32 }
        other: { type: integer, format: int32 }
    CharacterConferenceSummary:
      type: object
      required: [id, kind, generatedAt, outcome]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [BOOTSTRAP, WEEKLY, MONTHLY, DAILY] }
        weekStart: { type: string, format: date, nullable: true }
        generatedAt: { type: string, format: date-time }
        outcome: { $ref: '#/components/schemas/ConferenceOutcomeCounts' }
    ConferenceTurn:
      type: object
      required: [persona, text]
      properties:
        persona: { type: string }
        text: { type: string }
        refIds:
          type: array
          items: { type: string }
    ConferencePeerReaction:
      type: object
      required: [expertKey, stance, argument]
      properties:
        expertKey: { type: string }
        stance: { type: string, enum: [SUPPORT, CHALLENGE, NUANCE] }
        argument: { type: string }
        round: { type: integer, nullable: true }
        replyToExpert: { type: string, nullable: true }
        participationReason: { type: string, nullable: true }
        toolNames:
          type: array
          items: { type: string }
    ConferenceSkepticVerdict:
      type: object
      required: [verdict, argument]
      properties:
        verdict: { type: string, enum: [KEEP, WEAKEN, KILL] }
        argument: { type: string }
        suggestedConfidence: { type: number, format: double, nullable: true }
    ConferenceChairRuling:
      type: object
      required: [accepted, reason]
      properties:
        accepted: { type: boolean }
        confidence: { type: number, format: double, nullable: true }
        reason: { type: string }
        dissent: { type: boolean, nullable: true }
        note:
          type: string
          nullable: true
          enum: [DUPLICATE, CONTRADICTS, NOT_FOR_DOSSIER, REHOME]
        suggestedDimensionKey: { type: string, nullable: true }
    ConferenceItem:
      type: object
      required: [index, expertKey, text, sensitive, reactions]
      properties:
        index: { type: integer }
        expertKey: { type: string }
        text: { type: string }
        kind: { type: string, nullable: true }
        claimId: { type: string, nullable: true }
        sensitive: { type: boolean }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/ConferencePeerReaction' }
        skeptic:
          allOf: [{ $ref: '#/components/schemas/ConferenceSkepticVerdict' }]
          nullable: true
        chair:
          allOf: [{ $ref: '#/components/schemas/ConferenceChairRuling' }]
          nullable: true
    ConferenceThread:
      type: object
      required: [title, items]
      properties:
        dimensionKey: { type: string, nullable: true }
        title: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ConferenceItem' }
    CharacterFollowup:
      type: object
      required: [id, sourceIndex, kind, expertKey, question, requiredEvidence, dueOn, status]
      properties:
        id: { type: string, format: uuid }
        sourceIndex: { type: integer }
        kind: { type: string, enum: [QUESTION, HYPOTHESIS] }
        expertKey: { type: string }
        question: { type: string }
        requiredEvidence: { type: string }
        dueOn: { type: string, format: date }
        status: { type: string, enum: [WAITING, REVISITED, CLOSED] }
        lastCheckedOn: { type: string, format: date, nullable: true }
        resolvedByConferenceId: { type: string, format: uuid, nullable: true }
    CharacterConferenceResponse:
      type: object
      required: [id, kind, generatedAt, transcript, changes]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [BOOTSTRAP, WEEKLY, MONTHLY, DAILY] }
        weekStart: { type: string, format: date, nullable: true }
        generatedAt: { type: string, format: date-time }
        transcript:
          type: array
          items: { $ref: '#/components/schemas/ConferenceTurn' }
        deliberation:
          description: >-
            The same meeting as a STRUCTURE — one thread per dossier chapter, each item carrying
            the chain that happened to it. Absent only when the row is neither stored structured
            nor derivable from its prose transcript; the client then renders `transcript`.
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ConferenceThread' }
        deliberationSource:
          description: >-
            Where `deliberation` came from. STORED — the row carries the structured envelope its
            own konzílium wrote. DERIVED — the row predates the column and the threads were read
            back out of the prose transcript, so rounds that did not exist yet (cross-talk) must
            be shown as absent, never as zero. Null when there is no deliberation at all.
          type: string
          enum: [STORED, DERIVED]
          nullable: true
        followups:
          type: array
          items: { $ref: '#/components/schemas/CharacterFollowup' }
        changes:
          type: array
          items:
            type: object
            required: [kind, summary]
            properties:
              claimId: { type: string, nullable: true }
              kind: { type: string }
              dimensionKey: { type: string, nullable: true }
              summary: { type: string }
    CharacterRunSummary:
      type: object
      required: [id, kind, day, observationCount, callCount, detectorKeys, expertKeys]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [NIGHTLY, WEEKLY, MONTHLY, BOOTSTRAP, EDITION] }
        day:
          type: string
          format: date
          description: >-
            The anchor day — the observed day for NIGHTLY, week_start for WEEKLY, the month's
            first day for MONTHLY, the run date for BOOTSTRAP
        status:
          type: string
          description: SUCCESS means verified completion; FAILED requires retry; UNKNOWN is an unverified historical run.
          pattern: '^(UNKNOWN|SUCCESS|FAILED)$'
        failureCount: { type: integer, minimum: 0 }
        observationCount: { type: integer }
        callCount:
          type: integer
          description: >-
            Honest only for NIGHTLY (one call per fired expert); always 0 for WEEKLY/MONTHLY/
            BOOTSTRAP rows — no reliable call count is derivable there, so the FE should omit or
            relabel this cell for non-NIGHTLY kinds. The AI-napló is the call-level truth.
        detectorKeys:
          type: array
          items: { type: string }
        expertKeys:
          type: array
          items: { type: string }
        conferenceId:
          type: string
          format: uuid
          nullable: true
          description: Soft ref to the conference this run produced — null for NIGHTLY
    CharacterRunObservationSignal:
      type: object
      required: [detectorKey, summary, refCount]
      properties:
        detectorKey: { type: string }
        summary: { type: string }
        refCount:
          type: integer
          description: >-
            Count of raw evidence refs the signal is grounded in ("N forrás-hivatkozás", v4.1) —
            the raw ref ids stay backend-side, never served to the client
    CharacterRunObservation:
      type: object
      required: [id, expertKey, dimensionKeys, text, salience, signals]
      properties:
        id: { type: string, format: uuid }
        expertKey: { type: string }
        dimensionKeys:
          type: array
          items: { type: string }
        text: { type: string }
        salience: { type: integer }
        signals:
          type: array
          items: { $ref: '#/components/schemas/CharacterRunObservationSignal' }
    CharacterRunResponse:
      type: object
      required: [summary, observations]
      properties:
        summary: { $ref: '#/components/schemas/CharacterRunSummary' }
        observations:
          type: array
          items: { $ref: '#/components/schemas/CharacterRunObservation' }
    TeamEdition:
      type: object
      required: [day, status, posts]
      properties:
        day: { type: string, format: date }
        status: { type: string, enum: [PUBLISHED, QUIET] }
        posts: { type: array, items: { $ref: '#/components/schemas/TeamEditionPost' } }
    TeamEditionPost:
      type: object
      required: [rank, characterKey, genre, sourceKind, sourceId, sourceRoute, body, voiced, guests]
      properties:
        rank: { type: integer, minimum: 1, maximum: 6 }
        characterKey: { type: string, enum: [szunya, mocor, falat, deru, mezo] }
        genre: { type: string, enum: [megfigyeles, sejtes, kerdes, kiserlet, elorejelzes, konzilium, keres, ertekeles] }
        sourceKind: { type: string, enum: [pattern, pair, prediction, experiment, konzilium] }
        sourceId: { type: string }
        sourceRoute: { type: string }
        title: { type: string, nullable: true }
        body: { type: string }
        voiced: { type: boolean }
        guests:
          type: array
          items:
            type: object
            required: [characterKey, body, voiced]
            properties:
              characterKey: { type: string, enum: [szunya, mocor, falat, deru, mezo, szkeptikus] }
              body: { type: string }
              voiced: { type: boolean }
