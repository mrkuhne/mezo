openapi: 3.0.3
info: { title: '', version: '' }
tags:
  - name: Medication
    description: Medication (Gyógyszer) — owned medication definition + a dose event-log; the 7-day cycle (cycleDay + phase) is derived from the logged doses. GET /api/medication feeds the whole Fuel "Gyógyszer" tab in one round-trip.
paths:
  /api/medication:
    post:
      tags: [Medication]
      operationId: createMedication
      summary: Create the owner's medication (the single-active slice's create path)
      description: >-
        The owner can have ONE active medication at a time — creating while an active one exists
        answers 400 with MEDICATION_ACTIVE_EXISTS. Re-creating after a stop (PUT active:false)
        is the normal path; the old row's dose history stays.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MedicationRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MedicationResponse' } } } }
        '400': { description: 'Validation error, or an active medication already exists', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    get:
      tags: [Medication]
      operationId: getMedicationDay
      summary: The owner's active medication — definition + cycle config, the derived cycle, and the recent doses
      description: >-
        Never 404s: having no active medication is a normal state, answered with 200 and an empty
        payload (`medication` and `cycle` null, `recentDoses` empty) (mezo-5cmq).
      responses:
        '200': { description: 'Medication day, or an empty payload when the owner has no active medication', content: { application/json: { schema: { $ref: '#/components/schemas/MedicationDayResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/medication/{id}:
    put:
      tags: [Medication]
      operationId: updateMedication
      summary: Edit an owned medication's definition and cycle config
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MedicationRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/MedicationResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/medication/{id}/dose:
    post:
      tags: [Medication]
      operationId: logDose
      summary: Log an actual injection against an owned medication
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MedicationDoseRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MedicationDoseResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/medication/{id}/dose/{doseId}:
    delete:
      tags: [Medication]
      operationId: deleteDose
      summary: Soft-delete a mis-entered dose
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: doseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    MedicationPhase:
      type: object
      required: [key, fromDay, toDay, label]
      properties:
        key: { type: string, enum: [peak, stable, trough] }
        fromDay: { type: integer }
        toDay: { type: integer }
        label: { type: string }
    MedicationCycleConfig:
      type: object
      required: [cycleLengthDays, phases]
      properties:
        cycleLengthDays: { type: integer }
        phases:
          type: array
          items: { $ref: '#/components/schemas/MedicationPhase' }
    MedicationCycleCell:
      type: object
      required: [day, phaseKey, label, current]
      properties:
        day: { type: integer }
        phaseKey: { type: string }
        label: { type: string }
        current: { type: boolean }
    MedicationCycleResponse:
      type: object
      required: [cycleDay, phaseKey, phaseLabel, week]
      properties:
        cycleDay: { type: integer }
        phaseKey: { type: string }
        phaseLabel: { type: string }
        lastDoseAt: { type: string, format: date-time, nullable: true }
        week:
          type: array
          items: { $ref: '#/components/schemas/MedicationCycleCell' }
    MedicationDoseResponse:
      type: object
      required: [id, administeredAt, dose]
      properties:
        id: { type: string, format: uuid }
        administeredAt: { type: string, format: date-time }
        dose: { type: number }
        note: { type: string, nullable: true }
    MedicationResponse:
      type: object
      required: [id, name, activeIngredient, route, cadence, defaultDose, doseUnit, cycle, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        activeIngredient: { type: string }
        route: { type: string }
        cadence: { type: string }
        defaultDose: { type: number }
        doseUnit: { type: string }
        cycle: { $ref: '#/components/schemas/MedicationCycleConfig' }
        active: { type: boolean }
    MedicationDayResponse:
      type: object
      # `medication`/`cycle` are NOT required: no active medication is a normal state answered with
      # 200 + an empty payload, never a 404 (mezo-5cmq). The nullable-next-to-allOf form is what the
      # generators honour (a bare `nullable` beside a `$ref` is dropped) — cf. `tdeeBootstrap`.
      required: [recentDoses]
      properties:
        medication:
          description: Null when the owner has no active medication — a normal state, not an error (mezo-5cmq).
          nullable: true
          allOf: [ { $ref: '#/components/schemas/MedicationResponse' } ]
        cycle:
          description: Null whenever `medication` is null — there is no cycle to derive.
          nullable: true
          allOf: [ { $ref: '#/components/schemas/MedicationCycleResponse' } ]
        recentDoses:
          type: array
          items: { $ref: '#/components/schemas/MedicationDoseResponse' }
    MedicationRequest:
      type: object
      required: [name, activeIngredient, route, cadence, defaultDose, doseUnit, cycle, active]
      properties:
        name: { type: string, minLength: 1 }
        activeIngredient: { type: string, minLength: 1 }
        route: { type: string, minLength: 1 }
        cadence: { type: string, minLength: 1 }
        defaultDose: { type: number, exclusiveMinimum: 0 }
        doseUnit: { type: string, minLength: 1 }
        cycle: { $ref: '#/components/schemas/MedicationCycleConfig' }
        active: { type: boolean }
    MedicationDoseRequest:
      type: object
      required: [dose]
      properties:
        administeredAt: { type: string, format: date-time, nullable: true }
        dose: { type: number, exclusiveMinimum: 0 }
        note: { type: string, nullable: true }
