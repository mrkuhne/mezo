          allOf:
            - $ref: '#/components/schemas/BlockSuggestionOutgoing'
        muscle:
          type: string
          nullable: true
          description: >-
            Coarse muscle group key (back, chest, quad, …) for add; superseded by `muscles` when that is non-empty.
