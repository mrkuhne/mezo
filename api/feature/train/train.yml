    SportSlotSkipResponse:
      type: object
      description: One dated occurrence of a recurring sport slot hidden by skip_sport_slot (mezo-d58h.5)
      required:
        - dayOfWeek
        - time
        - date
      properties:
        dayOfWeek:
          type: integer
          description: 0=Hét .. 6=Vas
        time:
          type: string
          description: "HH:mm"
        date:
          type: string
          format: date
    GymScheduleSlotResponse:
      type: object
      required:
        - id
        - dayOfWeek
        - time
      properties:
        id:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=Hét .. 6=Vas
        time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: "HH:mm"
    GymScheduleSlotInput:
      type: object
      required:
        - dayOfWeek
        - time
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0=Hét .. 6=Vas
        time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: "HH:mm"
    SportSessionResponse:
      type: object
      required:
        - id
        - sport
        - date
        - time
        - duration
        - rpe
      properties:
        id:
          type: string
          format: uuid
        sport:
          type: string
          description: >-
            Modality discriminator
            (volleyball|cross|trx|bike|swim|football|basketball|tennis|hike|other).
        date:
          type: string
          format: date
        time:
          type: string
          description: "HH:mm"
          example: '18:15'
        duration:
          type: integer
          description: 'minutes'
        setsPlayed:
          type: integer
          description: Sets played (volleyball; null for cross/TRX).
        rounds:
          type: integer
          description: Completed rounds (cross/TRX; null for volleyball).
        intensity:
          type: integer
        rpe:
          type: number
        shoulderStrain:
          type: integer
          description: Shoulder load 1–10 (volleyball; null for cross/TRX).
        jumpCount:
          type: integer
        notes:
          type: string
        kcal:
          type: integer
          nullable: true
          description: >-
            Energy burnt in kcal — the user's own value when they gave one, otherwise the backend's
            MET estimate. Null when the athlete's weight is unknown; never 0 as a stand-in.
        kcalIsEstimate:
          type: boolean
          nullable: true
          description: True when kcal is the backend's estimate, false when the user overrode it.
        levelUp:
          $ref: '#/components/schemas/LevelUpResult'
    RunSegment:
      type: object
      required: [type, durationSec]
      properties:
        type: { type: string, description: 'warmup|work|rest|cooldown' }
        durationSec: { type: integer }
        label: { type: string, nullable: true }
    RpeTarget:
      type: object
      required: [min, max]
      properties:
        min: { type: integer }
        max: { type: integer }
    RunPrescribedSession:
      type: object
      required: [key, dayOfWeek, label, kind, rpeTarget, segments]
      properties:
        key: { type: string }
        dayOfWeek: { type: integer, description: '0=Hét..6=Vas' }
        timeOfDay: { type: string, nullable: true, pattern: '^\d{2}:\d{2}$', example: '18:00', description: 'HH:mm, plan-level start time' }
        label: { type: string }
        kind: { type: string, description: 'sprint|pyramid|steady' }
        rpeTarget: { $ref: '#/components/schemas/RpeTarget' }
        rounds: { type: integer, nullable: true }
        segments:
          type: array
          items: { $ref: '#/components/schemas/RunSegment' }
    RunWeek:
      type: object
      required: [weekNumber, phaseLabel, sessions]
      properties:
        weekNumber: { type: integer }
        phaseLabel: { type: string }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/RunPrescribedSession' }
    RunningBlockStructureDto:
      type: object
      required: [weeks]
      properties:
        weeks:
          type: array
          items: { $ref: '#/components/schemas/RunWeek' }
    RunningBlockResponse:
      type: object
      required: [id, title, kind, status, startDate, endDate, weeks, currentWeek, structure]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        goal: { type: string, nullable: true }
        kind: { type: string }
        status: { type: string, enum: [planned, active, archived] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        weeks: { type: integer }
        currentWeek: { type: integer }
        summary: { type: string, nullable: true }
        structure: { $ref: '#/components/schemas/RunningBlockStructureDto' }
    RunningBlockUpsertRequest:
      type: object
      required: [title, kind, startDate, endDate, weeks, structure]
      properties:
        title: { type: string }
        goal: { type: string, nullable: true }
        kind: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        weeks: { type: integer }
        currentWeek: { type: integer, nullable: true }
        summary: { type: string, nullable: true }
        structure: { $ref: '#/components/schemas/RunningBlockStructureDto' }
    RunSessionLogResponse:
      type: object
      required: [id, blockId, weekNumber, sessionKey, date]
      properties:
        id: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        weekNumber: { type: integer }
        sessionKey: { type: string }
        date: { type: string, format: date }
        completedRounds: { type: integer, nullable: true }
        rpeActual: { type: integer, nullable: true }
        hrRecoverySec: { type: integer, nullable: true }
        sprintLandmark: { type: string, nullable: true }
        durationMin: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        kcal:
          type: integer
          nullable: true
          description: >-
            Energy burnt in kcal — the backend's MET estimate for the run; assumes ~9 km/h when
            the log carries no pace. Null when the athlete's weight is unknown; never 0 as a
            stand-in.
        kcalIsEstimate:
          type: boolean
          nullable: true
          description: Always true when kcal is present — the run wire has no override field.
        levelUp:
          $ref: '#/components/schemas/LevelUpResult'
    RunSessionLogRequest:
      type: object
      required: [blockId, weekNumber, sessionKey, date]
      properties:
        blockId: { type: string, format: uuid }
        weekNumber: { type: integer }
        sessionKey: { type: string }
        date: { type: string, format: date }
        completedRounds: { type: integer, nullable: true }
        rpeActual: { type: integer, nullable: true }
        hrRecoverySec: { type: integer, nullable: true }
        sprintLandmark: { type: string, nullable: true }
        durationMin: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
    TimingProfileResponse:
      type: object
      required: [leadInSeconds, setCycleCompoundSeconds, setCycleIsolationSeconds, transitionSeconds, samples]
      properties:
        leadInSeconds: { type: number, description: Session start to the first completed set. }
        setCycleCompoundSeconds: { type: number, description: Rest + execution for one compound set. }
        setCycleIsolationSeconds: { type: number, description: Rest + execution for one non-compound set. }
        transitionSeconds: { type: number, description: Interval spanning an exercise change. }
        samples:
          $ref: '#/components/schemas/TimingProfileSamples'
    TimingProfileSamples:
      type: object
      required: [leadIn, setCycleCompound, setCycleIsolation, transition]
      description: Accepted observations per component. 0 means the value is still the static seed.
      properties:
        leadIn: { type: integer }
        setCycleCompound: { type: integer }
        setCycleIsolation: { type: integer }
        transition: { type: integer }
