  /api/train/workouts/as-planned:
    post:
      tags: [Train]
      operationId: completeWorkoutAsPlanned
      summary: Book a past template day as completed with the plan's prescribed sets (Boop catch-up, mezo-r36n9.161)
      description: >-
        The gym catch-up: the owner missed a template day and books it afterwards. One completed instance dated
        `date`, started at `startedAt`, with the prescribed working sets (as of today) marked done at that instant;
        an override replaces the weight of every set of that exercise; an exercise with neither a prescription nor an
        override is skipped, never booked at zero. No derived timing. Idempotent on `clientRef`. `date` must be within
        today−7 … today (owner zone); `startedAt` at most 5 minutes ahead of now. Spec
        docs/superpowers/specs/2026-11-24-boop-visszamenoleg-ital-design.md §3.6, §7.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutAsPlannedRequest'
      responses:
        '201':
          description: The completed instance (or the one an earlier call with the same clientRef created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutInstanceResponse'
        '400':
          description: Validation error (date outside the window — TRAIN_AS_PLANNED_DATE_OUT_OF_WINDOW —, startedAt ahead of now)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Template day not found or not owned
          content:
