        startedAt:
          type: string
          format: date-time
          description: Wall-clock start of the instance. Absent on rows created before mezo-1jm8.
        finishedAt:
          type: string
          format: date-time
          description: >
            Wall-clock finish. ABSENT on an auto-closed (abandoned) session even though its status
            is 'completed' — that pair is exactly "the timing here is not trustworthy".
        activeSeconds:
          type: integer
          description: >
            Derived work time: consecutive set-completion intervals, each clipped at the gap cap.
            Absent when nothing was logged.
    WorkoutSummaryResponse:
      type: object
      required: [id, date, status, origin, title]
      properties:
        id:
          type: string
          format: uuid
        templateSessionId:
          type: string
          format: uuid
          description: The instance's template day — maps "template day → completed instance this week" (cross-day start, mezo-p7rp)
        date:
          type: string
          format: date
        status:
          type: string
          enum: [planned, active, completed, skipped]
        origin:
          type: string
          enum: [meso, custom]
