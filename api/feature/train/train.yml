      properties:
        skillKey: { type: string }
        perkKey: { type: string }
        name: { type: string }
        effectCopy: { type: string }
        milestoneLevel: { type: integer }
    LevelUpRobustness:
      type: object
      required: [xpGained, streakWeeks]
      properties:
        xpGained: { type: integer, format: int64 }
        streakWeeks: { type: integer }
    ExerciseSetResponse:
      type: object
      required:
        - id
        - exerciseId
        - setIndex
      properties:
        technique:
          allOf:
            - $ref: '#/components/schemas/Technique'
          nullable: true
        legs:
          type: array
          items:
            $ref: '#/components/schemas/SetLeg'
        id:
          type: string
          format: uuid
        exerciseId:
          type: string
          format: uuid
        setIndex:
          type: integer
        weightKg:
          type: number
        reps:
          type: integer
        rir:
          type: integer
        side:
          type: string
          description: L|B|R
        note:
          type: string
        skipped:
          type: boolean
          default: false
          description: true for a whole-exercise skip marker row (no perf data)
        kind:
          type: string
          enum: [warmup, working]
        medals:
          type: array
          items:
            $ref: '#/components/schemas/Medal'
          description: Medals this set earned (empty when none)
        doneAt:
          type: string
          format: date-time
          description: When the set was completed. Already persisted since mezo-n5q; exposed by mezo-1jm8.
    WorkoutAsPlannedRequest:
      type: object
      required: [templateSessionId, date, startedAt, clientRef]
      properties:
        templateSessionId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: The day the workout is booked on — today−7 … today in the owner zone
        startedAt:
          type: string
          format: date-time
          description: When it started; the sets are marked done at this instant, finishedAt equals it
        clientRef:
          type: string
          format: uuid
          description: Idempotency key (unique per owner); a retry returns the instance the first call created
        overrides:
          type: array
          description: One weight per exercise, replacing the prescription's for every set of that exercise
          items:
            $ref: '#/components/schemas/WorkoutAsPlannedOverride'
    WorkoutAsPlannedOverride:
      type: object
      required: [exerciseId, weightKg]
      properties:
        exerciseId:
          type: string
          format: uuid
        weightKg:
          type: number
