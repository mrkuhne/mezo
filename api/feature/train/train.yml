components:
  schemas:
    MesocycleResponse:
      type: object
      required:
        - id
        - title
        - shortTitle
        - status
        - startDate
        - endDate
        - weeks
        - currentWeek
        - split
        - style
        - phaseCurve
        - hasReport
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
          nullable: true
          description: The originating template this run was started from (null for legacy/direct runs)
        title:
          type: string
        shortTitle:
          type: string
        status:
          type: string
          enum: [active, planned, archived]
        goal:
          type: string
        goalPreset:
          type: string
          nullable: true
          description: Machine key of the wizard's goal choice (hypertrophy/strength/cut-prep/recovery/sport/erohipertrofia); null for legacy/edited goals (mezo-dq60)
        musclePriorities:
          type: object
          nullable: true
          description: Sparse per-coarse-muscle priority tier map (emphasize/maintain; absent key = grow); null/empty = all grow (mezo-3m5m)
          additionalProperties:
            type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: When this run was closed (archived); null while active/planned
        hasReport:
          type: boolean
          default: false
