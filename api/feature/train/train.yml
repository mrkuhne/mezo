          allOf:
            - $ref: '#/components/schemas/WorkoutInstanceResponse'
          description: >-
            Today's most recent COMPLETED instance of today's template day (null when none) —
            drives the Mai hero "Kész + Megnézem" state and the session-route review redirect.
        weekDoneDates:
          type: array
          description: >-
            ISO dates within the current Mon–Sun week that have a COMPLETED gym
            workout instance (explicit finish). Drives the Mai gym done-state
            (today) and the weekly-row done chips (past days). Present even on
            rest days and when today is not a gym day.
          items:
            type: string
            format: date
        overloadSummary:
          allOf:
            - $ref: '#/components/schemas/OverloadSummary'
          nullable: true
          description: Day-level overload summary; null when hypertrophy-drive is off.
    TodayExercise:
      type: object
      required:
        - id
        - name
        - muscle
        - warmupSets
        - workingSets
        - repMin
        - repMax
        - targetRIR
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        muscle:
          type: string
        warmupSets:
          type: integer
        workingSets:
          type: integer
        repMin:
          type: integer
        repMax:
          type: integer
        targetRIR:
          type: integer
        anchorWeightKg:
          type: number
          nullable: true
        type:
          type: string
          enum: [compound, isolation, plyo]
        warning:
          type: string
        videoUrl:
          type: string
          nullable: true
          description: Effective YouTube demo URL resolved from the linked catalog row (null when none)
        imageStartUrl:
          type: string
          nullable: true
          description: Demo still (start position) resolved from the linked catalog row (null when none)
        imageEndUrl:
          type: string
          nullable: true
          description: Demo still (end position); alternated with imageStartUrl to convey the movement
        note:
          type: string
          maxLength: 500
          nullable: true
          description: durable per-exercise note
        lastWeek:
          $ref: '#/components/schemas/LastWeekRef'
        prescribedSets:
          type: array
          nullable: true
          description: >-
            Per-set targets computed by the Hypertrophy Drive engine; null when the
            mezo.feature.hypertrophy-drive switch is off.
          items:
            $ref: '#/components/schemas/PrescribedSet'
        rationale:
          type: string
          nullable: true
          description: Short HU explanation of the recommendation (e.g. "Múlt hét 8 × 77.5 kg → +2.5 kg")
        progression:
          allOf:
            - $ref: '#/components/schemas/ProgressionSignal'
          nullable: true
          description: RIR-aware overload recommendation; null on first session / switch off.
    PrescribedSet:
      type: object
      required:
        - kind
        - targetReps
      properties:
        kind:
          type: string
          enum: [warmup, working]
        targetWeightKg:
          type: number
          nullable: true
        targetReps:
          type: integer
        targetRIR:
          type: integer
          nullable: true
    ProgressionSignal:
      type: object
      description: >-
        Per-exercise progressive-overload recommendation for TODAY vs the last completed
        session. Null when there is no meaningful progression (first session / no history) —
        the FE then shows the start-weight pill instead of the banner.
      required:
        - lever
        - targetReps
        - rationale
      properties:
        lever:
          type: string
          enum: [weight, rep, hold, deload]
          description: Which lever moved — weight up/down, rep build, hold/consolidate, or deload back-off.
        deltaKg:
          type: number
          nullable: true
          description: Signed kg change vs last week (+ up, − deload/back-off); null on rep/hold.
        deltaReps:
          type: integer
          nullable: true
          description: Rep-target change vs last week (e.g. +1); null on weight/hold/deload.
        targetWeightKg:
          type: number
          nullable: true
        targetReps:
          type: integer
        rationale:
          type: string
          description: Short HU explanation (e.g. "Múlt hét könnyen ment (RIR 3) → +1 rep").
    OverloadSummary:
      type: object
      description: Day-level count of how many exercises move via each lever (PrepHero chip).
      required: [weightUp, repUp, hold]
      properties:
        weightUp:
          type: integer
        repUp:
          type: integer
        hold:
          type: integer
    LastWeekRef:
      type: object
      description: Top set of the previous completed instance of the same template day
      required:
        - weightKg
        - reps
        - rir
      properties:
        weightKg:
          type: number
        reps:
          type: integer
        rir:
          type: integer
    WorkoutInstanceResponse:
      type: object
      required:
        - id
        - templateSessionId
        - date
        - status
        - sets
      properties:
        id:
          type: string
          format: uuid
        templateSessionId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        status:
          type: string
          enum: [active, completed]
        sets:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseSetResponse'
        levelUp:
          $ref: '#/components/schemas/LevelUpResult'
