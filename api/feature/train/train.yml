          description: Per-exercise style; null = inherit the block style.
        effectiveTrainingStyle:
          allOf:
            - $ref: '#/components/schemas/TrainingStyle'
          nullable: true
          readOnly: true
          description: The style in force for this exercise (own style, else the block's); null = unstyled.
        restSec:
          type: integer
          minimum: 30
          maximum: 600
          nullable: true
          description: Rest between sets in seconds; null = derived from the style.
        overrides:
          type: array
          description: Style-prescription fields the user has taken over by hand.
          items:
            $ref: '#/components/schemas/StyleOverride'
    PrescribedSet:
      type: object
      required:
        - kind
        - targetReps
      properties:
        technique:
          allOf:
            - $ref: '#/components/schemas/Technique'
          nullable: true
        topHoldSec:
          type: integer
          minimum: 2
          maximum: 2
          description: Seconds to hold the top of every rep on a top_pause set; absent otherwise.
        legs:
          type: array
          items:
            $ref: '#/components/schemas/PrescribedLeg'
        kind:
          type: string
          enum: [warmup, working]
        targetWeightKg:
          type: number
          nullable: true
        targetReps:
          type: integer
        targetRIR:
          type: integer
          nullable: true
        restSec:
          type: integer
          nullable: true
          description: Rest after this set in seconds; set only on styled blocks.
    Technique:
      type: string
      enum: [none, rest_drop, drop, myo, partials, rest_pause, top_pause]
      description: Intensity technique applied to the last working set of an exercise.
    SkippedTechnique:
      type: object
      required: [challenge, reason]
      properties:
        technique:
          allOf:
            - $ref: '#/components/schemas/Technique'
          nullable: true
          description: The planned technique left out today; null when only the challenge was left out.
        challenge:
          type: boolean
          description: The planned challenge was left out today.
        reason:
          type: string
          enum: [DELOAD, GENTLE, SPORT]
          description: >-
            DELOAD — the mesocycle's deload week; GENTLE — a comeback or readiness-lightened day; SPORT — a sport
            day loading the same muscles.
    TechniqueSource:
      type: string
      enum: [owner, planner, ai]
      description: Who set the technique (planner/ai reserved for later slices).
    SetLegKind:
      type: string
      enum: [drop, mini, partials]
      description: Kind of a technique leg hanging off a parent set.
    PrescribedLeg:
      type: object
      required: [kind, toFailure, restBeforeSec]
      properties:
        kind:
          $ref: '#/components/schemas/SetLegKind'
        weightKg:
          type: number
          nullable: true
        reps:
          type: integer
          nullable: true
        minReps:
          type: integer
          nullable: true
          description: Myo mini-sets stop when a set falls below this.
        toFailure:
          type: boolean
        restBeforeSec:
          type: integer
        dropPercent:
          type: integer
          nullable: true
          description: Drop leg load as percent of the parent weight actually lifted.
        challenge:
          type: boolean
          nullable: true
          description: true on the day challenge's half-rep (partials) leg — the reps compared with challengeBest; it follows the technique's own legs when the exercise carries both (mezo-r36n9.98). null otherwise.
    SetLeg:
      type: object
      required: [legIndex, kind]
      properties:
        legIndex:
          type: integer
        kind:
          $ref: '#/components/schemas/SetLegKind'
        weightKg:
          type: number
          nullable: true
        reps:
          type: integer
          nullable: true
        restSec:
          type: integer
          nullable: true
    SetLegInput:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/SetLegKind'
        weightKg:
          type: number
          minimum: 0
          maximum: 999
          nullable: true
        reps:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        restSec:
          type: integer
          minimum: 0
          maximum: 600
          nullable: true
    PartialsBestEntry:
      type: object
      required: [weightKg, reps]
      properties:
        weightKg:
          type: number
        reps:
          type: integer
    ExerciseTechniqueUpdateRequest:
      type: object
      required: [technique, challenge]
      properties:
        technique:
          $ref: '#/components/schemas/Technique'
        challenge:
          type: boolean
    TrainingStyle:
      type: string
      enum: [balanced, volume, heavy, allout]
      description: Block-level training style (volume/intensity profile).
    Equipment:
      type: string
      enum: [machine, cable, dumbbell, barbell, bodyweight, kettlebell, other]
      description: Catalog equipment class. Absent on create = other.
    Stability:
      type: string
      enum: [stable, free]
      description: Catalog stability class. Absent on create = free.
    StyleOverride:
      type: string
      enum: [repRange, workingSets, targetRir, restSec]
      description: A style-prescribed field the user has overridden.
    ProgressionSignal:
      type: object
      description: >-
        Per-exercise progressive-overload recommendation for TODAY vs the last completed
        session. Null when there is no meaningful progression (first session / no history) —
        the FE then shows the start-weight pill instead of the banner.
      required:
        - lever
        - targetReps
        - rationale
      properties:
        lever:
          type: string
          enum: [weight, rep, hold, deload]
          description: Which lever moved — weight up/down, rep build, hold/consolidate, or deload back-off.
        deltaKg:
          type: number
          nullable: true
          description: Signed kg change vs last week (+ up, − deload/back-off); null on rep/hold.
        deltaReps:
          type: integer
          nullable: true
          description: Rep-target change vs last week (e.g. +1); null on weight/hold/deload.
        targetWeightKg:
          type: number
          nullable: true
        targetReps:
          type: integer
        rationale:
          type: string
          description: Short HU explanation (e.g. "Múlt hét könnyen ment (RIR 3) → +1 rep").
    OverloadSummary:
      type: object
      description: >-
        Day-level count of how many exercises move via each lever (PrepHero chip).
        weightUp counts load INCREASES only; a load reduction (grind back-off) counts in
        weightDown and must never be presented as progressive overload.
      required: [weightUp, weightDown, repUp, hold]
      properties:
        weightUp:
          type: integer
        weightDown:
          type: integer
        repUp:
          type: integer
        hold:
          type: integer
    LastWeekRef:
      type: object
      description: Top set of the previous completed instance of the same template day
      required:
        - weightKg
        - reps
        - rir
      properties:
        weightKg:
          type: number
        reps:
          type: integer
        rir:
          type: integer
    WorkoutInstanceResponse:
      type: object
      required:
        - id
        - templateSessionId
        - date
        - status
        - sets
      properties:
        id:
          type: string
          format: uuid
        templateSessionId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        status:
          type: string
          enum: [active, completed]
        sets:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseSetResponse'
        levelUp:
          $ref: '#/components/schemas/LevelUpResult'
        medals:
          type: array
          items:
            $ref: '#/components/schemas/Medal'
          description: Medals earned across the session, including SESSION_VOLUME
        startedAt:
          type: string
          format: date-time
          description: Wall-clock start of the instance. Absent on rows created before mezo-1jm8.
        finishedAt:
          type: string
          format: date-time
          description: >
            Wall-clock finish. ABSENT on an auto-closed (abandoned) session even though its status
            is 'completed' — that pair is exactly "the timing here is not trustworthy".
        activeSeconds:
          type: integer
          description: >
            Derived work time: consecutive set-completion intervals, each clipped at the gap cap.
            Absent when nothing was logged.
        energy:
          allOf:
            - $ref: '#/components/schemas/WorkoutEnergy'
          nullable: true
          description: >
            The session's energy (mezo-r36n9.170), filled only on a COMPLETED instance and only on
            today's completedWorkout and the finish response. The watch's figure when a Health
            strength workout matches the session and carries kcal, else the server's net estimate
            (the same gym model the day's food budget uses). Null when neither is known (no body
            data yet, no timing).
    WorkoutEnergy:
      type: object
      required: [kcal, source]
      properties:
        kcal:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [estimate, watch]
          description: "'estimate' = the server's net estimate from the work time; 'watch' = the matched Health workout's kcal."
    WorkoutSummaryResponse:
      type: object
      required: [id, date, status, origin, title]
      properties:
        id:
          type: string
          format: uuid
        templateSessionId:
          type: string
          format: uuid
          description: The instance's template day — maps "template day → completed instance this week" (cross-day start, mezo-p7rp)
        date:
          type: string
          format: date
        status:
          type: string
          enum: [planned, active, completed, skipped]
        origin:
          type: string
          enum: [meso, custom]
          description: Mesocycle-plan instance vs custom (saját) workout instance (mezo-ws2x)
        title:
          type: string
          description: The workout title — the template day's title / the custom workout's name
    WorkoutDetailResponse:
      type: object
      required: [id, templateSessionId, date, status, title, dayLabel, exercises]
      properties:
        id: { type: string, format: uuid }
        templateSessionId: { type: string, format: uuid }
        date: { type: string, format: date }
        status: { type: string, enum: [active, completed, skipped] }
        title: { type: string, description: "The day type, e.g. 'Pull Day'" }
        dayLabel: { type: string, description: "'Hét'..'Vas'" }
        durationEst: { type: integer }
        note:
          type: string
          nullable: true
          description: >
            The workout-level closing note, absent when none was written (mezo-d20.8.2.2).
        startedAt:
          type: string
          format: date-time
          description: Wall-clock start of the instance. Absent on rows created before mezo-1jm8.
        finishedAt:
          type: string
          format: date-time
          description: >
            Wall-clock finish. ABSENT on an auto-closed (abandoned) session even though its status
            is 'completed' — that pair is exactly "the timing here is not trustworthy".
        activeSeconds:
          type: integer
          description: >
            Derived work time: consecutive set-completion intervals, each clipped at the gap cap.
            Absent when nothing was logged.
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutDetailExercise'
    WorkoutDetailExercise:
      type: object
      required: [exerciseId, name, muscle, type, warmupSets, workingSets, repMin, repMax, targetRIR, skipped, sets]
      properties:
        exerciseId: { type: string, format: uuid }
        name: { type: string }
        muscle: { type: string }
        type: { type: string, enum: [compound, isolation, plyo] }
        warmupSets: { type: integer }
        workingSets: { type: integer }
        repMin: { type: integer }
        repMax: { type: integer }
        targetRIR: { type: integer }
        skipped: { type: boolean, description: A skip-marker set exists for this exercise in this instance }
        sets:
          type: array
          description: Non-skipped logged sets, setIndex ascending
          items:
            $ref: '#/components/schemas/ExerciseSetResponse'
    LevelUpResult:
      type: object
      required: [source, totalXp, gains, levelUps, perks, robustness]
      properties:
        source: { type: string, enum: [GYM, SPORT, RUN, QUEST, ACTIVITY, HABIT] }
        workoutLabel: { type: string }
        durationMin: { type: integer }
        rpe: { type: integer }
        totalXp: { type: integer, format: int64 }
        gains:
          type: array
          items: { $ref: '#/components/schemas/LevelUpGain' }
        levelUps:
          type: array
          items: { type: string }
        perks:
          type: array
          items: { $ref: '#/components/schemas/LevelUpPerk' }
        robustness: { $ref: '#/components/schemas/LevelUpRobustness' }
    LevelUpGain:
      type: object
      required: [skillKey, kind, name, xpGained, levelBefore, levelAfter, progressFromPct, progressToPct]
      properties:
        skillKey: { type: string }
        kind: { type: string, enum: [ATHLETIC, MUSCLE, LIFE] }
        name: { type: string }
        icon: { type: string }
        xpGained: { type: integer, format: int64 }
        levelBefore: { type: integer }
        levelAfter: { type: integer }
        progressFromPct: { type: number }
        progressToPct: { type: number }
    LevelUpPerk:
      type: object
