        prescription:
          nullable: true
          description: >-
            The block style's prescription for this exercise (block day editor only, mezo-r36n9.116); null on an
            unstyled block, for a row the style never stamps (plyo), and always on the workout swap read
          allOf:
            - $ref: '#/components/schemas/SuggestionPrescription'
    SuggestionPrescription:
      type: object
