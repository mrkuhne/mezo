          type: string
          enum: [compound, isolation, plyo]
        stim:
          type: number
          minimum: 0
          maximum: 1
        fatigue:
          type: number
          minimum: 0
          maximum: 1
        videoUrl:
          type: string
          nullable: true
          pattern: '^https?://((www\.|m\.)?(youtube(-nocookie)?\.com/(watch\?v=|shorts/|embed/|live/)|youtu\.be/)[A-Za-z0-9_-]{11}([&?/#].*)?|(www\.|m\.)?instagram\.com/([A-Za-z0-9_.]+/)?(reels?|p|tv)/[A-Za-z0-9_-]{5,}/?([?#].*)?)$'
