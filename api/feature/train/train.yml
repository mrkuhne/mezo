          minLength: 1
        muscle:
          type: string
          enum: [chest-upper, chest-mid, chest-lower, back-wide, back-mid, back-lower, traps, shoulder-front, shoulder-side, shoulder-rear, biceps-long, biceps-short, biceps-brachialis, triceps-long, triceps-lateral, triceps-medial, quad, ham, glute, calf, core]
