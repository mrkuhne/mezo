      properties:
        templateSessionId:
          type: string
          format: uuid
    SetLogRequest:
      type: object
      required:
        - exerciseId
        - setIndex
        - weightKg
        - reps
      properties:
        technique:
          allOf:
            - $ref: '#/components/schemas/Technique'
          nullable: true
        legs:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/SetLegInput'
        exerciseId:
          type: string
          format: uuid
        setIndex:
          type: integer
          minimum: 0
          maximum: 49
        weightKg:
          type: number
          minimum: 0
          maximum: 999
        reps:
          type: integer
          minimum: 1
          maximum: 100
        rir:
          type: integer
          minimum: 0
          maximum: 5
          nullable: true
          description: Omitted for warmup sets — effort tracking applies to working sets only
        side:
          type: string
          pattern: '^[LBR]$'
        note:
          type: string
          maxLength: 500
        kind:
          type: string
          pattern: '^(warmup|working)$'
          description: warmup|working — defaults to working server-side when omitted
        targetWeightKg:
          type: number
          minimum: 0
          maximum: 999
          nullable: true
          description: The Progresszió-prescribed load for this set, snapshotted at log time
        targetReps:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: The Progresszió-prescribed reps for this set, snapshotted at log time
        prescribedWeightKg:
          type: number
          minimum: 0
          maximum: 999
          nullable: true
          description: >-
            The engine's ORIGINAL working weight for this slot, before any on-card weight swap
            (targetWeightKg carries the swap-adjusted target since mezo-l95v4). A logged weight
            near it but different teaches the per-machine weight memory that the prescribed
            weight is missing on this exercise (mezo-bk7l2).
    SetUpdateRequest:
      type: object
      description: >-
        Full replacement of one logged set's performance fields (mezo-l3on). Deliberately NOT a
        partial patch — an absent optional field CLEARS it, which avoids the JSON null vs. missing
        tri-state. setIndex, kind, exerciseId and the target* prescription snapshot are immutable.
      required:
        - weightKg
        - reps
      properties:
        legs:
          type: array
          maxItems: 6
          nullable: true
          description: Absent = legs untouched; [] = clear; list = replace.
          items:
            $ref: '#/components/schemas/SetLegInput'
        weightKg:
          type: number
          minimum: 0
          maximum: 999
        reps:
          type: integer
          minimum: 1
          maximum: 100
        rir:
          type: integer
          minimum: 0
          maximum: 5
          nullable: true
          description: Ignored (forced null) on a warmup set — effort tracking is working-set-only
        side:
          type: string
          pattern: '^[LBR]$'
        note:
          type: string
          maxLength: 500
    WorkoutExerciseChangeRequest:
