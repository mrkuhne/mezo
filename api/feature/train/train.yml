      properties:
        workingSets:
          type: integer
        repMin:
          type: integer
        repMax:
          type: integer
        targetRIR:
          type: integer
          description: Reps in reserve (tartalék)
        restSec:
          type: integer
    BlockExerciseSuggestionsRequest:
      type: object
      required: [mode, dayIndex, dayCatalogIds]
      properties:
        mode:
          type: string
          enum: [replace, add]
        dayIndex:
          type: integer
          minimum: 0
          maximum: 6
          description: Weekday of the edited day, 0 = Monday (Hét) … 6 = Sunday (Vas)
        outgoing:
          nullable: true
