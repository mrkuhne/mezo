openapi: 3.0.3
info:
  title: ''
  version: ''
tags:
  - name: Train
    description: Training domain — mesocycles (with volume provenance) and sport sessions
paths:
  /api/train/mesocycles:
    get:
      tags: [Train]
      operationId: listMesocycles
      summary: All mesocycles of the current user with volume provenance and template days, start date ascending
      responses:
        '200':
          description: Mesocycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/activate:
    post:
      tags: [Train]
      operationId: activateMesocycle
      summary: Activate a mesocycle — archives any other active one (idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Activated mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/close:
    post:
      tags: [Train]
      operationId: closeMesocycle
      summary: Close (archive) a mesocycle (idempotent); optional self-eval note is captured on close
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesocycleCloseRequest'
      responses:
        '200':
          description: Archived mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/discard:
    post:
      tags: [Train]
      operationId: discardMesocycle
      summary: Throw away a block that was never trained (mezo-r36n9.113) — soft-deletes the run, its days, exercises and volume rows, and the template it came from when that template has no other runs; no report, no close event, no AI
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Discarded
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: TRAIN_MESO_DISCARD_HAS_LOGS when the block has a logged session; TRAIN_RUN_NOT_EDITABLE when it is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/muscle-priorities:
    put:
      tags: [Train]
      operationId: updateMesocycleMusclePriorities
      summary: Replace the run's muscle priority tier map — takes effect at the next weekly rollover (mezo-3m5m)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusclePrioritiesUpdateRequest'
      responses:
        '200':
          description: Updated mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/settings:
    put:
      tags: [Train]
      operationId: updateMesocycleSettings
      summary: Change a running block's settings — training style, techniques flag, weekly review mode (mezo-r36n9.83)
      description: >-
        Every field is optional; an absent field keeps the stored value. A new trainingStyle re-stamps every
        exercise of the run's days in place (ids kept, owner overrides respected). techniquesEnabled only flips
        the block flag: stored technique picks are never deleted, they are simply ignored while it is off.
        weeklyReviewMode applies to proposals generated after the switch; a pending proposal stays pending.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesocycleSettingsUpdateRequest'
      responses:
        '200':
          description: Updated mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: The run is archived (TRAIN_RUN_NOT_EDITABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/report:
    get:
      tags: [Train]
      operationId: getMesocycleReport
      summary: The generated end-of-mesocycle report — adherence, volume arc, strength deltas, records and optional AI narrative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The mesocycle report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleReportResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: No report exists yet, or the mesocycle is not found/not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/report/regenerate:
    post:
      tags: [Train]
      operationId: regenerateMesocycleReport
      summary: Recompute the report for an archived mesocycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Regeneration accepted
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: The mesocycle run is not archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/volume-arc:
    get:
      tags: [Train]
      operationId: getMesocycleVolumeArc
      summary: Read-only per-muscle volume arc (planned scaffold + actual logged working sets) for a mesocycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The mesocycle volume arc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleVolumeArcResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/exercise-suggestions:
    post:
      tags: [Train]
      operationId: getBlockExerciseSuggestions
      summary: Ranked, reasoned add/swap suggestions for one day of a training block's plan (mezo-r36n9.116)
      description: >-
        The block day editor's suggestions — the workout swap's ranker over the block's goal, the gym profile and
        the discomfort history, with today's check-in pain only when the edited day is today's weekday. Replace
        ranks alternatives to an outgoing exercise; add ranks the catalogue rows of the chosen fine muscle tokens
        (`muscles`, mezo-r36n9.127), else of one coarse muscle group (`muscle`), else — both absent — of the week's
        under-band groups, and explains a muscle under its weekly band. Each suggestion carries the block style's
        prescription. Read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockExerciseSuggestionsRequest'
      responses:
        '200':
          description: Suggestions and labels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseSubstitutesResponse'
        '400':
          description: Validation error (replace without outgoing, add with an unknown muscle token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Block not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: The block is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/coverage:
    post:
      tags: [Train]
      operationId: getBlockCoverage
      summary: Missing complementary movements in a training block's draft week, each with one proposed exercise (mezo-r36n9.114)
      description: >-
        The block builder's coverage hints (spec 2026-11-25-boop-hianyjelzes-design). The phone sends its current
        draft week; a fixed rules table, per coarse muscle group over the catalogue movement patterns of the draft
        rows, finds a missing complementary movement (e.g. the hamstrings trained only with hip hinges, no leg curl).
        At most one finding per group, at most three overall, in the table's priority order; silent for groups at
        Tartás (the block's stored muscle priorities) and for groups the draft does not train; user-authored rows
        (no pattern) never create or close a gap. Each finding carries fixed Hungarian verdict/why phrases and, when
        the gym, the discomfort history and the draft allow, ONE proposed catalogue exercise of the missing pattern
        on a named draft day with the block style's prescription. Advice only — read-only, never blocks a save.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockCoverageRequest'
      responses:
        '200':
          description: Ordered findings (0..3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockCoverageResponse'
        '400':
          description: Validation error (missing days, a dayIndex outside 0..6)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Block not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: The block is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/evaluation:
    get:
      tags: [Train]
      operationId: getMesocycleEvaluation
      summary: Read-only evaluation of a run's plan (its template days) — the path is the volume arc's planned line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The run's plan evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoPlanEvaluation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/exercises/{exerciseId}/technique:
    put:
      tags: [Train]
      operationId: updateExerciseTechnique
      summary: Set or clear the technique/challenge of one exercise in a running mesocycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseTechniqueUpdateRequest'
      responses:
        '200':
          description: Updated exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymExercise'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle/exercise not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: Techniques disabled on this run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/days/{dayId}/exercises:
    put:
      tags: [Train]
      operationId: replaceDayExercises
      summary: Replace the exercise list of one template day (full-list, order = array order)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GymExerciseInput'
      responses:
        '200':
          description: Updated template day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoDay'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle/day not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: An add/remove/swap of exercises while that day's workout is running (TRAIN_DAY_WORKOUT_RUNNING); a same-order edit or a pure reorder is saved in place and allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/rerun:
    post:
      tags: [Train]
      operationId: rerunMesocycle
      summary: Start a new run from a closed mesocycle's originating template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The originating template id, for starting a fresh run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoRerunResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/restart:
    post:
      tags: [Train]
      operationId: restartMesocycle
      summary: Restart the active mesocycle from week 1 today, carrying its current state (mezo-r36n9.177)
      description: >-
        One transaction. Closes the active run exactly like closeMesocycle (closedAt, frozen report, AI review after
        commit) and stamps a new ACTIVE run starting today from the old run's CURRENT state — every edit made to its
        days, settings and priorities. The new run keeps the old run's template (a legacy run gets one materialized
        and linked). updateTemplate=true also overwrites that template with the run's state. Any failure (e.g.
        SEASON_REQUIRED) changes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesocycleRestartRequest'
      responses:
        '200':
          description: The new active run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: Not the active run (TRAIN_MESO_NOT_ACTIVE) or no season covers today (SEASON_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/save-to-template:
    post:
      tags: [Train]
      operationId: saveMesocycleToTemplate
      summary: Overwrite the run's template with the run's current state (mezo-r36n9.177)
      description: >-
        Full replace of the template's plan with the run's days, settings and priorities; a legacy run without a
        template gets one created and linked. Idempotent. The run itself is not changed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The template id that now carries the run's state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoRerunResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: The run is archived (TRAIN_MESO_NOT_ACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-plans/generate:
    post:
      tags: [Train]
      operationId: generateMesoPlan
      summary: Generate a hypertrophy mesocycle proposal (deterministic skeleton + optional LLM exercise pick); returns a MesoTemplateUpsertRequest-compatible template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoPlanGenerateRequest'
      responses:
        '200':
          description: Generated proposal — not persisted; save it via POST /api/train/meso-templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoPlanGenerateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-plans/evaluate:
    post:
      tags: [Train]
      operationId: evaluateMesoPlan
      summary: Measure a draft mesocycle plan against the muscle-group volume bands (read-only, deterministic, never blocks a save)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoPlanEvaluateRequest'
      responses:
        '200':
          description: The plan's evaluation — nothing is persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoPlanEvaluation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-plans/candidates:
    post:
      tags: [Train]
      operationId: getMesoPlanCandidates
      summary: Ranked, flawless split candidates for the chosen days (deterministic skeleton + fill + style stamp, no LLM, read-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoPlanCandidatesRequest'
      responses:
        '200':
          description: 1-3 ranked candidates, or the closest one flagged nothingFits with fixes — nothing is persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoPlanCandidates'
        '400':
          description: Validation error (incl. TRAIN_MESO_EMPHASIZE_CAP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-templates:
    get:
      tags: [Train]
      operationId: listMesoTemplates
      summary: All mesocycle templates of the current user, with run counts, created date ascending
      responses:
        '200':
          description: Meso templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MesoTemplateResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags: [Train]
      operationId: createMesoTemplate
      summary: Create a mesocycle template (wizard) with nested days and exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoTemplateUpsertRequest'
      responses:
        '200':
          description: Created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoTemplateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-templates/{id}:
    put:
      tags: [Train]
      operationId: updateMesoTemplate
      summary: Update a mesocycle template's fields, days and exercises (full replace)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoTemplateUpsertRequest'
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoTemplateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Template not found or not owned
          content:
            application/json:
              schema:
