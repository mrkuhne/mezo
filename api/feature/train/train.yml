          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such block of the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: TRAIN_YEAR_BLOCK_LOCKED (running/done block, or the consolidation's order/time/skip) or TRAIN_YEAR_NOTHING_TO_LINK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/train/year-plans/{id}/archive:
    post:
      tags: [Train]
      operationId: archiveYearPlan
      summary: Close (archive) an Éves terv; afterwards there is no active plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The archived year plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearPlan'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such plan of the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    YearPlanRequest:
      type: object
      required: [startDate]
      description: An Éves terv request (mezo-r36n9.113); absent optional fields take the mezo.year-plan defaults
      properties:
        startDate:
          type: string
          format: date
          description: The plan's first day, a Monday (400 TRAIN_YEAR_START_NOT_MONDAY otherwise); an adopted running block moves it to the Monday on/before that block's start
        emphasis:
          type: array
          nullable: true
          maxItems: 9
          description: Landmark groups to focus twice this year; absent = none
          items:
            type: string
            pattern: '^(chest|back|shoulder|biceps|triceps|quad|ham|glute|calf)$'
        blockWeeks:
          type: integer
          nullable: true
          minimum: 4
          maximum: 8
          description: Loading block length; absent = 6
        consolidationWeeks:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2
          description: Consolidation length; absent = 2
        replaceActive:
          type: boolean
          nullable: true
          description: true archives the active plan first (Jövő évi terv); absent/false = 409 when one exists
    YearBlockPatch:
      type: object
      description: One edit of a year block; every field optional, applied in the order focus, weeks, ordinal, shiftWeeks, skip
      properties:
        focus:
          type: array
          nullable: true
          minItems: 1
          maxItems: 2
          description: 1-2 distinct focus groups (a duplicate is 400); re-derives the block kind (mixed keeps it and warns mixed_focus)
          items:
            type: string
            pattern: '^(chest|back|shoulder|biceps|triceps|quad|ham|glute|calf)$'
        weeks:
          type: integer
          nullable: true
          minimum: 1
          maximum: 8
          description: Block length; a loading block 4-8, the consolidation 1-2 (sets the plan's consolidation length)
        ordinal:
          type: integer
          nullable: true
          minimum: 1
          description: New position among the loading blocks (1..loadingBlocks); the rest renumber contiguously
        shiftWeeks:
          type: integer
          nullable: true
          minimum: -1
          maximum: 1
          description: +1 adds a week of gap before the block; -1 removes one (400 without a gap, see canMoveEarlier)
        skip:
          type: boolean
          nullable: true
          description: true skips the block, false brings it back to planned
        linkRunning:
          type: boolean
          nullable: true
          description: true links the unlinked running mesocycle to this planned block (409 TRAIN_YEAR_NOTHING_TO_LINK when there is none)
    YearPlan:
      type: object
      required: [status, startDate, endDate, blockWeeks, consolidationWeeks, emphasis, loadingBlocks, bufferWeeks, overrunWeeks, blocks, relaxed, warnings, focusCount, review]
      description: An Éves terv with every number and date the phone shows, computed on the server
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Absent on a preview
        status:
          type: string
          enum: [active, archived]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: The consolidation's last day (re-dated; after the 52nd week when overrunWeeks > 0)
        blockWeeks:
          type: integer
        consolidationWeeks:
          type: integer
          description: The planned consolidation length (the consolidation block's weeks show a shortened one)
        emphasis:
          type: array
          items:
            type: string
        currentWeek:
          type: integer
          nullable: true
          description: Week of today since startDate (1-based, may exceed 52); null before the start
        loadingBlocks:
          type: integer
          description: Number of non-consolidation blocks
        bufferWeeks:
          type: integer
          description: Spare weeks before the consolidation
        bufferStart:
          type: string
          format: date
          nullable: true
          description: First buffer day; null when bufferWeeks is 0
        overrunWeeks:
          type: integer
          description: Weeks the year runs past its 52 weeks
        blocks:
          type: array
          description: Every block in ordinal order, the consolidation last
          items:
            $ref: '#/components/schemas/YearBlock'
        relaxed:
          type: array
          description: Rotation relaxations of a preview/create (empty on later reads)
          items:
            $ref: '#/components/schemas/YearNote'
        warnings:
          type: array
          description: Rule breaks of the current plan (an owner edit is always accepted)
          items:
            $ref: '#/components/schemas/YearNote'
        focusCount:
          type: object
          description: Every landmark group -> how many non-skipped loading blocks focus it
          additionalProperties:
            type: integer
        next:
          allOf:
            - $ref: '#/components/schemas/YearNext'
          nullable: true
        unlinkedRunning:
          allOf:
            - $ref: '#/components/schemas/YearUnlinkedRunning'
          nullable: true
        nextYearStart:
          type: string
          format: date
          nullable: true
          description: >-
            The Monday „Jövő évi terv" starts on — on/after the day after the plan's end, after a running
            consolidation block's own end, and never before the Monday on/after today. Only on the active plan.
        review:
          $ref: '#/components/schemas/YearReview'
    YearBlock:
      type: object
      required: [ordinal, kind, focus, weeks, plannedStart, lastDay, status, adopted, canMoveEarlier, skipConsequence]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Absent on a preview
        ordinal:
          type: integer
        kind:
          type: string
          enum: [upper, lower, consolidation]
        focus:
          type: array
          items:
            type: string
        weeks:
          type: integer
          description: The weeks the block takes (actual for a followed mesocycle)
        plannedStart:
          type: string
          format: date
        lastDay:
          type: string
          format: date
        status:
          type: string
          enum: [planned, running, done, skipped]
        mesocycleId:
          type: string
          format: uuid
          nullable: true
        currentWeek:
          type: integer
          nullable: true
          description: Week of today inside this block (1-based); null when today is outside it
        adopted:
          type: boolean
          description: true when the block adopted a mesocycle that was already running
        canMoveEarlier:
          type: boolean
          description: true when shiftWeeks -1 is possible (the block has a gap before it and is editable)
        skipConsequence:
          type: array
          description: Focus groups no other block focuses — lost for the year if this block is skipped
          items:
            type: string
    YearNote:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [emphasis_once, no_focus, pair_relaxed, focus_consecutive, no_focus_this_year, pair_unusual, mixed_focus]
        group:
          type: string
          nullable: true
        ordinal:
          type: integer
          nullable: true
        blockId:
          type: string
          format: uuid
          nullable: true
          description: no_focus_this_year — the suggested block for the group
        replaces:
          type: string
          nullable: true
          description: no_focus_this_year — the group to swap out of blockId; absent = add as a second focus
        weeks:
          type: integer
          nullable: true
    YearNext:
      type: object
      required: [blockId, startsOn, reason]
      properties:
        blockId:
          type: string
          format: uuid
        startsOn:
          type: string
          format: date
        reason:
          type: string
          enum: [last_week, no_block]
    YearUnlinkedRunning:
      type: object
      required: [mesocycleId, title, startDate, status]
      properties:
        mesocycleId:
          type: string
          format: uuid
        title:
          type: string
        startDate:
          type: string
          format: date
        status:
          type: string
          enum: [active, planned]
          description: active = the block runs now; planned = it starts on startDate
    YearReview:
      type: object
      required: [blocksDone, blocksSkipped, focused, unfocused]
      properties:
        blocksDone:
          type: integer
        blocksSkipped:
          type: integer
        focused:
          type: array
          description: Groups focused by a done or running block, config order
          items:
            type: string
        unfocused:
          type: array
          description: The other landmark groups, config order
          items:
            type: string
    GymProfile:
      type: object
      required: [offKinds, missingExerciseIds]
      properties:
        offKinds:
          type: array
          description: Kit kinds the gym does not have - barbell, dumbbell, kettlebell, cable, machine, smith, bench, pullup-bar, specialty (never bodyweight)
          items: { type: string, maxLength: 16 }
        missingExerciseIds:
          type: array
          description: Catalogue exercises the gym cannot do even though the kit exists (e.g. a missing hack-squat machine)
          items: { type: string, format: uuid }
    MesocycleResponse:
      type: object
      required:
        - id
        - title
        - shortTitle
        - status
        - startDate
        - endDate
        - weeks
        - currentWeek
        - split
        - style
        - phaseCurve
        - hasReport
        - weeklyReviewMode
      properties:
        techniquesEnabled:
          type: boolean
          description: Block flag; techniques and the challenge are prescribed only when true.
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
          nullable: true
          description: The originating template this run was started from (null for legacy/direct runs)
        title:
          type: string
        shortTitle:
          type: string
        status:
          type: string
          enum: [active, planned, archived]
        goal:
          type: string
        goalPreset:
          type: string
          nullable: true
          description: Machine key of the wizard's goal choice (hypertrophy/strength/cut-prep/recovery/sport/erohipertrofia); null for legacy/edited goals (mezo-dq60)
        musclePriorities:
          type: object
          nullable: true
          description: Sparse per-coarse-muscle priority tier map (emphasize/maintain; absent key = grow); null/empty = all grow (mezo-3m5m)
          additionalProperties:
            type: string
        sportGroups:
          type: array
          nullable: true
          description: Coarse muscle groups a sport (e.g. volleyball) already loads; lowers their volume band (mezo-r36n9.77). Keys of the landmark table, normalised de-duplicated in table order; null/empty = none
          items:
            type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: When this run was closed (archived); null while active/planned
        hasReport:
          type: boolean
          default: false
          description: True once an end-of-mesocycle report has been generated for this run
        weeks:
          type: integer
        currentWeek:
          type: integer
        split:
          type: string
        style:
          type: string
        phaseCurve:
          type: array
          items:
            type: string
            enum: [MEV, MAV, MRV, Deload]
        notes:
          type: string
        summary:
          type: string
        volumeRecompute:
          $ref: '#/components/schemas/VolumeRecompute'
        volumePerMuscle:
          type: object
          description: Per-muscle volume profile keyed by muscle id (chest, back, ...)
          additionalProperties:
            $ref: '#/components/schemas/VolumeProfile'
        days:
          type: array
          items:
            $ref: '#/components/schemas/MesoDay'
        trainingStyle:
          allOf:
            - $ref: '#/components/schemas/TrainingStyle'
          nullable: true
          description: Block training style; null = no style (unstyled block behaves as before).
        weeklyReviewMode:
          type: string
          enum: [auto, manual]
          description: >-
            EFFECTIVE weekly review mode of the run (mezo-r36n9.83): its own setting, else the server default.
            auto = the weekly volume proposal is applied at once; manual = it waits for line-by-line decisions.
    MesoTemplateResponse:
      type: object
      required:
        - id
        - title
        - weeks
        - phaseCurve
        - days
        - runCount
      properties:
        techniquesEnabled:
          type: boolean
          description: Block flag; techniques and the challenge are prescribed only when true.
        id:
          type: string
          format: uuid
        title:
          type: string
        shortTitle:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        goalPreset:
          type: string
          nullable: true
          description: Machine key of the wizard's goal choice (hypertrophy/strength/cut-prep/recovery/sport/erohipertrofia); null for legacy/edited goals (mezo-dq60)
        musclePriorities:
          type: object
          nullable: true
          description: Sparse per-coarse-muscle priority tier map (emphasize/maintain; absent key = grow); null/empty = all grow (mezo-3m5m)
          additionalProperties:
            type: string
        sportGroups:
          type: array
          nullable: true
          description: Coarse muscle groups a sport (e.g. volleyball) already loads; lowers their volume band (mezo-r36n9.77). Keys of the landmark table, normalised de-duplicated in table order; null/empty = none
          items:
            type: string
        weeks:
          type: integer
          minimum: 1
          maximum: 16
        split:
          type: string
          nullable: true
        style:
          type: string
          nullable: true
        phaseCurve:
          type: array
          items:
            type: string
            enum: [MEV, MAV, MRV, Deload]
        notes:
          type: string
          nullable: true
        volumePerMuscle:
          type: object
          nullable: true
          description: Per-muscle volume baseline keyed by muscle id (chest, back, ...)
          additionalProperties:
            $ref: '#/components/schemas/VolumeBaseline'
        days:
          type: array
          items:
            $ref: '#/components/schemas/MesoDay'
        runCount:
          type: integer
          description: Number of mesocycle runs started from this template
        trainingStyle:
          allOf:
            - $ref: '#/components/schemas/TrainingStyle'
          nullable: true
          description: Block training style; null = no style (unstyled block behaves as before).
    VolumeRecompute:
      type: object
      required:
        - lastRun
        - nextRun
        - trigger
        - changes
      properties:
        lastRun:
          type: string
        nextRun:
          type: string
        trigger:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/VolumeChange'
    VolumeChange:
      type: object
      required:
        - muscle
        - change
        - reason
      properties:
        muscle:
          type: string
        change:
          type: string
        reason:
          type: string
        warning:
          type: boolean
    VolumeProfile:
      type: object
      required:
        - mev
        - mav
        - mrv
        - current
        - source
      properties:
        mev:
          type: integer
        mav:
          type: integer
        mrv:
          type: integer
        current:
          type: integer
        source:
          $ref: '#/components/schemas/VolumeSource'
    VolumeSource:
      type: object
      description: Provenance envelope — baseline -> adjustments -> confidence -> override
      required:
        - baseline
        - adjustments
        - confidence
      properties:
        baseline:
          $ref: '#/components/schemas/VolumeBaseline'
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/VolumeAdjustment'
        confidence:
          type: number
        note:
          type: string
        userOverride:
          $ref: '#/components/schemas/VolumeUserOverride'
    VolumeBaseline:
      type: object
      required:
        - name
        - mev
        - mav
        - mrv
      properties:
        name:
          type: string
        mev:
          type: integer
        mav:
          type: integer
        mrv:
          type: integer
    VolumeAdjustment:
      type: object
      required:
        - kind
        - label
        - delta
      properties:
        kind:
          type: string
          pattern: '^(pattern|recovery|niggle|sport-cross)$'
        label:
          type: string
        delta:
          type: object
          description: Partial mev/mav/mrv deltas
          additionalProperties:
            type: integer
        warning:
          type: boolean
    VolumeUserOverride:
      type: object
      required:
        - mev
        - mav
        - mrv
        - at
      properties:
        mev:
          type: integer
        mav:
          type: integer
        mrv:
          type: integer
        at:
          type: string
          format: date-time
    MesocycleVolumeArcResponse:
      type: object
      required:
        - mesocycleId
        - title
        - currentWeek
        - weeks
        - startDate
        - endDate
        - status
        - phaseCurve
        - muscles
      properties:
        mesocycleId:
          type: string
          format: uuid
        title:
          type: string
        currentWeek:
          type: integer
        weeks:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [active, planned, archived]
        phaseCurve:
          type: array
          items:
            type: string
            enum: [MEV, MAV, MRV, Deload]
        muscles:
          type: array
          items:
            $ref: '#/components/schemas/MuscleVolumeArc'
    MuscleVolumeArc:
      type: object
      required:
        - muscle
        - region
        - mrv
        - weeks
      properties:
        muscle:
          type: string
          description: Coarse volume-group key (chest/back/shoulder/biceps/triceps/quad/ham/glute/calf/core)
        region:
          type: string
          description: Color-family region key (coral/sky/lav/rose/sage/amber)
        mrv:
          type: integer
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/VolumeArcWeek'
    VolumeArcWeek:
      type: object
      required:
        - week
        - phase
        - planned
        - isCurrent
      properties:
        week:
          type: integer
        phase:
          type: string
          enum: [MEV, MAV, MRV, Deload]
        planned:
          type: integer
        actual:
          type: integer
          nullable: true
          description: Null for future weeks with no logged data yet
        isCurrent:
          type: boolean
    MesoDay:
      type: object
      required:
        - day
        - type
        - muscle
        - exerciseCount
        - exercises
      properties:
        id:
          type: string
          format: uuid
          description: The underlying template-day (workout_session) row — addresses day-level writes
        day:
          type: string
          description: "'Hét'..'Vas'"
        type:
          type: string
        muscle:
          type: string
        exerciseCount:
          type: integer
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/GymExercise'
        note:
          type: string
        current:
          type: boolean
        muscleAccent:
          type: boolean
    GymExercise:
      type: object
      required:
        - id
        - name
        - muscle
        - warmupSets
        - workingSets
        - repMin
        - repMax
        - targetRIR
        - type
      properties:
        technique:
          allOf:
            - $ref: '#/components/schemas/Technique'
          nullable: true
          description: Intensity technique on the last working set; null = none.
        techniqueSource:
          allOf:
            - $ref: '#/components/schemas/TechniqueSource'
          nullable: true
          description: Who set the technique; null = none.
        challenge:
          type: boolean
          description: Proactive "depth" challenge flag (partials challenge on the last working set).
        id:
          type: string
          format: uuid
        name:
          type: string
        muscle:
          type: string
        warmupSets:
          type: integer
        workingSets:
          type: integer
        repMin:
          type: integer
        repMax:
          type: integer
        targetRIR:
          type: integer
        anchorWeightKg:
          type: number
          nullable: true
        type:
          type: string
          enum: [compound, isolation, plyo]
        warning:
          type: string
        catalogId:
          type: string
          format: uuid
        countsTowardVolume:
          type: boolean
          description: Whether this exercise's sets count as hypertrophy volume; false for the fix-zárás closing block and plyometrics (mezo-gbo7). Absent = true.
        videoUrl:
          type: string
          nullable: true
          description: Effective YouTube demo URL resolved from the linked catalog row (null when none)
        imageStartUrl:
          type: string
          nullable: true
          description: Demo still (start position) resolved from the linked catalog row (null when none)
        imageEndUrl:
          type: string
          nullable: true
          description: Demo still (end position); alternated with imageStartUrl to convey the movement
        trainingStyle:
          allOf:
            - $ref: '#/components/schemas/TrainingStyle'
          nullable: true
          description: Per-exercise style; null = inherit the block style.
        effectiveTrainingStyle:
          allOf:
            - $ref: '#/components/schemas/TrainingStyle'
          nullable: true
          readOnly: true
          description: The style in force for this exercise (own style, else the block's); null = unstyled.
        restSec:
          type: integer
          minimum: 30
          maximum: 600
          nullable: true
          description: Rest between sets in seconds; null = derived from the style.
        overrides:
          type: array
          description: Style-prescription fields the user has taken over by hand.
          items:
            $ref: '#/components/schemas/StyleOverride'
    MesoPlanGenerateRequest:
      type: object
      required: [daysOfWeek, weeks]
      properties:
        daysOfWeek:
          type: array
          minItems: 2
          maxItems: 6
          uniqueItems: true
          description: Training days, FE day tokens; any weekday incl. weekend
          items:
            type: string
            pattern: '^(Hét|Kedd|Sze|Csü|Pén|Szo|Vas)$'
        weeks:
          type: integer
          minimum: 1
          maximum: 8
          description: Total length incl. the terminal deload week (4–8; 1–3 only with consolidation)
        consolidation:
          type: boolean
          nullable: true
          description: A short year-plan consolidation block (1–3 weeks, every muscle at Tartás, flat curve, no deload); absent = false
        priorities:
          type: object
          nullable: true
          description: Sparse per-muscle tier map over the 9 coarse groups (chest, back, shoulder, biceps, triceps, quad, ham, glute, calf); absent = grow
          additionalProperties:
            type: string
            pattern: '^(emphasize|grow|maintain)$'
        goalText:
          type: string
          nullable: true
          maxLength: 400
          description: Free-text goal steering exercise choice (e.g. "röplabda mellett, vállra figyelve")
        split:
          type: string
          nullable: true
          pattern: '^[a-z0-9_]{2,16}$'
          description: Key of a catalogued split for the chosen day count (a candidate's splitKey from POST /meso-plans/candidates); absent = the default split
        sessionMinutesTarget:
          type: integer
          nullable: true
          minimum: 10
          maximum: 300
          description: The session-minutes target the chosen candidate was offered under (mezo-r36n9.113); with split, an LLM-merged plan that no longer passes the candidate filters falls back to the deterministic plan
        sportGroups:
          type: array
          nullable: true
          description: Coarse muscle groups a sport already loads (as on the candidates request); null = none
          items:
            type: string
    MesoPlanEvaluateRequest:
      type: object
      required: [weeks, phaseCurve, days]
      properties:
        trainingStyle:
          allOf:
            - $ref: '#/components/schemas/TrainingStyle'
          nullable: true
          description: Draft's block training style; with techniquesEnabled it turns the technique planner projection on.
        techniquesEnabled:
          type: boolean
          nullable: true
          description: Draft's technique flag; absent/false = no planner output.
        weeks:
          type: integer
          minimum: 1
          maximum: 16
        phaseCurve:
          type: array
          minItems: 1
          items:
            type: string
            enum: [MEV, MAV, MRV, Deload]
        days:
          type: array
          items:
            $ref: '#/components/schemas/MesoDayInput'
        musclePriorities:
          type: object
          nullable: true
          description: Sparse per-muscle tier map; absent = grow
          additionalProperties:
            type: string
        sportGroups:
          type: array
          nullable: true
          description: Coarse muscle groups a sport already loads; null = none (the evaluation then suggests groups from the sport schedule)
          items:
            type: string
        sessionMinutesTarget:
          type: integer
          nullable: true
          minimum: 10
          maximum: 300
          description: Target session length; per-day overTarget is null when absent
    VolumeBandView:
      type: object
      required: [low, high, limit, sportAdjusted]
      properties:
        low:
          type: integer
        high:
          type: integer
        limit:
          type: integer
        sportAdjusted:
          type: boolean
    DaySetSpread:
      type: object
      required: [dayIndex, sets]
      properties:
        dayIndex:
          type: integer
        sets:
          type: integer
    PlanProposalEdit:
      type: object
      required: [dayIndex, exerciseIndex, delta]
      properties:
        dayIndex:
          type: integer
        exerciseIndex:
          type: integer
        delta:
          type: integer
    MuscleEvaluation:
      type: object
      required: [muscle, tier, band, weeklySets, fit, diff, spread, proposal, proposalBlocked]
      properties:
        muscle:
          type: string
        tier:
          type: string
          enum: [emphasize, grow, maintain]
        band:
          $ref: '#/components/schemas/VolumeBandView'
        weeklySets:
          type: integer
        fit:
          type: string
          enum: [below, inside, above]
        diff:
          type: integer
          description: Sets short of the band floor (positive) or over its top (negative); 0 inside
        spread:
          type: array
          items:
            $ref: '#/components/schemas/DaySetSpread'
        proposal:
          type: array
          items:
            $ref: '#/components/schemas/PlanProposalEdit'
        proposalBlocked:
          type: boolean
        basis:
          $ref: '#/components/schemas/MuscleBasis'
        consecutiveHeavy:
          type: array
          items:
            $ref: '#/components/schemas/ConsecutiveHeavyDay'
          description: Pairs of consecutive calendar days (Vas wraps to Hét) on which this muscle gets at least the heavy-set threshold of counting working sets both days.
    MuscleBasis:
      type: object
      required: [source]
      description: Why the band is what it is (the phone words it).
      properties:
        source:
          type: string
          enum: [landmarks_rp, maintain_third, sport_adjusted]
          description: landmarks_rp = the RP landmarks for the tier; maintain_third = the Tartás band (a third of MEV up to MEV); sport_adjusted = lowered because the sport already trains the muscle.
    ConsecutiveHeavyDay:
      type: object
      required: [dayIndex, nextDayIndex, sets, nextSets]
      properties:
        dayIndex:
          type: integer
        nextDayIndex:
          type: integer
          description: The plan day on the next calendar day
        sets:
          type: integer
        nextSets:
          type: integer
    TierBudgetView:
      type: object
      required: [usedSets, emphasizeCount, emphasizeMax, raiseCost]
      description: The weekly set budget the tiers spend.
      properties:
        capacitySets:
          type: integer
          nullable: true
          description: Working sets the training days fit in the session-minutes target; null without a target.
        usedSets:
          type: integer
          description: Peak weekly total over the non-deload weeks of the projected path.
        emphasizeCount:
          type: integer
        emphasizeMax:
          type: integer
        raiseCost:
          type: object
          additionalProperties:
            type: integer
          description: Muscle -> extra peak weekly sets if it were raised one tier (maintain -> grow -> emphasize); emphasized muscles are absent.
    SessionCapWarning:
      type: object
      required: [muscle, sets, cap]
      properties:
        muscle:
          type: string
        sets:
          type: integer
        cap:
          type: integer
    ExerciseCapWarning:
      type: object
      required: [exerciseIndex, sets, cap]
      properties:
        exerciseIndex:
          type: integer
          description: Index in the day's exercise list
        sets:
          type: integer
        cap:
          type: integer
    DayEvaluation:
      type: object
      required: [dayIndex, day, minutesEstimate, sessionCapWarnings, exerciseCapWarnings, sportSameDay]
      properties:
        dayIndex:
          type: integer
        day:
          type: string
        minutesEstimate:
          type: integer
        overTarget:
          type: boolean
          nullable: true
        sessionCapWarnings:
          type: array
          items:
            $ref: '#/components/schemas/SessionCapWarning'
        exerciseCapWarnings:
          type: array
          description: Counting exercises of the day above the per-exercise working-set cap (may be empty)
          items:
            $ref: '#/components/schemas/ExerciseCapWarning'
        sportSameDay:
          type: boolean
    VolumePathWeek:
      type: object
      required: [week, phase, total, muscles]
      properties:
        week:
          type: integer
        phase:
          type: string
        total:
          type: integer
        muscles:
          type: object
          additionalProperties:
            type: integer
        techniques:
          type: array
          items:
            $ref: '#/components/schemas/PlannedTechnique'
          description: Technique picks of this week (stored picks for the current week, planner projection for later weeks); null when the block does not opt in.
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/PlannedChallenge'
          description: The day challenges (partial-rep add-on) of this week; null when the block does not opt in.
    PlannedTechnique:
      type: object
      required: [dayIndex, exerciseIndex, technique, source]
      properties:
        dayIndex: { type: integer }
        exerciseIndex: { type: integer }
        technique:
          $ref: '#/components/schemas/Technique'
        source:
          $ref: '#/components/schemas/TechniqueSource'
    PlannedChallenge:
      type: object
      required: [dayIndex, exerciseIndex]
      properties:
        dayIndex: { type: integer }
        exerciseIndex: { type: integer }
    TechniqueWarning:
      type: object
      required: [code, dayIndex]
      properties:
        code:
          type: string
          enum: [owner_over_allowance, no_challenge_candidate]
        dayIndex: { type: integer }
        exerciseIndex: { type: integer, nullable: true }
    MesoPlanEvaluation:
      type: object
      required: [deficit, sportDays, suggestedSportGroups, muscles, days, path]
      properties:
        deficit:
          type: boolean
        sportDays:
          type: array
          items:
            type: integer
          description: Distinct weekdays (0=Hét..6=Vas) of the user's sport schedule
        suggestedSportGroups:
          type: array
          items:
            type: string
        muscles:
          type: array
          items:
            $ref: '#/components/schemas/MuscleEvaluation'
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayEvaluation'
        path:
          type: array
          items:
            $ref: '#/components/schemas/VolumePathWeek'
        techniqueWarnings:
          type: array
          items:
            $ref: '#/components/schemas/TechniqueWarning'
          description: Technique planner notes (owner picks over the allowance, a day without a challenge candidate); null when the block does not opt in.
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/TechniqueRecommendation'
          description: Per-exercise technique recommendation for every exercise that may carry a technique (a stable one); null when the block does not opt in.
        budget:
          allOf:
            - $ref: '#/components/schemas/TierBudgetView'
          nullable: true
          description: The tier budget; null when the plan has no counting exercises.
    TechniqueRecommendation:
      type: object
      required: [dayIndex, exerciseIndex, technique, reason, challengeFit]
      description: Rule-based technique recommendation for one exercise (mezo-r36n9.98), the same rule the technique planner uses.
      properties:
        dayIndex: { type: integer }
        exerciseIndex: { type: integer }
        technique:
          $ref: '#/components/schemas/Technique'
        reason:
          type: string
          description: "Why this technique (the phone words it). One of: isolation_pump (high-rep isolation -> myo), stable_machine (machine or cable -> rest_drop), lengthened_safe (stable, safe in the stretched position -> partials), all_out (all-out style already ends at failure -> none), no_safe_technique (stable but none fits -> none). New codes may be added; treat an unknown one as no text."
        challengeFit:
          type: boolean
          description: The exercise may carry the day's half-rep challenge (stable and lengthened-friendly).
    MesoPlanGenerateResponse:
      type: object
      required: [template, rationale, llmUsed, draftId]
      properties:
        draftId:
          type: string
          format: uuid
          description: Backend-minted id (mezo-76f6) — stateless, no content hash; a fresh id per generate/regenerate call. The FE echoes it back to POST /api/ai-drafts/{draftId}/outcome.
        template:
          $ref: '#/components/schemas/MesoTemplateUpsertRequest'
        rationale:
          type: string
          description: One Hungarian sentence on what was chosen and why (LLM or deterministic)
        llmUsed:
          type: boolean
          description: false when the LLM port was absent, failed, or its answer changed nothing (no accepted pick) — the deterministic filler produced the plan
    MesoPlanCandidatesRequest:
      type: object
      required: [daysOfWeek, weeks]
      properties:
        daysOfWeek:
          type: array
          minItems: 2
          maxItems: 6
          uniqueItems: true
          description: Training days, FE day tokens; any weekday incl. weekend
          items:
            type: string
            pattern: '^(Hét|Kedd|Sze|Csü|Pén|Szo|Vas)$'
        weeks:
          type: integer
          minimum: 1
          maximum: 8
          description: Total length incl. the terminal deload week (4–8; 1–3 only with consolidation)
        consolidation:
          type: boolean
          nullable: true
          description: A short year-plan consolidation block (1–3 weeks, every muscle at Tartás, flat curve, no deload); absent = false
        priorities:
          type: object
          nullable: true
          description: Sparse per-muscle tier map over the coarse groups; absent = grow; more than emphasizeMax emphasize = 400
          additionalProperties:
            type: string
            pattern: '^(emphasize|grow|maintain)$'
        sessionMinutesTarget:
          type: integer
          nullable: true
          minimum: 10
          maximum: 300
          description: Target session length; absent = no time filter
        sportGroups:
          type: array
          nullable: true
          description: Coarse muscle groups a sport already loads; null = none
          items:
            type: string
    MesoPlanCandidates:
      type: object
      required: [candidates, nothingFits, fixes]
      properties:
        candidates:
          type: array
          description: Offered candidates, best first (max 3); when nothingFits, exactly the closest one
          items:
            $ref: '#/components/schemas/MesoPlanCandidate'
        nothingFits:
          type: boolean
          description: true when no catalogued split passes every hard filter
        fixes:
          type: array
          description: What would make a candidate pass; empty when something fits
          items:
            $ref: '#/components/schemas/CandidateFix'
        intakeBudget:
          allOf:
            - $ref: '#/components/schemas/IntakeBudget'
          nullable: true
          description: The intake's weekly set budget (week 1 of the lead candidate); absent when no candidate came back
    IntakeBudget:
      type: object
      required: [usedSets, emphasizeCount, emphasizeMax, raiseAllowed]
      description: The new-block intake's tier budget (mezo-r36n9.113) — week-1 based, consistent with the candidate filter (the builder's TierBudgetView is peak-week based).
      properties:
        usedSets:
          type: integer
          description: Week-1 total counting working sets of the lead candidate (recommended, else the closest)
        capacitySets:
          type: integer
          nullable: true
          description: Sum over the lead candidate's training days of the working sets each day fits in the session-minutes target (minutes model v2, that day's real warm-ups); null without a target. An offered candidate always has usedSets <= capacitySets.
        emphasizeCount:
          type: integer
        emphasizeMax:
          type: integer
        raiseAllowed:
          type: object
          additionalProperties:
            type: boolean
          description: Muscle -> true when raising only it one tier (maintain -> grow -> emphasize, within emphasizeMax) still offers at least one candidate; emphasized muscles are absent; empty without a target
    MesoPlanCandidate:
      type: object
      required: [splitKey, splitLabel, template, evaluation, recommended, reasons]
      properties:
        splitKey:
          type: string
        splitLabel:
          type: string
        template:
          $ref: '#/components/schemas/MesoTemplateUpsertRequest'
        evaluation:
          $ref: '#/components/schemas/MesoPlanEvaluation'
        recommended:
          type: boolean
          description: true on the first offered candidate (false on a nothingFits closest one)
        reasons:
          type: array
          description: Neutral or positive facts only; the phone owns the copy
          items:
            $ref: '#/components/schemas/CandidateReason'
    CandidateReason:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [fits_time, freq_2x, freq_high, more_warmups]
        value:
          type: integer
          nullable: true
          description: fits_time = longest day minutes; freq_high = least times per week any trained group is hit; more_warmups = extra warm-up sets per week vs the recommended
    CandidateFix:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [more_minutes, fewer_emphasis, more_days]
        value:
          type: integer
          nullable: true
          description: more_minutes = the session minutes the closest candidate needs (rounded up to 15)
        muscle:
          type: string
          nullable: true
          description: fewer_emphasis = the Hangsúly muscle to lower to Építés
    MesoTemplateUpsertRequest:
      type: object
      required:
        - title
        - weeks
        - phaseCurve
        - days
      properties:
        techniquesEnabled:
          type: boolean
          description: Block flag; techniques and the challenge are prescribed only when true.
        title:
          type: string
          minLength: 1
        shortTitle:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        goalPreset:
          type: string
          nullable: true
          description: Machine key of the wizard's goal choice (hypertrophy/strength/cut-prep/recovery/sport/erohipertrofia); null for legacy/edited goals (mezo-dq60)
        musclePriorities:
          type: object
          nullable: true
          description: Sparse per-coarse-muscle priority tier map (emphasize/maintain; absent key = grow); null/empty = all grow (mezo-3m5m)
          additionalProperties:
            type: string
        sportGroups:
          type: array
          nullable: true
          description: Coarse muscle groups a sport (e.g. volleyball) already loads; lowers their volume band (mezo-r36n9.77). Keys of the landmark table, normalised de-duplicated in table order; absent on a PUT keeps the stored list, [] clears it
          items:
            type: string
        weeks:
          type: integer
          minimum: 1
          maximum: 16
        split:
          type: string
          nullable: true
        style:
          type: string
          nullable: true
        phaseCurve:
          type: array
          minItems: 1
          items:
            type: string
            enum: [MEV, MAV, MRV, Deload]
        notes:
          type: string
          nullable: true
        volumePerMuscle:
          type: object
          nullable: true
          description: Per-muscle volume baseline keyed by muscle id (chest, back, ...)
          additionalProperties:
            $ref: '#/components/schemas/VolumeBaseline'
        days:
          type: array
          items:
            $ref: '#/components/schemas/MesoDayInput'
        trainingStyle:
          allOf:
            - $ref: '#/components/schemas/TrainingStyle'
          nullable: true
          description: Block training style; null = no style (unstyled block behaves as before).
    MesoTemplateStartRequest:
      type: object
      required:
        - startDate
        - status
      properties:
        startDate:
          type: string
          format: date
        status:
          type: string
          enum: [active, planned]
        yearBlockId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The Éves terv block this run starts (mezo-r36n9.113). Optional; an id that is not a planned, unlinked block
            of the active plan falls back to the ±14-day rule (nearest planned block), and never fails the start.
    MesocycleSettingsUpdateRequest:
      type: object
      description: Partial update of a running block's settings (mezo-r36n9.83); every absent field keeps its value.
      properties:
        trainingStyle:
          allOf:
            - $ref: '#/components/schemas/TrainingStyle'
          nullable: true
          description: >-
            New block style; re-stamps the run's exercises. Absent OR null keeps the stored style — a block style
            cannot be cleared through this operation.
        techniquesEnabled:
          type: boolean
          nullable: true
          description: Block techniques flag. Off keeps the stored picks (ignored while off); on makes them live again.
        weeklyReviewMode:
          type: string
          nullable: true
          pattern: '^(auto|manual)$'
          description: >-
            The run's own weekly review mode (auto|manual); absent or null keeps it. Applies to proposals
            generated after the switch — a pending proposal stays pending until decided or the week boundary.
    MusclePrioritiesUpdateRequest:
      type: object
      properties:
        musclePriorities:
          type: object
          nullable: true
          description: Sparse per-coarse-muscle priority tier map (emphasize/maintain; absent key = grow); absent or empty CLEARS the map to all grow (unlike sportGroups, which keeps when absent) (mezo-3m5m)
          additionalProperties:
            type: string
        sportGroups:
          type: array
          nullable: true
          description: Coarse muscle groups a sport (e.g. volleyball) already loads; lowers their volume band (mezo-r36n9.77). Keys of the landmark table, normalised de-duplicated in table order; absent keeps the stored list, [] clears it
          items:
            type: string
    MesoRerunResponse:
      type: object
      required:
        - templateId
      properties:
        templateId:
          type: string
          format: uuid
    MesocycleRestartRequest:
      type: object
      description: Optional restart options
      properties:
        updateTemplate:
          type: boolean
          default: false
          description: Also overwrite the run's template with its current state
    MesocycleCloseRequest:
      type: object
      description: Optional self-eval note captured when closing a mesocycle
      properties:
        selfEval:
          type: string
          maxLength: 2000
    MesocycleReportResponse:
      type: object
      description: >-
        The generated end-of-mesocycle report — adherence, volume arc, per-exercise strength
        deltas, PR/medal highlights, and an optional AI narrative eval. context is declared for
        forward-compat (populated in a later slice) so this contract does not change shape then.
      required:
        - mesocycleId
        - title
        - startDate
        - weeks
        - aiEvalStatus
        - aiEvalEnabled
        - adherence
        - strength
        - records
      properties:
        mesocycleId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
          nullable: true
          description: The originating template this run was started from (null for legacy/direct runs)
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        weeks:
          type: integer
        selfEval:
          type: string
          nullable: true
          description: The owner's free-text self-eval note captured on close
        aiEval:
          type: string
          nullable: true
          description: The AI-generated narrative eval (null until generated / when the feature is off)
        aiEvalStatus:
          type: string
          enum: [pending, ready, failed]
        aiEvalGeneratedAt:
          type: string
          format: date-time
          nullable: true
        aiEvalEnabled:
          type: boolean
        adherence:
          $ref: '#/components/schemas/MesoReportAdherence'
        volume:
          allOf:
            - $ref: '#/components/schemas/MesocycleVolumeArcResponse'
          nullable: true
        strength:
          type: array
          items:
            $ref: '#/components/schemas/MesoStrengthDelta'
        records:
          $ref: '#/components/schemas/MesoReportRecords'
        context:
          allOf:
            - $ref: '#/components/schemas/MesoContext'
          nullable: true
          description: Lifestyle/wellbeing context correlated to the mesocycle window (populated in a later slice)
    MesoReportAdherence:
      type: object
      required:
        - plannedSessions
        - completedSessions
        - plannedWeeks
        - completedWeeks
        - completionPct
      properties:
        plannedSessions:
          type: integer
        completedSessions:
          type: integer
        plannedWeeks:
          type: integer
        completedWeeks:
          type: integer
        completionPct:
          type: integer
    MesoStrengthDelta:
      type: object
      required:
        - exerciseName
        - muscle
        - firstWeek
        - lastWeek
        - firstTopReps
        - lastTopReps
      properties:
        exerciseName:
          type: string
        catalogId:
          type: string
          format: uuid
        muscle:
          type: string
        firstWeek:
          type: integer
        lastWeek:
          type: integer
        firstTopKg:
          type: number
        firstTopReps:
          type: integer
        lastTopKg:
          type: number
        lastTopReps:
          type: integer
        firstE1rm:
          type: number
        lastE1rm:
          type: number
        deltaKg:
          type: number
        deltaPct:
          type: number
    MesoReportRecords:
      type: object
      required:
        - medalCount
        - top
      properties:
        medalCount:
          type: integer
        top:
          type: array
          items:
            $ref: '#/components/schemas/MesoRecordHighlight'
    MesoRecordHighlight:
      type: object
      required:
        - exerciseName
        - kind
        - date
      properties:
        exerciseName:
          type: string
        kind:
          type: string
        date:
          type: string
          format: date
        value:
          type: number
    MesoContext:
      type: object
      description: Lifestyle/wellbeing context for the mesocycle window (populated in a later slice)
      required:
        - weeks
        - totals
      properties:
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/MesoContextWeek'
        totals:
          $ref: '#/components/schemas/MesoContextTotals'
    MesoContextWeek:
      type: object
      required:
        - week
      properties:
        week:
          type: integer
        sleepAvgH:
          type: number
          nullable: true
        sleepQualityAvg:
          type: number
          nullable: true
        kcalAvg:
          type: number
          nullable: true
        kcalTargetAvg:
          type: number
          nullable: true
        mealCoverageDays:
          type: number
          nullable: true
        waterAvgMl:
          type: number
          nullable: true
        energyAvg:
          type: number
          nullable: true
        stressAvg:
          type: number
          nullable: true
        weightDeltaKg:
          type: number
          nullable: true
        sportMinutes:
          type: number
          nullable: true
        sportSessions:
          type: number
          nullable: true
        runSessions:
          type: number
          nullable: true
        gymRpeAvg:
          type: number
          nullable: true
    MesoContextTotals:
      type: object
      required:
        - daysTotal
      properties:
        daysTotal:
          type: integer
        sleepAvgH:
          type: number
          nullable: true
        kcalAvg:
          type: number
          nullable: true
        energyAvg:
          type: number
          nullable: true
        stressAvg:
          type: number
          nullable: true
        weightChangeKg:
          type: number
          nullable: true
        sportMinutes:
          type: number
          nullable: true
        sportSessions:
          type: number
          nullable: true
        runSessions:
          type: number
          nullable: true
        mealCoverageDays:
          type: number
          nullable: true
    MesoDayInput:
      type: object
      required:
        - day
        - type
      properties:
        day:
          type: string
          minLength: 1
          description: "'Hét'..'Vas'"
        type:
          type: string
          minLength: 1
        muscle:
          type: string
        muscleAccent:
          type: boolean
        note:
          type: string
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/GymExerciseInput'
    GymExerciseInput:
      type: object
      required:
        - name
        - warmupSets
        - workingSets
        - repMin
        - repMax
        - targetRIR
        - type
      properties:
        technique:
          allOf:
            - $ref: '#/components/schemas/Technique'
          nullable: true
          description: Intensity technique on the last working set; null = none.
        techniqueSource:
          allOf:
            - $ref: '#/components/schemas/TechniqueSource'
          nullable: true
          description: Who set the technique; null = none.
        challenge:
          type: boolean
          description: Proactive "depth" challenge flag (partials challenge on the last working set).
        name:
          type: string
          minLength: 1
        muscle:
          type: string
        warmupSets:
          type: integer
          minimum: 0
          maximum: 10
        workingSets:
          type: integer
          minimum: 1
          maximum: 10
        repMin:
          type: integer
          minimum: 1
          maximum: 100
        repMax:
          type: integer
          minimum: 1
          maximum: 100
        targetRIR:
          type: integer
          minimum: 0
          maximum: 5
        anchorWeightKg:
          type: number
          minimum: 0
          maximum: 999
          nullable: true
        type:
          type: string
          enum: [compound, isolation, plyo]
        warning:
          type: string
        catalogId:
          type: string
          format: uuid
        countsTowardVolume:
          type: boolean
