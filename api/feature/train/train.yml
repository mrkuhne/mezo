            - $ref: '#/components/schemas/TrainingStyle'
          nullable: true
          description: Per-exercise style; null = inherit the block style.
        restSec:
          type: integer
          minimum: 30
          maximum: 600
          nullable: true
          description: Rest between sets in seconds; null = derived from the style.
        overrides:
          type: array
          description: Style-prescription fields the user has taken over by hand.
          items:
            $ref: '#/components/schemas/StyleOverride'
    CustomWorkoutResponse:
      type: object
      required:
        - id
        - name
        - exercises
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/GymExercise'
    CustomWorkoutUpsertRequest:
      type: object
      required:
        - name
        - exercises
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/GymExerciseInput'
    ExerciseCatalogItem:
      type: object
      required:
        - id
        - slug
        - name
        - muscle
        - type
        - stim
        - fatigue
        - editable
        - mediaEditable
        - authoredByMe
        - allowedTechniques
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        muscle:
          type: string
        type:
          type: string
          enum: [compound, isolation, plyo]
        stim:
          type: number
          minimum: 0
          maximum: 1
        fatigue:
          type: number
          minimum: 0
          maximum: 1
        videoUrl:
          type: string
          nullable: true
        imageStartUrl:
          type: string
          nullable: true
          description: Demo still (start position); null when the exercise has no image
        imageEndUrl:
          type: string
          nullable: true
          description: Demo still (end position); alternated with imageStartUrl to convey the movement
        editable:
          type: boolean
          description: >-
            true when the viewer may PUT/DELETE this row — its author or the OWNER on a
            user-authored row. Never true on a master (built-in) row: those are loader-owned
            content (409 CATALOG_MASTER_READONLY for everyone).
        mediaEditable:
          type: boolean
          description: >-
            true when the viewer may set/clear the demo video and stills — the author or the
            OWNER on a user-authored row, the OWNER only on a master row.
        authoredByMe:
          type: boolean
          description: true when created_by == the viewer (multi-user S5, mezo-qw37.5)
        authorName:
          type: string
          nullable: true
          description: The author's display name for user-authored rows; null on master rows
        equipment:
          $ref: '#/components/schemas/Equipment'
        stability:
          $ref: '#/components/schemas/Stability'
        lengthenedFriendly:
          type: boolean
          description: Whether the exercise loads the muscle well at long length.
        allowedTechniques:
          type: array
          items:
            $ref: '#/components/schemas/Technique'
          description: Curated SPE choices for this exercise; empty when none fit. Does not include none.
        challengeAllowed:
          type: boolean
          description: >-
            Whether the day's challenge (half reps in the stretched position) may sit on this exercise
            (owner decision #72, mezo-r36n9.127): every non-plyo exercise except a free-weight compound
            (type compound with barbell, dumbbell or kettlebell in its gear). A row with no known kit
            (no gear and no equipment) is false. Server-computed; the template save enforces the same rule.
        gear:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Kit the exercise needs (barbell, dumbbell, kettlebell, cable, machine, smith, bench,
            pullup-bar, bodyweight, specialty); null on user-authored rows (mezo-r36n9.66).
        pattern:
          type: string
          nullable: true
          description: Movement pattern (spec 2026-11-17 §6.1); null on user-authored rows.
        secondaryMuscles:
          type: array
          nullable: true
          items:
            type: string
          description: Up to three assisting muscles; null on user-authored rows.
        joints:
          type: array
          nullable: true
          items:
            type: string
          description: Joints the movement loads (shoulder, elbow, wrist, lower-back, hip, knee, ankle); null on user-authored rows.
        lengthened:
          type: boolean
          nullable: true
          description: Loads the muscle at a stretch; null on user-authored rows. Distinct from lengthenedFriendly.
        demand:
          type: string
          nullable: true
          description: Systemic demand low | medium | high; null on user-authored rows.
    ExerciseSubstitutesResponse:
      type: object
      required: [suggestions, labels]
