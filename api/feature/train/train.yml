        - exerciseId
        - setIndex
        - weightKg
        - reps
      properties:
        exerciseId:
          type: string
          format: uuid
        setIndex:
          type: integer
          minimum: 0
          maximum: 49
        weightKg:
          type: number
          minimum: 0
          maximum: 999
        reps:
          type: integer
          minimum: 1
          maximum: 100
        rir:
          type: integer
          minimum: 0
          maximum: 5
          nullable: true
          description: Omitted for warmup sets — effort tracking applies to working sets only
        side:
          type: string
          pattern: '^[LBR]$'
        note:
          type: string
          maxLength: 500
        kind:
          type: string
          pattern: '^(warmup|working)$'
          description: warmup|working — defaults to working server-side when omitted
