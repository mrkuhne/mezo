openapi: 3.0.3
info:
  title: ''
  version: ''
tags:
  - name: Train
    description: Training domain — mesocycles (with volume provenance) and sport sessions
paths:
  /api/train/mesocycles:
    get:
      tags: [Train]
      operationId: listMesocycles
      summary: All mesocycles of the current user with volume provenance and template days, start date ascending
      responses:
        '200':
          description: Mesocycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/activate:
    post:
      tags: [Train]
      operationId: activateMesocycle
      summary: Activate a mesocycle — archives any other active one (idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Activated mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/close:
    post:
      tags: [Train]
      operationId: closeMesocycle
      summary: Close (archive) a mesocycle (idempotent); optional self-eval note is captured on close
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesocycleCloseRequest'
      responses:
        '200':
          description: Archived mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/muscle-priorities:
    put:
      tags: [Train]
      operationId: updateMesocycleMusclePriorities
      summary: Replace the run's muscle priority tier map — takes effect at the next weekly rollover (mezo-3m5m)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusclePrioritiesUpdateRequest'
      responses:
        '200':
          description: Updated mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/report:
    get:
      tags: [Train]
      operationId: getMesocycleReport
      summary: The generated end-of-mesocycle report — adherence, volume arc, strength deltas, records and optional AI narrative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The mesocycle report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleReportResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: No report exists yet, or the mesocycle is not found/not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/report/regenerate:
    post:
      tags: [Train]
      operationId: regenerateMesocycleReport
      summary: Recompute the report for an archived mesocycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Regeneration accepted
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: The mesocycle run is not archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/volume-arc:
    get:
      tags: [Train]
      operationId: getMesocycleVolumeArc
      summary: Read-only per-muscle volume arc (planned scaffold + actual logged working sets) for a mesocycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The mesocycle volume arc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleVolumeArcResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/days/{dayId}/exercises:
    put:
      tags: [Train]
      operationId: replaceDayExercises
      summary: Replace the exercise list of one template day (full-list, order = array order)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GymExerciseInput'
      responses:
        '200':
          description: Updated template day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoDay'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle/day not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles/{id}/rerun:
    post:
      tags: [Train]
      operationId: rerunMesocycle
      summary: Start a new run from a closed mesocycle's originating template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The originating template id, for starting a fresh run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoRerunResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-plans/generate:
    post:
      tags: [Train]
      operationId: generateMesoPlan
      summary: Generate a hypertrophy mesocycle proposal (deterministic skeleton + optional LLM exercise pick); returns a MesoTemplateUpsertRequest-compatible template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoPlanGenerateRequest'
      responses:
        '200':
          description: Generated proposal — not persisted; save it via POST /api/train/meso-templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoPlanGenerateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-templates:
    get:
      tags: [Train]
      operationId: listMesoTemplates
      summary: All mesocycle templates of the current user, with run counts, created date ascending
      responses:
        '200':
          description: Meso templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MesoTemplateResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags: [Train]
      operationId: createMesoTemplate
      summary: Create a mesocycle template (wizard) with nested days and exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoTemplateUpsertRequest'
      responses:
        '200':
          description: Created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoTemplateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-templates/{id}:
    put:
      tags: [Train]
      operationId: updateMesoTemplate
      summary: Update a mesocycle template's fields, days and exercises (full replace)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoTemplateUpsertRequest'
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoTemplateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Template not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    delete:
      tags: [Train]
      operationId: deleteMesoTemplate
      summary: Soft-delete a mesocycle template (past runs survive)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Template not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-templates/{id}/start:
    post:
      tags: [Train]
      operationId: startMesoTemplate
      summary: Start a mesocycle run from a template on the given date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoTemplateStartRequest'
      responses:
        '200':
          description: The started mesocycle run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Template not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/custom-workouts:
    get:
      tags: [Train]
      operationId: listCustomWorkouts
      summary: The owner's saved custom (saját) workout templates, oldest first
      responses:
        '200':
          description: Custom workout templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomWorkoutResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags: [Train]
      operationId: createCustomWorkout
      summary: Create a custom workout template (name + full recipe exercise list)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomWorkoutUpsertRequest'
      responses:
        '201':
          description: The created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomWorkoutResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/custom-workouts/{id}:
    put:
      tags: [Train]
      operationId: updateCustomWorkout
      summary: Rename + full exercise-list replace of a custom workout template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomWorkoutUpsertRequest'
      responses:
        '200':
          description: The updated template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomWorkoutResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Foreign/missing/non-custom row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    delete:
      tags: [Train]
      operationId: deleteCustomWorkout
      summary: Soft-delete a custom workout template (instance history survives)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Foreign/missing/non-custom row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/exercises:
    get:
      tags: [Train]
      operationId: getExerciseCatalog
      summary: Shared exercise catalog (master + every user's rows), muscle then name ascending; each item carries the viewer's permissions
      responses:
        '200':
          description: Catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseCatalogItem'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags: [Train]
      operationId: createExercise
      summary: Create a user-authored catalog exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogExerciseCreateRequest'
      responses:
        '201':
          description: Created exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseCatalogItem'
        '400':
          description: Validation error
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } }
        '401':
          description: Missing/invalid token
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } }
  /api/train/exercises/{id}:
    put:
      tags: [Train]
      operationId: updateExercise
      summary: Update a user-authored exercise (author or OWNER; master rows → 409)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogExerciseCreateRequest'
      responses:
        '200':
          description: Updated exercise
          content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseCatalogItem' } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '403': { description: Not the author nor the OWNER (EXERCISE_CATALOG_NOT_EDITABLE), content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: Master row is read-only, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    delete:
      tags: [Train]
      operationId: deleteExercise
      summary: Soft-delete a user-authored exercise (author or OWNER; master rows → 409)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '403': { description: Not the author nor the OWNER (EXERCISE_CATALOG_NOT_EDITABLE), content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: Master row is read-only, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/train/exercises/{id}/video:
    put:
      tags: [Train]
      operationId: setExerciseVideo
      summary: Set/clear the demo video (author or OWNER on a user row; OWNER only on a master row)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogVideoRequest'
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseCatalogItem' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '403': { description: Not the author nor the OWNER (EXERCISE_CATALOG_NOT_EDITABLE), content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/train/exercises/{id}/images:
    put:
      tags: [Train]
      operationId: setExerciseImages
      summary: Set/clear the demo stills (author or OWNER on a user row; OWNER only on a master row)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogImagesRequest'
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseCatalogItem' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '403': { description: Not the author nor the OWNER (EXERCISE_CATALOG_NOT_EDITABLE), content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/train/exercise-records:
    get:
      tags: [Train]
      operationId: getExerciseRecords
      summary: Per-exercise all-time records aggregated from logged sets, sessionCount desc then name
      responses:
        '200':
          description: Exercise records (empty array when nothing is logged yet)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseRecordResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/medals:
    get:
      tags: [Train]
      operationId: getMedals
      summary: The owner's full medal history, newest first (derived from logged sets)
      responses:
        '200':
          description: Medals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedalListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/sport-sessions:
    get:
      tags: [Train]
      operationId: listSportSessions
      summary: Sport sessions of the current user, date descending — optionally narrowed to an inclusive date range (Sport Napló trend)
      description: >-
        Both bounds are optional and inclusive. Omitting both keeps the historical behaviour
        (the whole owned log, date descending); an omitted single bound stays unbounded on that
        side. With both bounds present the range must be forward (`from` <= `to`) and no wider
        than `mezo.train.sport-session-max-span-days`.
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Sport sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportSessionResponse'
        '400':
          description: Invalid date range (from after to, or span too wide)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags: [Train]
      operationId: logSportSession
      summary: Log a sport session (SportLogSheet) — date/time default to now server-side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SportSessionCreateRequest'
      responses:
        '201':
          description: Created sport session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportSessionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/sport-schedule:
    get:
      tags: [Train]
      operationId: getSportSchedule
      summary: The recurring weekly sport schedule slots, day-of-week then time ascending
      responses:
        '200':
          description: Weekly schedule slots (empty array when none set)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportScheduleSlotResponse'
        '401':
