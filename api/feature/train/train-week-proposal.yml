openapi: 3.0.3
info: { title: mezo train-week-proposal fragment, version: 1.0.0 }
tags:
  - name: TrainWeekProposal
    description: >-
      Volume engine v2 S3 (mezo-r36n9.78, spec 2026-11-17 §6.4/§6.6) — the weekly volume proposal of a run:
      set / weight / rep lines with reason codes, grouped per muscle. In auto mode it is applied at once
      (read-only record); in manual mode the user decides line by line (accept / keep). Nothing is
      force-decided: a pending proposal expires at the next week boundary.
paths:
  /api/train/mesocycles/{id}/week-proposals:
    get:
      tags: [TrainWeekProposal]
      operationId: listWeekProposals
      summary: This week's weekly proposal first, then pending tier changes of the current week, newest first
      description: >-
        This calendar week's weekly proposal (any status) first, then the run's still-pending tier-change
        proposals of the current week, newest first. Empty when the run is not active, the gate is off or none
        exists. Opening it generates the week's proposal when due (like opening the day).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Proposals of the run
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WeekProposal' } }
        '401':
          description: Missing/invalid token
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } }
        '404':
          description: The run is not the caller's (TRAIN_MESO_NOT_FOUND)
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } }
  /api/train/mesocycles/{id}/week-proposals/{proposalId}/decisions:
    post:
      tags: [TrainWeekProposal]
      operationId: decideWeekProposal
      summary: Accept or keep proposal lines (per line, or the rest in one go); returns the updated proposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeekProposalDecisionRequest' }
      responses:
        '200':
          description: The proposal after the decisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeekProposal' }
        '400':
          description: Empty request (no decisions and no rest flag), unknown line id, both rest flags set, one line asked twice with different decisions, or a decided line asked to change (TRAIN_WEEK_PROPOSAL_DECISION_INVALID)
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } }
        '401':
          description: Missing/invalid token
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } }
        '404':
          description: No such proposal on the caller's run (TRAIN_WEEK_PROPOSAL_NOT_FOUND)
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } }
        '409':
          description: The proposal is no longer pending, or its week has passed (TRAIN_WEEK_PROPOSAL_CLOSED); a retry that only repeats the stored decisions (no rest flag) returns 200 instead
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } }
components:
  schemas:
    WeekProposalReason:
      type: string
      description: Why a line (or a muscle that holds) is what it is; Hungarian wording is the client's
      enum:
        - all_sets_done
        - felt_easy
        - deficit_pace
        - room_in_band
        - soreness_cleared
        - top_of_rep_range
        - reserve_left
        - next_plate
        - grind
        - too_much
        - sets_missed
        - tier_maintain
        - deload
        - no_slot
        - above_band
        - joint_pain
        - soreness
        - at_ceiling
        - deload_restore
        - stalled
        - tier_change
        - technique_week
        - emphasis
        - deficit_allowance
        - sport_day
        - challenge
        - ai_suggested
    WeekProposalLine:
      type: object
      required: [id, exerciseId, exerciseName, dayIndex, muscleGroup, kind, from, to, reasons]
      properties:
        id: { type: string, description: Stable line id within the proposal }
        exerciseId: { type: string, format: uuid }
        exerciseName: { type: string }
        dayIndex: { type: integer, description: Template day index the exercise sits on }
        dayName: { type: string, nullable: true }
        muscleGroup: { type: string }
        kind:
          type: string
          enum: [sets, weight, reps, technique, rep_range]
          description: >-
            Weight and reps lines are a preview (read-time prescription); sets, technique and rep_range lines write
            on accept. technique lines carry from/to = working sets before/after, fromTechnique/toTechnique the change (challenge
            true = a partials add-on that keeps the sets). rep_range lines carry from/to = rep max, plus the four rep bounds.
        from: { type: number, description: 'Value before the change (sets; kg or reps)' }
        to: { type: number, description: 'Value after the change (sets; kg or reps)' }
        reasons: { type: array, items: { $ref: '#/components/schemas/WeekProposalReason' } }
        fromTechnique:
          allOf: [ { $ref: '#/components/schemas/Technique' } ]
          nullable: true
        toTechnique:
          allOf: [ { $ref: '#/components/schemas/Technique' } ]
          nullable: true
        challenge: { type: boolean, nullable: true, description: 'True on a challenge move (technique partials, sets unchanged)' }
        fromRepMin: { type: integer, nullable: true }
        fromRepMax: { type: integer, nullable: true }
        toRepMin: { type: integer, nullable: true }
        toRepMax: { type: integer, nullable: true }
        decision:
          type: string
          nullable: true
          enum: [accepted, kept]
          description: Absent while undecided
    WeekProposalMuscle:
      type: object
      required: [muscle, tier, sportAdjusted, setsBefore, setsAfter, lineCount, reasons]
      properties:
        muscle: { type: string }
        tier: { type: string, enum: [emphasize, grow, maintain] }
        bandLow: { type: integer, nullable: true }
        bandHigh: { type: integer, nullable: true }
        sportAdjusted: { type: boolean, description: The band was lowered because a sport already loads the group }
        setsBefore: { type: integer, description: Weekly sets of the group before the proposal }
        setsAfter: { type: integer, description: Weekly sets if every line were applied }
        lineCount: { type: integer, description: 0 = the muscle stays where it was; reasons say why }
        reasons: { type: array, items: { $ref: '#/components/schemas/WeekProposalReason' } }
    WeekProposal:
      type: object
      required: [id, mesocycleId, week, kind, status, mode, createdAt, lines, muscles]
      properties:
        id: { type: string, format: uuid }
        mesocycleId: { type: string, format: uuid }
        week: { type: integer, description: Run week the proposal is for }
        kind: { type: string, enum: [weekly, tier_change] }
        status: { type: string, enum: [pending, applied, auto_applied, expired, superseded] }
        mode: { type: string, enum: [auto, manual] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        lines: { type: array, items: { $ref: '#/components/schemas/WeekProposalLine' } }
        muscles: { type: array, items: { $ref: '#/components/schemas/WeekProposalMuscle' } }
    WeekProposalLineDecision:
      type: object
      required: [lineId, decision]
      properties:
        lineId: { type: string }
        decision: { type: string, enum: [accepted, kept] }
    WeekProposalDecisionRequest:
      type: object
      description: Per-line decisions and/or one of the rest flags (not both flags); undecided lines stay pending
      properties:
        decisions: { type: array, items: { $ref: '#/components/schemas/WeekProposalLineDecision' } }
        acceptRest: { type: boolean, description: Accept every still-undecided line }
        keepRest: { type: boolean, description: Keep every still-undecided line }
