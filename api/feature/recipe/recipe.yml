openapi: 3.0.3
info: { title: '', version: '' }
tags:
  - name: Recipe
    description: Recipes (Receptek) — owned recipe + recipe_ingredient aggregate; lines reference pantry_item by id with a per-basis macro snapshot
paths:
  /api/recipe:
    get:
      tags: [Recipe]
      operationId: listRecipes
      summary: The owner's recipes (whole-recipe macros computed from line snapshots)
      responses:
        '200': { description: Recipes, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeListResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Recipe]
      operationId: createRecipe
      summary: Create a recipe with its ingredient lines (snapshots captured server-side)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecipeRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/recipe/{id}:
    get:
      tags: [Recipe]
      operationId: getRecipe
      summary: A single owned recipe by id (detail deep-link / hard-reload refetch)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Recipe, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    put:
      tags: [Recipe]
      operationId: updateRecipe
      summary: Full-replace an owned recipe aggregate (all fields + all lines)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecipeRequest' } } }
      responses:
        '204': { description: Updated }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    delete:
      tags: [Recipe]
      operationId: deleteRecipe
      summary: Soft-delete an owned recipe (and its lines)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Deleted }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/recipe/{id}/breakdown:
    get:
      tags: [Recipe]
      operationId: getRecipeBreakdown
      summary: Lazily materialized template breakdown — deterministic 3-dim envelope + cached AI prose (mezo-bw3y)
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Breakdown (breakdown null while the recipe has no kcal), content: { application/json: { schema: { $ref: '#/components/schemas/RecipeBreakdownResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/recipe/workshop/turn:
    post:
      tags: [RecipeWorkshop]
      operationId: workshopTurn
      summary: One stateless Receptműhely AI turn — history + current draft in, prose reply + full updated draft out (mezo-92pb); nothing persisted
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkshopTurnRequest' } } }
      responses:
        '200': { description: Updated draft, content: { application/json: { schema: { $ref: '#/components/schemas/WorkshopTurnResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '502': { description: LLM answer unparseable, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '503': { description: LLM port unavailable (companion off), content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    RecipeMacros:
      type: object
      required: [kcal, p, c, f]
      properties:
        kcal: { type: number }
        p: { type: number }
        c: { type: number }
        f: { type: number }
    RecipeContribution:
      type: object
      required: [kcal, p, c, f]
      properties:
        kcal: { type: number }
        p: { type: number }
        c: { type: number }
        f: { type: number }
    RecipeMezoFit:
      type: object
      required: [fitsFor]
      properties:
        score: { type: number, nullable: true }
        fitsFor: { type: array, items: { type: string } }
    # Template breakdown (mezo-bw3y): the envelope schema is the meal fragment's MealBreakdown —
    # a cross-fragment $ref resolved at merge time (the SystemMessage common-schema precedent).
    RecipeBreakdownResponse:
      type: object
      required: [fitsFor]
      properties:
        breakdown:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/MealBreakdown' } ]
        fitsFor: { type: array, items: { type: string } }
    RecipeIngredientRequest:
      type: object
      required: [pantryItemId, amount, unit]
      properties:
        pantryItemId: { type: string, format: uuid }
        amount: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, minLength: 1 }
        note: { type: string, nullable: true }
    RecipeIngredientResponse:
      type: object
      required: [pantryItemId, amount, unit, lineOrder, name, contribution]
      properties:
        pantryItemId: { type: string, format: uuid }
        amount: { type: number }
        unit: { type: string }
        note: { type: string, nullable: true }
        lineOrder: { type: integer }
        name: { type: string }
        contribution: { $ref: '#/components/schemas/RecipeContribution' }
        nutrients: { $ref: '#/components/schemas/Nutrients' }
    RecipeRequest:
      type: object
      required: [name, category, ingredients]
      properties:
        name: { type: string, minLength: 1 }
        slot: { type: string, nullable: true }
        category: { type: string, pattern: '^(breakfast|lunch|dinner|snack)$' }
        servings: { type: integer, minimum: 1, default: 1 }
        prepMins: { type: integer, minimum: 0, nullable: true }
        cookMins: { type: integer, minimum: 0, nullable: true }
        tags: { type: array, items: { type: string }, default: [] }
        starred: { type: boolean, default: false }
        role: { type: string, pattern: '^(standard|pre_workout|post_workout)$', default: standard, description: 'Template meal role — selects the scoring rubric overlay (mezo-uavr). Absent ⇒ standard.' }
        ingredients:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RecipeIngredientRequest' }
    RecipeResponse:
      type: object
      required: [id, name, category, servings, tags, starred, role, createdDate, novaDominant, macros, mezoFit, timesLogged, avgScore, lastLogged, ingredients]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slot: { type: string, nullable: true }
        category: { type: string }
        servings: { type: integer }
        prepMins: { type: integer, nullable: true }
        cookMins: { type: integer, nullable: true }
        tags: { type: array, items: { type: string } }
        starred: { type: boolean }
        role: { type: string, description: 'Template meal role: standard|pre_workout|post_workout (mezo-uavr)' }
        createdDate: { type: string }
        novaDominant: { type: integer, description: 'NOVA class 1..4 (converged with meal_item.nova — mezo-2dy)' }
        macros: { $ref: '#/components/schemas/RecipeMacros' }
        nutrients: { $ref: '#/components/schemas/Nutrients' }
        mezoFit: { $ref: '#/components/schemas/RecipeMezoFit' }
        timesLogged: { type: integer }
        avgScore: { type: number }
        lastLogged: { type: string }
        ingredients: { type: array, items: { $ref: '#/components/schemas/RecipeIngredientResponse' } }
    RecipeListResponse:
      type: object
      required: [recipes]
      properties:
        recipes: { type: array, items: { $ref: '#/components/schemas/RecipeResponse' } }
    WorkshopChatMessage:
      type: object
      required: [role, text]
      properties:
        role: { type: string, pattern: '^(user|assistant)$' }
        text: { type: string, minLength: 1, maxLength: 4000 }
    WorkshopDraftLine:
      type: object
      required: [source, name, amount, unit]
      properties:
        source: { type: string, pattern: '^(pantry|estimate)$' }
        pantryItemId: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1 }
        amount: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, minLength: 1 }
        # Estimate lines only — LLM totals for the STATED amount (never per-100). Pantry lines
        # carry null here; their macros are computed from the pantry row, never the LLM.
        kcal: { type: number, nullable: true }
        proteinG: { type: number, nullable: true }
        carbsG: { type: number, nullable: true }
        fatG: { type: number, nullable: true }
    WorkshopDraft:
      type: object
      required: [name, category, servings, steps, lines]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, pattern: '^(breakfast|lunch|dinner|snack)$' }
        servings: { type: integer, minimum: 1, maximum: 12 }
        steps: { type: array, items: { type: string }, maxItems: 20 }
        lines: { type: array, items: { $ref: '#/components/schemas/WorkshopDraftLine' }, maxItems: 30 }
    WorkshopTurnRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        goal: { type: string, nullable: true, pattern: '^(high_protein|pre_workout|post_workout|before_bed|breakfast)$' }
        history: { type: array, items: { $ref: '#/components/schemas/WorkshopChatMessage' }, maxItems: 20, default: [] }
        draft:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/WorkshopDraft' } ]
    WorkshopTurnResponse:
      type: object
      required: [reply, draft]
      properties:
        reply: { type: string }
        draft: { $ref: '#/components/schemas/WorkshopDraft' }
