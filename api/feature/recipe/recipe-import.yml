openapi: 3.0.3
info: { title: mezo recipe-import fragment, version: 1.0.0 }
tags:
  - name: RecipeImport
    description: >-
      Recipe import (Boop B4, decisions 13 and 16): a web page, a photo of a recipe or pasted text becomes a
      DRAFT in the Receptműhely draft shape. Stateless — nothing is saved here; every route ends in the review
      screen, where each ingredient row says what it matched. A page's own machine-readable recipe is read first,
      the AI reads the page only when there is none. Nothing the page says is ever followed as an instruction.
paths:
  /api/recipe/import/url:
    post:
      tags: [RecipeImport]
      operationId: importRecipeFromUrl
      summary: Read a recipe from a web page (structured recipe first, AI fallback) into a review draft
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecipeImportUrlRequest' } } }
      responses:
        '200': { description: 'The draft; result is null when the page carries no readable recipe', content: { application/json: { schema: { $ref: '#/components/schemas/RecipeImportResponse' } } } }
        '400': { description: 'Not an http(s) link to a public host', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '502': { description: 'The page could not be loaded, or the AI answer could not be read', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '503': { description: 'The page has no structured recipe and the AI is not available', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/recipe/import/text:
    post:
      tags: [RecipeImport]
      operationId: importRecipeFromText
      summary: Read a recipe from pasted text into a review draft
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecipeImportTextRequest' } } }
      responses:
        '200': { description: 'The draft; result is null when no recipe could be read', content: { application/json: { schema: { $ref: '#/components/schemas/RecipeImportResponse' } } } }
        '400': { description: 'Empty or over-long text', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '502': { description: 'The AI answer could not be read', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '503': { description: 'The AI is not available', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/recipe/import/photo:
    post:
      tags: [RecipeImport]
      operationId: importRecipeFromPhoto
      summary: Read a recipe from a photo (cookbook page, screenshot) into a review draft; the photo is not kept
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        '200': { description: 'The draft; result is null when no recipe could be read', content: { application/json: { schema: { $ref: '#/components/schemas/RecipeImportResponse' } } } }
        '400': { description: 'Not a JPEG, PNG or WebP picture, empty, or over the size cap', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '502': { description: 'The AI answer could not be read', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '503': { description: 'The AI is not available', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    RecipeImportUrlRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 2048 }
    RecipeImportTextRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
    RecipeImportMatch:
      type: object
      description: >-
        What an ingredient row matched (by name). catalogId is null when it matched nothing; confidence is derived
        deterministically (never taken from the AI); needsReview is true for every unmatched or low-confidence row.
      required: [confidence, needsReview]
      properties:
        catalogId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The catalog food the row's name matched (null = matched nothing). A preview writes nothing: the food
            reaches the owner's shelf only when the recipe is saved with this id as the ingredient's catalogId.
        confidence: { type: number, minimum: 0, maximum: 1 }
        needsReview: { type: boolean }
    RecipeImportLine:
      description: A Receptműhely draft line plus what it matched and the text it was read from.
      allOf:
        - $ref: '#/components/schemas/WorkshopDraftLine'
        - type: object
          required: [match]
          properties:
            match: { $ref: '#/components/schemas/RecipeImportMatch' }
            sourceText:
              type: string
              nullable: true
              description: 'The ingredient line as the page, photo or text wrote it'
    RecipeImportDraft:
      type: object
      required: [name, category, servings, steps, lines]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, pattern: '^(breakfast|lunch|dinner|snack)$' }
        servings: { type: integer, minimum: 1, maximum: 12 }
        steps: { type: array, items: { type: string }, maxItems: 20 }
        lines: { type: array, items: { $ref: '#/components/schemas/RecipeImportLine' }, maxItems: 30 }
        sourceUrl: { type: string, nullable: true, description: 'Where the recipe came from (URL route only)' }
        cookedWeightG: { type: number, nullable: true, description: 'Weight of the finished dish when the source states it' }
        structured: { type: boolean, description: 'True when the page carried a machine-readable recipe (no AI read it)' }
        needsReview: { type: boolean, description: 'True when any ingredient row needs a look' }
    RecipeImportResponse:
      type: object
      properties:
        result:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/RecipeImportDraft' } ]
