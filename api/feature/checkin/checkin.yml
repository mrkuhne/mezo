openapi: 3.0.3
info:
  title: ''
  version: ''
tags:
  - name: CheckIn
    description: Daily check-in slots (biometrics)
paths:
  /api/biometrics/checkin:
    get:
      tags: [CheckIn]
      operationId: listCheckInsForDay
      summary: Check-ins of the current user for one day
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Check-ins for the given day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckInResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags: [CheckIn]
      operationId: saveCheckIn
      summary: Upsert a check-in slot (find-or-new on date + slotTime)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCheckInRequest'
      responses:
        '200':
          description: Saved (upsert — 200, not 201)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/biometrics/checkin/plan:
    get:
      tags: [CheckIn]
      operationId: getCheckInPlan
      summary: The question plan for one check-in slot (slot items + the question of the day)
      description: >-
        Check-in 2.0 (mezo-ck2). The slot's items come from server config (mezo.checkin.plan);
        the adaptive "question of the day" is chosen server-side (80 % need / 20 % random) and is
        stable for (user, date, slotTime), so reopening the sheet never reshuffles it.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: slotTime
          in: query
          required: true
          description: One of the configured slot times (e.g. "06:30")
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The plan for the slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInPlanResponse'
        '400':
          description: Unknown slot time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
components:
  schemas:
    SaveCheckInRequest:
      type: object
      required:
        - date
        - slotTime
        - state
      properties:
        date:
          type: string
          format: date
        slotTime:
          type: string
          minLength: 1
          description: Slot identifier as shown in the UI (e.g. "08:00")
        state:
          type: string
          pattern: '^(done|now|skipped|pending)$'
        energy:
          type: integer
          minimum: 1
          maximum: 10
        stress:
          type: integer
          minimum: 1
          maximum: 10
        body:
          type: integer
          minimum: 1
          maximum: 10
        mental:
          type: integer
          minimum: 1
          maximum: 10
        mood:
          type: integer
          minimum: 1
          maximum: 10
          description: '"Hangulat" 1 (very bad) .. 10 (very good); null = not answered'
        rested:
          type: integer
          minimum: 1
          maximum: 10
          description: '"Kipihentség" 1..10; null = not answered'
        soreness:
          type: integer
          minimum: 1
          maximum: 10
          description: '"Izomláz" 1 (none) .. 10 (very strong) — 10 = worse; null = not answered'
        pain:
          type: boolean
          description: '"Fáj valami?" — true = yes, false = "Nem", null = not answered'
        painRegions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PainRegion'
        painIntensity:
          type: integer
          minimum: 1
          maximum: 10
        motivation:
          type: integer
          minimum: 1
          maximum: 10
          description: '"Motiváció" 1..10; null = not answered'
        hunger:
          type: integer
          minimum: 1
          maximum: 10
          description: '"Éhség" 1..10; null = not answered'
        craving:
          type: integer
          minimum: 1
          maximum: 10
          description: '"Sóvárgás" 1..10; null = not answered'
        cravingKinds:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CravingKind'
        digestion:
          type: integer
          minimum: 1
          maximum: 10
          description: '"Emésztés" 1 (heavy, bloated) .. 10 (light, fine); null = not answered'
        connection:
          type: integer
          minimum: 1
          maximum: 10
          description: '"Kapcsolódás" 1 (alone) .. 10 (very connected); null = not answered'
        dayRating:
          type: integer
          minimum: 1
          maximum: 10
          description: '"A nap mérlege" (item id `day`) 1..10; null = not answered'
        askedItems:
          type: array
          nullable: true
          description: What the sheet showed (plan + adaptive). Asked + null = skipped; absent = not asked. Null on legacy rows.
          items:
            $ref: '#/components/schemas/CheckInItemId'
        adaptiveItem:
          $ref: '#/components/schemas/CheckInItemId'
        adaptiveReason:
          $ref: '#/components/schemas/AdaptiveReason'
        quickExit:
          type: boolean
          description: Saved via "Most csak ennyi" after the core items
        note:
          type: string
          description: Optional free-form note, without an application character limit.
    CheckInResponse:
      type: object
      required:
        - id
        - date
        - slotTime
        - state
        - savedAt
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        slotTime:
          type: string
        state:
          type: string
        energy:
          type: integer
        stress:
          type: integer
        body:
          type: integer
        mental:
          type: integer
        mood:
          type: integer
          description: '"Hangulat" 1 (very bad) .. 10 (very good); null = not answered'
        rested:
          type: integer
          description: '"Kipihentség" 1..10; null = not answered'
        soreness:
          type: integer
          description: '"Izomláz" 1 (none) .. 10 (very strong) — 10 = worse; null = not answered'
        pain:
          type: boolean
          description: '"Fáj valami?" — true = yes, false = "Nem", null = not answered'
        painRegions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PainRegion'
        painIntensity:
          type: integer
        motivation:
          type: integer
          description: '"Motiváció" 1..10; null = not answered'
        hunger:
          type: integer
          description: '"Éhség" 1..10; null = not answered'
        craving:
          type: integer
          description: '"Sóvárgás" 1..10; null = not answered'
        cravingKinds:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/CravingKind'
        digestion:
          type: integer
          description: '"Emésztés" 1 (heavy, bloated) .. 10 (light, fine); null = not answered'
        connection:
          type: integer
          description: '"Kapcsolódás" 1 (alone) .. 10 (very connected); null = not answered'
        dayRating:
          type: integer
          description: '"A nap mérlege" (item id `day`) 1..10; null = not answered'
        askedItems:
          type: array
          nullable: true
          description: What the sheet showed (plan + adaptive). Asked + null = skipped; absent = not asked. Null on legacy rows.
          items:
            $ref: '#/components/schemas/CheckInItemId'
        adaptiveItem:
          $ref: '#/components/schemas/CheckInItemId'
        adaptiveReason:
          $ref: '#/components/schemas/AdaptiveReason'
        quickExit:
          type: boolean
          description: Saved via "Most csak ennyi" after the core items
        note:
          type: string
          description: Optional free-form note, without an application character limit.
        savedAt:
          type: string
          format: date-time
    CheckInItemId:
      type: string
      description: Check-in 2.0 item ids (core five first)
      enum:
        - energy
        - mood
        - stress
        - body
        - mental
        - rested
        - soreness
        - pain
        - motivation
        - hunger
        - craving
        - digestion
        - connection
        - day
    CheckInItemKind:
      type: string
      description: How the sheet renders the item — a 1..10 scale, the pain gate (yes/no → regions → intensity), or the craving scale (+ kinds from 4)
      enum:
        - SCALE
        - PAIN
        - CRAVING
    PainRegion:
      type: string
      enum:
        - FEJ
        - NYAK
        - VALL
        - KONYOK
        - CSUKLO_KEZ
        - FELSO_HAT
        - DEREK
        - CSIPO
        - HAS
        - TERD
        - BOKA_LABFEJ
        - EGYEB
    CravingKind:
      type: string
      enum:
        - EDES
        - SOS
        - ZSIROS
        - BARMIT
    AdaptiveReason:
      type: string
      description: Why the question of the day was chosen — need (thinnest wanted series) or random (20 % planned-missingness guard)
      enum:
        - NEED
        - RANDOM
    CheckInPlanOption:
      type: object
      description: A selectable sub-option with its Hungarian label (pain region or craving kind)
      required: [id, label]
      properties:
        id:
          type: string
          description: PainRegion or CravingKind value
        label:
          type: string
    CheckInPlanItem:
      type: object
      required: [id, label, question, kind]
      properties:
        id:
          $ref: '#/components/schemas/CheckInItemId'
        label:
          type: string
          description: Hungarian display label (e.g. "Energia")
        question:
          type: string
          description: Hungarian question (e.g. "Mennyi energia van benned most?")
        low:
          type: string
          description: Anchor of 1 (for PAIN the intensity scale's anchor)
        high:
          type: string
          description: Anchor of 10 (for PAIN the intensity scale's anchor)
        kind:
          $ref: '#/components/schemas/CheckInItemKind'
        options:
          type: array
          description: PAIN → the regions, CRAVING → the kinds; absent for SCALE
          items:
            $ref: '#/components/schemas/CheckInPlanOption'
    CheckInAdaptiveItem:
      type: object
      description: The question of the day — a CheckInPlanItem plus why it was chosen
      required: [id, label, question, kind, why, reason]
      properties:
        id:
          $ref: '#/components/schemas/CheckInItemId'
        label:
          type: string
        question:
          type: string
        low:
          type: string
        high:
          type: string
        kind:
          $ref: '#/components/schemas/CheckInItemKind'
        options:
          type: array
          items:
            $ref: '#/components/schemas/CheckInPlanOption'
        why:
          type: string
          description: One Hungarian sentence shown under "A NAP KÉRDÉSE"
        reason:
          $ref: '#/components/schemas/AdaptiveReason'
    CheckInPlanResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: The slot's plan in ask order (core five first)
          items:
            $ref: '#/components/schemas/CheckInPlanItem'
        adaptive:
          $ref: '#/components/schemas/CheckInAdaptiveItem'
