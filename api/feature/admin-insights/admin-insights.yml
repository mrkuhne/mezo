openapi: 3.0.3
info:
  title: mezo admin-insights fragment
  version: 1.0.0
tags:
  - name: AdminInsights
    description: >
      OWNER-only installation insights. Every operation returns 403 AUTH_FORBIDDEN
      for a non-owner. Read-only; nothing here writes.
paths:
  /api/admin/overview:
    get:
      tags: [AdminInsights]
      operationId: getAdminOverview
      summary: Installation-wide counters and 30-day series (AdminInsights)
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverviewResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/admin/users-insight:
    get:
      tags: [AdminInsights]
      operationId: listAdminUserInsights
      summary: Accounts enriched with footprint, cost and activity (AdminInsights)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [name, createdAt, lastActivityAt, rowCount, cost30dUsd, activeDays30d], default: lastActivityAt }
        - { name: dir, in: query, required: false, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUserInsightResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/admin/users/{id}/insight:
    get:
      tags: [AdminInsights]
      operationId: getAdminUserInsight
      summary: One user's 90-day activity, data inventory, features and cost (AdminInsights)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetailResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such user (ADMIN_USER_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/admin/usage/features:
    get:
      tags: [AdminInsights]
      operationId: getAdminFeatureUsage
      summary: Feature x day counts for LLM and domain features (AdminInsights)
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, enum: ['7d','30d','90d'], default: '30d' } }
      responses:
        '200':
          description: Feature usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFeatureUsageResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/admin/usage/cost-matrix:
    get:
      tags: [AdminInsights]
      operationId: getAdminCostMatrix
      summary: User x feature LLM cost, ERROR calls excluded (AdminInsights)
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, enum: ['7d','30d','90d'], default: '30d' } }
      responses:
        '200':
          description: Cost matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCostMatrixResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/admin/usage/screens:
    get:
      tags: [AdminInsights]
      operationId: getAdminScreenUsage
      summary: Screen views/uniques from the lean screen_event log (AdminInsights)
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, enum: ['7d','30d','90d'], default: '30d' } }
      responses:
        '200':
          description: Screen usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminScreenUsageResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/admin/alerts:
    get:
      tags: [AdminInsights]
      operationId: getAdminAlerts
      summary: Owner status band — evaluated alert rules
      responses:
        '200':
          description: Evaluated alerts (empty list = all good)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAlertsResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/admin/features:
    get:
      tags: [AdminInsights]
      operationId: getAdminFeatureBoard
      summary: Feature scorecard — usage, feedback, cost and reliability per feature (AdminInsights)
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, enum: ['30d','90d'], default: '30d' } }
      responses:
        '200':
          description: Feature scorecard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFeatureBoardResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/admin/features/{key}:
    get:
      tags: [AdminInsights]
      operationId: getAdminFeatureDetail
      summary: One feature's usage, funnel, feedback trend, reliability and cost breakdown (AdminInsights)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: period, in: query, required: false, schema: { type: string, enum: ['30d','90d'], default: '30d' } }
      responses:
        '200':
          description: Feature detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFeatureDetailResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No such feature key (ADMIN_FEATURE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/admin/feedback/summary:
    get:
      tags: [AdminInsights]
      operationId: getAdminFeedbackSummary
      summary: Per-feature feedback (helped/didn't) and recall totals (AdminInsights)
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, enum: ['30d','90d'], default: '30d' } }
      responses:
        '200':
          description: Feedback summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFeedbackSummaryResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    AdminDayCount:
      type: object
      required: [day, count]
      properties:
        day: { type: string, format: date }
        count: { type: integer, format: int64 }
    AdminDaySeries:
      type: object
      required: [key, days]
      properties:
        key: { type: string, description: 'domain or metric key, e.g. train, food, activeUsers, costUsd' }
        days:
          type: array
          items: { $ref: '#/components/schemas/AdminDayCount' }
    AdminDayAmount:
      type: object
      required: [day, amountUsd]
      properties:
        day: { type: string, format: date }
        amountUsd: { type: number, format: double }
    AdminOverviewResponse:
      type: object
      required:
        [userCount, activeToday, active7d, active30d, loggedToday, costTodayUsd,
         memoryItemCount, vectorCount, activeUserSeries, domainSeries, costSeries]
      properties:
        userCount: { type: integer, format: int64 }
        activeToday: { type: integer, format: int64 }
        active7d: { type: integer, format: int64 }
        active30d: { type: integer, format: int64 }
        loggedToday:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: 'domain key -> rows logged today (train, food, sleep, journal, habits, chat)'
        costTodayUsd: { type: number, format: double }
        memoryItemCount: { type: integer, format: int64 }
        vectorCount: { type: integer, format: int64 }
        activeUserSeries:
          type: array
          items: { $ref: '#/components/schemas/AdminDayCount' }
        domainSeries:
          type: array
          items: { $ref: '#/components/schemas/AdminDaySeries' }
        costSeries:
          type: array
          items: { $ref: '#/components/schemas/AdminDayAmount' }
    AdminUserInsightResponse:
      type: object
      required: [id, email, name, role, status, createdAt, rowCount, vectorCount, cost30dUsd, activeDays30d]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [OWNER, USER] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        createdAt: { type: string, format: date-time }
        onboardedAt: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        lastActivityAt: { type: string, format: date-time, nullable: true }
        rowCount: { type: integer, format: int64 }
        vectorCount: { type: integer, format: int64 }
        cost30dUsd: { type: number, format: double }
        activeDays30d: { type: integer, format: int32 }
    AdminTableFootprint:
      type: object
      required: [table, rowCount, deletedCount]
      properties:
        table: { type: string }
        rowCount: { type: integer, format: int64 }
        deletedCount: { type: integer, format: int64 }
        lastCreatedAt: { type: string, format: date-time, nullable: true }
    AdminFeatureCost:
      type: object
      required: [feature, calls, costUsd, unknownCalls]
      properties:
        feature: { type: string }
        calls: { type: integer, format: int64 }
        costUsd: { type: number, format: double }
        unknownCalls: { type: integer, format: int64 }
    AdminUserDetailResponse:
      type: object
      required: [user, activitySeries, inventory, featureUsage30d, costByFeature30d]
      properties:
        user: { $ref: '#/components/schemas/AdminUserInsightResponse' }
        activitySeries:
          type: array
          items: { $ref: '#/components/schemas/AdminDaySeries' }
        inventory:
          type: array
          items: { $ref: '#/components/schemas/AdminTableFootprint' }
        featureUsage30d:
          type: object
          additionalProperties: { type: integer, format: int64 }
        costByFeature30d:
          type: array
          items: { $ref: '#/components/schemas/AdminFeatureCost' }
    AdminFeatureUsageResponse:
      type: object
      required: [period, days, features]
      properties:
        period: { type: string }
        days:
          type: array
          items: { type: string, format: date }
        features:
          type: array
          items: { $ref: '#/components/schemas/AdminDaySeries' }
    AdminCostMatrixCell:
      type: object
      required: [userId, feature, calls, costUsd, unknownCalls]
      properties:
        userId: { type: string, format: uuid, nullable: true, description: 'null = the Hatter (background/cron) bucket' }
        feature: { type: string }
        calls: { type: integer, format: int64 }
        costUsd: { type: number, format: double }
        unknownCalls: { type: integer, format: int64 }
    AdminCostMatrixUser:
      type: object
      required: [id, label]
      properties:
        id: { type: string, format: uuid, nullable: true }
        label: { type: string }
    AdminCostMatrixResponse:
      type: object
      required: [period, users, features, cells, totalUsd]
      properties:
        period: { type: string }
        users:
          type: array
          items: { $ref: '#/components/schemas/AdminCostMatrixUser' }
        features:
          type: array
          items: { type: string }
        cells:
          type: array
          items: { $ref: '#/components/schemas/AdminCostMatrixCell' }
        totalUsd: { type: number, format: double }
    AdminScreenUsageRow:
      type: object
      required: [screen, views, uniqueUsers, days]
      properties:
        screen: { type: string, description: 'The matched route pattern the client reported' }
        views: { type: integer, format: int64 }
        uniqueUsers: { type: integer, format: int64 }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        days:
          type: array
          description: Dense daily view counts over the window (AdminSeries.dense) — the sparkline
          items: { $ref: '#/components/schemas/AdminDayCount' }
    AdminScreenUsageResponse:
      type: object
      required: [period, days, screens]
      properties:
        period: { type: string }
        days:
          type: array
          items: { type: string, format: date }
        screens:
          type: array
          items: { $ref: '#/components/schemas/AdminScreenUsageRow' }
    AdminAlertsResponse:
      type: object
      required: [generatedAt, alerts]
      properties:
        generatedAt: { type: string, format: date-time }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/AdminAlert' }
    AdminAlert:
      type: object
      required: [key, severity, title, detail, link]
      properties:
        key: { type: string, description: 'stable rule key, e.g. cost_spike' }
        severity: { type: string, enum: [info, warn, bad] }
        title: { type: string, description: 'Hungarian, owner-facing' }
        detail: { type: string, description: 'Hungarian, one sentence' }
        link: { type: string, description: 'in-admin deep link with query params' }
        subject:
          type: string
          description: 'raw technical key the alert is about, e.g. a feature slug — the client renders its label'
    AdminFeatureHelped:
      type: object
      required: [up, down]
      properties:
        up: { type: integer, format: int32 }
        down: { type: integer, format: int32 }
    AdminFeatureRow:
      type: object
      required:
        [key, kind, uniqueUsers, usesPerWeek, habitUserShare, helped, acceptedShare, costUsd,
         costPerUse, unknownCalls, errorPct, p90LatencyMs, screenViews]
      properties:
        key: { type: string, description: 'feature slug (LLM feature or domain featureMap key)' }
        kind: { type: string, enum: [ai, domain, both, system] }
        uniqueUsers: { type: integer, format: int64 }
        usesPerWeek:
          type: array
          items: { type: integer, format: int32 }
          description: 'Fixed length 12, oldest -> newest ISO week, dense-filled (0 for silent weeks). Not enforced by the schema.'
        habitUserShare: { type: number, format: double, description: 'habit users / tried users in period; 0 when nobody tried' }
        helped:
          allOf: [ { $ref: '#/components/schemas/AdminFeatureHelped' } ]
          nullable: true
          description: 'null when the companion switch is off OR the feature has no mapped feedback surface'
        acceptedShare:
          type: number
          format: double
          nullable: true
          description: 'Always null until ai_draft_outcome ships (slice 8) — the contract carries the field now.'
        costUsd: { type: number, format: double }
        costPerUse: { type: number, format: double, nullable: true, description: 'null when there were zero non-ERROR calls' }
        unknownCalls: { type: integer, format: int64 }
        errorPct: { type: number, format: double, nullable: true, description: 'null below the minimum-calls floor' }
        p90LatencyMs: { type: integer, format: int32, nullable: true, description: 'null when there is no latency sample in period. Latency percentiles include failed (ERROR) calls — they measure experienced latency.' }
        screenViews: { type: integer, format: int64, nullable: true, description: 'null until a feature-to-screen mapping exists (slice 4 decides)' }
    AdminFeatureBoardResponse:
      type: object
      required: [period, rows]
      properties:
        period: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/AdminFeatureRow' }
    AdminFeatureFunnel:
      type: object
      required: [tried, repeated, habitual, triedUsers]
      properties:
        tried: { type: integer, format: int32, description: '>=1 use in the period' }
        repeated: { type: integer, format: int32, description: 'uses on >=2 distinct days' }
        habitual: { type: integer, format: int32, description: 'active in >=3 of the last 4 ISO weeks' }
        triedUsers:
          type: array
          items: { type: string }
          description: 'names, beta-scale — never paginated'
    AdminFeatureFeedbackPoint:
      type: object
      required: [week, up, down]
      properties:
        week: { type: string, description: 'ISO week, e.g. 2026-W12' }
        up: { type: integer, format: int32 }
        down: { type: integer, format: int32 }
    AdminFeatureDownReason:
      type: object
      required: [reason, count]
      properties:
        reason: { type: string }
        count: { type: integer, format: int32 }
    AdminFeatureTopError:
      type: object
      required: [code, count]
      properties:
        code: { type: string }
        count: { type: integer, format: int32 }
    AdminFeatureReliability:
      type: object
      required: [errorPct, p90LatencyMs, p50LatencyMs, topErrors]
      properties:
        errorPct: { type: number, format: double, nullable: true }
        p90LatencyMs: { type: integer, format: int32, nullable: true, description: 'Latency percentiles include failed (ERROR) calls — they measure experienced latency.' }
        p50LatencyMs: { type: integer, format: int32, nullable: true, description: 'Latency percentiles include failed (ERROR) calls — they measure experienced latency.' }
        topErrors:
          type: array
          items: { $ref: '#/components/schemas/AdminFeatureTopError' }
    AdminFeatureModelCost:
      type: object
      required: [model, costUsd, calls]
      properties:
        model: { type: string }
        costUsd: { type: number, format: double }
        calls: { type: integer, format: int64 }
    AdminFeatureTopUser:
      type: object
      required: [name, costUsd, uses]
      properties:
        name: { type: string, description: 'deleted users fall back to an id-string, per AdminUsageService' }
        costUsd: { type: number, format: double }
        uses: { type: integer, format: int64 }
    AdminFeatureDetailResponse:
      type: object
      required:
        [key, kind, usageByWeek, funnel, feedbackTrend, downReasons, reliability, costByModel, topUsers]
      properties:
        key: { type: string }
        kind: { type: string, enum: [ai, domain, both, system] }
        usageByWeek:
          type: array
          items: { type: integer, format: int32 }
          description: 'Fixed length 12, oldest -> newest ISO week. Not enforced by the schema.'
        funnel: { $ref: '#/components/schemas/AdminFeatureFunnel' }
        feedbackTrend:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/AdminFeatureFeedbackPoint' }
          description: 'Bucketed on message_feedback.updated_at — a flipped vote re-dates. null when companion-off or the feature is unmapped.'
        downReasons:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/AdminFeatureDownReason' }
          description: 'null when companion-off or the feature is unmapped'
        reliability: { $ref: '#/components/schemas/AdminFeatureReliability' }
        costByModel:
          type: array
          items: { $ref: '#/components/schemas/AdminFeatureModelCost' }
        topUsers:
          type: array
          items: { $ref: '#/components/schemas/AdminFeatureTopUser' }
    AdminFeedbackRecall:
      type: object
      required: [useful, irrelevant, suppress]
      properties:
        useful: { type: integer, format: int32 }
        irrelevant: { type: integer, format: int32 }
        suppress: { type: integer, format: int32 }
    AdminFeedbackFeatureSummary:
      type: object
      required: [key, up, down, reasons]
      properties:
        key: { type: string }
        up: { type: integer, format: int32 }
        down: { type: integer, format: int32 }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/AdminFeatureDownReason' }
    AdminFeedbackSummaryResponse:
      type: object
      required: [period, features, recall]
      properties:
        period: { type: string }
        features:
          type: array
          items: { $ref: '#/components/schemas/AdminFeedbackFeatureSummary' }
        recall:
          allOf: [ { $ref: '#/components/schemas/AdminFeedbackRecall' } ]
          nullable: true
          description: 'null when the companion feature switch is off'
