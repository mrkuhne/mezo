openapi: 3.0.3
info:
  title: ''
  version: ''
tags:
  - name: BiometricProfile
    description: Body-composition profile — the TDEE bootstrap inputs (one per owner)
paths:
  /api/biometrics/profile:
    get:
      tags: [BiometricProfile]
      operationId: getBiometricProfile
      summary: The owner's biometric profile
      description: >-
        Never 404s: having no profile yet is a normal state, answered with 200 and an empty profile
        — an object whose every field is null (mezo-5cmq).
      responses:
        '200': { description: 'Profile, or an all-null empty profile when the owner has none yet', content: { application/json: { schema: { $ref: '#/components/schemas/BiometricProfileResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    put:
      tags: [BiometricProfile]
      operationId: upsertBiometricProfile
      summary: Create or replace the owner's biometric profile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BiometricProfileUpsertRequest' } } }
      responses:
        '200': { description: Upserted, content: { application/json: { schema: { $ref: '#/components/schemas/BiometricProfileResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    BiometricProfileResponse:
      type: object
      # Nothing configures Jackson's property inclusion, so Include.ALWAYS applies and an empty
      # profile goes over the wire as an object with every field NULL — not as `{}`. Hence: no
      # `required` block AND `nullable: true` on the erstwhile-required trio, so the schema, the
      # generated types and the actual bytes agree (mezo-5cmq).
      description: >-
        Every field is optional AND nullable: an owner with no profile row yet gets a 200 with an
        empty profile — an object whose every field is null — not a 404 (mezo-5cmq). The UPSERT
        request keeps its required trio.
      properties:
        sex: { type: string, enum: [M, F], nullable: true }
        heightCm: { type: number, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        bodyFatPct: { type: number, nullable: true }
        # Physical-activity level (PAL bucket) — a TDEE-bootstrap input. Nullable until set;
        # defaulted to MIXED server-side when absent.
        activityLevel: { type: string, enum: [DESK, MIXED, PHYSICAL], nullable: true }
        # Derived (NOT persisted) base-TDEE bootstrap — computed from this profile + the latest
        # weigh-in. Null when there is no profile-and-weight pair. Cross-feature $ref to the goal
        # fragment's TdeeBootstrap (the merge flattens all fragments into one components.schemas).
        tdeeBootstrap: { allOf: [ { $ref: '#/components/schemas/TdeeBootstrap' } ], nullable: true }
    BiometricProfileUpsertRequest:
      type: object
      required: [sex, heightCm, birthDate]
      properties:
        sex: { type: string, pattern: '^(M|F)$' }
        heightCm: { type: number, minimum: 50, maximum: 260 }
        birthDate: { type: string, format: date }
        bodyFatPct: { type: number, nullable: true, minimum: 0, maximum: 75 }
        # Optional PAL bucket; server defaults to MIXED server-side when absent.
        activityLevel: { type: string, enum: [DESK, MIXED, PHYSICAL], nullable: true }
