        kind: { type: string, enum: [mesocycle, deload, kimelo, season, other], description: 'other = another change he logged himself inside the window (a new supplement in the stack, a journal line saying he started something)' }
        date: { type: string, format: date }
        text: { type: string, description: 'One Hungarian line („Közben új edzésblokk indult”)' }
    SeasonExperimentCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        subjectKind: { type: string, enum: [supplement, recipe, food, habit, text], default: habit }
        subjectRef: { type: string, format: uuid, nullable: true }
        lengthDays: { type: integer, minimum: 7, maximum: 28, default: 14 }
    SeasonExperimentMark:
      type: object
