openapi: 3.0.3
info: { title: mezo season fragment, version: 1.0.0 }
tags:
  - name: Season
    description: >
      Boop B6 Évad (mezo-r36n9.16) — one N-week season that owns its goal (1:1), the weekly gym + sport slots and the
      training block (through goal_plan_link), derives the food targets, the sleep need and the weight course, and
      previews every change without persisting anything. Nothing changes until the owner accepts (activate / apply).
      A value the server cannot compute is null — the phone leaves it out, it never invents one.
paths:
  /api/seasons:
    get:
      tags: [Season]
      operationId: listSeasons
      summary: The owner's seasons, newest start first
      responses:
        '200':
          description: Seasons
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SeasonResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Season]
      operationId: createSeason
      summary: Create a planned season (and its planned goal) from a draft — activates nothing
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonDraft' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/draft:
    get:
      tags: [Season]
      operationId: getFirstSeasonDraft
      summary: A season draft assembled from the live goal, the running block, the weekly slots and the sleep goal (persists nothing)
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonDraft' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/draft/preview:
    post:
      tags: [Season]
      operationId: previewSeasonDraft
      summary: The live consequences of a draft before any season exists (the new-season summary). Persists nothing; before = the current state
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonDraft' } } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonPreview' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/adherence:
    get:
      tags: [Season]
      operationId: getAdherence
      summary: >
        The single source of day judgement (food inside the day's band, the planned session done, the night long enough),
        served for every day whether or not a season exists (without one the food budget is the goal's served target).
        Today, kímélő days (any fuel recovery mode — the same rule as the Étel Hét tab) and unlogged days are not judged; reasoned skips excuse a session.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Days, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonAdherenceResponse' } } } }
        '400': { description: 'Validation error (to before from, or more than 62 days)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/active/overview:
    get:
      tags: [Season]
      operationId: getSeasonOverview
      summary: The one read model the Évad tab renders
      responses:
        '200': { description: Overview, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonOverview' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: No active season (the phone shows the empty state), content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Season]
      operationId: applySeason
      summary: Apply a previewed draft in one transaction (goal, slots, sleep need, block, revision). A stale fingerprint is 409 SEASON_PREVIEW_STALE
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonApply' } } }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'SEASON_PREVIEW_STALE (fingerprint moved — it covers the running block''s days too), SEASON_NOT_EDITABLE, SEASON_BLOCK_NEEDS_GYM_DAY (no gym day left while the block runs), or TRAIN_DAY_WORKOUT_RUNNING (a block day that would be dropped has a workout running)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/{id}/activate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Season]
      operationId: activateSeason
      summary: Activate a planned season — its goal, the slots, the sleep need and the block in one transaction; the previous active season closes
      responses:
        '200': { description: Activated, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: SEASON_NOT_EDITABLE, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/{id}/close:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Season]
      operationId: closeSeason
      summary: Close a season
      responses:
        '200': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/{id}/preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Season]
      operationId: previewSeason
      summary: The live consequences of a change to this season — before = the season as it is, after = the draft. Persists nothing
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonDraft' } } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonPreview' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/{id}/rules:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Season]
      operationId: putSeasonRules
      summary: Change the season's switches (no kcal effect, so no preview)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonRules' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/menu:
    get:
      tags: [Season]
      operationId: getMenuWeek
      summary: The menu of one week (S3). status none = no menu yet, seeding = the season allows no recipe yet
      parameters:
        - { name: weekStart, in: query, required: true, schema: { type: string, format: date }, description: 'The Monday of the week' }
      responses:
        '200': { description: Menu week, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonMenuWeek' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No active season', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/menu/generate:
    post:
      tags: [Season]
      operationId: generateMenuWeek
      summary: Plan (or re-plan, „Kérek másikat”) a proposed menu week from the allowed recipes and each day's budget. An approved week is not re-planned
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonMenuGenerate' } } }
      responses:
        '200': { description: Menu week, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonMenuWeek' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No active season', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'MENU_NOT_PROPOSED — the week is already approved', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/menu/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Season]
      operationId: approveMenuWeek
      summary: Approve a proposed week — its meals become the Étel day plan's suggestions and its shopping list is made. Idempotent
      responses:
        '200': { description: Menu week, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonMenuWeek' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/menu/meals/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Season]
      operationId: swapMenuMeal
      summary: Put another allowed recipe into this meal's window (scaled to it); on an approved week the shopping list follows
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonMenuChoice' } } }
      responses:
        '200': { description: Menu week, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonMenuWeek' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/menu/meals/{id}/alternatives:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Season]
      operationId: listMenuAlternatives
      summary: Allowed recipes that fit this meal's window, fitting ones first
      responses:
        '200': { description: Alternatives, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SeasonMenuAlternative' } } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/recipes:
    get:
      tags: [Season]
      operationId: listSeasonRecipes
      summary: Every recipe of his with whether the active season allows it and whether his rules let it into a menu
      responses:
        '200': { description: Recipes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SeasonRecipeOption' } } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No active season', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/{id}/recipes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Season]
      operationId: putSeasonRecipes
      summary: Replace the recipes the season allows (no kcal effect, so no preview)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonRecipeIds' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'SEASON_NOT_EDITABLE', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/shopping:
    get:
      tags: [Season]
      operationId: getShoppingList
      summary: The shopping list of an approved menu week (404 when that week has none)
      parameters:
        - { name: weekStart, in: query, required: true, schema: { type: string, format: date }, description: 'The Monday of the week' }
      responses:
        '200': { description: List, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingListResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No list for that week', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/shopping/lists:
    get:
      tags: [Season]
      operationId: listShoppingLists
      summary: His lists, newest week first (past lists stay readable)
      responses:
        '200': { description: Lists, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShoppingListSummary' } } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/shopping/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Season]
      operationId: checkShoppingItem
      summary: Tick a line off (or back on)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingItemCheck' } } }
      responses:
        '200': { description: Line, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingItem' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/shopping/{id}/staples:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Season]
      operationId: toggleShoppingStaple
      summary: Put one of his staples on this list (on = true) or take it off — staples join a list only on his tap
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingStapleToggle' } } }
      responses:
        '200': { description: List, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingListResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/staples:
    get:
      tags: [Season]
      operationId: listStaples
      summary: His always-at-home items (the default six until he sets his own)
      responses:
        '200': { description: Staples, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonStaples' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    put:
      tags: [Season]
      operationId: putStaples
      summary: Replace his staples
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonStaples' } } }
      responses:
        '200': { description: Staples, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonStaples' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/experiments:
    get:
      tags: [Season]
      operationId: listExperiments
      summary: 'S4 — the Hatás tab: the open proposal (at most one), the running experiment (at most one) and the finished ones, newest first. Finishes a running experiment whose window is over and runs the proposal detector first'
      responses:
        '200': { description: Experiments, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonExperiments' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No active season', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Season]
      operationId: createExperiment
      summary: 'Start an experiment he names himself („Új kísérlet”, „Újra kipróbálom”) — it runs from today'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonExperimentCreate' } } }
      responses:
        '200': { description: Experiment, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonExperiment' } } } }
        '400': { description: 'Validation error', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No active season', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'EXPERIMENT_ALREADY_RUNNING — one runs at a time', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/experiments/{id}/start:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Season]
      operationId: startExperiment
      summary: 'Start a proposed experiment („Indulhat”) — it runs from today'
      responses:
        '200': { description: Experiment, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonExperiment' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'EXPERIMENT_ALREADY_RUNNING — one runs at a time; EXPERIMENT_NOT_PROPOSED — not a proposal any more', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/experiments/{id}/days:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Season]
      operationId: markExperimentDay
      summary: 'Mark (or unmark) one day of a running experiment as done. Only days inside the window, never in the future'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonExperimentMark' } } }
      responses:
        '200': { description: Experiment, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonExperiment' } } } }
        '400': { description: 'EXPERIMENT_DAY_OUTSIDE — the day is outside the window or in the future', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'EXPERIMENT_NOT_RUNNING', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/experiments/{id}/dismiss:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Season]
      operationId: dismissExperiment
      summary: 'Dismiss a proposal („Most nem”) or stop a running experiment („Leállítom”) — status dismissed. Idempotent'
      responses:
        '200': { description: Experiment, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonExperiment' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/seasons/experiments/{id}/keep:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Season]
      operationId: keepExperiment
      summary: '„Megtartom szokásnak” — a finished experiment becomes a season rule line every AI context reads. Idempotent'
      responses:
        '200': { description: Experiment, content: { application/json: { schema: { $ref: '#/components/schemas/SeasonExperiment' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'EXPERIMENT_NOT_DONE — only a finished experiment can be kept', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    SeasonSportSlot:
      type: object
      required: [dayOfWeek, time, durationMin, sport]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6, description: '0 = hétfő .. 6 = vasárnap' }
        time: { type: string, pattern: '^\d{2}:\d{2}$' }
        durationMin: { type: integer, minimum: 15, maximum: 360 }
        sport: { type: string, pattern: '^(volleyball|cross|trx|bike|swim|football|basketball|tennis|hike|running|other)$' }
    SeasonSleepAnchor:
      type: object
      required: [anchor, time]
      properties:
        anchor: { type: string, enum: [WAKE, BED] }
        time: { type: string, pattern: '^\d{2}:\d{2}$' }
    SeasonBlockChoice:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [adopt, rerun, template] }
        mesocycleId: { type: string, format: uuid, nullable: true, description: 'adopt / rerun: the mesocycle' }
        templateId: { type: string, format: uuid, nullable: true, description: 'template: the template' }
    SeasonDraft:
      type: object
      required: [title, trajectory, startDate, weeks, gymDays, sport, allowedRecipeIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        trajectory: { type: string, enum: [cut, bulk, maintain] }
        targetWeightKg: { type: number, nullable: true, minimum: 0, description: 'cut / bulk only' }
        ratePctPerWeek: { type: number, nullable: true, minimum: 0, maximum: 2, description: 'Weekly pace in %BW; when set (and no target) the target follows from it' }
        kgPerWeek: { type: number, nullable: true, minimum: 0, maximum: 2, description: 'Weekly pace in kg; alternative to ratePctPerWeek' }
        startDate: { type: string, format: date }
        weeks: { type: integer, minimum: 4, maximum: 24 }
        gymDays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 'Gym weekdays, 0 = hétfő' }
        gymTime: { type: string, nullable: true, pattern: '^\d{2}:\d{2}$' }
        sport: { type: array, items: { $ref: '#/components/schemas/SeasonSportSlot' } }
        sleepAnchor: { allOf: [{ $ref: '#/components/schemas/SeasonSleepAnchor' }], nullable: true }
        allowedRecipeIds: { type: array, items: { type: string, format: uuid } }
        block: { allOf: [{ $ref: '#/components/schemas/SeasonBlockChoice' }], nullable: true }
    SeasonApply:
      type: object
      required: [draft, fingerprint]
      properties:
        draft: { $ref: '#/components/schemas/SeasonDraft' }
        fingerprint: { type: string }
    SeasonRules:
      type: object
      required: [processedFoodMaxNova, deloadMaintain, useLearnedExpenditure, proposeExperiments, menuTime]
      properties:
        processedFoodMaxNova: { type: integer, minimum: 1, maximum: 4 }
        deloadMaintain: { type: boolean }
        useLearnedExpenditure: { type: boolean }
        proposeExperiments: { type: boolean }
        menuDay: { type: integer, minimum: 0, maximum: 6, nullable: true, description: 'null (or absent) = no weekly menu' }
        menuTime: { type: string, pattern: '^\d{2}:\d{2}$' }
    SeasonResponse:
      type: object
      required: [id, title, status, startDate, endDate, weeks, goalId, rules, draft]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [planned, active, closed] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: 'startDate + weeks*7 - 1' }
        weeks: { type: integer }
        goalId: { type: string, format: uuid }
        sleepNeedMin: { type: integer, nullable: true }
        mesocycleId: { type: string, format: uuid, nullable: true }
        rules: { $ref: '#/components/schemas/SeasonRules' }
        draft: { $ref: '#/components/schemas/SeasonDraft' }
    SeasonBand:
      type: object
      required: [lowKg, highKg]
      properties:
        lowKg: { type: number }
        highKg: { type: number }
    SeasonNumbers:
      type: object
      required: [trainDayKcal, proteinG, carbsTrainG, sleepNeedMin, bedtime]
      properties:
        trainDayKcal: { type: integer }
        restDayKcal: { type: integer, nullable: true, description: 'null when gym + sport days cover all seven weekdays' }
        proteinG: { type: integer }
        carbsTrainG: { type: integer }
        sleepNeedMin: { type: integer }
        bedtime: { type: string, pattern: '^\d{2}:\d{2}$' }
        targetDate: { type: string, format: date, nullable: true }
        weeksToTarget: { type: integer, nullable: true }
        paceVerdict: { type: string, enum: [feasible, warnings, aggressive], nullable: true }
        kgPerWeek: { type: number, nullable: true, description: 'Signed planned weekly change (cut negative)' }
        band: { allOf: [{ $ref: '#/components/schemas/SeasonBand' }], nullable: true }
        gymPerWeek: { type: integer }
        sportPerWeek: { type: integer }
        weekKcal: { type: integer, nullable: true, description: 'The week''s total planned intake: the seven weekdays'' served targets, each with its own sessions (a rest day, a gym day, a sport day, a gym + sport day). Moves when a session or sport day is added even though the training-day target does not' }
        trainSportDayKcal: { type: integer, nullable: true, description: 'A gym + sport day''s served target (both sessions); null when no weekday carries both' }
    SeasonTodo:
      type: object
      required: [key, title, body]
      properties:
        key: { type: string }
        title: { type: string }
        body: { type: string }
    SeasonWarning:
      type: object
      required: [key, text]
      properties:
        key: { type: string }
        text: { type: string }
    SeasonPreview:
      type: object
      required: [before, after, todo, warnings, fingerprint]
      properties:
        before: { $ref: '#/components/schemas/SeasonNumbers' }
        after: { $ref: '#/components/schemas/SeasonNumbers' }
        todo: { type: array, items: { $ref: '#/components/schemas/SeasonTodo' } }
        warnings: { type: array, items: { $ref: '#/components/schemas/SeasonWarning' } }
        fingerprint: { type: string, description: 'Send back with applySeason; empty for a draft preview' }
        block:
          allOf: [{ $ref: '#/components/schemas/SeasonBlockWeek' }]
          nullable: true
          description: 'The running block''s re-arranged week when the draft moves the gym days (mezo-r36n9.122) — applied with the same accept; null when the block does not change'
    SeasonBlockWeek:
      type: object
      required: [mesocycleId, title, days, dropped]
      properties:
        mesocycleId: { type: string, format: uuid }
        title: { type: string }
        days: { type: array, items: { $ref: '#/components/schemas/SeasonBlockDay' } }
        dropped: { type: array, items: { $ref: '#/components/schemas/SeasonBlockDay' }, description: 'Days that leave the block (change = drop, weekday = their old weekday)' }
    SeasonBlockDay:
      type: object
      required: [weekday, title, change]
      properties:
        weekday: { type: integer, description: '0 = hétfő … 6 = vasárnap; for a dropped day its old weekday, -1 when its label is not a weekday' }
        title: { type: string, description: 'The block day''s name' }
        change: { type: string, enum: [keep, move, add, drop] }
        fromWeekday: { type: integer, nullable: true, description: 'move: the weekday it came from; add: the weekday of the day it repeats' }
    SeasonOverviewHead:
      type: object
      required: [title, week, weeks, status, trajectory]
      properties:
        title: { type: string }
        week: { type: integer, description: '1-based current week, clamped to 1..weeks' }
        weeks: { type: integer }
        status: { type: string, enum: [on_course, slower, faster, no_data, in_band, out_of_band] }
        trajectory: { type: string, enum: [cut, bulk, maintain] }
    SeasonMapPillar:
      type: object
      required: [key]
      properties:
        key: { type: string, enum: [edzes, etel, alvas, suly] }
        value: { type: string, nullable: true, description: 'Headline already formatted by the server (e.g. "4 edzés"); null when unknown' }
    SeasonMapLink:
      type: object
      required: [from, to, key]
      properties:
        from: { type: string, enum: [edzes, etel, alvas, suly] }
        to: { type: string, enum: [edzes, etel, alvas, suly] }
        key: { type: string, enum: [train_food, train_sleep, food_weight, sleep_food, food_train, sleep_train] }
        value: { type: number, nullable: true, description: 'train_food kcal, train_sleep min, food_weight kg/week, sleep_food kcal; null when not computed' }
    SeasonMap:
      type: object
      required: [pillars, links]
      properties:
        pillars: { type: array, items: { $ref: '#/components/schemas/SeasonMapPillar' } }
        links: { type: array, items: { $ref: '#/components/schemas/SeasonMapLink' } }
    SeasonWeightPoint:
      type: object
      required: [date, kg]
      properties:
        date: { type: string, format: date }
        kg: { type: number }
    SeasonWeight:
      type: object
      required: [series, projection]
      properties:
        series: { type: array, items: { $ref: '#/components/schemas/SeasonWeightPoint' }, description: 'Trend (EWMA) points inside the season so far' }
        projection: { type: array, items: { $ref: '#/components/schemas/SeasonWeightPoint' }, description: 'The plan from today to the season end' }
        trendKg: { type: number, nullable: true }
        targetKg: { type: number, nullable: true }
        band: { allOf: [{ $ref: '#/components/schemas/SeasonBand' }], nullable: true }
        kgPerWeek: { type: number, nullable: true, description: 'Signed planned weekly change' }
        paceVerdict: { type: string, enum: [feasible, warnings, aggressive], nullable: true }
    SeasonSportLine:
      type: object
      required: [dayOfWeek, time, durationMin, sport]
      properties:
        dayOfWeek: { type: integer }
        time: { type: string }
        durationMin: { type: integer }
        sport: { type: string }
    SeasonBlockPillar:
      type: object
      required: [gymDays, sport]
      properties:
        title: { type: string, nullable: true, description: 'The running block name; null without a block' }
        mesocycleId: { type: string, format: uuid, nullable: true }
        blockWeeks: { type: integer, nullable: true }
        fromWeek: { type: integer, nullable: true, description: 'Season week the block starts in' }
        toWeek: { type: integer, nullable: true }
        gymDays: { type: array, items: { type: integer } }
        sport: { type: array, items: { $ref: '#/components/schemas/SeasonSportLine' } }
    SeasonFoodPillar:
      type: object
      required: [trainDayKcal, proteinG, allowedCount, novaMax]
      properties:
        trainDayKcal: { type: integer }
        trainSportDayKcal: { type: integer, nullable: true, description: 'A gym + sport day (both sessions); null when no weekday carries both' }
        restDayKcal: { type: integer, nullable: true }
        proteinG: { type: integer }
        allowedCount: { type: integer }
        recipeCount: { type: integer, nullable: true, description: 'All of his recipes, for "24 / 53"' }
        novaMax: { type: integer }
    SeasonSleepPillar:
      type: object
      required: [needMin, bedtime, anchor, anchorTime]
      properties:
        needMin: { type: integer }
        baseMin: { type: integer, nullable: true }
        bedtime: { type: string }
        anchor: { type: string, enum: [WAKE, BED] }
        anchorTime: { type: string }
        avgMin: { type: integer, nullable: true, description: 'Average of the last 7 nights; null without data' }
    SeasonWeightPillar:
      type: object
      properties:
        targetKg: { type: number, nullable: true }
        targetDate: { type: string, format: date, nullable: true }
        deltaKg: { type: number, nullable: true, description: 'Trend now minus season start' }
        kgPerWeek: { type: number, nullable: true }
        band: { allOf: [{ $ref: '#/components/schemas/SeasonBand' }], nullable: true }
    SeasonPillars:
      type: object
      required: [block, food, sleep, weight]
      properties:
        block: { $ref: '#/components/schemas/SeasonBlockPillar' }
        food: { $ref: '#/components/schemas/SeasonFoodPillar' }
        sleep: { $ref: '#/components/schemas/SeasonSleepPillar' }
        weight: { $ref: '#/components/schemas/SeasonWeightPillar' }
    SeasonAdherenceDay:
      type: object
      required: [date, judged, excused, sessionPlanned, dayKind, sessions]
      properties:
        date: { type: string, format: date }
        judged: { type: boolean, description: 'The food side counts: not today, not a kímélő day, something logged' }
        excused: { type: boolean, description: 'A kímélő day — left out of every count. A reasoned skip only excuses that one session, the day''s other session, the food and the night still count' }
        excuse: { type: string, nullable: true, description: 'kimelo (the whole day is excused) or skip (at least one session is)' }
        kcal: { type: integer, nullable: true }
        targetKcal: { type: integer, nullable: true, description: "The day's served target (DayTargetProjector); null when it cannot be computed" }
        proteinG: { type: integer, nullable: true }
        targetProteinG: { type: integer, nullable: true }
        foodInBand: { type: boolean, nullable: true, description: 'judged and |kcal − target| ≤ 10 % of target; null when not judged' }
        sessionPlanned: { type: boolean, description: 'At least one session planned' }
        sessionDone: { type: boolean, nullable: true, description: 'Every judged session done; null when none was judged (nothing planned, all excused, today)' }
        dayKind: { type: string, description: 'edzesnap (gym or a block run) | sport | edzes_sport (both — two sessions) | pihenonap' }
        sessions: { type: array, items: { $ref: '#/components/schemas/SeasonAdherenceSession' }, description: 'One per planned session kind of the day; a gym + sport day has two' }
        sleepMin: { type: integer, nullable: true }
        needMin: { type: integer, nullable: true, description: "The night's need: the active season's, else the sleep goal" }
        sleepOk: { type: boolean, nullable: true, description: 'sleepMin ≥ needMin − 15; null without a night' }
    SeasonAdherenceSession:
      type: object
      required: [kind, excused]
      properties:
        kind: { type: string, description: 'gym | sport | run' }
        excused: { type: boolean, description: 'Skipped with a reason, or the day is kímélő' }
        done: { type: boolean, nullable: true, description: 'A completed session of this kind that date; null when excused or today+' }
    SeasonAdherenceResponse:
      type: object
      required: [days, summary]
      properties:
        days: { type: array, items: { $ref: '#/components/schemas/SeasonAdherenceDay' } }
        summary: { $ref: '#/components/schemas/SeasonAdherence' }
    SeasonAdherence:
      type: object
      required: [foodInBand, foodJudged, sessionsDone, sessionsPlanned, nightsOk, nightsJudged, excusedDays, trainingDone, trainingPlanned, sportDone, sportPlanned]
      properties:
        foodInBand: { type: integer }
        foodJudged: { type: integer }
        sessionsDone: { type: integer, description: 'trainingDone + sportDone — a gym + sport day counts two' }
        sessionsPlanned: { type: integer, description: 'trainingPlanned + sportPlanned' }
        nightsOk: { type: integer }
        nightsJudged: { type: integer }
        excusedDays: { type: integer }
        trainingDone: { type: integer, description: 'Gym and block-run sessions done' }
        trainingPlanned: { type: integer }
        sportDone: { type: integer }
        sportPlanned: { type: integer }
    SeasonInsight:
      type: object
      required: [key, title, body]
      properties:
        key: { type: string }
        title: { type: string }
        body: { type: string }
    SeasonUpcoming:
      type: object
      required: [week, kind, text]
      properties:
        week: { type: integer }
        kind: { type: string, enum: [deload, end] }
        text: { type: string }
    SeasonOverview:
      type: object
      required: [season, head, map, weight, pillars, insights, upcoming]
      properties:
        season: { $ref: '#/components/schemas/SeasonResponse' }
        head: { $ref: '#/components/schemas/SeasonOverviewHead' }
        map: { $ref: '#/components/schemas/SeasonMap' }
        weight: { $ref: '#/components/schemas/SeasonWeight' }
        pillars: { $ref: '#/components/schemas/SeasonPillars' }
        adherence: { allOf: [{ $ref: '#/components/schemas/SeasonAdherence' }], nullable: true, description: 'S2; null in S1' }
        insights: { type: array, items: { $ref: '#/components/schemas/SeasonInsight' }, description: 'S2; empty in S1' }
        upcoming: { type: array, items: { $ref: '#/components/schemas/SeasonUpcoming' } }
        menu: { allOf: [{ $ref: '#/components/schemas/SeasonMenuStatus' }], nullable: true, description: 'S3 — next week''s menu state (the wall''s approval card); null without a weekly menu (menuDay null)' }
    SeasonMenuStatus:
      type: object
      required: [weekStart, status, menuTime]
      properties:
        weekStart: { type: string, format: date, description: 'Next week''s Monday' }
        weekId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [none, seeding, proposed, approved] }
        menuDay: { type: integer, nullable: true, description: '0 = hétfő .. 6 = vasárnap' }
        menuTime: { type: string, example: '18:00' }
    SeasonMenuGenerate:
      type: object
      required: [weekStart]
      properties:
        weekStart: { type: string, format: date }
    SeasonMenuChoice:
      type: object
      required: [recipeId]
      properties:
        recipeId: { type: string, format: uuid }
    SeasonMenuWeek:
      type: object
      required: [weekStart, status, repeated, allowedCount, recipeCount, days]
      properties:
        id: { type: string, format: uuid, nullable: true }
        weekStart: { type: string, format: date }
        status: { type: string, enum: [none, seeding, proposed, approved] }
        repeated: { type: boolean, description: The allowed recipes were too few for the week without repeats }
        allowedCount: { type: integer }
        recipeCount: { type: integer }
        approvedAt: { type: string, format: date-time, nullable: true }
        days: { type: array, items: { $ref: '#/components/schemas/SeasonMenuDay' } }
    SeasonMenuDay:
      type: object
      required: [date, kind, kcal, meals]
      properties:
        date: { type: string, format: date }
        kind: { type: string, enum: [edzesnap, sport, edzes_sport, pihenonap] }
        sportName: { type: string, nullable: true }
        kcal: { type: integer, description: The day's planned meals summed }
        meals: { type: array, items: { $ref: '#/components/schemas/SeasonMenuMeal' } }
    SeasonMenuMeal:
      type: object
      required: [id, slot, label, name, kcal, preSession, locked, changed]
      properties:
        id: { type: string, format: uuid }
        slot: { type: string, enum: [breakfast, lunch, dinner, snack] }
        label: { type: string }
        recipeId: { type: string, format: uuid, nullable: true, description: null = an ingredient tip (name is the tip) }
        name: { type: string }
        servings: { type: number, nullable: true }
        kcal: { type: integer }
        proteinG: { type: integer, nullable: true }
        preSession: { type: boolean }
        locked: { type: boolean, description: He chose it himself }
        changed: { type: boolean, description: A mid-week re-fit moved it }
    SeasonMenuAlternative:
      type: object
      required: [recipeId, name, kcal, servings, fits]
      properties:
        recipeId: { type: string, format: uuid }
        name: { type: string }
        kcal: { type: integer }
        servings: { type: number }
        proteinG: { type: integer, nullable: true }
        fits: { type: boolean }
    SeasonRecipeOption:
      type: object
      required: [id, name, category, allowed, usable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string, nullable: true }
        kcal: { type: integer, nullable: true, description: Per serving }
        allowed: { type: boolean }
        usable: { type: boolean, description: His sensitivity profile and the season's NOVA rule let it into a menu }
        reason: { type: string, nullable: true, description: Why it cannot go into a menu }
    SeasonRecipeIds:
      type: object
      required: [recipeIds]
      properties:
        recipeIds: { type: array, items: { type: string, format: uuid } }
    ShoppingListResponse:
      type: object
      required: [id, weekStart, items, staples, itemCount, checkedCount, changedCount]
      properties:
        id: { type: string, format: uuid }
        weekStart: { type: string, format: date }
        items: { type: array, items: { $ref: '#/components/schemas/ShoppingItem' } }
        staples: { type: array, items: { $ref: '#/components/schemas/ShoppingStapleChip' } }
        itemCount: { type: integer }
        checkedCount: { type: integer }
        changedCount: { type: integer }
    ShoppingItem:
      type: object
      required: [id, name, shelf, forRecipes, checked, changed, staple]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        amount: { type: number, nullable: true }
        unit: { type: string, nullable: true }
        amountText: { type: string, nullable: true, description: '„1,4 kg” — null for a staple or a line no longer needed' }
        shelf: { type: string, enum: [zoldseg, hus, tej, kamra, egyeb] }
        forRecipes: { type: array, items: { type: string } }
        checked: { type: boolean }
        changed: { type: boolean, description: A mid-week re-fit moved it }
        removed: { type: boolean, description: A re-fit made it unnecessary (shown under változott) }
        staple: { type: boolean }
    ShoppingStapleChip:
      type: object
      required: [name, onList]
      properties:
        name: { type: string }
        onList: { type: boolean }
    ShoppingListSummary:
      type: object
      required: [id, weekStart, itemCount, checkedCount]
      properties:
        id: { type: string, format: uuid }
        weekStart: { type: string, format: date }
        itemCount: { type: integer }
        checkedCount: { type: integer }
    ShoppingItemCheck:
      type: object
      required: [checked]
      properties:
        checked: { type: boolean }
    ShoppingStapleToggle:
      type: object
      required: [name, on]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        on: { type: boolean }
    SeasonStaples:
      type: object
      required: [names]
      properties:
        names: { type: array, maxItems: 40, items: { type: string, minLength: 1, maxLength: 80 } }
        defaults: { type: boolean, description: True while he has not set his own (the six defaults) }
    SeasonExperiments:
      type: object
      required: [past, proposeOn]
      properties:
        proposal: { allOf: [{ $ref: '#/components/schemas/SeasonExperiment' }], nullable: true, description: 'The one open proposal (Boop ötlete)' }
        running: { allOf: [{ $ref: '#/components/schemas/SeasonExperiment' }], nullable: true }
        past: { type: array, items: { $ref: '#/components/schemas/SeasonExperiment' }, description: 'done experiments, newest first (dismissed ones are left out)' }
        proposeOn: { type: boolean, description: 'The season''s „Boop is javasol kísérletet” setting' }
    SeasonExperiment:
      type: object
      required: [id, subjectKind, title, lengthDays, status, markedDays, needDays, watched, overlaps, kept]
      properties:
        id: { type: string, format: uuid }
        subjectKind: { type: string, enum: [supplement, recipe, food, habit, text] }
        subjectRef: { type: string, format: uuid, nullable: true }
        title: { type: string }
        reason: { type: string, nullable: true, description: 'Why Boop proposed it, one Hungarian sentence („Hétfő óta szedsz esti magnéziumot.”); null for his own' }
        startDate: { type: string, format: date, nullable: true, description: 'null while proposed' }
        endDate: { type: string, format: date, nullable: true, description: 'startDate + lengthDays - 1' }
        lengthDays: { type: integer, minimum: 7, maximum: 28 }
        status: { type: string, enum: [proposed, running, done, dismissed] }
        dayIndex: { type: integer, nullable: true, description: 'Running: which day of the window today is (1-based, capped at lengthDays)' }
        markedDays: { type: array, items: { type: string, format: date } }
        needDays: { type: integer, description: 'ceil(0.7 × lengthDays) — the marked days the result needs' }
        watched: { type: array, items: { $ref: '#/components/schemas/SeasonExperimentSignalKey' }, description: 'The signals compared' }
        overlaps: { type: array, items: { $ref: '#/components/schemas/SeasonExperimentOverlap' }, description: 'Other changes inside the window so far (running) or in total (done)' }
        result: { allOf: [{ $ref: '#/components/schemas/SeasonExperimentResult' }], nullable: true, description: 'Set when done' }
        finishedOn: { type: string, format: date, nullable: true }
        kept: { type: boolean, description: '„Megtartom szokásnak” — a season rule line' }
    SeasonExperimentSignalKey:
      type: string
      enum: [sleep_min, deep_min, hrv_ms, resting_hr, energy, mood, morning_feel]
    SeasonExperimentResult:
      type: object
      required: [verdict, signals, baselineFrom, baselineTo, markedCount]
      properties:
        verdict: { type: string, enum: [clear, none, insufficient], description: 'insufficient = fewer than needDays marked; clear = at least one clear signal; none = nothing beyond his day-to-day variation' }
        signals: { type: array, items: { $ref: '#/components/schemas/SeasonExperimentSignal' } }
        baselineFrom: { type: string, format: date }
        baselineTo: { type: string, format: date }
        markedCount: { type: integer }
    SeasonExperimentSignal:
      type: object
      required: [key, nBefore, nAfter, clear]
      properties:
        key: { $ref: '#/components/schemas/SeasonExperimentSignalKey' }
        before: { type: number, format: double, nullable: true, description: 'Mean over the baseline days with data; null without any' }
        after: { type: number, format: double, nullable: true }
        nBefore: { type: integer }
        nAfter: { type: integer }
        cliffsDelta: { type: number, format: double, nullable: true, description: 'Null below 5 days on either side' }
        clear: { type: boolean, description: '|Cliff''s delta| ≥ 0.33 with ≥ 5 days on each side' }
        better: { type: boolean, nullable: true, description: 'Only when clear: the change is in the good direction (resting HR down, the rest up)' }
    SeasonExperimentOverlap:
      type: object
      required: [kind, date, text]
