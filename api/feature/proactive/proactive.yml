openapi: 3.0.3
info: { title: '', version: '' }
tags:
  - name: Proactive
    description: >-
      Proactive layer — surfaces the companion speaks first on (mezo-h4wp). B1.1 ships the
      morning briefing read; cron + staleness arrive in B1.2, weekly/heartbeat/prediction
      surfaces in later slices.
paths:
  /api/proactive/feed:
    get:
      tags: [Proactive]
      operationId: getFeed
      summary: The unified companion-message feed for one day (companion-feed) — morning/sleep/weight/midday/evening
      description: >-
        Returns the day's persisted companion-feed messages in generation order. For TODAY the
        cron-kind miss-recovery lazily generates: morning always (its cron is dawn — by any read
        it has elapsed); midday/evening once their fire-time (derived from the SAME cron the job
        runs on) has passed. Event-triggered kinds (sleep/weight) are born from their events, never
        from this miss-recovery. Past dates never generate. An empty array is the honest empty
        state (never a 404 — this is a list endpoint, the P1 precedent).
      parameters:
        - name: date
          in: query
          required: false
          description: >-
            The fed day — the FE sends its LOCAL date (the briefing precedent); defaults to the
            server's today.
          schema: { type: string, format: date }
      responses:
        '200':
          description: The day's companion-feed messages (possibly empty), in generation order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FeedMessageResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/weekly-suggestion:
    get:
      tags: [Proactive]
      operationId: getWeeklySuggestion
      summary: The companion's generated plan suggestion for the week containing the given day (lazily generated when the Monday cron has not produced it yet)
      parameters:
        - name: date
          in: query
          required: false
          description: Any day of the wanted week (the FE sends its LOCAL date); defaults to the server's today. The week identity is the ISO Monday.
          schema: { type: string, format: date }
      responses:
        '200':
          description: The persisted (or just-generated) weekly suggestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklySuggestionResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No suggestion possible — no narrative memory (daily_summary) in the prior week. The FE keeps its honest placeholder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/memoir:
    get:
      tags: [Proactive]
      operationId: getMemoir
      summary: The latest weekly memoir (lazily generated for the last completed week when none exists yet)
      responses:
        '200':
          description: The latest persisted (or just-generated) memoir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoirResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No memoir possible — no narrative memory in the last completed week. The FE renders its honest "készül" state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/memoir/archive:
    get:
      tags: [Proactive]
      operationId: getMemoirArchive
      summary: Every persisted memoir, newest week first — the archive shelf (F7.5, mezo-d20.8.5)
      description: >-
        The full list in one round — weekly cadence keeps this small (~52 rows/year). Never
        generates: the archive lists what the Sunday cron / lazy-latest already wrote. An empty
        list is the honest empty state (never a 404 — list-endpoint precedent).
      responses:
        '200':
          description: The persisted memoirs, weekStart descending (possibly empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoirArchiveResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/prediction:
    get:
      tags: [Proactive]
      operationId: getPredictions
      summary: Pattern-grounded weekly predictions with validation state (P1)
      description: >-
        All live predictions, newest window first. Lazily generates the CURRENT week's batch when
        that week has no rows yet (needs CONFIRMED patterns — the grounding gate). An empty array
        is the honest empty state (never fabricated forecasts).
      responses:
        '200':
          description: All live predictions (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PredictionResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/experiment:
    get:
      tags: [Proactive]
      operationId: getExperiments
      summary: All live N=1 experiments (proposed/active/completed), newest first (P2)
      description: >-
        Returns the user's live experiments (dismissed excluded). An empty array is the honest
        empty state (never a 404). Lazily proposes when the user has none and has confirmed patterns.
      responses:
        '200':
          description: All live experiments (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExperimentResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/experiment/propose:
    post:
      tags: [Proactive]
      operationId: proposeExperiments
      summary: On-demand experiment proposal ("+ Új kísérlet javasol Mezo") (P2)
      description: >-
        Generates up to the open-cap of experiment proposals from confirmed patterns. A no-op
        (empty array) when the cap is already met or there are no confirmed patterns.
      responses:
        '200':
          description: The freshly proposed experiments (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExperimentResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/experiment/{id}/decision:
    post:
      tags: [Proactive]
      operationId: decideExperiment
      summary: L2 accept/dismiss a proposed experiment (P2)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExperimentDecisionRequest' }
      responses:
        '200':
          description: The experiment with its new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExperimentResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Experiment not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: The experiment is not in the proposed state (already decided)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/challenge:
    get:
      tags: [Proactive]
      operationId: getChallenges
      summary: Live workout challenges for a planned session on a day (proposed/accepted/hit/miss/inconclusive) (Challenges)
      description: >-
        Returns the session/day's live challenges (dismissed excluded). Lazily generates when none
        exist and date == today; lazily evaluates accepted ones once the instance is done. An empty
        array is the honest empty state (never a 404).
      parameters:
        - name: templateSessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: The session/day's live challenges (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChallengeResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/challenge/{id}/decision:
    post:
      tags: [Proactive]
      operationId: decideChallenge
      summary: L2 accept/dismiss a proposed workout challenge (Challenges)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeDecisionRequest' }
      responses:
        '200':
          description: The challenge with its new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Challenge not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: The challenge is not in the proposed state (already decided)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/weekly-review/{start}:
    get:
      tags: [Proactive]
      operationId: getWeeklyReview
      summary: The persisted weekly review narrative (Én/Heti, spec 2026-08-27 §5) for the ISO-Monday week starting {start}
      description: >-
        Returns the review row as-is (never lazily generates — the WeeklyReviewJob owns
        generation). `stale` is a best-effort probe: true when any of the week's logged
        weight/sleep/check-in/meal rows was created after the review's `generatedAt` (false on
        probe failure — never blocks the read).
      parameters:
        - name: start
          in: path
          required: true
          description: The ISO Monday of the wanted week
          schema: { type: string, format: date }
      responses:
        '200':
          description: The persisted weekly review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReviewResponse' }
        '400':
          description: '{start} is not a Monday'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: No weekly review persisted for this week
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/weekly-review/{start}/regenerate:
    post:
      tags: [Proactive]
      operationId: regenerateWeeklyReview
      summary: On-demand regeneration of the weekly review (soft-deletes the existing row, re-runs the generator)
      description: >-
        409 while the week is still in progress (`{start} + 7 days` must be on/before today — the
        same completed-week gate the generator idiom uses elsewhere). 404 when the regenerated
        week still has no logged data (empty-week ⇒ no row, the generator's own rule).
      parameters:
        - name: start
          in: path
          required: true
          description: The ISO Monday of the wanted week
          schema: { type: string, format: date }
      responses:
        '200':
          description: The freshly generated weekly review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReviewResponse' }
        '400':
          description: '{start} is not a Monday'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Regeneration yielded no row (no logged data in the week)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '409':
          description: The week is not completed yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/weekly-review/{start}/lessons:
    get:
      tags: [Proactive]
      operationId: getWeeklyReviewLessons
      summary: The week's knowledge candidates — "A hét tanulságai" (mezo-d20.7.6) — WITH their decisions
      description: >-
        The weekly generator proposes candidates onto the SAME learned_fact path chat extraction
        uses; this read returns the ones proposed for `{start}`, newest first, including the
        already-decided ones (`GET /api/companion/fact/candidate` only returns the undecided
        inbox, but a closed week must be reviewable in its settled state). `evidence` names what
        the candidate rests on. Always 200 — an empty array is the honest empty state (no review,
        no usable candidate, or every candidate rejected), never a 404. Deciding stays the shipped
        write path: `POST /api/companion/fact/candidate/{candidateId}/decision`.
      parameters:
        - name: start
          in: path
          required: true
          description: The ISO Monday of the wanted week
          schema: { type: string, format: date }
      responses:
        '200':
          description: The week's candidates with their decisions (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WeeklyLessonResponse' }
        '400':
          description: '{start} is not a Monday'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/proactive/weekly-review/{start}/digest:
    get:
      tags: [Proactive]
      operationId: getWeeklyReviewDigest
      summary: Code-collected week-window refs behind the weekly review — the confirmed pattern events, new facts, life events, memoir presence and predictions the review draws its highlight candidates from
      description: >-
        Otherwise always 200 — empty lists are the honest empty state, never a 404 (the review row
        itself may not even exist yet; this is a raw week-window read, independent of it).
      parameters:
        - name: start
          in: path
          required: true
          description: The ISO Monday of the wanted week
          schema: { type: string, format: date }
      responses:
        '200':
          description: The week's digest (possibly all-empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReviewDigestResponse' }
        '400':
          description: '{start} is not a Monday'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    FeedRef:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          description: FE RefTag kind (WeightTrend/Goal/Workout/FuelDay/Medication/Sleep/Memory/Person)
        label:
          type: string
    FeedMessageResponse:
      type: object
      required: [id, date, kind, eyebrow, body, refs, generatedAt]
      properties:
        id: { type: string, format: uuid, description: The companion_message row id — the W4.1 feedback artifactId (feed_message). }
        date: { type: string, format: date }
        kind:
          type: string
          description: Feed message kind — morning, sleep, weight, midday, evening, or people LLM-generated messages; advice is the single daily coaching card (S4, mezo-d58h.4) whose prose is LLM-written over deterministic facts; intervention and setup are the pre-S4 config-text cards, kept for existing rows only.
          enum: [morning, sleep, weight, midday, evening, intervention, people, setup, advice]
        eyebrow: { type: string }
        body:
          type: array
          items: { type: string }
        refs:
          type: array
          items: { $ref: '#/components/schemas/FeedRef' }
        generatedAt: { type: string, format: date-time }
    WeeklySuggestionResponse:
      type: object
      required: [id, weekStart, prose, generatedAt]
      properties:
        id: { type: string, format: uuid, description: The weekly_suggestion row id — the W4.1 feedback artifactId (weekly_suggestion). }
        weekStart: { type: string, format: date }
        prose:
          type: string
          description: Plain Hungarian plan-suggestion prose (smart tier; no markdown structure)
        generatedAt: { type: string, format: date-time }
    MemoirAnchor:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          description: FE RefTag kind (Memory/Pattern/…) — code-collected, model-SELECTED, never invented
        label:
          type: string
    MemoirResponse:
      type: object
      required: [id, weekStart, title, body, anchors, generatedAt]
      properties:
        id: { type: string, format: uuid, description: The memoir row id — the W4.1 feedback artifactId (memoir). }
        weekStart: { type: string, format: date }
        title:
          type: string
          description: Display title of the week's narrative
        body:
          type: string
          description: The memoir prose — narrative paragraphs separated by "\n\n" (prompt v2, mezo-uajy)
        anchors:
          type: array
          items: { $ref: '#/components/schemas/MemoirAnchor' }
        generatedAt: { type: string, format: date-time }
    MemoirArchiveResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          description: Every persisted memoir, weekStart descending.
          items: { $ref: '#/components/schemas/MemoirResponse' }
    PredictionResponse:
      type: object
      required: [id, title, basis, metricKey, expectedDirection, validFrom, validTo, status, generatedAt]
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
          description: The forecast statement (HU prose, model-written)
        basis:
          type: string
          description: Why — grounded in the selected pattern + context (model-written prose)
        confidence:
          type: number
          format: double
          nullable: true
          description: COPIED from the grounding pattern's stats; null = the FE renders „tanulom" (never model-invented)
        metricKey:
          type: string
          description: weight_trend | sleep_avg | training_volume (the deterministic v1 catalog)
        expectedDirection:
          type: string
          description: up | down | stable (model-SELECTED from the enum)
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        status:
          type: string
          description: pending | validated | missed
        actual:
          type: string
          nullable: true
          description: Code-formatted outcome text once the validation job closed the window
        generatedAt: { type: string, format: date-time }
    ExperimentDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, pattern: '^(accept|dismiss)$' }
    ExperimentResponse:
      type: object
      required: [id, title, hypothesis, status, metricKey, expectedDirection, totalDays, generatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        hypothesis: { type: string }
        status:
          type: string
          description: proposed | active | completed | dismissed
        metricKey: { type: string }
        expectedDirection:
          type: string
          description: up | down | stable
        startDate:
          type: string
          format: date
          nullable: true
          description: Null until accepted (proposed rows have no start)
        totalDays:
          type: integer
          description: The experiment window length in days
        outcome:
          type: string
          nullable: true
          description: Code-formatted outcome once the window closed
        outcomeGood:
          type: boolean
          nullable: true
          description: true/false once evaluated; null = completed but inconclusive (no data)
        generatedAt: { type: string, format: date-time }
    ChallengeDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, pattern: '^(accept|dismiss)$' }
    ChallengeRef:
      type: object
      required: [kind, label]
      properties:
        kind: { type: string }
        label: { type: string }
    ChallengeResponse:
      type: object
      required: [id, exerciseId, exercise, type, typeLabel, status, target, risk, why, glory, refs, generatedAt]
      properties:
        id: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        exercise: { type: string, description: The target exercise's name }
        type: { type: string, description: 'PR | Depth | Volume | overload' }
        typeLabel: { type: string, description: HU display label derived from type }
        status: { type: string, description: 'proposed | accepted | dismissed | hit | miss | inconclusive' }
        target: { type: string, description: Code-derived display string of the structured target }
        targetWeightKg:
          type: number
          nullable: true
          description: Structured target — kg (PR type only); feeds the FE pre-finish outcome preview
        targetReps:
          type: integer
          nullable: true
          description: Structured target — reps (PR type only)
        targetSets:
          type: integer
          nullable: true
          description: Structured target — set count (Volume type only)
        targetRir:
          type: integer
          nullable: true
          description: Structured target — RIR ceiling (Depth type only)
        confidence:
          type: number
          nullable: true
          description: Pattern-copied; null = "tanulom" (never fabricated)
        risk: { type: string, description: 'low | mid' }
        why: { type: string }
        glory: { type: string }
        refs:
          type: array
          items: { $ref: '#/components/schemas/ChallengeRef' }
        outcome:
          type: string
          nullable: true
          description: Code-formatted outcome once the workout is evaluated
        outcomeGood:
          type: boolean
          nullable: true
          description: true/false once evaluated; null = inconclusive (no logged sets)
        generatedAt: { type: string, format: date-time }
    WeeklyReviewDayNote:
      type: object
      required: [date, note]
      properties:
        date: { type: string, format: date }
        note: { type: string }
    WeeklyReviewHighlight:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          description: FE RefTag kind (Pattern/Fact/LifeEvent/Memory) — code-collected, model-SELECTED, never invented
        label:
          type: string
    WeeklyReviewResponse:
      type: object
      required: [id, weekStart, summary, dayNotes, highlights, generatedAt, stale]
      properties:
        id: { type: string, format: uuid, description: The weekly_review row id — the W4.1 feedback artifactId (weekly_review). }
        weekStart: { type: string, format: date }
        summary:
          type: string
          description: The review prose — what went well, what broke, what pattern showed up across the days
        dayNotes:
          type: array
          items: { $ref: '#/components/schemas/WeeklyReviewDayNote' }
        highlights:
          type: array
          items: { $ref: '#/components/schemas/WeeklyReviewHighlight' }
        generatedAt: { type: string, format: date-time }
        stale:
          type: boolean
          description: >-
            Best-effort: true when any of the week's logged weight/sleep/check-in/meal rows was
            created after generatedAt; false on probe failure (never blocks the read).
    WeeklyReviewPatternRef:
      type: object
      required: [pairKey, title, event]
      properties:
        pairKey: { type: string }
        title: { type: string }
        event:
          type: string
          description: The pattern_event kind (confirmed | reinforced | promoted)
    WeeklyReviewFactRef:
      type: object
      required: [id, text]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
    WeeklyReviewLifeEventRef:
      type: object
      required: [id, title, occurredOn]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        occurredOn: { type: string, format: date }
    WeeklyReviewPredictionRef:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status:
          type: string
          description: pending | validated | missed
    WeeklyReviewDigestResponse:
      type: object
      required: [patterns, newFacts, lifeEvents, memoir, predictions]
      properties:
        patterns:
          type: array
          items: { $ref: '#/components/schemas/WeeklyReviewPatternRef' }
        newFacts:
          type: array
          items: { $ref: '#/components/schemas/WeeklyReviewFactRef' }
        lifeEvents:
          type: array
          items: { $ref: '#/components/schemas/WeeklyReviewLifeEventRef' }
        memoir:
          type: boolean
          description: Whether a memoir row exists for this week
        predictions:
          type: array
          items: { $ref: '#/components/schemas/WeeklyReviewPredictionRef' }
    WeeklyLessonResponse:
      type: object
      description: >-
        One weekly knowledge candidate (mezo-d20.7.6). The same learned_fact row the Tudástár
        inbox serves as a FactCandidateResponse — repeated here as the weekly read's own shape so
        the fragment stays self-contained; the two MUST stay field-compatible (one entity, one
        mapper). Decisions are made on the companion candidate endpoint, never here.
      required: [id, candidateText, category, createdAt]
      properties:
        id: { type: string, format: uuid }
        candidateText: { type: string }
        category: { type: string, description: "'train' | 'fuel' | 'health' | 'life'" }
        evidence: { type: string, nullable: true, description: 'What the candidate rests on, in the proposer''s own words — null when the model named nothing usable.' }
