openapi: 3.0.3
info: { title: '', version: '' }
tags:
  - name: MeWeek
    description: >-
      Weekly review data layer (mezo-p2tr) — live, deterministic per-day values + day scores +
      weekly aggregates for one ISO-Monday week. Scores are code-computed (spec §2); missing
      data is null ("tanulom"), never fabricated.
paths:
  /api/me/week/{start}:
    get:
      tags: [MeWeek]
      operationId: getMeWeek
      summary: The week's per-day data + deterministic day scores + weekly aggregates (live for the current week)
      parameters:
        - name: start
          in: path
          required: true
          description: The week's ISO Monday (400 when the date is not a Monday)
          schema: { type: string, format: date }
      responses:
        '200':
          description: The week (always exactly 7 day entries, start..start+6)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeWeekResponse' }
        '400':
          description: start is not an ISO Monday
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/me/week/{start}/trend:
    get:
      tags: [MeWeek]
      operationId: getMeWeekTrend
      summary: The persisted weekly-score trend for the N ISO weeks ending at start (inclusive)
      description: >-
        The Heti hero's 8-week trend (mezo-d20.7.5). Points are the PERSISTED weekly scores
        (weekly_score) — a deterministic cache, refreshed whenever the week's own inputs changed
        after computedAt (and always for a week that has not finished yet). A week whose score is
        null (fewer than 2 scored days — the "tanulom" gate) yields NO point: the series is short,
        never padded with a zero. Oldest first.
      parameters:
        - name: start
          in: path
          required: true
          description: The last week of the window — its ISO Monday (400 when the date is not a Monday)
          schema: { type: string, format: date }
        - name: weeks
          in: query
          required: false
          description: How many ISO weeks the window spans, counting back from start (inclusive)
          schema: { type: integer, minimum: 1, maximum: 26, default: 8 }
      responses:
        '200':
          description: The window's points (0..weeks entries, oldest first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeWeekTrendResponse' }
        '400':
          description: start is not an ISO Monday, or weeks is out of range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/me/day/{date}/evaluation:
    get:
      tags: [MeWeek]
      operationId: getDayEvaluation
      summary: The day's 6-dimension evaluation + (for a closed day, lazily) the Mezo prose
      parameters:
        - name: date
          in: path
          required: true
          description: The day to evaluate (400 when not a valid calendar date)
          schema: { type: string, format: date }
      responses:
        '200':
          description: The day's dimensions + (when closed and scoreable) the overall score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayEvaluationResponse' }
        '400':
          description: date is not a valid calendar date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    MeWeekSubscores:
      description: >-
        A napi motor hat dimenziójának pontszáma ezen a napon (mezo-jcpt.5). A mezőnevek a
        DayEvaluation dimenzió-idjei, hogy a heti mozaik és a nap-oldal EGY szókincset használjon.
        null = a dimenzió degradált vagy nem mérhető ezen a napon — soha nem 0.
      type: object
      properties:
        nutrition: { type: integer, nullable: true, description: 0–100; null = no data }
        quality:   { type: integer, nullable: true }
        training:  { type: integer, nullable: true }
        sleep:     { type: integer, nullable: true }
        logging:   { type: integer, nullable: true }
        rhythm:    { type: integer, nullable: true }
    MeWeekDay:
      type: object
      required: [date, subscores, checkinCount, workoutCount]
      properties:
        date: { type: string, format: date }
        score: { type: integer, nullable: true, description: 0–100; null = "tanulom" (<2 subscores) }
        subscores: { $ref: '#/components/schemas/MeWeekSubscores' }
        kcal: { type: number, nullable: true, description: consumed kcal; null when nothing logged }
        proteinG: { type: number, nullable: true }
        carbsG: { type: number, nullable: true }
        fatG: { type: number, nullable: true }
        kcalTarget: { type: number, nullable: true }
        proteinTargetG: { type: number, nullable: true }
        weightKg: { type: number, nullable: true }
        sleepMin: { type: integer, nullable: true }
        sleepQuality: { type: number, nullable: true }
        checkinCount: { type: integer }
        checkinEnergyAvg: { type: number, nullable: true }
        workoutCount: { type: integer, description: gym + sport + run sessions logged on the day }
        xp: { type: integer, nullable: true }
    MeWeekAggregates:
      type: object
      properties:
        score: { type: integer, nullable: true, description: round(mean of non-null day scores); null when <2 }
        prevWeekScore: { type: integer, nullable: true }
        avgKcal: { type: number, nullable: true, description: mean over days with logged kcal }
        avgProteinG: { type: number, nullable: true }
        avgSleepMin: { type: number, nullable: true }
        avgCheckinEnergy: { type: number, nullable: true }
        checkinRatio: { type: number, nullable: true, description: filled slots / (4 × elapsed days of the week) }
        latestWeightKg: { type: number, nullable: true }
        weightWeeklyRateKg: { type: number, nullable: true, description: EWMA weekly rate from the weight trend }
        totalXp: { type: integer, nullable: true }
    MeWeekTrendPoint:
      type: object
      required: [weekStart, score, computedAt]
      properties:
        weekStart: { type: string, format: date, description: The week's ISO Monday }
        score: { type: integer, description: 0–100 — round(mean of the week's non-null day scores) }
        sleepAvg: { type: number, nullable: true, description: mean of the week's non-null sleep subscores; null when none }
        fuelAvg: { type: number, nullable: true }
        checkinAvg: { type: number, nullable: true }
        activityAvg: { type: number, nullable: true }
        computedAt:
          type: string
          format: date-time
          description: >-
            When this score was last computed from the week's data. The score is a cache, not a
            truth — a retroactive log can change it; this stamp is what makes the value honest.
    MeWeekTrendResponse:
      type: object
      required: [start, weeks, points]
      properties:
        start: { type: string, format: date, description: "The window's last week (ISO Monday), echoed back" }
        weeks: { type: integer, description: The requested window width — points may be shorter }
        points:
          type: array
          description: Oldest first; only weeks that actually have a score. Never padded.
          items: { $ref: '#/components/schemas/MeWeekTrendPoint' }
    MeWeekResponse:
      type: object
      required: [start, days, weekly]
      properties:
        start: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/MeWeekDay' }
        weekly: { $ref: '#/components/schemas/MeWeekAggregates' }
    DayDimension:
      type: object
      required: [id, label, weight, status]
      properties:
        id: { type: string, description: nutrition|quality|training|sleep|logging|rhythm }
        label: { type: string }
        weight: { type: number, description: renormalized weight; 0 when NO_DATA }
        score: { type: integer, nullable: true }
        status: { type: string, description: DONE|IN_PROGRESS|NO_DATA }
        facts:
          type: array
          items: { type: object, required: [label, value],
                   properties: { label: {type: string}, value: {type: string} } }
        note: { type: string, nullable: true, description: 1-2 sentences from Mezo (closed day only) }
    DayEvaluationResponse:
      type: object
      required: [date, state, dimensions]
      properties:
        date: { type: string, format: date }
        state: { type: string, description: scored|in_progress|thin|empty|future }
        reviewId:
          type: string
          format: uuid
          nullable: true
          description: >-
            A naphoz tartozó LLM-próza (day_review) sor-azonosítója — a visszajelzés-gombok
            artifact-id-je (mezo-jcpt.9). CSAK prózás (pontozott) napon van jelen: nincs próza
            → nincs id → nincs gomb, mert artifact nélkül nincs mire szavazni.
        score: { type: integer, nullable: true, description: 'base + adjustment.delta, clamped 0..100' }
        base: { type: integer, nullable: true }
        adjustment:
          type: object
          nullable: true
          required: [delta, reason]
          properties: { delta: { type: integer, minimum: -5, maximum: 5 }, reason: { type: string } }
        narrative: { type: array, items: { type: string }, description: empty when there is no prose }
        highlights:
          type: array
          items: { type: object, required: [kind, label],
                   properties: { kind: { type: string, description: key|pattern|win }, label: { type: string } } }
        context:
          type: array
          items: { type: object, required: [label, value],
                   properties: { label: {type: string}, value: {type: string} } }
        dimensions: { type: array, items: { $ref: '#/components/schemas/DayDimension' } }
