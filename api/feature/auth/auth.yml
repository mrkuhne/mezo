openapi: 3.0.3
info:
  title: ''
  version: ''
tags:
  - name: Auth
    description: Multi-user auth — invite-code registration, login, current-user profile
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login with email + password, returns a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Invalid credentials (AUTH_LOGIN_INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '403':
          description: Account disabled (AUTH_ACCOUNT_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register with an invite code, returns a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Account created, JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: Invite invalid/used/expired (AUTH_INVITE_INVALID) or email taken (AUTH_EMAIL_TAKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: The authenticated user's account profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '403':
          description: Account disabled (AUTH_ACCOUNT_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the authenticated user's password (also clears must-change-password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Current password wrong (AUTH_LOGIN_INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/auth/onboarding-complete:
    post:
      tags: [Auth]
      operationId: completeOnboarding
      summary: Mark the authenticated user's onboarding as done
      responses:
        '204':
          description: Marked
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: owner@mezo.local
        password:
          type: string
          minLength: 1
    TokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: HS256-signed JWT bearer token
    RegisterRequest:
      type: object
      required:
        - inviteCode
        - email
        - password
        - name
      properties:
        inviteCode:
          type: string
          minLength: 1
          maxLength: 32
          example: MEZO-7KQ2-XN4P
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 72
        name:
          type: string
          minLength: 1
          maxLength: 120
    MeResponse:
      type: object
      required:
        - id
        - email
        - name
        - role
        - onboarded
        - mustChangePassword
        - timezone
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          description: OWNER or USER
        onboarded:
          type: boolean
        mustChangePassword:
          type: boolean
        timezone:
          type: string
          example: Europe/Budapest
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
