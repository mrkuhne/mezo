openapi: 3.0.3
info: { title: '', version: '' }
tags:
  - name: Fuel
    description: >
      Fuel-owned protocol + supplement-intake endpoints. The protocol is a LIVING set of occurrences
      (one protocol_item row per pantry-item/zone placement, each carrying its own slotKey/dose/pin
      state) — there is no whole-selection activate step; occurrences are added/moved/re-dosed/
      unpinned/removed individually and the engine places a new occurrence's zone when slotKey is
      omitted (mezo-vx9v). supplement_intake is an append-only taken-ledger FK-ing pantry_item (ADR 0005).
paths:
  /api/fuel/protocol:
    get:
      tags: [Fuel]
      operationId: getProtocol
      summary: The active protocol + version history (active absent when none exists — honest-empty)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProtocolViewResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/fuel/protocol/items:
    post:
      tags: [Fuel]
      operationId: addProtocolItem
      summary: Add an occurrence to the living protocol (engine places it when slotKey omitted)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProtocolItemCreateRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProtocolItemResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Pantry item not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: Duplicate occurrence in that zone, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/fuel/protocol/items/{id}:
    patch:
      tags: [Fuel]
      operationId: patchProtocolItem
      summary: Move (pin), re-dose or unpin (engine re-places) one occurrence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProtocolItemPatchRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProtocolItemResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: Duplicate occurrence in that zone, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    delete:
      tags: [Fuel]
      operationId: deleteProtocolItem
      summary: Remove one occurrence (soft delete)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/fuel/intake/{date}:
    get:
      tags: [Fuel]
      operationId: listIntakes
      summary: The day's supplement intakes (feeds taken-state; the P5 timeline reuses this read)
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeListResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/fuel/intake:
    post:
      tags: [Fuel]
      operationId: logIntake
      summary: Log one supplement/stim intake (dose snapshotted from the pantry item when omitted)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IntakeRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Pantry item not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/fuel/intake/entry/{id}:
    delete:
      tags: [Fuel]
      operationId: deleteIntake
      summary: Soft-delete an intake entry (undo a mis-tap)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/fuel/slot-templates:
    get:
      tags: [Fuel]
      operationId: listSlotTemplates
      summary: All meal-slot templates of the owner (0-3 rows, one per day type)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SlotTemplateListResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/fuel/slot-templates/{dayType}:
    put:
      tags: [Fuel]
      operationId: putSlotTemplate
      summary: Whole-document upsert of one day type's template
      parameters:
        - { name: dayType, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SlotTemplateRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SlotTemplateResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    delete:
      tags: [Fuel]
      operationId: deleteSlotTemplate
      summary: Delete one day type's template (revert to the automatic recommendation)
      parameters:
        - { name: dayType, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    ProtocolHistoryEntry:
      type: object
      required: [version, builtAt]
      properties:
        version: { type: integer }
        builtAt: { type: string, format: date-time }
        reason: { type: string }
    ProtocolResponse:
      type: object
      required: [id, version, builtAt, status, items]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        builtAt: { type: string, format: date-time }
        status: { type: string, enum: [active, superseded] }
        confidence: { type: number }
        lastReplanReason: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/ProtocolItemResponse' } }
    ProtocolItemResponse:
      type: object
      required: [id, pantryItemId, slotKey, pinned, placementSource]
      properties:
        id: { type: string, format: uuid }
        pantryItemId: { type: string, format: uuid }
        slotKey: { type: string }
        dose: { type: string }
        pinned: { type: boolean }
        placementSource: { type: string, enum: [rule, llm, user, fallback] }
        placementReason: { type: string }
        restDayFallback: { type: string, description: "'skip' or a zone key; absent = FE default" }
        dailyTotalHint: { type: string, description: 'Rule-table daily-total hint (derived, not stored)' }
    ProtocolItemCreateRequest:
      type: object
      required: [pantryItemId]
      properties:
        pantryItemId: { type: string, format: uuid }
        slotKey: { type: string, pattern: '^(wake|breakfast|pre_workout|post_workout|lunch|dinner|evening|bedtime)$' }
        dose: { type: string, maxLength: 60 }
    ProtocolItemPatchRequest:
      type: object
      properties:
        slotKey: { type: string, pattern: '^(wake|breakfast|pre_workout|post_workout|lunch|dinner|evening|bedtime)$' }
        dose: { type: string, maxLength: 60 }
        pinned: { type: boolean, description: 'false = unpin, the engine re-places; true only alongside slotKey' }
    ProtocolViewResponse:
      type: object
      required: [history]
      properties:
        active: { $ref: '#/components/schemas/ProtocolResponse' }
        history: { type: array, items: { $ref: '#/components/schemas/ProtocolHistoryEntry' } }
    IntakeRequest:
      type: object
      required: [pantryItemId]
      properties:
        pantryItemId: { type: string, format: uuid }
        takenAt: { type: string, format: date-time, description: 'Offset-bearing; defaults to now server-side' }
        slotKey: { type: string }
        dose: { type: string, description: 'Snapshot; defaults to the pantry item''s dose' }
        note: { type: string }
    IntakeResponse:
      type: object
      required: [id, pantryItemId, takenAt, takenDate]
      properties:
        id: { type: string, format: uuid }
        pantryItemId: { type: string, format: uuid }
        takenAt: { type: string, format: date-time }
        takenDate: { type: string, format: date }
        slotKey: { type: string }
        dose: { type: string }
        note: { type: string }
    IntakeListResponse:
      type: object
      required: [intakes]
      properties:
        intakes: { type: array, items: { $ref: '#/components/schemas/IntakeResponse' } }
    SlotTemplateSlot:
      type: object
      required: [label, slotKind, role, anchorType, budgetPct]
      properties:
        label: { type: string, maxLength: 40 }
        slotKind: { type: string, pattern: '^(breakfast|lunch|dinner|snack)$' }
        role: { type: string, pattern: '^(standard|pre_workout|post_workout)$' }
        anchorType: { type: string, pattern: '^(fixed|wake|training_start|training_end|bed)$' }
        time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'Required when anchorType=fixed' }
        offsetMin: { type: integer, minimum: -720, maximum: 720, description: 'Required for relative anchors, signed' }
        budgetPct: { type: integer, minimum: 1, maximum: 100 }
    SlotTemplateRequest:
      type: object
      required: [slots]
      properties:
        slots: { type: array, items: { $ref: '#/components/schemas/SlotTemplateSlot' }, minItems: 2, maxItems: 8 }
    SlotTemplateResponse:
      type: object
      required: [dayType, slots]
      properties:
        dayType: { type: string, enum: [rest, training_am, training_pm] }
        slots: { type: array, items: { $ref: '#/components/schemas/SlotTemplateSlot' } }
    SlotTemplateListResponse:
      type: object
      required: [templates]
      properties:
        templates: { type: array, items: { $ref: '#/components/schemas/SlotTemplateResponse' } }
