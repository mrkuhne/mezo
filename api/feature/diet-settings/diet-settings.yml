openapi: 3.0.3
info: { title: mezo diet-settings fragment, version: 1.0.0 }
tags:
  - name: DietSettings
    description: Nutrition-owned per-user diet preferences (macro split, protein tier, water/fiber targets)
paths:
  /api/diet/settings:
    get:
      tags: [DietSettings]
      operationId: getDietSettings
      summary: The diet settings; config-default ghost when unset — never 404 (DietSettings)
      responses:
        '200':
          description: The settings (ghost balanced / moderate / 4000 / 30 before the first save)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DietSettingsResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    put:
      tags: [DietSettings]
      operationId: setDietSettings
      summary: Upsert the diet settings (per-user singleton) (DietSettings)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDietSettingsRequest' }
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DietSettingsResponse' }
        '400':
          description: Validation failure (incl. custom split not summing to 100.0%)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/diet/settings/preview:
    post:
      tags: [DietSettings]
      operationId: previewDietSettings
      summary: Project today's macro targets for an UNSAVED diet-settings draft (DietSettings)
      description: >-
        Read-only projection: runs the goal engine's prescription calculation with the posted draft
        preferences instead of the saved row and returns the targets today WOULD serve. Nothing is
        persisted and the active goal is not re-evaluated. Feeds the Fuel settings macro preview so
        switching the split preset / protein tier updates the numbers before Mentés.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDietSettingsRequest' }
      responses:
        '200':
          description: The projected targets for today under the draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DietSettingsPreviewResponse' }
        '400':
          description: Validation failure (incl. custom split not summing to 100.0%)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    DietSettingsResponse:
      type: object
      required: [splitPreset, proteinTier, waterMl, fiberG, dayTypeShiftKcal]
      properties:
        splitPreset:
          type: string
          enum: [balanced, low_fat, low_carb, high_carb, custom]
          description: Named fat/carb balance; custom uses the three pct fields
        proteinPctX10:
          type: integer
          minimum: 0
          maximum: 1000
          description: Custom protein energy share, tenths of a percent (advisory — the g/kg floor wins)
        carbsPctX10: { type: integer, minimum: 0, maximum: 1000 }
        fatPctX10: { type: integer, minimum: 0, maximum: 1000 }
        proteinTier:
          type: string
          enum: [moderate, high]
          description: g/kg band endpoint — moderate=2.0 g/kg BW, high=2.2 g/kg BW (engine config)
        waterMl: { type: integer, minimum: 500, maximum: 8000 }
        fiberG: { type: integer, minimum: 10, maximum: 80 }
        dayTypeShiftKcal:
          type: integer
          minimum: 0
          maximum: 500
          description: 'Kcal moved off each rest day onto training days (weekly budget unchanged); 0 = uniform days'
    DietSettingsPreviewResponse:
      type: object
      required: [kcal, proteinG, carbsG, fatG, source]
      properties:
        kcal:
          type: integer
          description: Projected kcal for today under the draft (day-type adjusted, as the Fuel day serves it)
        proteinG: { type: integer, description: Projected protein target (g) }
        carbsG: { type: integer, description: Projected carbs target (g) — absorbs the day-type kcal delta }
        fatG: { type: integer, description: Projected fat target (g) }
        source:
          type: string
          enum: [goal, config]
          description: >-
            goal = projected from the owner's ACTIVE goal recept under the draft; config = the static
            nutrition fallback (no active/coherent goal, or no biometric profile to project from)
    SetDietSettingsRequest:
      type: object
      required: [splitPreset, proteinTier, waterMl, fiberG, dayTypeShiftKcal]
      properties:
        splitPreset: { type: string, enum: [balanced, low_fat, low_carb, high_carb, custom] }
        proteinPctX10: { type: integer, minimum: 0, maximum: 1000 }
        carbsPctX10: { type: integer, minimum: 0, maximum: 1000 }
        fatPctX10: { type: integer, minimum: 0, maximum: 1000 }
        proteinTier: { type: string, enum: [moderate, high] }
        waterMl: { type: integer, minimum: 500, maximum: 8000 }
        fiberG: { type: integer, minimum: 10, maximum: 80 }
        dayTypeShiftKcal:
          type: integer
          minimum: 0
          maximum: 500
          description: 'Kcal moved off each rest day onto training days (weekly budget unchanged); 0 = uniform days'
