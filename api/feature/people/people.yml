openapi: 3.0.3
info:
  title: ''
  version: ''
tags:
  - name: People
    description: Inner-circle persons + mention logging (Emberek)
paths:
  /api/people:
    get:
      tags: [People]
      operationId: getPeopleBootstrap
      summary: Persons (mention-count desc) + recent mentions (ts desc, max 50) of the current user
      responses:
        '200':
          description: People bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags: [People]
      operationId: createPerson
      summary: Create an owned person (initial derived server-side; status=active, sourceKind=manual)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePersonRequest' }
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonResponse' }
        '400':
          description: Validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/people/{personId}:
    put:
      tags: [People]
      operationId: updatePerson
      summary: Full update of the editable person fields (knownFacts/ties/affectTrend are AI-curated, untouched)
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePersonRequest' }
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonResponse' }
        '400':
          description: Validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Person missing or foreign (indistinguishable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    delete:
      tags: [People]
      operationId: deletePerson
      summary: Soft-delete an owned person (mentions stay stored, leave the feed)
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Person missing or foreign (indistinguishable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/people/{personId}/mentions:
    post:
      tags: [People]
      operationId: logMention
      summary: Log a mention for an owned person (source/ts/flagged are server-stamped)
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogMentionRequest'
      responses:
        '201':
          description: Mention created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentionResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Person missing or foreign (indistinguishable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/people/{personId}/mentions/{mentionId}:
    delete:
      tags: [People]
      operationId: deleteMention
      summary: Revoke a mention (soft delete)
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: mentionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Mention missing, foreign, or belongs to a different person (indistinguishable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    LogMentionRequest:
      type: object
      required:
        - tone
      properties:
        tone:
          type: string
          pattern: '^(positive|neutral|mixed|negative)$'
        text:
          type: string
          maxLength: 500
        contextLabel:
          type: string
          enum: [munka, csalad, baratok, edzes, konfliktus, kozos_program, segitseg, egyeb]
    PeopleResponse:
      type: object
      required:
        - persons
        - mentions
      properties:
        persons:
          type: array
          items:
            $ref: '#/components/schemas/PersonResponse'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/MentionResponse'
    PersonResponse:
      type: object
      required:
        - id
        - name
        - initial
        - relationship
        - relationshipHu
        - affectBaseline
        - mentionCount
        - mentionsThisWeek
        - knownFacts
        - ties
        - affectTrend
        - aliases
        - status
        - sourceKind
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        initial:
          type: string
        relationship:
          type: string
          enum: [partner, friend, family, colleague, teammate, mentee]
        relationshipHu:
          type: string
        aliases:
          type: array
          items: { type: string, maxLength: 60 }
        status:
          type: string
          enum: [candidate, active, archived]
        sourceKind:
          type: string
          enum: [manual, extractor, seed]
        affectBaseline:
          type: string
          enum: [positive, neutral, mixed, negative]
        contactCadenceLabel:
          type: string
        notes:
          type: string
        knownFacts:
          type: array
          items:
            type: string
        ties:
          type: array
          items:
            type: string
        affectTrend:
          type: array
          items:
            type: integer
        mentionCount:
          type: integer
          description: Count of live mention rows — computed, never seeded
        mentionsThisWeek:
          type: integer
          description: Mentions in the rolling last 7 days
        lastMentionedAt:
          type: string
          format: date-time
    MentionResponse:
      type: object
      required:
        - id
        - ts
        - personId
        - personName
        - source
        - excerpt
        - flagged
      properties:
        id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        personId:
          type: string
          format: uuid
        personName:
          type: string
        source:
          type: string
          enum: [voice, camera, chip, text, chat]
        durationS:
          type: integer
        excerpt:
          type: string
        tone:
          type: string
          enum: [positive, neutral, mixed, negative]
        tiedToKind:
          type: string
        tiedToLabel:
          type: string
        flagged:
          type: boolean
        intensity: { type: integer, minimum: 1, maximum: 3 }
        contextLabel:
          type: string
          enum: [munka, csalad, baratok, edzes, konfliktus, kozos_program, segitseg, egyeb]
        sourceRefKind: { type: string }
    CreatePersonRequest:
      type: object
      required: [name, relationship, relationshipHu]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        aliases:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 60 }
        relationship:
          type: string
          enum: [partner, friend, family, colleague, teammate, mentee]
        relationshipHu: { type: string, minLength: 1, maxLength: 120 }
        affectBaseline:
          type: string
          enum: [positive, neutral, mixed, negative]
        contactCadenceLabel: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 500 }
    UpdatePersonRequest:
      type: object
      required: [name, relationship, relationshipHu]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        aliases:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 60 }
        relationship:
          type: string
          enum: [partner, friend, family, colleague, teammate, mentee]
        relationshipHu: { type: string, minLength: 1, maxLength: 120 }
        affectBaseline:
          type: string
          enum: [positive, neutral, mixed, negative]
        contactCadenceLabel: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 500 }
