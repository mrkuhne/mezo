openapi: 3.0.3
info:
  title: ''
  version: ''
tags:
  - name: Goal
    description: Goal domain — goal-rooted timeline (trajectory + quality guards + window)
paths:
  /api/goals:
    get:
      tags: [Goal]
      operationId: listGoals
      summary: List the owner's goals (active first)
      responses:
        '200':
          description: Goals
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GoalResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Goal]
      operationId: createGoal
      summary: Create a goal (status = planned)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoalUpsertRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/GoalResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/feasibility-preview:
    post:
      tags: [Goal]
      operationId: feasibilityPreview
      summary: Stateless preview — derive the weekly rate + realism verdict (+ a realistic target date) from a draft, before any goal is saved
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeasibilityPreviewRequest' } } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/FeasibilityPreviewResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}:
    get:
      tags: [Goal]
      operationId: getGoal
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Goal, content: { application/json: { schema: { $ref: '#/components/schemas/GoalResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    put:
      tags: [Goal]
      operationId: updateGoal
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoalUpsertRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/GoalResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    delete:
      tags: [Goal]
      operationId: deleteGoal
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Deleted }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}/activate:
    post:
      tags: [Goal]
      operationId: activateGoal
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Activated, content: { application/json: { schema: { $ref: '#/components/schemas/GoalResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}/archive:
    post:
      tags: [Goal]
      operationId: archiveGoal
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Archived, content: { application/json: { schema: { $ref: '#/components/schemas/GoalResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}/timeline:
    get:
      tags: [Goal]
      operationId: listGoalTimeline
      summary: The goal's positioned plan links + uncovered gym-lane gaps
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Timeline, content: { application/json: { schema: { $ref: '#/components/schemas/GoalTimelineResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}/evaluate:
    post:
      tags: [Goal]
      operationId: evaluateGoal
      summary: Run the TDEE/recept engine — computes + persists tdeeBootstrap + prescription, returns the goal
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Evaluated, content: { application/json: { schema: { $ref: '#/components/schemas/GoalResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}/plans:
    post:
      tags: [Goal]
      operationId: attachGoalPlan
      summary: Attach an owned mesocycle or running block at a week position
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoalPlanAttachRequest' } } }
      responses:
        '201': { description: Linked, content: { application/json: { schema: { $ref: '#/components/schemas/GoalPlanLinkResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Goal or plan not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}/plans/{linkId}:
    delete:
      tags: [Goal]
      operationId: detachGoalPlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Detached }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}/suggestions:
    get:
      tags: [Goal]
      operationId: listGoalSuggestions
      summary: The goal's OPEN (proposed) suggestions — diet-phase / correction proposals awaiting a decision
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200':
          description: Open suggestions (may be empty)
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GoalSuggestionResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}/suggestions/{suggestionId}/accept:
    post:
      tags: [Goal]
      operationId: acceptGoalSuggestion
      summary: Accept a suggestion — applies its payload to the goal (trajectory change or segment override), re-evaluates, returns the updated goal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: suggestionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Applied + re-evaluated, content: { application/json: { schema: { $ref: '#/components/schemas/GoalResponse' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: Stale — the goal changed since the proposal; the suggestion is now superseded, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/goals/{id}/suggestions/{suggestionId}/dismiss:
    post:
      tags: [Goal]
      operationId: dismissGoalSuggestion
      summary: Dismiss a suggestion — records the decision so the same trigger input never re-proposes it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: suggestionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Dismissed }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    GoalResponse:
      type: object
      required: [id, title, trajectory, guards, status, startDate, targetDate, startWeightKg, rateTargetPctPerWeek]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        trajectory: { type: string, enum: [cut, bulk, maintain] }
        guards: { type: array, items: { type: string, enum: [strength, muscle] } }
        status: { type: string, enum: [planned, active, archived] }
        startDate: { type: string, format: date }
        targetDate: { type: string, format: date }
        startWeightKg: { type: number }
        targetWeightKg: { type: number, nullable: true }
        rateTargetPctPerWeek: { type: number }
        identityFrame: { type: string, nullable: true }
        mealsPerDay: { type: integer, minimum: 3, maximum: 6, description: 'Day-planner: eating occasions per day' }
        wakeTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'Day-planner wake anchor, HH:mm' }
        bedTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'Day-planner bed anchor, HH:mm' }
        balanceAdjustmentKcal: { type: integer, nullable: true, description: 'Accepted adaptive corrections, summed (kcal/day); slice 5' }
        # Engine outputs — null until the goal is evaluated (POST /api/goals/{id}/evaluate).
        tdeeBootstrap: { allOf: [ { $ref: '#/components/schemas/TdeeBootstrap' } ], nullable: true }
        prescription: { allOf: [ { $ref: '#/components/schemas/GoalPrescription' } ], nullable: true }
    TdeeBootstrap:
      type: object
      description: Formula-TDEE bootstrap snapshot computed at first evaluation. tdee = neatBaselineKcal + weeklyEatKcalPerDay.
      required: [bmr, neat, neatBaselineKcal, weeklyEatKcalPerDay, tdee, formula, computedAt]
      properties:
        bmr: { type: number, description: Basal metabolic rate (kcal/day) }
        neat: { type: number, description: Non-exercise activity multiplier (lifestyle band DESK/MIXED/PHYSICAL) }
        neatBaselineKcal: { type: number, description: bmr × neat — the non-exercise lifestyle maintenance (kcal/day) }
        weeklyEatKcalPerDay: { type: number, description: 'Scheduled training energy (gym+sport+run), weekly total ÷ 7 (kcal/day)' }
        tdee: { type: number, description: Total maintenance = neatBaselineKcal + weeklyEatKcalPerDay (kcal/day) }
        formula: { type: string, enum: [MSJ, KATCH], description: 'MSJ = Mifflin-St Jeor, KATCH = Katch-McArdle' }
        computedAt: { type: string, format: date-time }
    GoalPrescription:
      type: object
      description: Segmented recept produced by the engine — kcal/protein/sleep/rest per timeline segment, plus guard + feasibility status.
      required: [generatedAt, basis, segments, guardStatus, feasibility]
      properties:
        generatedAt: { type: string, format: date-time }
        basis: { type: string, enum: [formula, adaptive] }
        segments: { type: array, items: { $ref: '#/components/schemas/GoalPrescriptionSegment' } }
        guardStatus: { $ref: '#/components/schemas/GoalGuardStatus' }
        feasibility: { $ref: '#/components/schemas/GoalFeasibility' }
    GoalPrescriptionSegment:
      type: object
      required: [fromWeek, toWeek, label, kcal, proteinG, sleepTargetH, restDays, projectedRateKgPerWk, dailyEnergyBalanceKcal, rationale]
      properties:
        fromWeek: { type: integer }
        toWeek: { type: integer }
        label: { type: string }
        kcal: { type: integer }
        proteinG: { type: integer }
        carbsG: { type: integer, description: 'Prescribed carbohydrate grams — the split remainder after protein + fat (absent on pre-slice-1 prescriptions)' }
        fatG: { type: integer, description: 'Prescribed fat grams — split fat-share of segment kcal, floored at fat-floor g/kg (absent on pre-slice-1 prescriptions)' }
        sleepTargetH: { type: number }
        restDays: { type: array, items: { type: integer } }
        projectedRateKgPerWk: { type: number }
        dailyEnergyBalanceKcal: { type: integer, description: 'Goal deficit(−)/surplus(+) per day (kcal); sign×rate%/100×kg×kcalPerKg÷7' }
        rationale: { type: string }
        trainingDayKcal: { type: integer, nullable: true, description: 'Day-type kcal target on a training day (kcal + shift×restDays/trainingDays); null → uniform kcal (mezo-sxlj)' }
        restDayKcal: { type: integer, nullable: true, description: 'Day-type kcal target on a rest day (kcal − shift, floored at BMR); null → uniform kcal (mezo-sxlj)' }
    GoalGuardStatus:
      type: object
      required: [strength, muscle]
      properties:
        strength: { $ref: '#/components/schemas/GoalStrengthGuardStatus' }
        muscle: { $ref: '#/components/schemas/GoalMuscleGuardStatus' }
    GoalStrengthGuardStatus:
      type: object
      required: [active, e1rmTrendPct, breached, notes]
      properties:
        active: { type: boolean }
        e1rmTrendPct: { type: number }
        breached: { type: boolean }
        notes: { type: array, items: { type: string } }
    GoalMuscleGuardStatus:
      type: object
      required: [active, minWeeklySetsPerMuscle, belowMaintenanceMuscles, rateWithinCap, proteinMonitored, notes]
      properties:
        active: { type: boolean }
        minWeeklySetsPerMuscle: { type: integer }
        belowMaintenanceMuscles: { type: array, items: { type: string } }
        rateWithinCap: { type: boolean }
        proteinMonitored: { type: boolean }
        notes: { type: array, items: { type: string } }
    GoalFeasibility:
      type: object
      required: [verdict, notes]
      properties:
        verdict: { type: string, enum: [feasible, feasible-with-warnings, aggressive] }
        notes: { type: array, items: { type: string } }
    GoalUpsertRequest:
      type: object
      # rateTargetPctPerWeek is NOT an input — it is server-derived from
      # |startWeightKg − targetWeightKg| / startWeightKg / weeks (see GoalService.applyUpsert).
      required: [title, trajectory, startDate, targetDate, startWeightKg]
      properties:
        title: { type: string, minLength: 1 }
        trajectory: { type: string, pattern: '^(cut|bulk|maintain)$' }
        guards: { type: array, items: { type: string, pattern: '^(strength|muscle)$' } }
        startDate: { type: string, format: date }
        targetDate: { type: string, format: date }
        startWeightKg: { type: number, minimum: 0 }
        targetWeightKg: { type: number, nullable: true, minimum: 0 }
        identityFrame: { type: string, nullable: true }
        mealsPerDay: { type: integer, minimum: 3, maximum: 6, description: 'Day-planner: eating occasions per day' }
        wakeTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'Day-planner wake anchor, HH:mm' }
        bedTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'Day-planner bed anchor, HH:mm' }
    FeasibilityPreviewRequest:
      type: object
      description: A draft goal window — feeds the stateless realism preview (no persistence, no ownership).
      required: [trajectory, startWeightKg, startDate, targetDate]
      properties:
        trajectory: { type: string, pattern: '^(cut|bulk|maintain)$' }
        startWeightKg: { type: number, minimum: 0 }
        targetWeightKg: { type: number, nullable: true, minimum: 0 }
        startDate: { type: string, format: date }
        targetDate: { type: string, format: date }
    FeasibilityPreviewResponse:
      type: object
      description: The server-derived weekly rate + realism verdict for a draft window; suggestedTargetDate is set only when the draft is over the rate cap.
      required: [derivedRatePctPerWeek, withinSafeBand, verdict]
      properties:
        derivedRatePctPerWeek: { type: number, description: 'Unsigned weekly rate magnitude (%BW/wk) derived from |startW − targetW| / startW / weeks.' }
        withinSafeBand: { type: boolean, description: 'true when derivedRate ≤ the rate cap (mezo.goal.rate.capPctPerWeek).' }
        verdict: { type: string, enum: [feasible, feasible-with-warnings, aggressive] }
        suggestedTargetDate: { type: string, format: date, nullable: true, description: 'The earliest cap-paced target date; present ONLY when derivedRate is over the cap.' }
    GoalPlanRef:
      type: object
      required: [title, status, startDate, endDate, weeks]
      properties:
        title: { type: string }
        status: { type: string, enum: [planned, active, archived] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        weeks: { type: integer }
    GoalPlanLinkResponse:
      type: object
      required: [id, planType, planId, startWeek, endWeek, plan]
      properties:
        id: { type: string, format: uuid }
        planType: { type: string, enum: [mesocycle, running_block] }
        planId: { type: string, format: uuid }
        startWeek: { type: integer }
        endWeek: { type: integer }
        plan: { $ref: '#/components/schemas/GoalPlanRef' }
    GoalPlanAttachRequest:
      type: object
      required: [planType, planId, startWeek]
      properties:
        planType: { type: string, pattern: '^(mesocycle|running_block)$' }
        planId: { type: string, format: uuid }
        startWeek: { type: integer, minimum: 1 }
    GoalGap:
      type: object
      required: [fromWeek, toWeek]
      properties:
        fromWeek: { type: integer }
        toWeek: { type: integer }
    GoalTimelineResponse:
      type: object
      required: [goalId, weeks, links, gaps]
      properties:
        goalId: { type: string, format: uuid }
        weeks: { type: integer }
        links: { type: array, items: { $ref: '#/components/schemas/GoalPlanLinkResponse' } }
        gaps: { type: array, items: { $ref: '#/components/schemas/GoalGap' } }
    GoalSuggestionResponse:
      type: object
      required: [id, kind, status, payload, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [phase_change, weekly_correction] }
        status: { type: string, enum: [proposed, accepted, dismissed, superseded] }
        payload: { $ref: '#/components/schemas/GoalSuggestionPayload' }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    GoalSuggestionPayload:
      type: object
      description: 'Typed suggestion body. phase_change carries either suggestedTrajectory (preset↔trajectory mismatch) or balanceOverrideKcal+fromWeek+toWeek (deload maintenance week). snapshotTrajectory is the accept-time race guard.'
      required: [reason]
      properties:
        reason: { type: string, description: 'Hungarian, user-facing rationale' }
        suggestedTrajectory: { type: string, enum: [cut, bulk, maintain], nullable: true }
        balanceOverrideKcal: { type: integer, nullable: true, description: 'Per-week energy-balance override (kcal/day); 0 = maintenance-leaning week' }
        fromWeek: { type: integer, nullable: true }
        toWeek: { type: integer, nullable: true }
        mesoId: { type: string, format: uuid, nullable: true }
        mesoTitle: { type: string, nullable: true }
        snapshotTrajectory: { type: string, enum: [cut, bulk, maintain], nullable: true, description: 'phase_change race guard; null on weekly_correction' }
        weekStart: { type: string, format: date, nullable: true, description: 'weekly_correction: reviewed week Monday (mirrors the dedup key)' }
        deltaKcal: { type: integer, nullable: true }
        observedRateKgPerWk: { type: number, nullable: true }
        targetRateKgPerWk: { type: number, nullable: true }
        dampedBySleep: { type: boolean, nullable: true }
        adherenceLoggedDays: { type: integer, nullable: true }
        adherenceAvgIntakeKcal: { type: integer, nullable: true }
        adherenceAvgTargetKcal: { type: integer, nullable: true }
        prescriptionGeneratedAt: { type: string, format: date-time, nullable: true, description: 'weekly_correction display/debug only — NOT the accept race guard (rotates on every recompute); see snapshotRateTargetPctPerWeek/snapshotBalanceAdjustmentKcal' }
        snapshotRateTargetPctPerWeek: { type: number, nullable: true, description: 'weekly_correction accept race guard: goal.rateTargetPctPerWeek at propose time' }
        snapshotBalanceAdjustmentKcal: { type: integer, nullable: true, description: 'weekly_correction accept race guard: goal.balanceAdjustmentKcal at propose time' }
