    PatternEventResponse:
      type: object
      required: [kind, occurredAt]
      properties:
        kind: { type: string, pattern: '^(snapshot|confirmed|monitoring|rejected|reinforced|promoted|observation|evidence|user_reply|revised|refuted|dormant)$' }
        occurredAt: { type: string, format: date-time }
        r: { type: number, format: double, nullable: true }
        n: { type: integer, nullable: true }
        p: { type: number, format: double, nullable: true }
        reinforcementCount: { type: integer, nullable: true }
        factId: { type: string, format: uuid, nullable: true }
        hit: { type: boolean, nullable: true, description: 'evidence: igazolta-e az éjszaka a jóslatot; null = a kapu nem volt ÉLŐ (nem tudtuk megmondani).' }
        verdict: { type: string, nullable: true, description: 'evidence: a kapu verdiktje (LIVE / FEW_DAYS / NO_DATA / DEGENERATE / IMBALANCED_GROUPS).' }
        channel: { type: string, nullable: true, description: 'user_reply: hol válaszolt a felhasználó.' }
        choice: { type: string, nullable: true, description: 'user_reply: mit választott.' }
        text: { type: string, nullable: true, description: 'observation / user_reply / revised szövege.' }
    AlignedDayResponse:
      type: object
      required: [date, a, b]
      properties:
        date: { type: string, format: date, description: 'metric-a napja (metric-b lagDays-szel később olvasódik).' }
        a: { type: number, format: double }
        b: { type: number, format: double }
    PatternImpactResponse:
      type: object
