      properties:
        summaryCount: { type: integer }
        firstDate: { type: string, format: date, nullable: true }
        lastDate: { type: string, format: date, nullable: true }
        embeddings:
          type: array
          description: 'Vektorok kind szerint, csak a nem-üresek — a lista nő, ahogy új narratív kind kap írót (mezo-b3pp.22).'
          items: { $ref: '#/components/schemas/MemoryEmbeddingKindCount' }
    MemoryEmbeddingKindCount:
      type: object
      required: [kind, count]
      properties:
        kind: { type: string, description: 'memory_embedding.kind — a ck_memory_embedding_kind CHECK egyik értéke.' }
        count: { type: integer }
    MemoryOverviewL2:
      type: object
      required: [patterns, pendingFactCandidates]
      properties:
        patterns:
          type: array
          items: { $ref: '#/components/schemas/MemoryPatternCount' }
        pendingFactCandidates: { type: integer, description: 'Eldöntetlen learned_fact jelöltek (L2 tény-inbox).' }
    MemoryPatternCount:
      type: object
      required: [kind, status, count]
      properties:
        kind: { type: string, pattern: '^(statistical|ai_hypothesis|reflection)$' }
        status: { type: string, pattern: '^(proposed|monitoring|confirmed|rejected|refuted|dormant)$', description: 'proposed/monitoring are engine states, confirmed/rejected the USER''s verdict (the engine never overrides them); refuted = the engine disproved it, dormant = parked for lack of data (Reflexió S2).' }
        count: { type: integer }
    MemoryOverviewL3:
      type: object
      required: [facts, totalReinforcements, factsInPrompt]
      properties:
        facts:
          type: array
          items: { $ref: '#/components/schemas/MemoryFactSourceCount' }
        totalReinforcements: { type: integer, description: 'A reinforcement_count-ok összege.' }
        factsInPrompt: { type: integer, description: 'include_in_prompt = true tények (a top-N injekció jelöltjei).' }
    MemoryFactSourceCount:
      type: object
      required: [source, count]
      properties:
        source: { type: string, pattern: '^(chat|pattern|manual)$' }
        count: { type: integer }
    MemoryOverviewJobs:
      type: object
      required: [summaryCron, patternCron, hypothesisCron]
      properties:
        summaryCron: { type: string, description: 'mezo.companion.summary.cron — nyers cron, a FE csak megjeleníti.' }
        patternCron: { type: string }
        hypothesisCron: { type: string }
        lastSummaryDate: { type: string, format: date, nullable: true, description: 'max(summary_date) — az utolsó megírt napló-nap.' }
        lastDetectedAt: { type: string, format: date-time, nullable: true, description: 'max(lastDetectedAt) a user statisztikai során — az utolsó FELISMERÉS, nem az utolsó futás (a pattern/monitor lastRunAt szemantikája).' }
    MemorySummaryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemorySummaryItem' }
    MemorySummaryItem:
      type: object
      required: [date, narrative, embedded]
      properties:
        date: { type: string, format: date }
        narrative: { type: string }
        embedded: { type: boolean, description: 'Van-e élő daily_summary vektor ehhez az összefoglalóhoz.' }
    SimilarDaysResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SimilarDayItem' }
    SimilarDayItem:
      type: object
      required: [date, excerpt, similarity, finalScore]
      properties:
        date: { type: string, format: date }
        excerpt: { type: string, description: 'A napi narratíva recall.render-max-chars-ra (300) vágva.' }
        similarity: { type: number, format: double, description: 'Nyers koszinusz-egyezés (0..1) — a floor erre vonatkozik.' }
        finalScore: { type: number, format: double, description: 'similarity × exp(-ageDays/decayDays) — a rangsor kulcsa.' }
    MemoryLlmUsageResponse:
      type: object
      required: [enabled, perDay, totals]
      properties:
        enabled: { type: boolean, description: 'mezo.feature.llm-log.enabled állása — false esetén a napló nem bővül és a sorok üresek.' }
        perDay:
          type: array
          items: { $ref: '#/components/schemas/MemoryLlmUsageDay' }
        totals: { $ref: '#/components/schemas/MemoryLlmUsageTotals' }
    MemoryLlmUsageDay:
      type: object
      required: [date, calls, inputTokens, outputTokens]
      properties:
        date: { type: string, format: date }
        calls: { type: integer, format: int64, description: 'Minden hívás, a hibásak is (az audit hívást számol).' }
        inputTokens: { type: integer, format: int64, description: 'prompt_tokens összege — a nyers szám, a cached rész is benne.' }
        outputTokens: { type: integer, format: int64, description: 'candidates + thoughts tokenek összege.' }
        costUsd: { type: number, format: double, nullable: true, description: 'null = nincs beárazott sor (ismeretlen ≠ nulla költség).' }
    MemoryLlmUsageTotals:
      type: object
      required: [calls, inputTokens, outputTokens]
      properties:
        calls: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        costUsd: { type: number, format: double, nullable: true }
    FlagTraceDayResponse:
      type: object
      required: [date, rules, transitions]
      properties:
        date: { type: string, format: date }
        earliestDate:
          type: string
          format: date
          nullable: true
          description: The oldest traced day for this user — the day pager's floor. Null when nothing has ever been traced.
        winner:
          $ref: '#/components/schemas/FlagTraceWinnerResponse'
        rules:
          type: array
          description: All the flag rules, in severity order (rank 1 = most severe).
          items: { $ref: '#/components/schemas/FlagTraceRuleResponse' }
        transitions:
          type: array
          description: What changed inside this day, chronologically. Empty on a day where nothing changed.
          items: { $ref: '#/components/schemas/FlagTraceTransitionResponse' }
    FlagTraceWinnerResponse:
      type: object
      nullable: true
      required: [flagKey, rank, cardId]
      description: >-
        The rule whose raise became the day's card — a fact about the DAY, read back from the
        delivered card. This is the ONLY source of a „Nyertes" badge; a client must never infer the
        winner from `cardOutcome`, which describes a rule's state at decision time and is null once
        that rule has changed since (mezo-y43v). Null when no card was delivered, or when the card
        came from a setup check rather than a flag — that key is none of the flag rules.
      properties:
        flagKey: { type: string }
        rank: { type: integer, description: 1-based position in the severity order. }
        cardId: { type: string, format: uuid, description: The companion_message row id. }
    FlagTraceRuleResponse:
      type: object
      required: [flagKey, label, domain, rank, outcome, reasonText, facts]
      properties:
        flagKey: { type: string }
        label:
          type: string
          description: >-
            The Hungarian name, server-sent so a round-2 rule appears without a frontend change.
            Falls back to the raw key for an unmapped rule.
        domain:
          type: string
          description: >-
            Drives the surface's colour wash and clay icon — sleep, training, nutrition, recovery,
            habits, logging, body, or general for an unmapped rule. The client MUST fall back
            safely on a domain it does not know.
        rank: { type: integer }
        outcome:
          type: string
          enum: [raised, clear, unavailable]
        reasonCode:
          type: string
          nullable: true
          description: >-
            Set when outcome is unavailable — the gate that stopped the rule, or the read-side
            not_evaluated_yet when the engine has never judged this rule.
        reasonText:
          type: string
          description: >-
            The one-line Hungarian explanation, describing the rule's state as of changedAt, not
            necessarily as of the requested day.
        facts:
          type: array
          description: >-
            The expandable evidence rows — thresholds and observed values — as of changedAt below.
            The trace records only changes, so a rule sitting unchanged for weeks carries the
            numbers observed when it last changed, not today's. Empty when there is nothing honest
            to show.
          items: { type: string }
        disposition:
          type: string
          nullable: true
          enum: [logged, suppressed_by_cooldown]
          description: What the service did with a raise. suppressed_by_cooldown means "true, but it spoke recently".
        cardOutcome:
          type: string
          nullable: true
          enum: [won, lost]
          description: >-
            The rule's correlation to the day's card AT THE MOMENT THE CARD WAS CHOSEN, derived at
            read time and never stored. Non-null only when the rule raised, was logged, the day's
            card was flag-sourced, and the rule's closing row already existed when the card was
            delivered. A rule that has changed state since — including the winner itself, if it
            later went clear — reports null here while `winner` above still names it; a rule that
            first raised after the card reports null because it never competed (mezo-y43v).
        changedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this state last changed — may predate the day; reasonText and facts above
            describe the rule as of this moment, not as of the requested day. Null when the rule
            has never been evaluated.
    FlagTraceTransitionResponse:
      type: object
      required: [at, flagKey, label, to, reasonText]
      properties:
        at: { type: string, format: date-time }
        flagKey: { type: string }
        label: { type: string }
        from:
          type: string
          nullable: true
          enum: [raised, clear, unavailable, suppressed]
          description: The state before this change; null on a rule's very first row.
        to:
          type: string
          enum: [raised, clear, unavailable, suppressed]
        reasonText: { type: string }
