          items: { $ref: '#/components/schemas/PatternImpactRef' }
        experiments:
          type: array
          items: { $ref: '#/components/schemas/PatternImpactRef' }
        challenges:
          type: array
          items: { $ref: '#/components/schemas/PatternImpactRef' }
    PatternImpactFact:
      type: object
