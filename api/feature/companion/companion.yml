openapi: 3.0.3
info: { title: '', version: '' }
tags:
  - name: Companion
    description: Phase-3 companion chat — conversations + messages (mezo-fnnq)
  - name: CompanionStream
    description: >-
      Phase-3 companion chat — SSE streaming turn (mezo-fnnq.4). PRECEDENT: this tag's generated
      interface (CompanionStreamApi) is deliberately NOT implemented — SSE (Flux<ServerSentEvent>)
      is outside the generator's vocabulary, so the endpoint is hand-written
      (CompanionStreamController) while the contract stays the single source of truth.
      See docs/features/_platform-api-backend.md §9.
  - name: CompanionVoice
    description: >-
      Phase-3 companion voice input (mezo-at8x.4) — stateless speech-to-text for the chat
      composer. Its own tag so the generated interface stays separate from the conversation
      CRUD surface.
  - name: CompanionFlags
    description: >-
      Proactive coaching observer (mezo-6269.2, spec 2026-09-05 §5) — the read side of the flag
      engine's own decision trace. Its own tag so the generated interface stays separate from the
      conversation CRUD surface, and because the surface is companion.flags-owned: a proactive
      controller reading companion_flag_log would cross a feature boundary.
  - name: CompanionObservation
    description: >-
      Reflexió S4 (mezo-eq85.4, spec 2026-09-06 §5) — az Észrevételek fül: amit Mezo észrevett a
      napodról, és a chip-válaszod rá. Saját tag, hogy a generált interfész elkülönüljön a
      beszélgetés-CRUD felülettől; a válasz-végpont ugyanezt a felületet zárja le (a
      /pattern/{id}/decision a KATALÓGUS-kártyák külön, felhasználói ítélete marad).
paths:
  /api/companion/flags/trace:
    get:
      tags: [CompanionFlags]
      operationId: getFlagTrace
      summary: One day of the coaching engine's decision — every rule's verdict, the day's transitions and the winning card
      description: >-
        Renders what the engine concluded; it never re-evaluates a rule. `rules` always holds every
        flag rule in SEVERITY order (the order is itself information — it is the ranking that chose
        the day's card), each with its closing state for that day, which may have been unchanged
        since before the day. `cardOutcome` is DERIVED here by comparing the day's delivered card
        against the raised+logged rules, never stored. A rule the engine has never judged comes
        back `unavailable` / `not_evaluated_yet` rather than a fabricated `clear`.
      parameters:
        - name: date
          in: query
          required: false
          description: The day to read (the FE sends its LOCAL date); defaults to the server's today.
          schema: { type: string, format: date }
      responses:
        '200':
          description: The day's trace — an honest empty-ish day still returns every rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlagTraceDayResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/conversation:
    get:
      tags: [Companion]
      operationId: listConversations
      summary: List the owner's conversations, most recently active first
      responses:
        '200':
          description: Conversations ordered by last activity (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConversationResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    post:
      tags: [Companion]
      operationId: createConversation
      summary: Start a new, empty conversation (title is set by the first message)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: The created conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/conversation/{conversationId}:
    patch:
      tags: [Companion]
      operationId: renameConversation
      summary: Rename one conversation (the list label; reversible, no history impact) — F7.5 (mezo-d20.8.5)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationRenameRequest' }
      responses:
        '200':
          description: The renamed conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Conversation not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    delete:
      tags: [Companion]
      operationId: deleteConversation
      summary: Delete one conversation (soft; its messages become unreachable) — F7.5 (mezo-d20.8.5)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Conversation not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/conversation/{conversationId}/messages:
    get:
      tags: [Companion]
      operationId: listMessages
      summary: Full message history of one conversation, oldest first
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Messages in chronological order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MessageResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Conversation not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/conversation/{conversationId}/message:
    post:
      tags: [Companion]
      operationId: sendMessage
      summary: Send a user message and get the assistant's answer (sync JSON; streaming sibling at .../message/stream)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: The persisted assistant message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Conversation not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/fact:
    get:
      tags: [Companion]
      operationId: listFacts
      summary: List the owner's confirmed knowledge facts, strongest reinforcement first (V1.1)
      responses:
        '200':
          description: Facts ordered by reinforcement count (desc), then newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgeFactResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    post:
      tags: [Companion]
      operationId: createFact
      summary: Manually add a confirmed knowledge fact (source = manual)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFactRequest' }
      responses:
        '201':
          description: The created fact (include_in_prompt defaults to true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeFactResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/fact/{factId}:
    patch:
      tags: [Companion]
      operationId: updateFact
      summary: Partially update a fact — edit its text/category or toggle include_in_prompt
      parameters:
        - name: factId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFactRequest' }
      responses:
        '200':
          description: The updated fact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeFactResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Fact not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/fact/candidate:
    get:
      tags: [Companion]
      operationId: listFactCandidates
      summary: Pending (undecided) extraction candidates, newest first (V1.2)
      responses:
        '200':
          description: Pending candidates awaiting an explicit L2 decision
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FactCandidateResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/fact/candidate/{candidateId}/decision:
    post:
      tags: [Companion]
      operationId: decideFactCandidate
      summary: >-
        Decide a candidate (V1.2) — accept/refine promote it into a knowledge fact, reject archives
        it. One decision per candidate; confirm is an explicit L2 action, never silent.
      description: >-
        The promoted fact inherits the candidate's `source`: a chat-extracted candidate becomes a
        `chat` fact, a weekly-review candidate a `weekly_review` one (mezo-d20.7.6) — promotion
        never re-labels where the insight came from.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactDecisionRequest' }
      responses:
        '200':
          description: The decided candidate (promotedFactId set on accept/refine)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactCandidateResponse' }
        '400':
          description: Validation error / candidate already decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Candidate not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/pattern:
    get:
      tags: [Companion]
      operationId: listPatterns
      summary: The pattern inbox (V3.1) — detected correlations, strongest/newest first
      responses:
        '200':
          description: All live patterns (proposed + monitoring + confirmed + rejected)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PatternResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/pattern/{patternId}/decision:
    post:
      tags: [Companion]
      operationId: decidePattern
      summary: >-
        Judge a pattern (V3.1, L2 surface) — confirm/monitor/reject. Unlike fact candidates a
        pattern is a standing judgement: transitions between the three user states are repeatable.
      parameters:
        - name: patternId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatternDecisionRequest' }
      responses:
        '200':
          description: The pattern with its new status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Pattern not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/pattern/monitor:
    get:
      tags: [Companion]
      operationId: patternMonitor
      summary: >-
        Élő kapu-diagnosztika (mezo-viqs) — a katalógus minden párjára ugyanaz a kiértékelés fut,
        amit az éjszakai job végezne, de ÍRÁS NÉLKÜL: verdikt + illesztett napok + a hiányzó
        metrika, plusz a 12 metrika lefedettsége a korrelációs ablakban.
      responses:
        '200':
          description: A motor pillanatnyi állapota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternMonitorResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/pattern/pair/{pairKey}:
    get:
      tags: [Companion]
      operationId: patternPairDetail
      summary: >-
        Egy katalógus-pár teljes részletező nézete (mezo-tk88.3): pár-meta + élő kapu-állapot
        (a monitor matekja), a perzisztált minta (ha van), az append-only esemény-történet,
        az illesztett napok (élőben számolva — sosem tárolt), és a hatás-lista (tény +
        source_pattern_id hivatkozók). Sor nélküli párra is válaszol (pattern: null).
      parameters:
        - name: pairKey
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: A pár részletei
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternPairDetailResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Unknown pair key (not in the catalog)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/observation:
    get:
      tags: [CompanionObservation]
      operationId: listObservations
      summary: Az Észrevételek fül kártyái egy napra (mezo-eq85.4)
      description: >-
        Négy kártyafajta, EBBEN a sorrendben: `fresh` (a nap felszínre engedett észrevételei,
        amikre még nem válaszoltál), `return` (a nap észrevételei egy KORÁBBI válaszod után —
        a szöveg már hivatkozik rá), `watching` (amit épp figyel a motor), `confirmed` (amit a
        KÉRT naptári napon erősített meg). Csoporton belül a legfrissebb elöl. `date` nélkül a mai nap.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Cards, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ObservationResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/pattern/{patternId}/reply:
    post:
      tags: [CompanionObservation]
      operationId: replyToPattern
      summary: Chip-válasz egy észrevételre — figyeld / nem stimmel / mesélj (mezo-eq85.4)
      description: >-
        A válasz mindig append-only ESEMÉNY. `watch` egy `proposed` sort `monitoring`-ra állít;
        `reject` MÁSODJÁRA refutálja (egyetlen `reject` nem mozdít státuszt); `talk` egy a
        sejtésre magolt beszélgetést nyit és visszaadja az azonosítóját. A `belief` mindig
        kódból számolódik újra — sosem LLM-becslés.
      parameters:
        - name: patternId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatternReplyRequest' }
      responses:
        '200':
          description: The pattern after the reply (+ the seeded conversation for talk)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternReplyResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Pattern not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/conversation/{conversationId}/message/stream:
    post:
      tags: [CompanionStream]
      operationId: streamMessage
      summary: >-
        Send a user message and stream the assistant's answer as Server-Sent Events (V0.4).
        Events: 0..n 'delta' (data = StreamDelta JSON) interleaved with 0..n 'tool'
        (data = StreamToolCall JSON — emitted as each tool actually executes, mezo-280), then
        exactly one terminal event — 'done' (data = the persisted assistant MessageResponse JSON)
        or 'error' (data = StreamError JSON; the assistant turn is NOT persisted, the user message
        is). A 'tool' event is progress only: the authoritative tool list is the done row's
        `tools`, which also covers any advisor-retry calls made after the stream ended.
        Every data line is JSON. Clients should send "Accept: text/event-stream, application/json"
        so pre-stream errors (400/401/404) arrive as normal SystemMessageList JSON.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: SSE frames — see the per-event data schemas (StreamDelta / StreamToolCall / MessageResponse / StreamError)
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StreamDelta'
                  - $ref: '#/components/schemas/StreamToolCall'
                  - $ref: '#/components/schemas/MessageResponse'
                  - $ref: '#/components/schemas/StreamError'
        '400':
          description: Validation error (emitted before the stream starts)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Conversation not found (or owned by someone else)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/transcribe:
    post:
      tags: [CompanionVoice]
      operationId: transcribeVoiceNote
      summary: >-
        Transcribe a short spoken message to text (mezo-at8x.4). Stateless and ephemeral —
        the audio is never stored, nothing is persisted, and the transcript is only handed
        back for the client to put in its composer. Server-side transcription (rather than
        the browser's Web Speech API) is what makes voice input work on iOS/PWA at all.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: The recorded voice note (wav/webm/ogg/mp4/mpeg, size capped by mezo.companion.transcription.max-audio-bytes)
      responses:
        '200':
          description: The transcript — empty text when nothing intelligible was said
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptionResponse' }
        '400':
          description: Missing/oversized/unsupported audio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Companion switched off — the whole surface is absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '502':
          description: COMPANION_TRANSCRIBE_FAILED — the model answer was unusable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/memory/overview:
    get:
      tags: [Companion]
      operationId: getMemoryOverview
      summary: >-
        Memória-obszervatórium áttekintés (mezo-al1i) — a 4 memória-réteg (L0 nyers napok →
        L1 napló + vektorok → L2 ítélet-inbox → L3 tartós tudás) élő számai + a cron-ütemezés.
        Read-only aggregátum, semmit nem ír.
      responses:
        '200':
          description: A memória-rétegek pillanatképe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryOverviewResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Companion switched off — the whole surface is absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/memory/summary:
    get:
      tags: [Companion]
      operationId: listMemorySummaries
      summary: >-
        Az L1 epizodikus napló (mezo-al1i) — napi összefoglaló-narratívák date-desc, opcionális
        [from,to] tartomány-szűréssel; embedded = van-e élő daily_summary vektora a napnak.
      parameters:
        - name: from
          in: query
          required: false
          description: A tartomány első napja (inkluzív); elhagyva nincs alsó határ.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: A tartomány utolsó napja (inkluzív); elhagyva nincs felső határ.
          schema: { type: string, format: date }
      responses:
        '200':
          description: A napló bejegyzései (date-desc)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorySummaryListResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Companion switched off — the whole surface is absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/memory/similar-days:
    get:
      tags: [Companion]
      operationId: searchSimilarDays
      summary: >-
        pgvector hasonló-nap kereső (mezo-al1i) — a V2.3 MemoryRecallService változatlan
        újrahasznosítása: embed query → ANN a daily_summary vektorokon → recency re-rank
        (similarity × exp(-age/τ)). A min-similarity küszöb alatti találat itt sem jön vissza
        (őszinte üres lista); a tool és a felület garantáltan ugyanazt a memóriát látja.
      parameters:
        - name: q
          in: query
          required: true
          description: A keresett élmény/téma/állapot szabad szövege.
          schema: { type: string, minLength: 1 }
        - name: k
          in: query
          required: false
          description: Max találat; alapértelmezés 3, a szerver a recall.max-k (5) fölé nem enged.
          schema: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: Hasonló napok (finalScore-desc)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimilarDaysResponse' }
        '400':
          description: Validation error (üres q, k a határokon kívül)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Companion switched off — the whole surface is absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/memory/llm-usage:
    get:
      tags: [Companion]
      operationId: getMemoryLlmUsage
      summary: >-
        LLM-használat napi bontásban (mezo-al1i) — rollup az llm_log_history felett (ADR 0014):
        napi hívás/token/költség + összesen, naptári napok a report-zónában. A teljes táblát
        olvassa (a cron/async sorok created_by-a null — a user-szűrés pont a legdrágább forgalmat
        rejtené el; single-user app, JWT mögött). enabled=false esetén a sorok üresek — a FE
        őszinte „audit kikapcsolva" állapotot mutat.
      parameters:
        - name: days
          in: query
          required: false
          description: Hány naptári napra visszamenőleg (a mai nappal bezárólag); alapértelmezés 30.
          schema: { type: integer, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: Napi rollup + összesen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryLlmUsageResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Companion switched off — the whole surface is absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    TranscriptionResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The transcript in the speaker's own language; empty string when the recording carried no speech.
    CreateConversationRequest:
      type: object
      description: >-
        mezo-p2tr — anchored conversations: an optional week/day anchor. Absent body/context =
        plain conversation, unchanged behaviour.
      properties:
        context:
          type: object
          nullable: true
          required: [kind, date]
          properties:
            kind: { type: string, pattern: '^(week|day)$', description: "'week' anchors an ISO-Monday week; 'day' anchors one day inside its week" }
            date: { type: string, format: date, description: 'ISO week-Monday for kind=week; any date inside the week for kind=day' }
        seedPatternId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Reflexió S3 (mezo-eq85.3) — the hypothesis this conversation is about. Every user turn
            in the thread is recorded as a user_reply event on that pattern. 404 when the pattern
            is missing or owned by someone else.
    ConversationRenameRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: The new list label — same cap as the auto-title column.
    ConversationResponse:
      type: object
      required: [id, startedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, nullable: true, maxLength: 120, description: 'Null until the first user message; then that message truncated.' }
        startedAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        seedPatternId: { type: string, format: uuid, nullable: true, description: 'Reflexió S3 (mezo-eq85.3) — the hypothesis this conversation is seeded with; null for a plain thread.' }
    MessageResponse:
      type: object
      required: [id, role, content, createdAt, tools, refs, recalled, degraded]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, description: "'user' | 'assistant'" }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        degraded:
          type: boolean
          description: >-
            True when the answer failed the V1.3 advisor self-check (redundancy / grounding /
            clinical) even after the corrective retry — render it flagged, honest (old docs §4.5
            [degraded] semantics). Always false on user rows.
        tools:
          type: array
          description: >-
            Tool calls behind this answer (V0.5): read-tool invocations of this turn, name carries
            the args, e.g. "get_weight_trend(weeks=2)". Empty when the turn used no tools.
          items: { $ref: '#/components/schemas/MessageTool' }
        refs:
          type: array
          description: >-
            Data references backing this answer (V0.5): entity refs contributed by the executed
            tools (deduped, capped). Empty when the turn used no tools.
          items: { $ref: '#/components/schemas/MessageRef' }
        recalled:
          type: array
          description: >-
            The memory context injected into this answer's prompt, in prompt order. OLD/SHADOW
            rows disclose the legacy [Emlékek] recall; NEW rows disclose selected shared-platform
            context with optional audit identities. Empty on user rows, on pre-W3.1 rows, and when
            the serving path supplied no recalled context (retrieval failure never degrades a turn).
          items: { $ref: '#/components/schemas/RecalledMemory' }
    RecalledMemory:
      type: object
      required: [kind, label, gist, similarity]
      properties:
        occurredOn: { type: string, format: date, nullable: true, description: "The day the remembered episode happened; absent for timeless fact or graph context" }
        kind: { type: string, description: "Context source kind (journal_entry | daily_summary | chat_turn | knowledge_fact | knowledge_edge | …)" }
        label: { type: string, description: "Hungarian source tag as rendered in the prompt (napló, napi összefoglaló, …)" }
        gist: { type: string, description: "The content injected for this item; legacy OLD/SHADOW rows remain first-line capped excerpts" }
        similarity: { type: number, format: double, minimum: 0, maximum: 1, description: "OLD/SHADOW: raw cosine similarity; NEW: normalized final fused relevance score" }
        retrievalRunId:
          type: string
          format: uuid
          description: "Shared retrieval audit run identifier for memories served by the unified platform; absent on OLD rows"
        retrievalResultId:
          type: string
          format: uuid
          description: "Stable audit result id for this selected memory; absent on OLD rows"
        memoryItemId:
          type: string
          format: uuid
          nullable: true
          description: "Canonical memory item id when this result came from memory_item; absent or null for direct fact/graph results and OLD rows"
        indicator:
          type: string
          description: "Human-readable selection indicator such as old, summary or conflict; absent on OLD rows"
    MessageTool:
      type: object
      required: [type, name]
      properties:
        type: { type: string, description: "'read' | 'compute' (mirrors the FE ToolType) — V0.5 emits only 'read'" }
        name: { type: string }
    MessageRef:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string }
        id: { type: string }
        label:
          type: string
          nullable: true
          description: >-
            Human name for the referenced entity when the producer knows one (mezo-b3pp.33) —
            today only GraphNode refs carry it (the graph node's title). Absent/null for every
            other kind, and for rows persisted before this field existed; the FE falls back to
            its own id-derived label then.
    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
    KnowledgeFactResponse:
      type: object
      required: [id, factText, category, source, reinforcementCount, includeInPrompt, createdAt]
      properties:
        id: { type: string, format: uuid }
        factText: { type: string }
        category: { type: string, description: "'train' | 'fuel' | 'health' | 'life'" }
        source: { type: string, description: "'chat' | 'pattern' | 'manual' — V1.1 creates only 'manual'; 'chat' arrives with V1.2 extraction, 'pattern' with V3.3 promotion" }
        reinforcementCount: { type: integer, description: 'How many times the fact was re-confirmed/re-detected (V1.3+/V3.3 increment it).' }
        includeInPrompt: { type: boolean, description: 'Whether the fact competes for the top-N system-prompt injection slots.' }
        lastReinforcedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        patternTitle: { type: string, nullable: true, description: 'The promoting pattern''s title (source=pattern facts only) — the V3.3 evidence link.' }
        citedWeeks: { type: integer, nullable: true, description: 'In how many of the recent weekly reviews the companion cited this fact as something the week was built on (mezo-d20.7.7). A SEPARATE, weaker signal than reinforcementCount — the model citing its own knowledge is not the user re-confirming it — derived live from the non-deleted weekly_review rows. Null = not measurable (the proactive/weekly feature is off), never a stand-in zero.' }
    CreateFactRequest:
      type: object
      required: [factText, category]
      properties:
        factText: { type: string, minLength: 1, maxLength: 500 }
        category: { type: string, pattern: '^(train|fuel|health|life)$' }
    UpdateFactRequest:
      type: object
      description: Partial update — only the provided fields are applied.
      properties:
        factText: { type: string, minLength: 1, maxLength: 500, nullable: true }
        category: { type: string, pattern: '^(train|fuel|health|life)$', nullable: true }
        includeInPrompt: { type: boolean, nullable: true }
    FactCandidateResponse:
      type: object
      required: [id, candidateText, category, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        candidateText: { type: string }
        category: { type: string, description: "'train' | 'fuel' | 'health' | 'life' — classified by the extractor at capture time" }
        source: { type: string, description: "'chat' (post-turn extraction, V1.2) | 'weekly_review' (the Monday weekly round's proposal, mezo-d20.7.6) — the promoted knowledge fact inherits it" }
        evidence: { type: string, nullable: true, description: 'What the candidate rests on, in the proposer''s own words (weekly candidates only — chat extraction does not produce one).' }
        weekStart: { type: string, format: date, nullable: true, description: 'The ISO Monday of the weekly review that proposed this candidate (null for chat-extracted ones).' }
        userDecision: { type: string, nullable: true, description: "'accept' | 'reject' | 'refine' — null while pending" }
        refinedText: { type: string, nullable: true, description: 'The user-edited wording when the decision was refine.' }
        promotedFactId: { type: string, format: uuid, nullable: true, description: 'The knowledge fact this candidate was promoted into (accept/refine).' }
        createdAt: { type: string, format: date-time }
    FactDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, pattern: '^(accept|reject|refine)$' }
        refinedText: { type: string, minLength: 1, maxLength: 500, nullable: true, description: 'Required when decision is refine — the corrected fact wording.' }
    StreamDelta:
      type: object
      required: [text]
      properties:
        text: { type: string, description: 'One streamed answer chunk (token/segment delta).' }
    StreamToolCall:
      type: object
      required: [type, name]
      description: >-
        One tool call, streamed the moment it executes (mezo-280) so the UI can show WHAT the
        companion is reading while it reads it, instead of back-filling every chip at 'done'.
        Same shape and same pre-baked "name(args)" label as MessageTool, so the FE renders a
        live chip and the done row's chip identically.
      properties:
        type: { type: string, description: "'read' | 'compute' (mirrors the FE ToolType) — V0.5 emits only 'read'" }
        name: { type: string, description: "Tool name carrying its args, e.g. 'get_training_plan(scope=today)'." }
    StreamError:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "Stream failure code — 'COMPANION_STREAM_FAILED'." }
    PatternResponse:
      type: object
      required: [id, kind, pairKey, category, categoryLabel, title, evidence, status, lastDetectedAt, evidenceHits, evidenceMisses]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, pattern: '^(statistical|ai_hypothesis|reflection)$', description: 'statistical = nightly Pearson job (V3.1); ai_hypothesis = the LLM proposal loop (V3.2); reflection = a self-proposed, falsifiable hypothesis (Reflexió S2).' }
        pairKey: { type: string, description: 'A minta stabil pár-kulcsa (statistical: katalógus-kulcs, hypothesis: hyp-hash) — a Motor↔Patterns kereszt-link horgonya (mezo-18bx).' }
        category: { type: string, pattern: '^(physiology|trigger|response)$', description: 'The FE PatternCategory — assigned by the metric-pair catalog.' }
        categoryLabel: { type: string, description: 'Hungarian category chip label.' }
        title: { type: string }
        mechanism: { type: string, nullable: true, description: 'Deterministic HU description for statistical rows; LLM mechanism for V3.2 hypotheses.' }
        evidence:
          type: array
          items: { type: string }
          description: 'Deterministic evidence chips (r=…, n=… nap, p=…, window).'
        confidence: { type: number, format: double, nullable: true, description: 'NULL for statistical rows (honest small-n — the FE renders "tanulom"); the 4-factor critique score for V3.2 hypotheses.' }
        critique: { $ref: '#/components/schemas/PatternCritique' }
        status: { type: string, pattern: '^(proposed|monitoring|confirmed|rejected|refuted|dormant)$', description: 'proposed/monitoring are engine states, confirmed/rejected the USER''s verdict (the engine never overrides them); refuted = the engine disproved it, dormant = parked for lack of data (Reflexió S2).' }
        lastDetectedAt: { type: string, format: date-time, description: 'When the nightly job last computed/refreshed the stats.' }
        thinking: { type: string, nullable: true, description: "The V3.2 critic's prose reasoning — the card's 'AI gondolatmenete'; null on statistical rows." }
        hypothesisKey: { type: string, nullable: true, description: 'Stabil identitás a teszt-tervből (ref-…), a statisztikai sorokon pair:<key>.' }
        testPlan:
          allOf: [{ $ref: '#/components/schemas/PatternTestPlan' }]
          nullable: true
        belief: { type: number, format: double, nullable: true, description: 'Determinisztikus bizonyosság 0..1 (kapu + válaszok + sorozat) — sosem LLM-becslés.' }
        evidenceHits: { type: integer, description: 'Hány éjszaka igazolta a teszt-terv jóslatát.' }
        evidenceMisses: { type: integer, description: 'Hány ÉLŐ éjszaka mondott ellent neki (adat nélküli éjszaka egyik sem).' }
        origin: { type: string, nullable: true, pattern: '^(pair_catalog|weekly_hypothesis|quick_notice|nightly_reflection)$', description: 'Honnan származik a sor — megjelenítés, sosem vezérli az életciklust.' }
        citedWeeks: { type: integer, nullable: true, description: 'In how many of the recent weekly reviews the companion cited this pattern as something the week was built on (mezo-d20.7.7). Deliberately NOT folded into confidence — confidence is a statistic (r/n/p, or the V3.2 critique score), a citation is the model selecting its own material; it is shown beside the statistic, never inside it, and never moves status. Derived live from the non-deleted weekly_review rows. Null = not measurable (the proactive/weekly feature is off), never a stand-in zero.' }
    PatternTestPlan:
      type: object
      description: A falszifikálható teszt egy minta mögött (Reflexió S2, mezo-eq85.2) — melyik két széria, mekkora eltolással, milyen irányban, milyen kapukkal.
      required: [seriesA, seriesB, seriesALabel, seriesBLabel, lagDays, expectedDirection, minN, windowDays]
      properties:
        seriesA: { type: string }
        seriesB: { type: string }
        seriesALabel: { type: string }
        seriesBLabel: { type: string }
        lagDays: { type: integer }
        expectedDirection: { type: string, pattern: '^(positive|negative)$' }
        minN: { type: integer }
        windowDays: { type: integer }
    PatternCritique:
      type: object
      nullable: true
      description: The V3.2 4-factor critique (0..1 each) — null until the hypothesis loop lands.
      properties:
        statistical: { type: number, format: double }
        confounders: { type: number, format: double }
        l3align: { type: number, format: double }
        actionability: { type: number, format: double }
    PatternDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, pattern: '^(confirm|monitor|reject)$' }
    ObservationResponse:
      type: object
      description: >-
        Egy kártya az Észrevételek fülön (Reflexió S4, mezo-eq85.4). A `fresh`/`return` kártyák
        egy `observation` ESEMÉNYT jelenítenek meg (az `id` az esemény azonosítója), a
        `watching`/`confirmed` kártyák magát a sort (az `id` a minta azonosítója) — a `patternId`
        mindig a soré, mert a chip-válasz arra megy.
      required: [id, patternId, card, occurredAt, title, text, evidence, status, evidenceHits, evidenceMisses, sourceIcon]
      properties:
        id: { type: string, format: uuid, description: 'Az esemény (fresh/return) vagy a minta (watching/confirmed) azonosítója — a lista stabil kulcsa.' }
        patternId: { type: string, format: uuid, description: 'A sor, amire a chip-válasz megy.' }
        hypothesisKey: { type: string, nullable: true, description: 'A sor stabil identitása (ref-…) — a statisztikai sorokon pair:<key>.' }
        card: { type: string, pattern: '^(fresh|return|watching|confirmed)$', description: 'fresh = még válasz nélküli mai észrevétel; return = mai észrevétel egy korábbi válaszod UTÁN; watching = épp figyelt sor; confirmed = a KÉRT naptári napon megerősített sor (a nap saját [00:00, 24:00) ablaka, nem egy mozgó 24 órás visszatekintés).' }
        occurredAt: { type: string, format: date-time, description: 'Az esemény ideje (fresh/return/confirmed), illetve a sor utolsó felismerése (watching).' }
        title: { type: string, description: 'A sor címe.' }
        text: { type: string, description: 'Az észrevétel prózája; a watching kártyán üres — ott a számok beszélnek.' }
        question: { type: string, nullable: true, description: 'A kérdés, amire a chipek válaszolnak — az observation payload utolsó sora; null, ha nincs.' }
        evidence:
          type: array
          items: { type: string }
          description: 'Az észrevétel forrás-hivatkozásai (journal_entry:<uuid>, sleep:<date>) — watching/confirmed kártyán a sor saját bizonyíték-chipjei.'
        status: { type: string, pattern: '^(proposed|monitoring|confirmed|rejected|refuted|dormant)$', description: 'A sor státusza a kártya kiadásának pillanatában.' }
        evidenceHits: { type: integer, description: 'Hány éjszaka igazolta a teszt-terv jóslatát.' }
        evidenceMisses: { type: integer, description: 'Hány ÉLŐ éjszaka mondott ellent neki.' }
        minN: { type: integer, nullable: true, description: 'A teszt-terv minimum-mintaszáma — null, ha a sor nem hordoz teszt-tervet.' }
        belief: { type: number, format: double, nullable: true, description: 'Determinisztikus bizonyosság 0..1 — sosem LLM-becslés.' }
        repliedChoice: { type: string, nullable: true, pattern: '^(watch|reject|talk)$', description: 'A legfrissebb chip-válaszod — null, ha még nem válaszoltál. ESEMÉNY-kártyán (fresh/return) a saját eseménye idejétől kezdve adott válasz, mert a chipek ARRA az észrevételre felelnek; SOR-kártyán (watching/confirmed) a sor legfrissebb válasza, időponthoz kötés nélkül, mert annak nincs saját pillanata.' }
        sourceIcon: { type: string, pattern: '^(naplo|alvas|edzes|vacsora|hold|mezo)$', description: 'Melyik felület ikonját mutassa a kártya — a teszt-terv seriesA előtagjából származtatva; terv nélkül mezo.' }
    PatternReplyRequest:
      type: object
      description: A chip-válasz (Reflexió S4, mezo-eq85.4) — a `text` a „mesélj” ágon a saját szavaid.
      required: [choice]
      properties:
        choice: { type: string, pattern: '^(watch|reject|talk)$' }
        text: { type: string, nullable: true, maxLength: 500 }
    PatternReplyResponse:
      type: object
      description: A sor a válasz után, plusz a `talk` ágon megnyitott beszélgetés azonosítója.
      required: [pattern]
      properties:
        pattern: { $ref: '#/components/schemas/PatternResponse' }
        conversationId: { type: string, format: uuid, nullable: true, description: 'A `talk` ágon nyitott, a sorra magolt beszélgetés — a többi ágon null.' }
    PatternMonitorResponse:
      type: object
      required: [windowFrom, windowTo, lookbackDays, minN, cron, pairs, metrics]
      properties:
        windowFrom: { type: string, format: date, description: 'A korrelációs ablak első napja.' }
        windowTo: { type: string, format: date, description: 'Az ablak utolsó napja (tegnap — a job is befejezett napokkal dolgozik).' }
        lookbackDays: { type: integer, description: 'mezo.companion.patterns.lookback-days' }
        minN: { type: integer, description: 'mezo.companion.patterns.min-n — a felszínre-engedő kapu.' }
        cron: { type: string, description: 'A nyers cron-kifejezés (a FE nem parse-olja, csak megjeleníti).' }
        lastRunAt: { type: string, format: date-time, nullable: true, description: 'A user statisztikai sorainak max(lastDetectedAt)-ja — az utolsó FELISMERÉS, nem az utolsó JOB-FUTÁS: a job minden éjjel lefut, de ez a mező csak akkor mozdul, ha talált (LIVE) egy párt, és egy confirmed/rejected sor mellett akkor sem, ha az továbbra is a job ablakában van (upsert nem érinti). null = még sosem talált mintát.' }
        pairs:
          type: array
          items: { $ref: '#/components/schemas/PatternMonitorPair' }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/PatternMetricCoverage' }
    PatternMonitorPair:
      type: object
      required: [key, title, category, categoryLabel, lagDays, metricAKey, metricALabel, metricAValueKind, metricBKey, metricBLabel, metricBValueKind, mechanismHu, questionHu, expectedDirection, whenPositiveHu, whenNegativeHu, metricADomain, metricBDomain, verdict, alignedDays]
      properties:
        key: { type: string, description: 'A pár stabil identitása (pair_key).' }
        title: { type: string }
        category: { type: string, pattern: '^(physiology|trigger|response)$' }
        categoryLabel: { type: string }
        lagDays: { type: integer, description: 'metric-b ennyi nappal metric-a napja UTÁN olvasódik.' }
        metricAKey: { type: string }
        metricALabel: { type: string }
        metricAValueKind: { type: string, pattern: '^(number|clock_hour|binary)$', description: 'A metrika megjelenítési típusa; a grafikon és az értékformázás contractos forrása.' }
        metricBKey: { type: string }
        metricBLabel: { type: string }
        metricBValueKind: { type: string, pattern: '^(number|clock_hour|binary)$', description: 'A metrika megjelenítési típusa; a grafikon és az értékformázás contractos forrása.' }
        mechanismHu: { type: string, description: 'Miért figyeljük — a katalógus mechanism-egysorosa (mezo-18bx).' }
        questionHu: { type: string, description: 'Kérdés-cím a Motor kártyán — „Jobban alszol, ha…?" (mezo-fj1g).' }
        expectedDirection: { type: string, pattern: '^(positive|negative)$', description: 'A mechanizmus által várt korreláció-irány (mezo-fj1g).' }
        whenPositiveHu: { type: string, description: 'Pozitív r emberi olvasata — {erősség} behelyettesítővel (mezo-fj1g).' }
        whenNegativeHu: { type: string, description: 'Negatív r emberi olvasata — {erősség} behelyettesítővel (mezo-fj1g).' }
        metricADomain: { type: string, pattern: '^(sleep|train|fuel|mind|body|other)$', description: 'metric-a élet-doménje.' }
        metricBDomain: { type: string, pattern: '^(sleep|train|fuel|mind|body|other)$', description: 'metric-b (a kimenet) doménje — a Motor tab elsődleges csoportja.' }
        verdict: { type: string, pattern: '^(live|few_days|no_data|degenerate|imbalanced_groups|frozen)$' }
        alignedDays: { type: integer, description: 'Az illesztett napok száma (frozen sornál a befagyasztott n).' }
        missingDays: { type: integer, nullable: true, description: 'minN - alignedDays — csak few_days.' }
