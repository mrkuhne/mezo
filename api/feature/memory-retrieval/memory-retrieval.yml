openapi: 3.0.3
info: { title: mezo memory-retrieval fragment, version: 1.0.0 }
paths:
  /api/companion/memory/retrieval-feedback:
    get:
      tags: [MemoryRetrieval]
      operationId: listMemoryRetrievalFeedback
      summary: Batch-read feedback for caller-owned retrieval results (MemoryRetrieval)
      description: >-
        Returns only feedback rows owned by the caller among the requested result IDs.
        Unknown, foreign and never-rated IDs are omitted.
      parameters:
        - name: resultIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Existing feedback for the requested owned results, possibly empty
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemoryRetrievalFeedbackResponse' }
        '400':
          description: Validation error (empty or oversized result ID list)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/companion/memory/retrieval/{runId}/result/{resultId}/feedback:
    put:
      tags: [MemoryRetrieval]
      operationId: putMemoryRetrievalFeedback
      summary: Upsert feedback for one caller-owned retrieval result (MemoryRetrieval)
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: resultId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutMemoryRetrievalFeedbackRequest' }
      responses:
        '200':
          description: Stored feedback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryRetrievalFeedbackResponse' }
        '400':
          description: Validation error, including non-memory suppression or changing a terminal suppression
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: Retrieval run/result pair is not owned by the caller or does not match
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
components:
  schemas:
    PutMemoryRetrievalFeedbackRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          pattern: '^(useful|irrelevant|suppress)$'
          description: "'useful' | 'irrelevant' | 'suppress'"
    MemoryRetrievalFeedbackResponse:
      type: object
      required: [runId, resultId, action, updatedAt]
      properties:
        runId: { type: string, format: uuid }
        resultId: { type: string, format: uuid }
        action:
          type: string
          enum: [useful, irrelevant, suppress]
          description: "'useful' | 'irrelevant' | 'suppress'"
        updatedAt: { type: string, format: date-time }
