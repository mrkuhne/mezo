      properties:
        key:
          type: string
          enum: [recurringIncome, oneOffIncome, fixedCosts, savingsTarget, practice, invested, previousDeficit, free, spent, remaining]
        amount: { $ref: '#/components/schemas/PenzMoney' }
    PenzAllowanceMonth:
      type: object
      required: [month, free, spent, remaining]
      properties:
        month: { type: string, description: "'YYYY-MM'" }
        free: { $ref: '#/components/schemas/PenzMoney' }
        spent: { $ref: '#/components/schemas/PenzMoney' }
        remaining: { $ref: '#/components/schemas/PenzMoney' }
    PenzAllowanceWeek:
      type: object
      required: [start, end, budget, spent, remaining, perDay]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
