openapi: 3.0.3
info: { title: mezo penz fragment, version: 1.0.0 }
tags:
  - name: Penz
    description: >
      Boop Pénz L4 (mezo-r36n9.102) — the money foundation: settings, accounts, categories, transactions (with
      transfer pairs), recurring rules, the weekly allowance and the month close. Money travels as PenzMoney —
      minor units (1/100 of the major unit for EVERY currency, HUF included) in its own currency plus the HUF
      twin computed ONCE at write time from the ECB reference rate of the transaction's own date (frankfurter.dev)
      and stored, never re-derived. Writes in a non-HUF currency answer 503 PENZ_FX_UNAVAILABLE when no rate is
      reachable (provider down and no cached rate within 7 days before the date).
paths:
  /api/penz/settings:
    get:
      tags: [Penz]
      operationId: getPenzSettings
      summary: The caller's money settings (created with the defaults on first access)
      responses:
        '200':
          description: The settings
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzSettingsResponse' } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    put:
      tags: [Penz]
      operationId: putPenzSettings
      summary: Replace the caller's money settings
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzSettingsRequest' } } }
      responses:
        '200':
          description: The stored settings
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzSettingsResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/accounts:
    get:
      tags: [Penz]
      operationId: listPenzAccounts
      summary: The caller's accounts (archived ones only when asked)
      parameters:
        - { name: includeArchived, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Accounts, default first, then by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzAccountResponse' } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Penz]
      operationId: createPenzAccount
      summary: Create an account (isDefault / isSavingsTarget move the flag off every other account; the first account is the default, the first savings account the savings target)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzAccountRequest' } } }
      responses:
        '200':
          description: The created account
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzAccountResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/accounts/{id}:
    put:
      tags: [Penz]
      operationId: updatePenzAccount
      summary: Update an account
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzAccountRequest' } } }
      responses:
        '200':
          description: The updated account
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzAccountResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such account of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'It is the last non-archived account (PENZ_LAST_ACTIVE_ACCOUNT), or the currency changes while the account has transactions or recurring rules (PENZ_ACCOUNT_CURRENCY_LOCKED)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/accounts/{id}/archive:
    post:
      tags: [Penz]
      operationId: archivePenzAccount
      summary: Archive an account (its transactions stay; it leaves the default lists; a default or savings-target flag moves to the first other active account that can hold it)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The archived account
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzAccountResponse' } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such account of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'It is the last non-archived account (PENZ_LAST_ACTIVE_ACCOUNT)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/categories:
    get:
      tags: [Penz]
      operationId: listPenzCategories
      summary: The caller's categories (the 15 Hungarian defaults are seeded on first access)
      responses:
        '200':
          description: Categories by kind, then position
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzCategoryResponse' } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Penz]
      operationId: createPenzCategory
      summary: Create a category
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzCategoryRequest' } } }
      responses:
        '200':
          description: The created category
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzCategoryResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'A category of this kind already has this name', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/categories/{id}:
    put:
      tags: [Penz]
      operationId: updatePenzCategory
      summary: Update a category
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzCategoryRequest' } } }
      responses:
        '200':
          description: The updated category
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzCategoryResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such category of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'A category of this kind already has this name', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/transactions:
    get:
      tags: [Penz]
      operationId: listPenzTransactions
      summary: The caller's transactions of one month, newest first
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - { name: needsReview, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: Transactions of the month
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzTransactionResponse' } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Penz]
      operationId: createPenzTransaction
      summary: Record a transaction — idempotent on clientRef (a replay returns the stored row)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzTransactionRequest' } } }
      responses:
        '200':
          description: The stored transaction
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzTransactionResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Unknown account or category of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '503': { description: 'No exchange rate reachable for a non-HUF amount (PENZ_FX_UNAVAILABLE)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/transactions/{id}:
    put:
      tags: [Penz]
      operationId: updatePenzTransaction
      summary: Update a transaction (a transfer leg moves amount, date and note on both legs)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzTransactionRequest' } } }
      responses:
        '200':
          description: The updated transaction
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzTransactionResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such transaction of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'PENZ_TRANSACTION_INVEST_LINKED — the money row of a recorded investment buy / sell; change or delete the investment record instead', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '503': { description: 'No exchange rate reachable for a non-HUF amount (PENZ_FX_UNAVAILABLE)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    delete:
      tags: [Penz]
      operationId: deletePenzTransaction
      summary: Delete a transaction (soft; a transfer leg takes its pair with it)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such transaction of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'PENZ_TRANSACTION_INVEST_LINKED — the money row of a recorded investment buy / sell; delete the investment record instead', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/transactions/{id}/reviewed:
    post:
      tags: [Penz]
      operationId: markPenzTransactionReviewed
      summary: Mark a transaction as reviewed (clears needsReview)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The transaction
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzTransactionResponse' } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such transaction of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/transfers:
    post:
      tags: [Penz]
      operationId: createPenzTransfer
      summary: Move money between two own accounts — a transfer_out + transfer_in pair, idempotent on clientRef
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzTransferRequest' } } }
      responses:
        '200':
          description: The two legs, transfer_out first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzTransactionResponse' } }
        '400': { description: 'Validation failure (e.g. the same account on both sides)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Unknown account of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '503': { description: 'No exchange rate reachable for a non-HUF amount (PENZ_FX_UNAVAILABLE)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/recurring-rules:
    get:
      tags: [Penz]
      operationId: listPenzRecurringRules
      summary: The caller's recurring income and fixed costs
      responses:
        '200':
          description: Rules by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzRecurringRuleResponse' } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Penz]
      operationId: createPenzRecurringRule
      summary: Create a recurring rule
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzRecurringRuleRequest' } } }
      responses:
        '200':
          description: The created rule
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzRecurringRuleResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'Unknown account or category of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '503': { description: 'No exchange rate reachable for a non-HUF amount (PENZ_FX_UNAVAILABLE)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/recurring-rules/{id}:
    put:
      tags: [Penz]
      operationId: updatePenzRecurringRule
      summary: Update a recurring rule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzRecurringRuleRequest' } } }
      responses:
        '200':
          description: The updated rule
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzRecurringRuleResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such rule of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '503': { description: 'No exchange rate reachable for a non-HUF amount (PENZ_FX_UNAVAILABLE)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    delete:
      tags: [Penz]
      operationId: deletePenzRecurringRule
      summary: Delete a recurring rule (soft; transactions it produced stay)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such rule of the caller', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/allowance:
    get:
      tags: [Penz]
      operationId: getPenzAllowance
      summary: The month's free money, the week's budget and what is left — with every line of the derivation
      description: >-
        Due recurring occurrences are written as transactions first. week.perDay = max(0, week.remaining) / the days
        left in the Monday-start week counting the date itself (floored to a whole minor unit). previousDeficit is
        the deficit the previous month's close stored (0 while that month is open).
      parameters:
        - { name: date, in: query, required: false, description: "Defaults to today in the owner's money timezone", schema: { type: string, format: date } }
      responses:
        '200':
          description: The allowance for the month and week containing the date
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzAllowanceResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/month-closes:
    get:
      tags: [Penz]
      operationId: listPenzMonthCloses
      summary: The caller's closed months, newest first
      responses:
        '200':
          description: Closed months
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzMonthCloseResponse' } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/month-closes/open:
    get:
      tags: [Penz]
      operationId: listOpenPenzMonths
      summary: Past months that have transactions and no close yet, oldest first (closed = false), with the finalRemaining and deficit a close would store now
      responses:
        '200':
          description: Open months
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzMonthCloseResponse' } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/month-closes/{month}:
    post:
      tags: [Penz]
      operationId: closePenzMonth
      summary: Close a past month — leftover transferred to the savings-target account, kept, or none (a deficit)
      parameters:
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzMonthCloseRequest' } } }
      responses:
        '200':
          description: The close
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzMonthCloseResponse' } } }
        '400': { description: 'Validation failure, or the month is not over yet', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'Already closed (PENZ_MONTH_ALREADY_CLOSED), an earlier month is still open (PENZ_EARLIER_MONTH_OPEN — months close oldest first), or no savings-target account for a transfer', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/savings-goals:
    get:
      tags: [Penz]
      operationId: listPenzSavingsGoals
      summary: The caller's savings goals and purchase plans (L5, mezo-r36n9.103), by position then creation
      responses:
        '200':
          description: Savings goals
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzSavingsGoalResponse' } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Penz]
      operationId: createPenzSavingsGoal
      summary: Create a savings goal or purchase plan — idempotent on clientRef (a replay returns the stored row)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzSavingsGoalRequest' } } }
      responses:
        '201':
          description: The stored savings goal (also the answer to a replayed clientRef)
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzSavingsGoalResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/savings-goals/{id}:
    put:
      tags: [Penz]
      operationId: updatePenzSavingsGoal
      summary: Update a savings goal (clientRef is ignored; a null position keeps the current one)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzSavingsGoalRequest' } } }
      responses:
        '200':
          description: The updated savings goal
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzSavingsGoalResponse' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such savings goal of the caller (PENZ_SAVINGS_GOAL_NOT_FOUND)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    delete:
      tags: [Penz]
      operationId: deletePenzSavingsGoal
      summary: Delete a savings goal (soft)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'No such savings goal of the caller (PENZ_SAVINGS_GOAL_NOT_FOUND)', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    PenzMoney:
      type: object
      description: >
        An amount in minor units (1/100 of the major unit for every currency, HUF included: 15 500 Ft = 1550000)
        in its own ISO-4217 currency, plus its HUF twin (stored at write time, never re-derived).
      required: [minor, currency, hufMinor]
      properties:
        minor: { type: integer, format: int64 }
        currency: { type: string }
        hufMinor: { type: integer, format: int64 }
    PenzMonthOverride:
      type: object
      properties:
        savingsTargetHufMinor: { type: integer, format: int64, nullable: true }
        categoryBudgets:
          type: object
          description: categoryId -> monthly budget in HUF minor units
          additionalProperties: { type: integer, format: int64 }
    PenzSettingsResponse:
      type: object
      required: [savingsTargetHufMinor, practiceMonthlyHufMinor, weekStart, emergencyFundMonths, timezone, monthOverrides]
      properties:
        savingsTargetHufMinor: { type: integer, format: int64 }
        practiceMonthlyHufMinor: { type: integer, format: int64, description: 'Gyakorlás monthly cap (spec §10.1.2)' }
        weekStart: { type: string, enum: [monday] }
        emergencyFundMonths: { type: integer }
        timezone: { type: string }
        monthOverrides:
          type: object
          description: "'YYYY-MM' -> override"
          additionalProperties: { $ref: '#/components/schemas/PenzMonthOverride' }
    PenzSettingsRequest:
      type: object
      required: [savingsTargetHufMinor, practiceMonthlyHufMinor]
      properties:
        savingsTargetHufMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
        practiceMonthlyHufMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
        weekStart: { type: string, pattern: '^monday$', nullable: true }
        emergencyFundMonths: { type: integer, minimum: 0, maximum: 60, nullable: true }
        timezone: { type: string, maxLength: 64, nullable: true }
        monthOverrides:
