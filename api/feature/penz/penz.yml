      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, pattern: '^(expense|income)$' }
        amountMinor: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
        currency: { type: string, pattern: '^(HUF|EUR|USD|GBP|CHF)$' }
        categoryId: { type: string, format: uuid, nullable: true }
        accountId: { type: string, format: uuid }
