        saved: { $ref: '#/components/schemas/PenzMoney' }
        dueDate: { type: string, format: date, nullable: true }
        note: { type: string, nullable: true }
        position: { type: integer }
        clientRef: { type: string, format: uuid, nullable: true }
    PenzSavingsGoalRequest:
      type: object
      required: [name, kind, targetHufMinor]
      properties:
        clientRef: { type: string, format: uuid, nullable: true, description: 'Idempotency key of a phone write (ignored on update)' }
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, pattern: '^(goal|purchase)$' }
        targetHufMinor: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
        savedHufMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000, nullable: true, description: 'Defaults to 0' }
        dueDate: { type: string, format: date, nullable: true }
        note: { type: string, maxLength: 500, nullable: true }
        position: { type: integer, minimum: 0, nullable: true, description: 'Defaults to the end of the list on create; null keeps the current one on update' }
