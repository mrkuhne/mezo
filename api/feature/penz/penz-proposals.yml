openapi: 3.0.3
info: { title: mezo penz catalog + proposals fragment, version: 1.0.0 }
tags:
  - name: PenzCatalog
    description: >
      Boop Pénz L7 (mezo-r36n9.105) — the curated product list a proposal may name (spec §10.2.1). Per owner,
      seeded once from a researched list (every seed row suggested / research, with fee fields, its source and the
      date the figures were checked); the model never adds a product. The owner approves or declines with one tap,
      adds one himself (approved at once) or updates fees (reviewedAt = today). Only approved rows ever appear in a
      proposal.
  - name: PenzProposal
    description: >
      Boop Pénz L7 (mezo-r36n9.105) — the investment proposal flow and the monthly strategy. A proposal splits one
      amount across the three sleeves by fixed, printed rules (emergency shortfall first, then 40 % mid / 60 % long,
      1 000 Ft rounding), offers two or three approved products per sleeve with server-computed costs, and carries a
      narration the model writes from those figures only (validated; fixed copy when it fails). He adjusts every
      number and accepts; the accepted plan is a checklist he ticks himself. Nothing here moves money, records a
      transaction or creates a holding.
paths:
  /api/penz/catalog:
    get:
      tags: [PenzCatalog]
      operationId: listPenzProducts
      summary: The caller's product list — approved, then suggested, then declined (seeded once on first access)
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzProduct' } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [PenzCatalog]
      operationId: createPenzProduct
      summary: Add a product himself — stored approved, suggestedBy owner, reviewedAt today
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzProductRequest' } } }
      responses:
        '201':
          description: The stored product
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzProduct' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/catalog/{id}:
    put:
      tags: [PenzCatalog]
      operationId: updatePenzProduct
      summary: Edit a product's text or fees — reviewedAt becomes today; the status does not change
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzProductRequest' } } }
      responses:
        '200':
          description: The updated product
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzProduct' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'PENZ_PRODUCT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/catalog/{id}/approve:
    post:
      tags: [PenzCatalog]
      operationId: approvePenzProduct
      summary: One tap — the product may now be named in a proposal (idempotent)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The approved product
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzProduct' } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'PENZ_PRODUCT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/catalog/{id}/decline:
    post:
      tags: [PenzCatalog]
      operationId: declinePenzProduct
      summary: One tap — the product is never offered (idempotent; an approved product may be declined later)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The declined product
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzProduct' } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'PENZ_PRODUCT_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/strategy:
    get:
      tags: [PenzProposal]
      operationId: getPenzStrategy
      summary: >
        The monthly strategy figure (the old app's monthly-investable formula) with its inputs, and the month's
        current monthly proposal if any. Computed on every read; re-proposed only when he asks.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: The strategy figure
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzStrategy' } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/proposals:
    get:
      tags: [PenzProposal]
      operationId: listPenzProposals
      summary: The caller's proposals, newest first, optionally of one status
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, pattern: '^(proposed|accepted|dismissed|superseded)$' } }
      responses:
        '200':
          description: Proposals
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PenzProposal' } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [PenzProposal]
      operationId: createPenzProposal
      summary: >
        Ask for a proposal — lump_sum with his amount, or monthly for the strategy figure. A newer proposal of the
        same kind supersedes an un-accepted older one. No amount (or a monthly figure of 0) is 400
        PENZ_PROPOSAL_AMOUNT_INVALID.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzProposalRequest' } } }
      responses:
        '201':
          description: The new proposal
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzProposal' } } }
        '400': { description: 'Validation failure / PENZ_PROPOSAL_AMOUNT_INVALID', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/proposals/{id}:
    get:
      tags: [PenzProposal]
      operationId: getPenzProposal
      summary: One proposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The proposal
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzProposal' } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'PENZ_PROPOSAL_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/proposals/{id}/accept:
    post:
      tags: [PenzProposal]
      operationId: acceptPenzProposal
      summary: >
        Accept with his own numbers. Each sleeve at most once; a product must be one of that sleeve's offered options
        and still approved (409 PENZ_PRODUCT_NOT_APPROVED), or null when the amount is 0; the total must be above 0
        (400 PENZ_PROPOSAL_AMOUNT_INVALID). Only a proposed proposal can be accepted (409 PENZ_PROPOSAL_STATE).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzProposalAcceptRequest' } } }
      responses:
        '200':
          description: The accepted proposal with its plan
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzProposal' } } }
        '400': { description: 'Validation failure / PENZ_PROPOSAL_AMOUNT_INVALID', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'PENZ_PROPOSAL_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'PENZ_PROPOSAL_STATE / PENZ_PRODUCT_NOT_APPROVED', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/proposals/{id}/dismiss:
    post:
      tags: [PenzProposal]
      operationId: dismissPenzProposal
      summary: Most nem — only a proposed proposal (409 PENZ_PROPOSAL_STATE otherwise)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The dismissed proposal
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzProposal' } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'PENZ_PROPOSAL_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'PENZ_PROPOSAL_STATE', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/penz/proposals/{id}/steps/{index}:
    post:
      tags: [PenzProposal]
      operationId: setPenzProposalStep
      summary: >
        Tick or untick one step of an accepted plan. Records nothing in Pénzem — the real buy is recorded with the
        existing investment sheet. Not accepted → 409 PENZ_PROPOSAL_STATE; no such step → 404 PENZ_PROPOSAL_NOT_FOUND.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PenzProposalStepRequest' } } }
      responses:
        '200':
          description: The proposal with the step updated
          content: { application/json: { schema: { $ref: '#/components/schemas/PenzProposal' } } }
        '400': { description: 'Validation failure', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: 'Missing/invalid token', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: 'PENZ_PROPOSAL_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '409': { description: 'PENZ_PROPOSAL_STATE', content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    PenzProductRequest:
      type: object
      required: [name, kind, currency, sleeves, whatItIs, distribution]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, pattern: '^(state_bond|money_market|bond_etf|equity_etf|mixed_fund|deposit)$' }
        currency: { type: string, pattern: '^(HUF|EUR|USD|GBP|CHF)$' }
        sleeves:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, pattern: '^(short|mid|long)$' }
        whatItIs: { type: string, minLength: 1, maxLength: 600 }
        terPct: { type: number, nullable: true, minimum: 0, maximum: 10, description: 'Yearly running cost (TER), percent' }
        entryFeePct: { type: number, nullable: true, minimum: 0, maximum: 10, description: 'One-off entry fee, percent' }
        distribution: { type: string, pattern: '^(accumulating|distributing|interest)$' }
        isin: { type: string, nullable: true, pattern: '^[A-Z]{2}[A-Z0-9]{9}[0-9]$' }
        symbol: { type: string, nullable: true, pattern: '^[A-Za-z0-9.\-=^]{1,20}$' }
        sourceName: { type: string, nullable: true, maxLength: 120 }
        sourceUrl: { type: string, nullable: true, maxLength: 500, pattern: '^https://\S+$' }
    PenzProduct:
      type: object
      required: [id, name, kind, currency, sleeves, whatItIs, distribution, reviewedAt, status, suggestedBy]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [state_bond, money_market, bond_etf, equity_etf, mixed_fund, deposit] }
        currency: { type: string }
        sleeves: { type: array, items: { type: string, enum: [short, mid, long] } }
        whatItIs: { type: string }
        terPct: { type: number, nullable: true }
        entryFeePct: { type: number, nullable: true }
        feeNote: { type: string, nullable: true }
        distribution: { type: string, enum: [accumulating, distributing, interest] }
        isin: { type: string, nullable: true }
        symbol: { type: string, nullable: true }
        sourceName: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        reviewedAt: { type: string, format: date, description: 'The date the fee figures were checked against the source' }
        status: { type: string, enum: [suggested, approved, declined] }
        suggestedBy: { type: string, enum: [research, owner] }
        approvedAt: { type: string, format: date-time, nullable: true }
    PenzStrategy:
      type: object
      required: [availableHufMinor, inputs, note]
      properties:
        availableHufMinor: { type: integer, format: int64, description: 'The monthly figure a monthly proposal splits; 0 when nothing is spare or there is no data' }
        inputs: { type: array, items: { $ref: '#/components/schemas/PenzStrategyInput' } }
        note: { type: string, description: 'How the figure came about, final Hungarian copy' }
        current: { allOf: [ { $ref: '#/components/schemas/PenzProposal' } ], nullable: true }
    PenzStrategyInput:
      type: object
      required: [key, label, hufMinor]
      properties:
        key: { type: string }
        label: { type: string }
        hufMinor: { type: integer, format: int64 }
    PenzProposalRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, pattern: '^(lump_sum|monthly)$' }
        amountHufMinor: { type: integer, format: int64, nullable: true, minimum: 1, maximum: 100000000000, description: 'lump_sum only: the amount to split, HUF minor units (at least 1 000 Ft)' }
    PenzProposal:
      type: object
      required: [id, kind, status, amountHufMinor, createdAt, title, sub, summary, uncertainty, narratedBy, facts, rules, sleeves, plan]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [lump_sum, monthly] }
        status: { type: string, enum: [proposed, accepted, dismissed, superseded] }
        amountHufMinor: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
        title: { type: string }
        sub: { type: string }
        summary: { type: string }
        uncertainty: { type: string }
        narratedBy: { type: string, enum: [model, fallback] }
        facts: { type: array, items: { $ref: '#/components/schemas/PenzProposalFact' } }
        rules: { type: array, items: { type: string } }
        sleeves: { type: array, items: { $ref: '#/components/schemas/PenzProposalSleeve' } }
        plan: { type: array, items: { $ref: '#/components/schemas/PenzProposalStep' } }
    PenzProposalFact:
      type: object
      required: [value, unit, label]
      properties:
        value: { type: string }
        unit: { type: string }
        label: { type: string }
    PenzProposalSleeve:
      type: object
      required: [sleeve, label, amountHufMinor, sharePct, why, options]
      properties:
        sleeve: { type: string, enum: [short, mid, long] }
        label: { type: string }
        amountHufMinor: { type: integer, format: int64 }
        sharePct: { type: number, description: 'Share of the proposal amount, percent, 1 decimal' }
        why: { type: string }
        optionsNote: { type: string, nullable: true }
        options: { type: array, items: { $ref: '#/components/schemas/PenzProposalOption' } }
    PenzProposalOption:
      type: object
      required: [productId, name, whatItIs, kind, currency, distribution, reviewedAt, differs]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        whatItIs: { type: string }
        kind: { type: string, enum: [state_bond, money_market, bond_etf, equity_etf, mixed_fund, deposit] }
        currency: { type: string }
        distribution: { type: string, enum: [accumulating, distributing, interest] }
        terPct: { type: number, nullable: true }
        entryFeePct: { type: number, nullable: true }
        feeNote: { type: string, nullable: true }
        yearlyCostHufMinor: { type: integer, format: int64, nullable: true, description: 'The sleeve amount × TER, rounded to 10 Ft; null without a TER' }
        reviewedAt: { type: string, format: date }
        differs: { type: array, items: { type: string } }
    PenzProposalStep:
      type: object
      required: [index, sleeve, amountHufMinor, done]
      properties:
        index: { type: integer }
        sleeve: { type: string, enum: [short, mid, long] }
        productId: { type: string, format: uuid, nullable: true }
        productName: { type: string, nullable: true }
        amountHufMinor: { type: integer, format: int64 }
        done: { type: boolean }
        doneAt: { type: string, format: date-time, nullable: true }
    PenzProposalAcceptRequest:
      type: object
      required: [sleeves]
      properties:
        sleeves:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/PenzProposalAcceptSleeve' }
    PenzProposalAcceptSleeve:
      type: object
      required: [sleeve, amountHufMinor]
      properties:
        sleeve: { type: string, pattern: '^(short|mid|long)$' }
        amountHufMinor: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
        productId: { type: string, format: uuid, nullable: true }
    PenzProposalStepRequest:
      type: object
      required: [done]
      properties:
        done: { type: boolean }
