openapi: 3.0.3
info: { title: mezo journal fragment, version: 1.0.0 }
paths:
  /api/journal:
    get:
      tags: [Journal]
      operationId: listJournalEntries
      summary: Journal entries in a date range, newest first (Journal)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Entries with occurred_on in [from, to], newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JournalEntryResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    post:
      tags: [Journal]
      operationId: createJournalEntry
      summary: Create a free-prose journal entry (Journal)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJournalEntryRequest' }
      responses:
        '201':
          description: Entry saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryResponse' }
        '400':
          description: Validation error (empty text, bad source)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/journal/{id}:
    put:
      tags: [Journal]
      operationId: updateJournalEntry
      summary: Edit an entry's text and/or day (Journal)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateJournalEntryRequest' }
      responses:
        '200':
          description: Updated entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntryResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: JOURNAL_ENTRY_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    delete:
      tags: [Journal]
      operationId: deleteJournalEntry
      summary: Soft-delete an entry (Journal)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Deleted
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: JOURNAL_ENTRY_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/journal/decision:
    get:
      tags: [Journal]
      operationId: listDecisionEntries
      summary: All decisions, newest first (Journal)
      responses:
        '200':
          description: Every non-deleted decision, newest first by decidedOn
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DecisionEntryResponse' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
    post:
      tags: [Journal]
      operationId: createDecisionEntry
      summary: Record a decision; the server freezes its own context snapshot (Journal)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDecisionEntryRequest' }
      responses:
        '201':
          description: Decision saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionEntryResponse' }
        '400':
          description: Validation error (empty decisionText)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/journal/decision/{id}/review:
    put:
      tags: [Journal]
      operationId: reviewDecisionEntry
      summary: Rate how a decision turned out (Journal)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionRequest' }
      responses:
        '200':
          description: Reviewed decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionEntryResponse' }
        '400':
          description: Validation error (rating out of 1..5)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
        '404':
          description: DECISION_ENTRY_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMessageList' }
  /api/journal/gratitude:
    get:
      tags: [Journal]
      summary: List gratitude entries in a date range (Journal)
      operationId: listGratitudeEntries
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Entries, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GratitudeEntryResponse' } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
    post:
      tags: [Journal]
      summary: Create a gratitude entry (Journal)
      operationId: createGratitudeEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGratitudeEntryRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GratitudeEntryResponse' }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
  /api/journal/gratitude/{id}:
    delete:
      tags: [Journal]
      summary: Soft-delete a gratitude entry (Journal)
      operationId: deleteGratitudeEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMessageList' } } } }
components:
  schemas:
    JournalEntryResponse:
      type: object
      required: [id, occurredOn, text, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        occurredOn: { type: string, format: date }
        text: { type: string }
        source: { type: string, enum: [quickinput, ritual] }
        createdAt: { type: string, format: date-time }
    CreateJournalEntryRequest:
      type: object
      required: [text, source]
      properties:
        text: { type: string, minLength: 1 }
        occurredOn:
          type: string
          format: date
          description: The day the entry is ABOUT; server defaults to today when absent.
        source: { type: string, pattern: '^(quickinput|ritual)$' }
    UpdateJournalEntryRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        occurredOn:
          type: string
          format: date
          description: Absent = keep the current day.
    DecisionEntryResponse:
      type: object
      required: [id, decidedOn, decisionText, reviewDue, createdAt]
      properties:
        id: { type: string, format: uuid }
        decidedOn: { type: string, format: date }
        decisionText: { type: string }
        reviewDue:
          type: string
          format: date
          description: decidedOn + mezo.companion.journal.decision-review-days, server-computed.
        reviewedAt: { type: string, format: date-time, nullable: true }
        outcomeRating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        outcomeText: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateDecisionEntryRequest:
      type: object
      required: [decisionText]
      properties:
        decisionText: { type: string, minLength: 1 }
        decidedOn:
          type: string
          format: date
          description: The day the decision was made; server defaults to today when absent.
    ReviewDecisionRequest:
      type: object
      required: [outcomeRating]
      properties:
        outcomeRating: { type: integer, minimum: 1, maximum: 5 }
        outcomeText: { type: string }
    GratitudeEntryResponse:
      type: object
      required: [id, occurredOn, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        occurredOn: { type: string, format: date }
        text: { type: string, maxLength: 280 }
        lifeArea: { type: string, nullable: true, pattern: '^(mindfulness|mindset|cooking|financial|productivity|learning|connection|recovery)$' }
        createdAt: { type: string, format: date-time }
    CreateGratitudeEntryRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 280 }
        lifeArea: { type: string, nullable: true, pattern: '^(mindfulness|mindset|cooking|financial|productivity|learning|connection|recovery)$' }
        occurredOn: { type: string, format: date, description: Defaults to today when absent }
