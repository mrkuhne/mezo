  /api/companion/feedback:
    get:
      tags:
        - CompanionFeedback
      operationId: listFeedback
      summary: >-
        Batch-read this user's verdicts for one artifact kind
        (CompanionFeedback)
      description: >-
        Page hydration: the caller passes every artifact id it renders and gets
        back only the ones that carry a verdict. Unknown/never-voted ids are
        simply absent (never an error) — the surface degrades to "no chip
        selected", never to a failed page.
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            pattern: >-
              ^(chat_message|feed_message|weekly_suggestion|weekly_review|memoir|prediction)$
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: The verdicts that exist among the requested ids (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageFeedbackResponse'
        '400':
          description: 'Validation error (unknown kind, empty/oversized id list)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    put:
      tags:
        - CompanionFeedback
      operationId: putFeedback
      summary: Upsert the single verdict for one artifact (CompanionFeedback)
      description: >-
        One updatable verdict per (user, artifactKind, artifactId). Re-tapping
        the OTHER verdict overwrites this row; re-tapping the SAME verdict is a
        retraction and goes to DELETE. Artifact existence is deliberately NOT
        checked cross-table (the kinds span five tables; a dangling id is
        harmless in a single-user app).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutFeedbackRequest'
      responses:
        '200':
          description: The stored verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageFeedbackResponse'
        '400':
          description: >-
            Validation error (unknown kind/verdict/reason, or reason sent with
            an up verdict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/companion/feedback/{artifactKind}/{artifactId}':
    delete:
      tags:
        - CompanionFeedback
      operationId: deleteFeedback
      summary: Retract the verdict on one artifact (CompanionFeedback)
      parameters:
        - name: artifactKind
          in: path
          required: true
          schema:
            type: string
            pattern: >-
              ^(chat_message|feed_message|weekly_suggestion|weekly_review|memoir|prediction)$
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: >-
            Retracted (idempotent — retracting a never-voted artifact also
            returns 204)
        '400':
          description: Validation error (unknown kind)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
