        days:
          type: array
          items:
            $ref: '#/components/schemas/PillarDayEntry'
    GoalDayEntry:
      type: object
      required:
        - day
      properties:
        day:
          type: string
          format: date
        point:
          type: number
          description: weighted daily point 0..1; absent = no pillar had data
    LifeGoalProgressResponse:
      type: object
      required:
        - goalId
        - from
        - to
        - arrow
        - days
        - pillars
        - conflicts
      properties:
        goalId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        arrow:
          $ref: '#/components/schemas/TrendArrow'
        weeklyPct:
          type: integer
          description: >-
            round(mean of the last 7 days' points × 100); absent when no
            data-day in the window
