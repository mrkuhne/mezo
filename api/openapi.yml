  '/api/me/week/{start}/trend':
    get:
      tags:
        - MeWeek
      operationId: getMeWeekTrend
      summary: >-
        The persisted weekly-score trend for the N ISO weeks ending at start
        (inclusive)
      description: >-
        The Heti hero's 8-week trend (mezo-d20.7.5). Points are the PERSISTED
        weekly scores (weekly_score) — a deterministic cache, refreshed whenever
        the week's own inputs changed after computedAt (and always for a week
        that has not finished yet). A week whose score is null (fewer than 2
        scored days — the "tanulom" gate) yields NO point: the series is short,
        never padded with a zero. Oldest first.
      parameters:
        - name: start
          in: path
          required: true
          description: >-
            The last week of the window — its ISO Monday (400 when the date is
            not a Monday)
          schema:
            type: string
            format: date
        - name: weeks
          in: query
          required: false
          description: >-
            How many ISO weeks the window spans, counting back from start
            (inclusive)
          schema:
            type: integer
            minimum: 1
            maximum: 26
            default: 8
      responses:
        '200':
          description: 'The window''s points (0..weeks entries, oldest first)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeWeekTrendResponse'
        '400':
          description: 'start is not an ISO Monday, or weeks is out of range'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
