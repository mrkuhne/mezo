  /api/train/workouts/today:
    get:
      tags:
        - Train
      operationId: getTodayWorkout
      summary: >-
        Workout context for a template day — day resolution is open instance >
        templateSessionId param > today's weekday label
      description: >-
        Cross-day start (mezo-p7rp): the resolved day is (1) the template day of
        the user's open (active) instance when one exists — the open workout
        always wins, even over the param — else (2) the template day named by
        the optional templateSessionId query param (owned template row, else
        404), else (3) the active meso's template day matching today's HU
        weekday label. completedWorkout is the resolved day's most recent
        COMPLETED instance of the current Mon–Sun week (any date) — a day
        already done this week reviews instead of restarting.
      parameters:
        - name: templateSessionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >-
            Workout context for the resolved day (empty object when no active
            meso or rest day)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutTodayResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/workouts:
    get:
      tags:
        - Train
      operationId: listWorkouts
      summary: >-
        Completed workout instances in the inclusive date range — same "done =
        explicitly finished" semantics as weekDoneDates
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
