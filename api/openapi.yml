        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/llm-usage/breakdown:
    get:
      tags:
        - LlmUsage
      operationId: getLlmUsageBreakdown
      summary: >-
        LLM call + cost breakdown by feature and served model for one calendar
        period (LlmUsage)
      parameters:
        - name: period
          in: query
          required: true
          description: >-
            Calendar period in mezo.llm-log.report-zone (DAY = today, WEEK =
            from Monday, MONTH = from the 1st)
          schema:
            type: string
            pattern: ^(DAY|WEEK|MONTH)$
      responses:
        '200':
          description: 'Totals plus the feature and model rollups, cost-descending'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmUsageBreakdownResponse'
        '400':
          description: Unknown period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/llm-usage/calls:
    get:
      tags:
        - LlmUsage
      operationId: listLlmCalls
      summary: >-
        Audited LLM calls of a period, newest first, without the payload
        (LlmUsage)
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            pattern: ^(DAY|WEEK|MONTH)$
        - name: feature
          in: query
          required: false
          description: 'exact feature slug, e.g. companion_chat'
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            pattern: ^(SUCCESS|ERROR|CANCELLED)$
        - name: callKind
          in: query
          required: false
          schema:
            type: string
            pattern: >-
              ^(CHAT|CHAT_STREAM|VISION|SMART|TOOL|TRANSCRIBE|EMBED_DOC|EMBED_QUERY)$
        - name: userId
          in: query
          required: false
          description: >-
            only calls made by this account (created_by); background rows (null
            owner) never match
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: growing window — the client raises it to load more (never an offset)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: The newest `limit` calls matching the filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmCallListResponse'
        '400':
          description: 'Unknown period, status or call kind'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '403':
          description: Not the owner (AUTH_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
