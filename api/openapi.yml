  '/api/companion/conversation/{conversationId}/message/stream':
    post:
      tags:
        - CompanionStream
      operationId: streamMessage
      summary: >-
        Send a user message and stream the assistant's answer as Server-Sent
        Events (V0.4). Events: 0..n 'delta' (data = StreamDelta JSON)
        interleaved with 0..n 'tool' (data = StreamToolCall JSON — emitted as
        each tool actually executes, mezo-280), then exactly one terminal event
        — 'done' (data = the persisted assistant MessageResponse JSON) or
        'error' (data = StreamError JSON; the assistant turn is NOT persisted,
        the user message is). A 'tool' event is progress only: the authoritative
        tool list is the done row's `tools`, which also covers any advisor-retry
        calls made after the stream ended. Every data line is JSON. Clients
        should send "Accept: text/event-stream, application/json" so pre-stream
        errors (400/401/404) arrive as normal SystemMessageList JSON.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: >-
            SSE frames — see the per-event data schemas (StreamDelta /
            StreamToolCall / MessageResponse / StreamError)
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StreamDelta'
                  - $ref: '#/components/schemas/StreamToolCall'
                  - $ref: '#/components/schemas/MessageResponse'
                  - $ref: '#/components/schemas/StreamError'
        '400':
          description: Validation error (emitted before the stream starts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Conversation not found (or owned by someone else)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/companion/transcribe:
    post:
      tags:
        - CompanionVoice
      operationId: transcribeVoiceNote
      summary: >-
        Transcribe a short spoken message to text (mezo-at8x.4). Stateless and
        ephemeral — the audio is never stored, nothing is persisted, and the
        transcript is only handed back for the client to put in its composer.
        Server-side transcription (rather than the browser's Web Speech API) is
        what makes voice input work on iOS/PWA at all.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: >-
                    The recorded voice note (wav/webm/ogg/mp4/mpeg, size capped
                    by mezo.companion.transcription.max-audio-bytes)
      responses:
        '200':
          description: The transcript — empty text when nothing intelligible was said
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '400':
          description: Missing/oversized/unsupported audio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Companion switched off — the whole surface is absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '502':
          description: COMPANION_TRANSCRIBE_FAILED — the model answer was unusable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
