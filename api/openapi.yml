          properties:
            kind:
              type: string
              pattern: ^(week|day)$
              description: >-
                'week' anchors an ISO-Monday week; 'day' anchors one day inside
                its week
            date:
              type: string
              format: date
              description: >-
                ISO week-Monday for kind=week; any date inside the week for
                kind=day
    ConversationRenameRequest:
      type: object
      required:
        - title
