    get:
      tags:
        - Proactive
      operationId: getWeeklyReview
      summary: >-
        The persisted weekly review narrative (Én/Heti, spec 2026-08-27 §5) for
        the ISO-Monday week starting {start}
      description: >-
        Returns the review row as-is (never lazily generates — the
        WeeklyReviewJob owns generation). `stale` is a best-effort probe: true
        when any of the week's logged weight/sleep/check-in/meal rows was
        created after the review's `generatedAt` (false on probe failure — never
        blocks the read).
      parameters:
        - name: start
          in: path
          required: true
          description: The ISO Monday of the wanted week
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The persisted weekly review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReviewResponse'
        '400':
          description: '{start} is not a Monday'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: No weekly review persisted for this week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/proactive/weekly-review/{start}/regenerate':
    post:
      tags:
        - Proactive
      operationId: regenerateWeeklyReview
      summary: >-
        On-demand regeneration of the weekly review (soft-deletes the existing
        row, re-runs the generator)
      description: >-
        409 while the week is still in progress (`{start} + 7 days` must be
        on/before today — the same completed-week gate the generator idiom uses
        elsewhere). 404 when the regenerated week still has no logged data
        (empty-week ⇒ no row, the generator's own rule).
      parameters:
        - name: start
          in: path
          required: true
          description: The ISO Monday of the wanted week
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The freshly generated weekly review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReviewResponse'
        '400':
          description: '{start} is not a Monday'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Regeneration yielded no row (no logged data in the week)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: The week is not completed yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
