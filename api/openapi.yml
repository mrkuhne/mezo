          type: array
          items:
            $ref: '#/components/schemas/GoalDayEntry'
        pillars:
          type: array
          items:
            $ref: '#/components/schemas/PillarProgress'
        conflicts:
          type: array
          items:
            type: string
          description: >-
            Hungarian one-liners — same signal pulled in opposite directions by
            another active goal
