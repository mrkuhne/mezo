      type: object
      required:
        - id
        - kind
        - status
        - payload
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - phase_change
            - weekly_correction
        status:
          type: string
          enum:
            - proposed
            - accepted
            - dismissed
            - superseded
        payload:
          $ref: '#/components/schemas/GoalSuggestionPayload'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
    GoalSuggestionPayload:
      type: object
      description: >-
        Typed suggestion body. phase_change carries either suggestedTrajectory
        (preset↔trajectory mismatch) or balanceOverrideKcal+fromWeek+toWeek
        (deload maintenance week). snapshotTrajectory is the accept-time race
        guard.
      required:
        - reason
      properties:
        reason:
          type: string
          description: 'Hungarian, user-facing rationale'
        suggestedTrajectory:
          type: string
          enum:
            - cut
            - bulk
            - maintain
          nullable: true
        balanceOverrideKcal:
          type: integer
          nullable: true
          description: >-
            Per-week energy-balance override (kcal/day); 0 = maintenance-leaning
            week
        fromWeek:
          type: integer
          nullable: true
        toWeek:
          type: integer
          nullable: true
        mesoId:
          type: string
          format: uuid
          nullable: true
        mesoTitle:
          type: string
          nullable: true
        snapshotTrajectory:
          type: string
          enum:
            - cut
            - bulk
            - maintain
          nullable: true
          description: phase_change race guard; null on weekly_correction
        weekStart:
          type: string
          format: date
          nullable: true
          description: 'weekly_correction: reviewed week Monday (mirrors the dedup key)'
        deltaKcal:
          type: integer
          nullable: true
        observedRateKgPerWk:
          type: number
          nullable: true
        targetRateKgPerWk:
          type: number
          nullable: true
        dampedBySleep:
          type: boolean
          nullable: true
        adherenceLoggedDays:
          type: integer
          nullable: true
        adherenceAvgIntakeKcal:
          type: integer
          nullable: true
        adherenceAvgTargetKcal:
          type: integer
          nullable: true
        prescriptionGeneratedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            weekly_correction display/debug only — NOT the accept race guard
            (rotates on every recompute); see
            snapshotRateTargetPctPerWeek/snapshotBalanceAdjustmentKcal
        snapshotRateTargetPctPerWeek:
          type: number
          nullable: true
          description: >-
            weekly_correction accept race guard: goal.rateTargetPctPerWeek at
            propose time
        snapshotBalanceAdjustmentKcal:
          type: integer
          nullable: true
          description: >-
            weekly_correction accept race guard: goal.balanceAdjustmentKcal at
            propose time
