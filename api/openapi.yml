        - muscle
        - type
        - stim
        - fatigue
        - editable
        - mediaEditable
        - authoredByMe
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        muscle:
          type: string
        type:
          type: string
          enum:
            - compound
            - isolation
            - plyo
        stim:
          type: number
          minimum: 0
          maximum: 1
        fatigue:
          type: number
          minimum: 0
          maximum: 1
        videoUrl:
          type: string
          nullable: true
        imageStartUrl:
          type: string
          nullable: true
          description: Demo still (start position); null when the exercise has no image
        imageEndUrl:
          type: string
          nullable: true
          description: >-
            Demo still (end position); alternated with imageStartUrl to convey
            the movement
        editable:
          type: boolean
          description: >-
            true when the viewer may PUT/DELETE this row — its author or the
            OWNER on a user-authored row. Never true on a master (built-in) row:
            those are loader-owned content (409 CATALOG_MASTER_READONLY for
            everyone).
        mediaEditable:
          type: boolean
          description: >-
            true when the viewer may set/clear the demo video and stills — the
            author or the OWNER on a user-authored row, the OWNER only on a
            master row.
        authoredByMe:
          type: boolean
          description: 'true when created_by == the viewer (multi-user S5, mezo-qw37.5)'
        authorName:
          type: string
          nullable: true
          description: >-
            The author's display name for user-authored rows; null on master
            rows
