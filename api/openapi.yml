      properties:
        kcal:
          type: number
        p:
          type: number
        c:
          type: number
        f:
          type: number
        water:
          type: number
    Nutrients:
      type: object
      description: >-
        Nutrition-quality facts (mezo-m6uv), frozen per line exactly like the
        macros. Grams, stored and summed at THREE decimals on the wire (ADR
        0025) — one-decimal rounding is a display-only concern on the client,
        never on the stored/transmitted value. A null field means the SOURCE
        carried no value — it is NOT zero; a rollup field is null only when
        every contributing line was null (otherwise it is the sum of the known
        ones).
      properties:
        fiberG:
          type: number
          nullable: true
        sugarG:
          type: number
          nullable: true
        saltG:
          type: number
          nullable: true
        saturatedFatG:
          type: number
          nullable: true
    MealScore:
      type: object
      properties:
        value:
          type: number
          nullable: true
        breakdown:
          allOf:
            - $ref: '#/components/schemas/MealBreakdown'
          nullable: true
    MealBreakdown:
      type: object
      description: >-
        Typed weighted score envelope (deterministic engine, mezo-yta / ADR
        0006; 8-dimension set since mezo-7797). summary/improve are LLM prose —
        null/empty until enriched.
      required:
        - value
        - confidence
        - dimensions
        - improve
        - tools
      properties:
        value:
          type: number
          description: Weighted total 0..1 — duplicates meal.score by design (ADR 0006)
        confidence:
          type: number
          description: Coverage-weighted numeric confidence 0..1
        summary:
          type: string
          nullable: true
        tagline:
          type: string
          nullable: true
          description: >-
            Card-sized LLM cut (max 60 chars) — null until the coach ran
            (mezo-mr4n)
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/MealScoreDimension'
        improve:
          type: array
          items:
            $ref: '#/components/schemas/MealImproveRow'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MealToolRow'
    MealScoreDimension:
      type: object
      description: >-
        One weighted dimension; exactly one payload field is populated, matching
        id — macro/micros/nova for their ids, `context` carries the generic
        label/value rows for context, who, fat_quality, plant_diversity,
        energy_density and portion.
      required:
        - id
        - label
        - weight
        - score
        - detail
      properties:
        id:
          type: string
          pattern: >-
            ^(macro|micro|nova|context|who|fat_quality|plant_diversity|energy_density|portion)$
        label:
          type: string
        weight:
          type: number
          description: >-
            0 when the dimension degraded (no input coverage) — total
            renormalizes
        score:
          type: number
        detail:
          type: string
        macro:
          allOf:
            - $ref: '#/components/schemas/MealMacroDetail'
          nullable: true
        micros:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MealMicroRow'
        nova:
          allOf:
            - $ref: '#/components/schemas/MealNovaDetail'
          nullable: true
        context:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MealContextRow'
        note:
          type: string
          nullable: true
          description: >-
            1-2 mondatos AI-jegyzet ehhez a dimenzióhoz (meal-coach tölti;
            determinisztikusan null)
    MealMacroDetail:
      type: object
      required:
        - ratioP
        - ratioC
        - ratioF
        - targetP
        - targetC
        - targetF
        - kcalShareOfDay
      properties:
        ratioP:
          type: number
          description: 'Protein kcal-share of the meal, %'
        ratioC:
          type: number
        ratioF:
          type: number
        targetP:
          type: string
          description: Display string of the config target share
        targetC:
          type: string
        targetF:
          type: string
        kcalShareOfDay:
          type: number
        notes:
