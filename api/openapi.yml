        title:
          type: string
          minLength: 1
          maxLength: 120
          description: The new list label — same cap as the auto-title column.
    ConversationResponse:
      type: object
      required:
        - id
        - startedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          maxLength: 120
          description: Null until the first user message; then that message truncated.
        startedAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
    MessageResponse:
      type: object
      required:
        - id
        - role
        - content
        - createdAt
        - tools
        - refs
        - recalled
        - degraded
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          description: '''user'' | ''assistant'''
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        degraded:
          type: boolean
          description: >-
            True when the answer failed the V1.3 advisor self-check (redundancy
            / grounding / clinical) even after the corrective retry — render it
            flagged, honest (old docs §4.5 [degraded] semantics). Always false
            on user rows.
        tools:
          type: array
          description: >-
            Tool calls behind this answer (V0.5): read-tool invocations of this
            turn, name carries the args, e.g. "get_weight_trend(weeks=2)". Empty
            when the turn used no tools.
          items:
            $ref: '#/components/schemas/MessageTool'
        refs:
          type: array
          description: >-
            Data references backing this answer (V0.5): entity refs contributed
            by the executed tools (deduped, capped). Empty when the turn used no
            tools.
          items:
            $ref: '#/components/schemas/MessageRef'
        recalled:
          type: array
          description: >-
            W3.1b (mezo-b3pp.28): the memories ambient recall injected into this
            answer's prompt (the [Emlékek] block), in prompt order — date +
            source + one-line gist + raw cosine similarity. Empty on user rows,
            on pre-W3.1 rows, and when recall found nothing or failed (the turn
            is never degraded by a failed recall).
          items:
            $ref: '#/components/schemas/RecalledMemory'
    RecalledMemory:
      type: object
      required:
        - occurredOn
        - kind
        - label
        - gist
        - similarity
      properties:
        occurredOn:
          type: string
          format: date
          description: The day the remembered episode happened
        kind:
          type: string
          description: >-
            memory_embedding.kind (journal_entry | daily_summary | chat_turn |
            …)
        label:
          type: string
          description: >-
            Hungarian source tag as rendered in the prompt (napló, napi
            összefoglaló, …)
        gist:
          type: string
          description: 'The one-line excerpt that was injected (first line, capped)'
        similarity:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Raw cosine similarity to the user message
    MessageTool:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          description: >-
            'read' | 'compute' (mirrors the FE ToolType) — V0.5 emits only
            'read'
        name:
          type: string
    MessageRef:
      type: object
      required:
        - kind
        - id
      properties:
        kind:
          type: string
        id:
          type: string
        label:
          type: string
          nullable: true
          description: >-
            Human name for the referenced entity when the producer knows one
            (mezo-b3pp.33) — today only GraphNode refs carry it (the graph
            node's title). Absent/null for every other kind, and for rows
            persisted before this field existed; the FE falls back to its own
            id-derived label then.
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
    KnowledgeFactResponse:
      type: object
      required:
        - id
        - factText
        - category
        - source
        - reinforcementCount
        - includeInPrompt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        factText:
          type: string
        category:
          type: string
          description: '''train'' | ''fuel'' | ''health'' | ''life'''
        source:
          type: string
          description: >-
            'chat' | 'pattern' | 'manual' — V1.1 creates only 'manual'; 'chat'
            arrives with V1.2 extraction, 'pattern' with V3.3 promotion
        reinforcementCount:
          type: integer
          description: >-
            How many times the fact was re-confirmed/re-detected (V1.3+/V3.3
            increment it).
        includeInPrompt:
          type: boolean
          description: >-
            Whether the fact competes for the top-N system-prompt injection
            slots.
        lastReinforcedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        patternTitle:
          type: string
          nullable: true
          description: >-
            The promoting pattern's title (source=pattern facts only) — the V3.3
            evidence link.
        citedWeeks:
          type: integer
          nullable: true
          description: >-
            In how many of the recent weekly reviews the companion cited this
            fact as something the week was built on (mezo-d20.7.7). A SEPARATE,
            weaker signal than reinforcementCount — the model citing its own
            knowledge is not the user re-confirming it — derived live from the
            non-deleted weekly_review rows. Null = not measurable (the
            proactive/weekly feature is off), never a stand-in zero.
    CreateFactRequest:
      type: object
      required:
        - factText
        - category
      properties:
        factText:
          type: string
          minLength: 1
          maxLength: 500
        category:
          type: string
          pattern: ^(train|fuel|health|life)$
    UpdateFactRequest:
      type: object
      description: Partial update — only the provided fields are applied.
      properties:
        factText:
          type: string
          minLength: 1
          maxLength: 500
          nullable: true
        category:
          type: string
          pattern: ^(train|fuel|health|life)$
          nullable: true
        includeInPrompt:
          type: boolean
          nullable: true
    FactCandidateResponse:
      type: object
      required:
        - id
        - candidateText
        - category
        - source
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        candidateText:
          type: string
        category:
          type: string
          description: >-
            'train' | 'fuel' | 'health' | 'life' — classified by the extractor
            at capture time
        source:
          type: string
          description: >-
            'chat' (post-turn extraction, V1.2) | 'weekly_review' (the Monday
            weekly round's proposal, mezo-d20.7.6) — the promoted knowledge fact
            inherits it
        evidence:
          type: string
          nullable: true
          description: >-
            What the candidate rests on, in the proposer's own words (weekly
            candidates only — chat extraction does not produce one).
        weekStart:
          type: string
          format: date
          nullable: true
          description: >-
            The ISO Monday of the weekly review that proposed this candidate
            (null for chat-extracted ones).
        userDecision:
          type: string
          nullable: true
          description: '''accept'' | ''reject'' | ''refine'' — null while pending'
        refinedText:
          type: string
          nullable: true
          description: The user-edited wording when the decision was refine.
        promotedFactId:
          type: string
          format: uuid
          nullable: true
          description: The knowledge fact this candidate was promoted into (accept/refine).
        createdAt:
          type: string
          format: date-time
    FactDecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          pattern: ^(accept|reject|refine)$
        refinedText:
          type: string
          minLength: 1
          maxLength: 500
          nullable: true
          description: Required when decision is refine — the corrected fact wording.
    StreamDelta:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: One streamed answer chunk (token/segment delta).
    StreamToolCall:
      type: object
      required:
        - type
        - name
      description: >-
        One tool call, streamed the moment it executes (mezo-280) so the UI can
        show WHAT the companion is reading while it reads it, instead of
        back-filling every chip at 'done'. Same shape and same pre-baked
        "name(args)" label as MessageTool, so the FE renders a live chip and the
        done row's chip identically.
      properties:
        type:
          type: string
          description: >-
            'read' | 'compute' (mirrors the FE ToolType) — V0.5 emits only
            'read'
        name:
          type: string
          description: 'Tool name carrying its args, e.g. ''get_training_plan(scope=today)''.'
    StreamError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Stream failure code — 'COMPANION_STREAM_FAILED'.
    PatternResponse:
      type: object
      required:
        - id
        - kind
        - pairKey
        - category
        - categoryLabel
        - title
        - evidence
        - status
        - lastDetectedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          pattern: ^(statistical|ai_hypothesis)$
          description: >-
            statistical = nightly Pearson job (V3.1); ai_hypothesis = weekly LLM
            loop (V3.2).
        pairKey:
          type: string
          description: >-
            A minta stabil pár-kulcsa (statistical: katalógus-kulcs, hypothesis:
            hyp-hash) — a Motor↔Patterns kereszt-link horgonya (mezo-18bx).
        category:
          type: string
          pattern: ^(physiology|trigger|response)$
          description: The FE PatternCategory — assigned by the metric-pair catalog.
        categoryLabel:
          type: string
          description: Hungarian category chip label.
        title:
          type: string
        mechanism:
          type: string
          nullable: true
          description: >-
            Deterministic HU description for statistical rows; LLM mechanism for
            V3.2 hypotheses.
        evidence:
          type: array
          items:
            type: string
          description: 'Deterministic evidence chips (r=…, n=… nap, p=…, window).'
        confidence:
          type: number
          format: double
          nullable: true
          description: >-
            NULL for statistical rows (honest small-n — the FE renders
            "tanulom"); the 4-factor critique score for V3.2 hypotheses.
        critique:
          $ref: '#/components/schemas/PatternCritique'
        status:
          type: string
          pattern: ^(proposed|monitoring|confirmed|rejected)$
        lastDetectedAt:
          type: string
          format: date-time
          description: When the nightly job last computed/refreshed the stats.
        thinking:
          type: string
          nullable: true
          description: >-
            The V3.2 critic's prose reasoning — the card's 'AI gondolatmenete';
            null on statistical rows.
        citedWeeks:
          type: integer
          nullable: true
          description: >-
            In how many of the recent weekly reviews the companion cited this
            pattern as something the week was built on (mezo-d20.7.7).
            Deliberately NOT folded into confidence — confidence is a statistic
            (r/n/p, or the V3.2 critique score), a citation is the model
            selecting its own material; it is shown beside the statistic, never
            inside it, and never moves status. Derived live from the non-deleted
            weekly_review rows. Null = not measurable (the proactive/weekly
            feature is off), never a stand-in zero.
    PatternCritique:
      type: object
      nullable: true
      description: >-
        The V3.2 4-factor critique (0..1 each) — null until the hypothesis loop
        lands.
      properties:
        statistical:
          type: number
          format: double
        confounders:
          type: number
          format: double
        l3align:
          type: number
