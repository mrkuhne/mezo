openapi: 3.0.3
info:
  title: mezo API
  description: >
    Contract-first API definition for the mezo backend — the single source of
    truth for generated backend DTOs / controller interfaces and frontend types.
    See docs/references/api_contract_conventions.md.
  version: 0.7.0
servers:
  - url: 'http://localhost:8090'
    description: Local dev backend (MEZO_PORT)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 'Multi-user auth — invite-code registration, login, current-user profile'
  - name: Weight
    description: Weight log (biometrics)
  - name: Sleep
    description: Sleep log (biometrics)
  - name: CheckIn
    description: Daily check-in slots (biometrics)
  - name: Train
    description: Training domain — mesocycles (with volume provenance) and sport sessions
  - name: Goal
    description: Goal domain — goal-rooted timeline (trajectory + quality guards + window)
  - name: BiometricProfile
    description: Body-composition profile — the TDEE bootstrap inputs (one per owner)
  - name: Pantry
    description: >-
      Pantry (Kamra) — food + supplement inventory (single pantry_item table,
      kind-projected)
  - name: PantryImport
    description: >-
      Pantry import — OpenFoodFacts lookup + confirmed-draft import (separate
      tag so the whole feature is bean-gated via
      mezo.feature.pantry-import.enabled)
  - name: Recipe
    description: >-
      Recipes (Receptek) — owned recipe + recipe_ingredient aggregate; lines
      reference pantry_item by id with a per-basis macro snapshot
  - name: Meal
    description: >-
      Meal logging (Étkezés-logolás) — owned meal + meal_item aggregate;
      polymorphic items reference a recipe or a pantry_item by id with a
      per-basis macro snapshot. GET /api/fuel/day/{date} aggregates the day for
      the Fuel screen.
  - name: Medication
    description: >-
      Medication (Gyógyszer) — owned medication definition + a dose event-log;
      the 7-day cycle (cycleDay + phase) is derived from the logged doses. GET
      /api/medication feeds the whole Fuel "Gyógyszer" tab in one round-trip.
  - name: Progression
  - name: Fuel
    description: >
      Fuel-owned protocol + supplement-intake endpoints. The protocol is a
      LIVING set of occurrences (one protocol_item row per pantry-item/zone
      placement, each carrying its own slotKey/dose/pin state) — there is no
      whole-selection activate step; occurrences are added/moved/re-dosed/
      unpinned/removed individually and the engine places a new occurrence's
      zone when slotKey is omitted (mezo-vx9v). supplement_intake is an
      append-only taken-ledger FK-ing pantry_item (ADR 0005).
  - name: FuelSlotPlan
    description: >
      Gated LLM "judge my split" evaluate endpoint for the meal-slot template
      feature (mezo-7102). Own tag so the generated controller interface
      (FuelSlotPlanApi) is separate from FuelApi — the endpoint is
      @ConditionalOnProperty-gated independently while FuelController
      (slot-template CRUD) stays unconditional. Stateless: nothing is persisted,
      the request is only auth-gated.
  - name: Companion
    description: Phase-3 companion chat — conversations + messages (mezo-fnnq)
  - name: CompanionStream
    description: >-
      Phase-3 companion chat — SSE streaming turn (mezo-fnnq.4). PRECEDENT: this
      tag's generated interface (CompanionStreamApi) is deliberately NOT
      implemented — SSE (Flux<ServerSentEvent>) is outside the generator's
      vocabulary, so the endpoint is hand-written (CompanionStreamController)
      while the contract stays the single source of truth. See
      docs/features/_platform-api-backend.md §9.
  - name: CompanionVoice
    description: >-
      Phase-3 companion voice input (mezo-at8x.4) — stateless speech-to-text for
      the chat composer. Its own tag so the generated interface stays separate
      from the conversation CRUD surface.
  - name: People
    description: Inner-circle persons + mention logging (Emberek)
  - name: Proactive
    description: >-
      Proactive layer — surfaces the companion speaks first on (mezo-h4wp). B1.1
      ships the morning briefing read; cron + staleness arrive in B1.2,
      weekly/heartbeat/prediction surfaces in later slices.
  - name: SleepGoal
    description: Sleep goal + day anchor — the single source of the day's wake/bed pair
  - name: SleepShot
    description: >-
      Sleep Cycle screenshot -> LLM-vision draft (nothing persisted; confirm
      rides POST /api/biometrics/sleep)
  - name: FuelSettings
    description: Fuel-owned per-user planner settings (eating cadence + caffeine cutoff)
  - name: DietSettings
    description: >-
      Nutrition-owned per-user diet preferences (macro split, protein tier,
      water/fiber targets)
  - name: TutorialProgress
    description: 'Per-user "seen" store of the in-app page guides (Mezo-kalauz, mezo-gb1s)'
  - name: Gamification
    description: 'User progression system — XP, levels, coins, titles, and daily streaks'
  - name: LlmUsage
    description: >-
      Read-only rollups of the llm_log_history audit table (mezo-2zyu) — LLM
      call count + cost per calendar period — every operation OWNER-only since
      mezo-qw37.3 (403 AUTH_FORBIDDEN)
  - name: Needs
    description: 'Életjel-ringek — day-close snapshot, bonus XP, "Életben tartva" streak'
  - name: MeWeek
    description: >-
      Weekly review data layer (mezo-p2tr) — live, deterministic per-day values
      + day scores + weekly aggregates for one ISO-Monday week. Scores are
      code-computed (spec §2); missing data is null ("tanulom"), never
      fabricated.
  - name: Character
    description: >-
      Karakter dossier (mezo-1gim) — the synthesized user profile: 7 CORE
      dimensions + 1 META (the companion's self-audit) + AI-opened chapters,
      confidence-carrying claims, expert observations, and persisted konzílium
      transcripts. Slice 1 ships reads over an honestly empty dossier.
  - name: Diagnosis
    description: >-
      On-demand diagnostic reports (mezo-hqfi) — a phenomenon question answered
      with ranked, evidence-bound suspects. Evidence is code-collected and
      frozen at generation time; the model selects it by index and can never
      invent a reference.
  - name: Admin
    description: >-
      Beta admin (mezo-qw37.3) — invite codes and account management, every
      operation OWNER-only (403 AUTH_FORBIDDEN otherwise)
  - name: LifeGoal
    description: >-
      Életcél-rendszer — PERMAH-dimenziós célok, pillérek a zárt
      jel-katalógusból, AI-javaslat (mezo-iizd)
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: 'Login with email + password, returns a JWT'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Invalid credentials (AUTH_LOGIN_INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '403':
          description: Account disabled (AUTH_ACCOUNT_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: 'Register with an invite code, returns a JWT'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 'Account created, JWT issued'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: >-
            Invite invalid/used/expired (AUTH_INVITE_INVALID) or email taken
            (AUTH_EMAIL_TAKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/auth/me:
    get:
      tags:
        - Auth
      operationId: me
      summary: The authenticated user's account profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '403':
          description: Account disabled (AUTH_ACCOUNT_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/auth/change-password:
    post:
      tags:
        - Auth
      operationId: changePassword
      summary: >-
        Change the authenticated user's password (also clears
        must-change-password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Current password wrong (AUTH_LOGIN_INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/auth/onboarding-complete:
    post:
      tags:
        - Auth
      operationId: completeOnboarding
      summary: Mark the authenticated user's onboarding as done
      responses:
        '204':
          description: Marked
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/biometrics/weight:
    get:
      tags:
        - Weight
      operationId: listWeightLogs
      summary: 'All weight logs of the current user, date ascending'
      responses:
        '200':
          description: 'Weight logs, ordered by date ascending'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeightLogResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags:
        - Weight
      operationId: logWeight
      summary: Log a weight entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogWeightRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightLogResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/biometrics/weight/trend:
    get:
      tags:
        - Weight
      operationId: getWeightTrend
      summary: EWMA weight trend (ground-truth scale spine for the goal engine)
      responses:
        '200':
          description: Weight trend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightTrendResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/biometrics/sleep:
    get:
      tags:
        - Sleep
      operationId: listSleepLogs
      summary: 'All sleep logs of the current user, date ascending'
      responses:
        '200':
          description: 'Sleep logs, ordered by date ascending'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SleepLogResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags:
        - Sleep
      operationId: logSleep
      summary: Log a sleep entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogSleepRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SleepLogResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/biometrics/checkin:
    get:
      tags:
        - CheckIn
      operationId: listCheckInsForDay
      summary: Check-ins of the current user for one day
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Check-ins for the given day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckInResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags:
        - CheckIn
      operationId: saveCheckIn
      summary: Upsert a check-in slot (find-or-new on date + slotTime)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCheckInRequest'
      responses:
        '200':
          description: 'Saved (upsert — 200, not 201)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/mesocycles:
    get:
      tags:
        - Train
      operationId: listMesocycles
      summary: >-
        All mesocycles of the current user with volume provenance and template
        days, start date ascending
      responses:
        '200':
          description: Mesocycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/train/mesocycles/{id}/activate':
    post:
      tags:
        - Train
      operationId: activateMesocycle
      summary: Activate a mesocycle — archives any other active one (idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Activated mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/train/mesocycles/{id}/close':
    post:
      tags:
        - Train
      operationId: closeMesocycle
      summary: >-
        Close (archive) a mesocycle (idempotent); optional self-eval note is
        captured on close
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesocycleCloseRequest'
      responses:
        '200':
          description: Archived mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/train/mesocycles/{id}/muscle-priorities':
    put:
      tags:
        - Train
      operationId: updateMesocycleMusclePriorities
      summary: >-
        Replace the run's muscle priority tier map — takes effect at the next
        weekly rollover (mezo-3m5m)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusclePrioritiesUpdateRequest'
      responses:
        '200':
          description: Updated mesocycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/train/mesocycles/{id}/report':
    get:
      tags:
        - Train
      operationId: getMesocycleReport
      summary: >-
        The generated end-of-mesocycle report — adherence, volume arc, strength
        deltas, records and optional AI narrative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The mesocycle report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleReportResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: 'No report exists yet, or the mesocycle is not found/not owned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/train/mesocycles/{id}/report/regenerate':
    post:
      tags:
        - Train
      operationId: regenerateMesocycleReport
      summary: Recompute the report for an archived mesocycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Regeneration accepted
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '409':
          description: The mesocycle run is not archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/train/mesocycles/{id}/volume-arc':
    get:
      tags:
        - Train
      operationId: getMesocycleVolumeArc
      summary: >-
        Read-only per-muscle volume arc (planned scaffold + actual logged
        working sets) for a mesocycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The mesocycle volume arc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesocycleVolumeArcResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/train/mesocycles/{id}/days/{dayId}/exercises':
    put:
      tags:
        - Train
      operationId: replaceDayExercises
      summary: >-
        Replace the exercise list of one template day (full-list, order = array
        order)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dayId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/GymExerciseInput'
      responses:
        '200':
          description: Updated template day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoDay'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle/day not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/train/mesocycles/{id}/rerun':
    post:
      tags:
        - Train
      operationId: rerunMesocycle
      summary: Start a new run from a closed mesocycle's originating template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'The originating template id, for starting a fresh run'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoRerunResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Mesocycle not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-plans/generate:
    post:
      tags:
        - Train
      operationId: generateMesoPlan
      summary: >-
        Generate a hypertrophy mesocycle proposal (deterministic skeleton +
        optional LLM exercise pick); returns a
        MesoTemplateUpsertRequest-compatible template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoPlanGenerateRequest'
      responses:
        '200':
          description: >-
            Generated proposal — not persisted; save it via POST
            /api/train/meso-templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoPlanGenerateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  /api/train/meso-templates:
    get:
      tags:
        - Train
      operationId: listMesoTemplates
      summary: >-
        All mesocycle templates of the current user, with run counts, created
        date ascending
      responses:
        '200':
          description: Meso templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MesoTemplateResponse'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
    post:
      tags:
        - Train
      operationId: createMesoTemplate
      summary: Create a mesocycle template (wizard) with nested days and exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoTemplateUpsertRequest'
      responses:
        '200':
          description: Created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesoTemplateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing/invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
  '/api/train/meso-templates/{id}':
    put:
      tags:
        - Train
      operationId: updateMesoTemplate
      summary: 'Update a mesocycle template''s fields, days and exercises (full replace)'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MesoTemplateUpsertRequest'
      responses:
        '200':
