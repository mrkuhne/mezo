    SleepGoalResponse:
      type: object
      required:
        - targetMinutes
        - anchor
        - anchorTime
        - wakeTime
        - bedTime
        - regularityBandMin
      properties:
        targetMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Asleep target in minutes (UI hints the 7–9 h range; default 480)
        anchor:
          type: string
          pattern: ^(WAKE|BED)$
          description: Which end is fixed — the other end is derived
        anchorTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: 'The fixed end, HH:mm'
        wakeTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: >-
            Wake anchor, HH:mm — derived when anchor=BED; equals anchorTime when
            anchor=WAKE
        bedTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: >-
            Bed anchor, HH:mm — derived when anchor=WAKE; equals anchorTime when
            anchor=BED
        regularityBandMin:
          type: integer
          minimum: 1
          description: ± band in minutes for the regularity score (Walker ±15)
    SetSleepGoalRequest:
      type: object
      required:
        - targetMinutes
        - anchor
        - anchorTime
      properties:
        targetMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Asleep target in minutes
        anchor:
          type: string
          pattern: ^(WAKE|BED)$
          description: Which end is fixed
        anchorTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: 'The fixed end, HH:mm'
        regularityBandMin:
          type: integer
          minimum: 1
          description: Omit to keep/take the config default (15)
    SleepShotDraftResponse:
      type: object
      required:
        - confidence
        - needsReview
      properties:
        bedtime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: 'Went-to-bed time, HH:mm (normalized zero-padded)'
        wakeup:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: 'Woke-up time, HH:mm'
        durationH:
          type: number
          description: >-
            Asleep duration in hours (from the screenshot's Asleep value, 2
            decimals)
        inBedMin:
          type: integer
          minimum: 1
          description: 'Total time in bed, minutes'
        awakeMin:
          type: integer
          minimum: 0
          description: Awake minutes (phase)
        lightMin:
          type: integer
          minimum: 0
          description: Light-sleep minutes (phase)
        remMin:
          type: integer
          minimum: 0
          description: REM minutes (Sleep Cycle calls it Dream)
        deepMin:
          type: integer
          minimum: 0
          description: Deep-sleep minutes (phase)
        sourceQualityPct:
          type: integer
          minimum: 0
          maximum: 100
          description: Sleep Cycle's own 0-100 quality
        hypnogram:
