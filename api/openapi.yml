        chat extraction uses; this read returns the ones proposed for `{start}`,
        newest first, including the already-decided ones (`GET
        /api/companion/fact/candidate` only returns the undecided inbox, but a
        closed week must be reviewable in its settled state). `evidence` names
        what the candidate rests on. Always 200 — an empty array is the honest
        empty state (no review, no usable candidate, or every candidate
        rejected), never a 404. Deciding stays the shipped write path: `POST
        /api/companion/fact/candidate/{candidateId}/decision`.
      parameters:
        - name: start
          in: path
          required: true
          description: The ISO Monday of the wanted week
