        Decide a candidate (V1.2) — accept/refine promote it into a knowledge
        fact, reject archives it. One decision per candidate; confirm is an
        explicit L2 action, never silent.
      description: >-
        The promoted fact inherits the candidate's `source`: a chat-extracted
        candidate becomes a `chat` fact, a weekly-review candidate a
        `weekly_review` one (mezo-d20.7.6) — promotion never re-labels where the
        insight came from.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactDecisionRequest'
      responses:
        '200':
          description: The decided candidate (promotedFactId set on accept/refine)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactCandidateResponse'
        '400':
          description: Validation error / candidate already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
        '404':
          description: Candidate not found (or owned by someone else)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
