          $ref: '#/components/schemas/PillarDayStatus'
        value:
          type: number
        target:
          type: number
        baseline:
          type: number
    PillarProgress:
      type: object
      required:
        - pillarId
        - arrow
        - days
      properties:
        pillarId:
          type: string
          format: uuid
        arrow:
          $ref: '#/components/schemas/TrendArrow'
        currentValue:
          type: number
          description: mean of the last 7 days' values (absent when none)
        referenceValue:
          type: number
          description: >-
            the rule's comparison figure: threshold / expected(today) / baseline
