          nullable: true
        prescription:
          allOf:
            - $ref: '#/components/schemas/GoalPrescription'
          nullable: true
    TdeeBootstrap:
      type: object
      description: >-
        Formula-TDEE bootstrap snapshot computed at first evaluation. tdee =
        neatBaselineKcal + weeklyEatKcalPerDay.
      required:
        - bmr
        - neat
        - neatBaselineKcal
        - weeklyEatKcalPerDay
        - tdee
        - formula
        - computedAt
      properties:
        bmr:
          type: number
          description: Basal metabolic rate (kcal/day)
        neat:
          type: number
          description: >-
            Non-exercise activity multiplier (lifestyle band
            DESK/MIXED/PHYSICAL)
        neatBaselineKcal:
          type: number
          description: bmr × neat — the non-exercise lifestyle maintenance (kcal/day)
        weeklyEatKcalPerDay:
          type: number
          description: >-
            Scheduled training energy (gym+sport+run), weekly total ÷ 7
            (kcal/day)
        tdee:
          type: number
          description: >-
            Total maintenance = neatBaselineKcal + weeklyEatKcalPerDay
            (kcal/day)
        formula:
          type: string
          enum:
            - MSJ
            - KATCH
          description: 'MSJ = Mifflin-St Jeor, KATCH = Katch-McArdle'
        computedAt:
          type: string
          format: date-time
    GoalPrescription:
      type: object
      description: >-
        Segmented recept produced by the engine — kcal/protein/sleep/rest per
        timeline segment, plus guard + feasibility status.
      required:
        - generatedAt
        - basis
        - segments
        - guardStatus
        - feasibility
      properties:
        generatedAt:
          type: string
          format: date-time
        basis:
          type: string
          enum:
            - formula
            - adaptive
        segments:
          type: array
          items:
            $ref: '#/components/schemas/GoalPrescriptionSegment'
        guardStatus:
          $ref: '#/components/schemas/GoalGuardStatus'
        feasibility:
          $ref: '#/components/schemas/GoalFeasibility'
    GoalPrescriptionSegment:
      type: object
      required:
        - fromWeek
        - toWeek
        - label
        - kcal
        - proteinG
        - sleepTargetH
        - restDays
        - projectedRateKgPerWk
        - dailyEnergyBalanceKcal
        - rationale
      properties:
        fromWeek:
          type: integer
        toWeek:
          type: integer
        label:
          type: string
        kcal:
          type: integer
        proteinG:
          type: integer
        carbsG:
          type: integer
          description: >-
            Prescribed carbohydrate grams — the split remainder after protein +
            fat (absent on pre-slice-1 prescriptions)
        fatG:
          type: integer
          description: >-
            Prescribed fat grams — split fat-share of segment kcal, floored at
            fat-floor g/kg (absent on pre-slice-1 prescriptions)
        sleepTargetH:
          type: number
        restDays:
          type: array
          items:
            type: integer
        projectedRateKgPerWk:
          type: number
        dailyEnergyBalanceKcal:
          type: integer
          description: >-
            Goal deficit(−)/surplus(+) per day (kcal);
            sign×rate%/100×kg×kcalPerKg÷7
        rationale:
          type: string
        trainingDayKcal:
          type: integer
          nullable: true
          description: >-
            Day-type kcal target on a training day (kcal +
            shift×restDays/trainingDays); null → uniform kcal (mezo-sxlj)
        restDayKcal:
          type: integer
          nullable: true
          description: >-
            Day-type kcal target on a rest day (kcal − shift, floored at BMR);
            null → uniform kcal (mezo-sxlj)
