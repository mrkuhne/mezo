            application/json:
              schema:
                $ref: '#/components/schemas/LifeGoalProgressResponse'
        '404':
          description: Not found / not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMessageList'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SystemMessage:
      type: object
      description: >
        Error contract returned by GlobalExceptionHandler (see
        error_handling.md). Every non-2xx response body is an array of
        SystemMessage.
      required:
        - code
        - type
      properties:
        level:
          type: string
          enum:
            - ERROR
            - WARNING
            - INFO
        code:
          type: string
          description: Machine-readable error code resolved via messages.properties
          example: VALIDATION_REQUIRED_FIELD
        params:
          type: array
          items:
            type: string
        message:
          type: string
          description: Resolved human-readable message (English)
        fieldName:
          type: string
          description: Offending field for FIELD-type messages
        type:
          type: string
          enum:
            - REQUEST
            - FIELD
        exceptionTraceId:
          type: string
          format: uuid
    SystemMessageList:
      type: array
      items:
        $ref: '#/components/schemas/SystemMessage'
    Hypnogram:
      type: object
      description: >
        Quantised sleep-stage sequence read off the tracker's stage graph
        (mezo-fk9a). One letter per bucket, chronological, starting at the row's
        bedtime: D=deep, L=light, R=REM, A=awake. DISPLAY-ONLY — never the
        source of a ratio statistic; every phase percentage comes from the exact
        per-phase minute totals.
      required:
        - bucketMin
        - stages
      properties:
        bucketMin:
          type: integer
          minimum: 1
          description: >-
            Minutes per letter (15 today; stored so a finer resolution needs no
            migration)
        stages:
          type: string
          pattern: '^[DLRA]+$'
          maxLength: 200
          description: 'One letter per bucket, chronological from bedtime'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: owner@mezo.local
        password:
          type: string
          minLength: 1
    TokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: HS256-signed JWT bearer token
    RegisterRequest:
      type: object
      required:
        - inviteCode
        - email
        - password
        - name
      properties:
        inviteCode:
          type: string
          minLength: 1
          maxLength: 32
          example: MEZO-7KQ2-XN4P
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 72
        name:
          type: string
          minLength: 1
          maxLength: 120
    MeResponse:
      type: object
      required:
        - id
        - email
        - name
        - role
        - onboarded
        - mustChangePassword
        - timezone
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          description: OWNER or USER
        onboarded:
          type: boolean
        mustChangePassword:
          type: boolean
        timezone:
          type: string
          example: Europe/Budapest
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
    LogWeightRequest:
      type: object
      required:
        - date
        - weightKg
      properties:
        date:
          type: string
          format: date
        weightKg:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 999.99
          description: Weight in kilograms (max 3 integer + 2 fraction digits)
        note:
          type: string
    WeightLogResponse:
      type: object
      required:
        - id
        - date
        - value
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        value:
          type: number
          description: Weight in kilograms (frontend field name)
        note:
          type: string
    WeightTrendPoint:
      type: object
      required:
        - date
        - trendKg
      properties:
        date:
          type: string
          format: date
        trendKg:
          type: number
          description: EWMA-smoothed weight (kg) at this date
    WeightTrendResponse:
      type: object
      required:
        - ewmaSeries
        - latestTrendKg
        - weeklyRateKgPerWeek
        - weeklyRatePctPerWeek
        - last4wRateKgPerWeek
        - dataSufficiency
      properties:
        ewmaSeries:
          type: array
          items:
            $ref: '#/components/schemas/WeightTrendPoint'
        latestTrendKg:
          type: number
          description: Latest EWMA trend value (kg)
        weeklyRateKgPerWeek:
          type: number
          description: Current weekly rate of change (kg/week) from the EWMA trend
        weeklyRatePctPerWeek:
          type: number
          description: Current weekly rate as percent of body weight per week
        last4wRateKgPerWeek:
          type: number
          description: Weekly rate (kg/week) averaged over the last 4 weeks
        dataSufficiency:
          type: string
          enum:
            - none
            - provisional
            - full
          description: How much logged weight data backs the trend
    LogSleepRequest:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          format: date
        bedtime:
          type: string
          description: 'Bedtime as HH:mm'
          example: '23:10'
        wakeup:
          type: string
          description: 'Wake-up time as HH:mm'
          example: '06:45'
        durationH:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 99.99
          description: Sleep duration in hours (max 2 integer + 2 fraction digits)
        quality:
          type: integer
          minimum: 1
          maximum: 10
        awakenings:
          type: integer
          minimum: 0
        note:
          type: string
        inBedMin:
          type: integer
          minimum: 1
          description: >-
            Total time in bed in minutes — enables true efficiency (asleep ÷
            in-bed)
        awakeMin:
          type: integer
          minimum: 0
          description: Minutes awake during the night (tracker phase data)
        lightMin:
          type: integer
          minimum: 0
          description: Light-sleep minutes (tracker phase data)
        remMin:
          type: integer
          minimum: 0
          description: REM minutes (tracker phase data; Sleep Cycle calls it Dream)
        deepMin:
          type: integer
          minimum: 0
          description: Deep-sleep minutes (tracker phase data)
        sourceQualityPct:
          type: integer
          minimum: 0
          maximum: 100
          description: Tracker-reported quality 0–100 (Sleep Cycle's own metric)
        source:
          type: string
          pattern: ^(manual|screenshot)$
          description: Row provenance; omitted → 'manual'
        hypnogram:
          $ref: '#/components/schemas/Hypnogram'
    SleepLogResponse:
      type: object
      required:
        - id
        - date
        - mealToSleep
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        bedtime:
          type: string
        wakeup:
          type: string
        duration:
